apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-platform.fullname" . }}-frontend-nginx
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
        gzip_min_length 1024;

        # 静态资源（Vite 带 hash 的产物可长缓存）
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # /api —— Spring Boot REST（含通知 SSE）
        location /api/ {
            proxy_pass http://{{ include "agent-platform.backendService" . }}:{{ .Values.service.backend.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE（通知推送）不缓冲
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            client_max_body_size 25m;
        }

        # /agui —— AG-UI 协议（SSE 流式输出，run-timeout 2h）
        location /agui/ {
            proxy_pass http://{{ include "agent-platform.backendService" . }}:{{ .Values.service.backend.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # SPA history 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
