{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-platform.secretName" . }}
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # HS256 JWT 密钥（>=32 字节），对应 AGENT_PLATFORM_JWT_SECRET
  jwt-secret: {{ required "secrets.jwtSecret 必填（openssl rand -base64 48）" .Values.secrets.jwtSecret | quote }}
  # AES-256-GCM 外部凭据加密密钥（base64 的 32 字节），对应 AGENT_PLATFORM_EXTERNAL_KEY
  external-key: {{ required "secrets.externalKey 必填（openssl rand -base64 32）" .Values.secrets.externalKey | quote }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
{{- end }}
