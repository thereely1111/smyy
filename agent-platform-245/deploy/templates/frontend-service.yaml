apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-platform.fullname" . }}-frontend
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - name: http
      port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      {{- if .Values.service.frontend.nodePort }}
      nodePort: {{ .Values.service.frontend.nodePort }}
      {{- end }}
  selector:
    {{- include "agent-platform.componentLabels" (dict "root" . "component" "frontend" "context" .) | nindent 4 }}
