        "409": { $ref: "#/components/responses/Error" }

  /api/admin/tags/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Tags]
      summary: 更新标签（改名/换色/排序/启停） [admin]
      description: 停用（enabled=false）不做物理删除，已关联数据保留；停用后不再出现在公开标签池与筛选中。改名/换色会同步应用到所有关联位置。
      requestBody:
