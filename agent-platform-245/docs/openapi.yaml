openapi: 3.1.0
info:
  title: Agent Platform API
  version: 1.0.0
  description: |
    智能体平台（agent-platform-java）后端 HTTP 接口文档。

    ## 通用约定

    - **Base URL**：`http://localhost:8080`（无 context-path）。
    - **鉴权**：除「公开端点」外，所有请求必须携带 `Authorization: Bearer <accessToken>`（JWT HS256）。
      401 时响应体为 `{"code":"UNAUTHORIZED","message":"..."}`，并附带 `WWW-Authenticate: Bearer realm="agent-platform"` 头。
    - **公开端点**（免 token）：`/api/auth/login`、`/api/auth/refresh`、`/api/auth/callback`、`/api/auth/oauth/login`、`/api/users/register`、`/api/users/captcha/*`、`/health`、`/actuator/*`，以及所有 `OPTIONS` 预检。
    - **无统一成功包装**：成功响应直接返回业务 DTO（字段 camelCase）；错误响应统一为
      `{"code": "<大写错误码>", "message": "<中文描述>"}`。已知错误码：
      `VALIDATION_ERROR`、`BAD_REQUEST`、`CONFLICT`、`FILE_TOO_LARGE`、`NOT_FOUND`、`UNAUTHORIZED`、`FORBIDDEN`、`INTERNAL_ERROR`。
    - **分页约定**：列表端点统一 `?search=&status=&page=&size=`（page 默认 0，size 默认 20），
      返回 `PageResponse<T>`：`{"content":[...],"page":0,"size":20,"totalElements":100,"totalPages":5}`。
      知识库、群组等少数域使用自定义包装（见各端点说明）。
    - **会话归属**：所有 `/api/agents/{agentId}/sessions/{sessionId}/**` 资源按 JWT 用户（`sub`）校验归属
      （owner 或 admin）；非本人会话返回 **404**（不暴露存在性）。
    - **管理端权限**：按权限码控制——标注 **[admin]** 的端点要求 `admin:access` 权限码
      （与前端 `/admin` 路由守卫一致），无权限码返回 403；部分端点要求特定权限码
      （如 `credential:create` 创建平台共享凭证、`knowledge:create` 创建平台知识库、
      `agent:menu` 查看智能体完整字段），见各端点说明。不再信任 `X-User-Role` 请求头。
    - **归属即权限**：用户级资源（模型凭证、通知渠道、通知）按 JWT 用户归属校验，
      越权访问他人资源返回 404（不暴露存在性）。
    - **SSE 超时**：AG-UI 流 `sse-timeout` 与 `run-timeout` 均为 2h（人工确认审阅可能持续 1-2h，需要 2h 余量）；超时/中断时连接正常结束，不写错误体。长时间无响应的 run 由 `RunSilenceDetector`（20min 告警 / 60min 判定失效并自动恢复）处理。
    - **run 互斥**：同一会话同时只允许一个活跃 run；已有 run 在跑时新 AG-UI 请求返回 **409**。停滞 run 由静默探测器检测（默认 60 分钟无事件）并自动恢复。

servers:
  - url: http://localhost:8080
    description: 本地开发

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 认证（登录/刷新/OAuth）
  - name: Users
    description: 用户注册与账号安全
  - name: Agents
    description: 智能体管理与装配
  - name: Sessions
    description: 会话管理、转录、HITL 恢复
  - name: Attachments
    description: 会话附件
  - name: Artifacts
    description: 会话产物（只读）
  - name: SubagentReports
    description: 子智能体汇报（只读）
  - name: SessionKnowledge
    description: 会话级知识库关联
  - name: SessionExtensions
    description: 会话扩展信息 KV
  - name: KnowledgeBases
    description: 知识库与检索
  - name: Skills
    description: 技能资源中心
  - name: Tools
    description: 工具资源中心
  - name: SkillRepositories
    description: 技能仓库（外部技能源浏览与导入）
  - name: Tags
    description: 标签（公开标签池 + 管理端 CRUD）
  - name: ModelCredentials
    description: 模型凭证（用户级，个人 / 平台共享）
  - name: ModelCatalog
    description: 模型目录（内建供应商模型枚举，按 provider 查询）
  - name: Channels
    description: 通知渠道（企业微信/钉钉/飞书/通用 webhook）
  - name: Notifications
    description: 平台通知（站内列表 + SSE 信号流）
  - name: AguiEvents
    description: AG-UI 事件审计记录查询（事件已持久化到数据库）
  - name: Groups
    description: 用户群组（知识库授权用）
  - name: Agui
    description: AG-UI 对话运行时（SSE）

paths:

  # ─────────────────────────── Auth ───────────────────────────

  /api/auth/login:
    post:
      tags: [Auth]
      summary: 登录
      description: >
        统一委托外部认证服务（tipdm OAuth2.0 密码模式）校验账号密码，并同步用户至本地 users 镜像表
        （外部明确拒绝凭据时返回 401，不回退本地密码校验）。校验通过后拉取权限码存入 Redis，
        最终签发本地 JWT（access/refresh）。未配置外部认证服务（auth-server-url/client-id）时
        登录直接拒绝（503）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: TokenResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "502":
          description: 外部认证服务异常（AUTH_ERROR）
          content:
            application/json:
              schema: { $ref: "#/components/responses/Error" }
        "503":
          description: 统一认证服务未启用或不可达（AUTH_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: "#/components/responses/Error" }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: 当前用户信息
      responses:
        "200":
          description: UserInfoResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInfoResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: 新的 token 对（access 默认 30 分钟，refresh 默认 7 天）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      description: JWT 无状态，服务端不吊销 token，但会清理该用户的 Redis 权限缓存；客户端同时清除本地存储。返回 204。
      responses:
        "204": { description: 无内容 }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: 创建账号 [admin]
      description: 管理端创建账号仅支持用户名（账密）方式；手机号/邮箱注册请使用公开入口 `POST /api/users/register`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: UserInfoResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInfoResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/auth/oauth/login:
    get:
      tags: [Auth]
      summary: 获取 OAuth 登录参数
      description: OAuth2.0 Authorization Code + PKCE。未配置 OAuth 时报错。
      security: []
      responses:
        "200":
          description: 登录跳转参数
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginUrl: { type: string }
                  state: { type: string }
                  redirectUri: { type: string }

  /api/auth/callback:
    post:
      tags: [Auth]
      summary: OAuth 回调换取本地 token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200":
          description: TokenResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }

  # ─────────────────────────── Users ───────────────────────────

  /api/users/register:
    post:
      tags: [Users]
      summary: 公开注册
      description: |
        免登录。`registerType`：`username`（默认，账密注册）/ `phone` / `email`；
        `principal` 在账密时为用户名，phone/email 时为对应手机号/邮箱（且必须携带先经
        `/api/users/captcha/*` 获取的验证码 `captcha`）。手机号/邮箱注册不在本地创建账号记录，
        响应为字段为空的 UserInfoResponse，调用方随后直接调用登录接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: UserInfoResponse（手机号/邮箱注册时字段为空）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInfoResponse" }
        "400": { $ref: "#/components/responses/Error" }

  /api/users/password:
    post:
      tags: [Users]
      summary: 修改自己的密码
      description: 身份以 JWT 为准，不接受请求传 userId。返回 204。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 4, maxLength: 100 }
      responses:
        "204": { description: 无内容 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/users/captcha/phone/{phone}:
    get:
      tags: [Users]
      summary: 发送手机号注册验证码
      description: 免登录，转发外部（tipdm）验证码服务。
      security: []
      parameters:
        - { name: phone, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 验证码发送受理标识
          content:
            application/json:
              schema: { type: integer, format: int64 }

  /api/users/captcha/email/{email}:
    get:
      tags: [Users]
      summary: 发送邮箱注册验证码
      description: 免登录，转发外部（tipdm）验证码服务。
      security: []
      parameters:
        - { name: email, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 验证码发送受理标识
          content:
            application/json:
              schema: { type: integer, format: int64 }

  # ─────────────────────────── Agents ───────────────────────────

  /api/agents:
    get:
      tags: [Agents]
      summary: 智能体分页列表（智能体广场数据源）
      description: >
        此端点不要求管理端权限码，普通登录用户通过它获取智能体广场数据。对非管理员
        （无 `admin:access` 权限码）隐藏 `systemPrompt`（编排契约 + 提示词）；
        管理端编辑页需 `agent:menu` 权限码才能获取完整字段。
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: tag, in: query, description: 按标签 ID 筛选（UUID）, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: PageResponse&lt;AgentConfigResponse&gt;（响应项额外带 tags[{id,name,color}]）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageResponse"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/AgentConfig" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [Agents]
      summary: 创建智能体 [admin]
      description: 保存时由 WorkspaceGenerator 生成 `workspace/agents/{agentId}/`（AGENTS.md + skills/ + subagents/）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentConfigRequest" }
      responses:
        "201":
          description: AgentConfigResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Agents]
      summary: 智能体详情
      responses:
        "200":
          description: AgentConfigResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConfig" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Agents]
      summary: 更新智能体 [admin]
      description: 更新后重建工作区。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentConfigRequest" }
      responses:
        "200":
          description: AgentConfigResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConfig" }
    delete:
      tags: [Agents]
      summary: 删除智能体 [admin]
      description: 递归清理工作区。返回 204。
      responses:
        "204": { description: 无内容 }

  /api/agents/{id}/status:
    patch:
      tags: [Agents]
      summary: 修改智能体状态 [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, active] }
      responses:
        "200": { description: 已更新 }
        "403": { $ref: "#/components/responses/Error" }

  /api/agents/{id}/assemble:
    post:
      tags: [Agents]
      summary: 装配 HarnessAgent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: AssembleResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentId: { type: string }
                  name: { type: string }
                  model: { type: string }
                  workspacePath: { type: string }
                  tools:
                    type: array
                    items: { type: string }
                  subagents:
                    type: array
                    items: { type: string }
                  skills:
                    type: array
                    items: { type: string }
                  stateStore: { type: string }

  # ─────────────────────────── Sessions ───────────────────────────

  /api/agents/{agentId}/sessions:
    get:
      tags: [Sessions]
      summary: 当前用户的会话列表
      description: 按 (agentId, 当前用户) 列会话。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: SessionInfo[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }

  /api/agents/{agentId}/sessions/{sessionId}/title:
    patch:
      tags: [Sessions]
      summary: 修改会话标题
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        "204": { description: 无内容 }

  /api/agents/{agentId}/sessions/{sessionId}/transcript:
    get:
      tags: [Sessions]
      summary: 读取会话转录
      description: |
        返回按 (userId, sessionId) 分区存储的完整转录。除 SSE 推送外，
        「后台 wakeup 续跑」产生的段落必须通过本接口拉取补齐（前端默认 5 秒轮询）。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SessionTranscriptResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTranscript" }
        "404": { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/sessions/{sessionId}/progress:
    get:
      tags: [Sessions]
      summary: 会话进度快照
      description: 会话停滞监控的进度快照；`hitlStuck=true` 表示权限确认长时间未处理，前端可调用 recover 恢复。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SessionProgressResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  phase: { type: string }
                  nextAction: { type: string, enum: [CONTINUE, WAIT_HITL, DONE, IDLE, UNKNOWN] }
                  progressLine: { type: string }
                  lastText: { type: string }
                  lastActiveAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
                  stallNow: { type: boolean }
                  hitlStuck: { type: boolean }

  /api/agents/{agentId}/sessions/{sessionId}/form-interrupts:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Sessions]
      summary: 查询未决表单中断
      description: |
        前端在收到 `RUN_FINISHED(outcome=interrupt)` 时上报登记（不等待结果）；
        刷新页面后由此接口取回 interruptId 再走标准 resume 恢复。
        进程内存存储：后端重启即清空。
      responses:
        "200":
          description: PendingFormInterrupt[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingFormInterrupt" }
    put:
      tags: [Sessions]
      summary: 上报未决表单中断
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PendingFormInterrupt" }
      responses:
        "204": { description: 无内容 }
    delete:
      tags: [Sessions]
      summary: 清空未决表单中断
      description: run 正常收尾（success）后由前端调用。
      responses:
        "204": { description: 无内容 }

  /api/agents/{agentId}/sessions/{sessionId}/archive:
    patch:
      tags: [Sessions]
      summary: 归档 / 取消归档（幂等）
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        "204": { description: 无内容 }

  /api/agents/{agentId}/sessions/{sessionId}/clear:
    post:
      tags: [Sessions]
      summary: 清空会话
      description: 清空状态、产物目录、会话扩展与 form-interrupts。返回 204。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 无内容 }

  /api/agents/{agentId}/sessions/{sessionId}/recover:
    post:
      tags: [Sessions]
      summary: 恢复会话
      description: 清除遗留 ASKING/interrupt 状态；保留会话 ID 与产物目录。用于权限确认停滞（hitlStuck）后的恢复。返回 204。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 无内容 }

  /api/agents/{agentId}/sessions/{sessionId}/interrupt:
    post:
      tags: [Sessions]
      summary: 中断正在运行的 run（停止按钮）
      description: >
        经框架 interrupt 真正停掉后端 run（前端停止按钮的后端支撑）。尽力等待收敛（最多 3s）后返回；
        需会话归属（等同写操作）。幂等：会话无在跑 run（HITL 挂起等表单等场景）时
        为静默 no-op，仍返回 202（interrupted=false）。注意：挂起态调用本端点
        不会解除 open interrupts——挂起表单的解除由下次 send 前置对账完成。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: 已受理（或幂等 no-op）
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  interrupted: { type: boolean, description: 是否实际触发了中断（false=本就无在跑 run） }
        "404": { $ref: "#/components/responses/Error" }

  # ─────────────────────────── Attachments ───────────────────────────

  /api/agents/{agentId}/sessions/{sessionId}/attachments:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Attachments]
      summary: 附件列表
      responses:
        "200":
          description: ListAttachmentsResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId: { type: string }
                        ref: { type: string, description: "如 @uploads/<存储名>，用户消息中以此引用" }
                        fileName: { type: string }
                        size: { type: integer }
                        createdAt: { type: string, format: date-time }
                  total: { type: integer }
    post:
      tags: [Attachments]
      summary: 上传附件
      description: |
        单文件 ≤ 20MB；扩展名白名单（txt/md/json/csv/代码/pdf/office/png/jpg 等）。
        保存到 `runtimes/{agentId}/{sessionId}/uploads/{uuid}-{ASCII名}`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: AttachmentResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileName: { type: string, description: 原始文件名 }
                  ref: { type: string, description: "@uploads/<存储名>，用户消息里携带的 @path 引用" }
                  size: { type: integer }
                  mimeType: { type: string }
                  createdAt: { type: string, format: date-time }
        "413": { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/sessions/{sessionId}/attachments/{fileId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: fileId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Attachments]
      summary: 删除单个附件
      responses:
        "204": { description: 无内容 }

  # ─────────────────────────── Artifacts ───────────────────────────

  /api/agents/{agentId}/sessions/{sessionId}/artifacts:
    get:
      tags: [Artifacts]
      summary: 产物文件树
      description: |
        聚合「本会话 + 全部子会话」（子会话各挂一个以 `sub-…` 命名的目录节点）。
        递归 ≤ 6 层；隐藏 dotfile 与内部目录（agents/default/memory/plan/MEMORY.md）。
        子会话路径仅接受当前会话派生的子会话 ID（防止越权访问）。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ArtifactNode[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtifactNode" }

  /api/agents/{agentId}/sessions/{sessionId}/artifacts/content:
    get:
      tags: [Artifacts]
      summary: 读取产物内容
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: 会话内相对路径
      responses:
        "200":
          description: |
            文本预览 ≤ 5MB；二进制/超限/非 UTF-8 时返回 content=null 并附 reason。
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  content: { type: [string, "null"] }
                  reason: { type: [string, "null"] }

  # ─────────────────────────── Subagent reports ───────────────────────────

  /api/agents/{agentId}/sessions/{sessionId}/subagents:
    get:
      tags: [SubagentReports]
      summary: 子智能体汇报列表
      description: 该会话派发的子智能体 + 最近【TASK_RESULT】汇报，平台核对产物存在性。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SubagentReport[]
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sessionId: { type: string, description: 子会话 ID（sub-…） }
                    agentId: { type: string }
                    label: { type: string }
                    status: { type: [string, "null"], enum: [COMPLETED, PARTIAL, BLOCKED, FAILED, null] }
                    stage: { type: string }
                    summary: { type: string }
                    nextAction: { type: string }
                    resumable: { type: boolean }
                    completed: { type: array, items: { type: string } }
                    inProgress: { type: array, items: { type: string } }
                    remaining: { type: array, items: { type: string } }
                    artifacts:
                      type: array
                      items:
                        type: object
                        properties:
                          path: { type: string }
                          relativePath: { type: string }
                          exists: { type: boolean }
                          size: { type: [integer, "null"] }
                          updatedAt: { type: [string, "null"], format: date-time }
                    missing: { type: array, items: { type: string } }
                    updatedAt: { type: string, format: date-time }

  # ─────────────────────────── Session knowledge ───────────────────────────

  /api/agents/{agentId}/sessions/{sessionId}/knowledge:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [SessionKnowledge]
      summary: 查询会话关联的知识库
      responses:
        "200":
          description: 关联的知识库 ID 集合
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgeBaseIds:
                    type: array
                    items: { type: string, format: uuid }
    put:
      tags: [SessionKnowledge]
      summary: 覆盖式设置会话知识库
      description: 空数组 = 解除全部关联。运行期由 RuntimeContext 注入供 knowledge_search 工具使用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeBaseIds]
              properties:
                knowledgeBaseIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: 关联的知识库 ID 集合
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgeBaseIds:
                    type: array
                    items: { type: string, format: uuid }

  # ─────────────────────────── Session extensions ───────────────────────────

  /api/agents/{agentId}/sessions/{sessionId}/extensions:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [SessionExtensions]
      summary: 查询会话扩展 KV
      responses:
        "200":
          description: ExtensionResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtensionResponse" }
    put:
      tags: [SessionExtensions]
      summary: 整体覆盖会话扩展 KV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      key: { type: string }
                      value: { type: string }
      responses:
        "200":
          description: ExtensionResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtensionResponse" }
    delete:
      tags: [SessionExtensions]
      summary: 清空会话扩展 KV
      responses:
        "204": { description: 无内容 }

  /api/agents/{agentId}/sessions/{sessionId}/extensions/entries:
    post:
      tags: [SessionExtensions]
      summary: 新增/更新单条扩展 KV
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
                value: { type: string }
      responses:
        "200":
          description: ExtensionResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtensionResponse" }

  /api/agents/{agentId}/sessions/{sessionId}/extensions/entries/{key}:
    delete:
      tags: [SessionExtensions]
      summary: 删除单条扩展 KV
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 无内容 }

  # ─────────────────────────── Knowledge bases ───────────────────────────

  /api/knowledge-bases:
    get:
      tags: [KnowledgeBases]
      summary: 当前用户可见的知识库列表
      description: >
        不分页，返回 {knowledgeBases, total}。按当前用户（JWT sub）过滤可见性
        （owner / USER grant / GROUP grant；平台共享库 scope=PLATFORM 对全员可见）。
      parameters:
        - { name: tag, in: query, description: 按标签 ID 筛选（UUID）, schema: { type: string, format: uuid } }
        - { name: scope, in: query, description: 按归属范围筛选, schema: { type: string, enum: [PERSONAL, PLATFORM] } }
      responses:
        "200":
          description: 知识库列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgeBases:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeBase" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [KnowledgeBases]
      summary: 创建知识库（固定归属个人）
      description: >
        scope 由路由决定，不接受请求体传参（防止请求体覆盖）：本端点固定创建
        `scope=PERSONAL`（owner=当前用户）；平台知识库走
        `POST /api/knowledge-bases/platform`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseUpsert" }
      responses:
        "201":
          description: KnowledgeBaseView
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeBase" }

  /api/knowledge-bases/platform:
    post:
      tags: [KnowledgeBases]
      summary: 创建平台知识库 [admin]
      description: >
        固定创建 `scope=PLATFORM`（全员可见），要求 `knowledge:create` 权限码
        （与「平台知识库」管理入口一致）；请求体与个人创建相同。
        平台库的编辑/删除（`PUT|DELETE /{id}`）按实体 scope 分流要求
        `knowledge:update` / `knowledge:delete`（个人库靠 owner/WRITE 数据授权）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseUpsert" }
      responses:
        "201":
          description: KnowledgeBaseView
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeBase" }
        "403": { $ref: "#/components/responses/Error" }

  /api/knowledge-bases/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [KnowledgeBases]
      summary: 知识库详情
      responses:
        "200":
          description: KnowledgeBaseView
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeBase" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [KnowledgeBases]
      summary: 更新知识库
      description: externalApiKey 不回显；编辑时留空 = 不重新加密。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseUpsert" }
      responses:
        "200":
          description: KnowledgeBaseView
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeBase" }
    delete:
      tags: [KnowledgeBases]
      summary: 删除知识库
      responses:
        "204": { description: 无内容 }

  /api/knowledge-bases/{id}/documents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [KnowledgeBases]
      summary: 文档列表（创建时间倒序）
      responses:
        "200":
          description: 文档列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeDocument" }
                  total: { type: integer }
    post:
      tags: [KnowledgeBases]
      summary: 上传文档（异步入库）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: 入库受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId: { type: string }
                  filename: { type: string }
                  status: { type: string }

  /api/knowledge-bases/{id}/documents/status:
    get:
      tags: [KnowledgeBases]
      summary: 轮询文档入库进度
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: ids
          in: query
          required: true
          schema: { type: string }
          description: 逗号分隔的文档 ID
      responses:
        "200":
          description: 入库状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string }
                        chunkCount: { type: [integer, "null"] }
                        error: { type: [string, "null"] }

  /api/knowledge-bases/{id}/documents/{docId}:
    delete:
      tags: [KnowledgeBases]
      summary: 删除文档
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: docId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 无内容 }

  /api/knowledge-bases/{id}/grants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [KnowledgeBases]
      summary: 查询授权列表
      responses:
        "200":
          description: 授权与可选群组
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeGrant" }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
    post:
      tags: [KnowledgeBases]
      summary: 新增授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalType, principalId, permission]
              properties:
                principalType: { type: string, enum: [USER, GROUP] }
                principalId: { type: string, format: uuid }
                permission: { type: string, enum: [READ, WRITE] }
      responses:
        "201":
          description: GrantView
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeGrant" }

  /api/knowledge-bases/{id}/grants/{grantId}:
    delete:
      tags: [KnowledgeBases]
      summary: 删除授权
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: grantId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 无内容 }

  /api/knowledge-bases/{id}/search:
    post:
      tags: [KnowledgeBases]
      summary: 知识库检索
      description: |
        按库类型返回两种结构：
        - **rag / external**（向量型）：`{documentId, chunkIndex, score, content}`
        - **text**（文本型，由服务端 grep 实现）：`{file, line, content, context[]}`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                topK: { type: integer, default: 5 }
      responses:
        "200":
          description: 检索结果（按库 type 分支）
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [rag, external, text] }
                  results:
                    type: array
                    items:
                      oneOf:
                        - type: object
                          title: VectorResult
                          properties:
                            documentId: { type: string }
                            chunkIndex: { type: integer }
                            score: { type: number }
                            content: { type: string }
                        - type: object
                          title: TextResult
                          properties:
                            file: { type: string }
                            line: { type: integer }
                            content: { type: string }
                            context:
                              type: array
                              items: { type: string }

  # ─────────────────────────── Skills ───────────────────────────

  /api/skills:
    get:
      tags: [Skills]
      summary: 技能分页列表
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: PageResponse&lt;SkillResponse&gt;
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageResponse"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/ResourceItem" }
    post:
      tags: [Skills]
      summary: 创建技能 [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceUpsert" }
      responses:
        "201":
          description: SkillResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceItem" }

  /api/skills/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Skills]
      summary: 技能详情
      responses:
        "200":
          description: SkillResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceItem" }
    put:
      tags: [Skills]
      summary: 更新技能 [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceUpsert" }
      responses:
        "200":
          description: SkillResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceItem" }
    delete:
      tags: [Skills]
      summary: 删除技能 [admin]
      responses:
        "204": { description: 无内容 }

  /api/skills/{id}/status:
    patch:
      tags: [Skills]
      summary: 修改技能状态 [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        "200": { description: 已更新 }

  # ─────────────────────────── Tools ───────────────────────────

  /api/tools:
    get:
      tags: [Tools]
      summary: 工具分页列表
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: PageResponse&lt;ToolResponse&gt;
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageResponse"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/ToolItem" }
    post:
      tags: [Tools]
      summary: 创建工具 [admin]
      description: |
        `executionMode=internal` + `askConfirmation=true` 时，调用触发人工确认中断；
        `executionMode=external` 时挂起等待前端经 AG-UI `resume[].payload.output` 回传结果。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolUpsert" }
      responses:
        "201":
          description: ToolResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolItem" }

  /api/tools/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Tools]
      summary: 工具详情
      responses:
        "200":
          description: ToolResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolItem" }
    put:
      tags: [Tools]
      summary: 更新工具 [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolUpsert" }
      responses:
        "200":
          description: ToolResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolItem" }
    delete:
      tags: [Tools]
      summary: 删除工具 [admin]
      responses:
        "204": { description: 无内容 }

  /api/tools/{id}/status:
    patch:
      tags: [Tools]
      summary: 修改工具状态 [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        "200": { description: 已更新 }

  # ─────────────────────────── Skill repositories ───────────────────────────

  /api/skill-repositories:
    get:
      tags: [SkillRepositories]
      summary: 技能仓库信息
