        "404": { $ref: "#/components/responses/Error" }

  # ─────────────────────────── Model credentials ───────────────────────────

  /api/credentials:
    get:
      tags: [ModelCredentials]
      summary: 当前用户的模型凭证列表
      description: >
        按归属校验权限（访问他人资源返回 404）。密钥类字段脱敏回显（掩码），external_api_key 不回显。
        每项含 `id/user_id/scope(USER|PLATFORM)/data(脱敏后配置，含 vendor_models 厂商核验模型清单)/
        enabled_models(启用模型开关)/editable/created_at/updated_at`。
      responses:
        "200":
          description: 凭证列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials: { type: array, items: { type: object } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [ModelCredentials]
      summary: 创建个人模型凭证
      description: >
        请求体为按供应商 schema 的动态 JSON（`data.type` 决定供应商）。本端点固定创建
        `scope=USER` 个人凭证（scope 不经请求体传递，由端点承载）。
        保存即核验 KEY：调用厂商 /models 验证可用性，成功后把厂商模型清单缓存进
        `data.vendor_models`；失败 400 阻断保存。可选 `enabled_models`（字符串数组）
        限定启用模型。平台共享凭证走 `POST /api/credentials/platform`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: 创建后的凭证视图（脱敏）
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/credentials/platform:
    post:
      tags: [ModelCredentials]
      summary: 创建平台共享模型凭证
      description: >
        创建 `scope=PLATFORM` 平台共享凭证（全员可在对话中选用），`credential:create`
        注解把门（scope 由端点决定）。核验与字段语义同
        `POST /api/credentials`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: 创建后的凭证视图（脱敏）
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/credentials/default-model:
    get:
      tags: [ModelCredentials]
      summary: 平台默认模型（全局唯一）
      description: >
        登录可读。对话未选模型时后端按它兜底（V57 platform_model_default 单例行）；
        未设置时 credential_id/model 为 null。仅 PLATFORM 凭证下的启用模型可被设为默认，
        凭证删除/禁用自动清除。
      responses:
        "200":
          description: 当前平台默认模型
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential_id: { type: string, nullable: true }
                  model: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [ModelCredentials]
      summary: 设置平台默认模型（覆盖式）
      description: >
        body = {credential_id, model}，全局互斥（单例行覆盖更新）；权限复用
        `credential:update`（与平台凭证编辑同级，不新增权限码）。只允许
        PLATFORM 凭证下的启用模型，否则 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id, model]
              properties:
                credential_id: { type: string }
                model: { type: string }
      responses:
        "200":
          description: 设置后的平台默认模型
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/credentials/schemas:
    get:
      tags: [ModelCredentials]
      summary: 供应商凭证 schema
      description: 新建/编辑表单按其动态渲染；同时作为模型目录枚举（/api/models 等）的 provider 来源。
      responses:
        "200":
          description: 供应商 schema 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas: { type: array, items: { type: object } }
  /api/credentials/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [ModelCredentials]
      summary: 更新模型凭证
      description: >
        密钥字段留空 = 保留原值（不回显、不覆盖）。按实体 scope 分流：PLATFORM 凭证
        要求 `credential:update`（个人凭证靠归属校验，越权 404）。`enabled_models`
        可单独改（详情页开关只传该字段）：null = 清除限制恢复全部可用；数组 = 全量替换。
        带 data 时保存即重新核验 KEY 并刷新 vendor_models。
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: 更新后的凭证视图（脱敏）
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [ModelCredentials]
      summary: 删除模型凭证
      description: >
        按实体 scope 分流：PLATFORM 凭证要求 `credential:delete`（个人凭证靠归属校验，
        越权 404）。删除默认模型所在凭证时平台默认模型自动清除。
      responses:
        "200":
          description: { deleted: true }
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }

