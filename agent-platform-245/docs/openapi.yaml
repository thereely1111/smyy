  # ─────────────────────────── AG-UI ───────────────────────────

  /agui/run/{agentId}:
    post:
      tags: [Agui]
      summary: 发起 / 恢复一次对话运行（SSE）
      description: |
        AG-UI v2 协议端点，响应为 `text/event-stream`（每行 `data: {JSON}`，兼容纯 JSON 行）。

        **标识语义**
        - `threadId` = 平台 `sessionId`（前端新会话生成 `main-{uuid}`，贯穿整个会话）。
        - `runId` 平台约定填 agentId；HITL resume 复用同一 `(threadId, runId)` 直到本轮 `RUN_FINISHED`。
        - 同一 thread 的 run 严格串行（并发 run 被框架拒绝："Thread already has an active run"）。
        - **会话隔离**：userId 取 `Authorization: Bearer` JWT 的 `sub`，会话状态按 (userId, sessionId) 分区。

        **HITL 恢复（resume）**
        - 收到 `RUN_FINISHED(outcome={type:"interrupt", interrupts:[...]})` 后，
          以同一 `(threadId, runId)` 重新 POST，并在 `resume[]` 中对全部 open interrupts 给出答复；
          否则报 "Thread has unresolved interrupts; RunAgentInput.resume must address all of them"。
        - `interruptId` 格式为 `{replyId}:{toolCallId}`。
        - `status=resolved`：`payload.approved`（权限确认）、`payload.output`（external 工具/表单回传值）、
          `payload.editedArgs`（编辑工具入参）。注意 external_execution 类中断只传 output，不传 approved。
        - `status=cancelled`：取消该中断。
        - 后端重启后中断登记丢失（进程内存），resume 会报 "does not match any open interrupt"，
          前端应改为把答案作为 user message 发起新 run。

        **可用事件**（详见事件说明）：`RUN_STARTED`、`RUN_FINISHED`、`RUN_ERROR`、
        `TEXT_MESSAGE_START/CONTENT/END`、`THINKING_BLOCK_START/DELTA/END`、
        `TOOL_CALL_START/ARGS/END`、`TOOL_CALL_RESULT` / `TOOL_RESULT_*`、
        `DATA_BLOCK_START/DELTA/END`、`CUSTOM`。
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - name: X-Agent-Id
          in: header
          required: false
          schema: { type: string }
          description: 也可不带路径用 `POST /agui/run` + 此头指定 Agent（两种映射等价）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threadId, runId, messages]
              properties:
                threadId:
                  type: string
                  description: = sessionId，如 main-<uuid>
                runId:
                  type: string
                  description: 平台约定填 agentId；resume 时复用
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      role: { type: string, enum: [user, assistant, system, tool] }
                      content:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, example: text }
                            text: { type: string }
                      metadata:
                        type: object
                        description: "如 {synthetic: true} 的消息在转录中不渲染"
                resume:
                  type: array
                  description: HITL 恢复项；必须覆盖全部 open interrupts
                  items:
                    type: object
                    required: [interruptId, status]
                    properties:
                      interruptId:
                        type: string
                        description: "{replyId}:{toolCallId}"
                      status: { type: string, enum: [resolved, cancelled] }
                      payload:
                        type: object
                        properties:
                          approved: { type: boolean, description: 权限确认类使用 }
                          editedArgs: { type: object, description: 编辑工具入参 }
                          output: { type: string, description: external 工具 / 表单提交值（JSON 字符串） }
                      metadata: { type: object }
                state: { type: object }
                tools: { type: array }
                context: { type: array }
                forwardedProps:
                  type: object
                  description: |
                    平台扩展字段（均可省略）：
                    - `credential_id` + `model`（成对出现）：对话轮次模型选择，按当前用户
                      解密凭证并校验可用性，在本轮 run 装配覆盖模型实例；携带但凭证不可用
                      仅降级不报错。未携带时优先平台默认模型（/api/credentials/default-model），
                      动态默认未设置/解析失败再回落 `agent-platform.model` 配置。
                      对话中可改，下一轮 run 重新装配生效；子智能体不跟随。
                    - `skill_invocations`: `[{skill_id, name}, …]` 消息级技能调用（「/ 调用技能」）。
      responses:
        "200":
          description: |
            SSE 事件流。关键事件：
            - `RUN_STARTED` / `RUN_FINISHED`（含 `outcome: {type: "success"|"interrupt"|"error"}`，
              interrupt 时携带 `interrupts[]`：`{id, reason:"tool_call", toolCallId, message,
              metadata:{agentscope.interruptKind, toolName, toolInput, toolContent, replyId}, responseSchema}`）
            - `RUN_ERROR`（message）
            - `TEXT_MESSAGE_START/CONTENT/END`（messageId, delta）
            - `THINKING_BLOCK_START/DELTA/END`
            - `TOOL_CALL_START/ARGS/END`（toolCallId, toolCallName, input）
            - `TOOL_CALL_RESULT` / `TOOL_RESULT_END`（toolCallId, output, state）
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Error" }

  # ─────────────────────────── Misc ───────────────────────────

  /health:
    get:
      tags: [Misc]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: agent-platform }
                  status: { type: string, example: ok }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token，iss=agent-platform，sub=userId(UUID)，默认 30 分钟有效。

  responses:
    Error:
      description: 统一错误结构
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: 参数校验失败 }

    PageResponse:
      type: object
      properties:
        page: { type: integer, default: 0 }
        size: { type: integer, default: 20 }
        totalElements: { type: integer }
        totalPages: { type: integer }

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: bearer }
        userId: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, developer, end_user] }
        name: { type: [string, "null"], description: 显示名（OAuth 用户取 userAlias，本地为空可null） }

    UserInfoResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, developer, end_user] }
        createdAt: { type: string, format: date-time }
        name: { type: [string, "null"], description: 显示名 }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"], description: 脱敏展示（如 138****1234） }

    RegisterRequest:
      type: object
      required: [principal, password]
      properties:
        principal:
          type: string
          maxLength: 100
          description: 账密注册时为用户名；phone/email 注册时为对应手机号/邮箱
        password: { type: string }
        role:
          type: string
          enum: [admin, developer, end_user]
          default: end_user
        registerType:
          type: string
          enum: [username, phone, email]
          default: username
        captcha:
          type: [string, "null"]
          description: phone/email 注册必填（先经 /api/users/captcha/* 获取）

    AgentConfigRequest:
      type: object
      required: [name, model]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string }
        systemPrompt: { type: string }
        model: { type: string, maxLength: 128, example: "dashscope:qwen3.8-flash" }
        status: { type: string, enum: [draft, active] }
        skillIds: { type: array, items: { type: string, format: uuid } }
        toolIds: { type: array, items: { type: string, format: uuid } }
        subagentIds: { type: array, items: { type: string, format: uuid } }
        launchTemplates: { type: array, items: { type: object } }
        planEnabled: { type: boolean }
        skillSedimentation: { type: boolean }
        welcomeForm: { type: object, description: 欢迎表单（见 docs/form-config-contract.md） }
        form: { type: object, description: 配置驱动表单（M11） }
        formTrigger: { type: string, enum: [disabled, on_session_start, on_round_start, once] }
        tagIds: { type: array, description: 关联标签（全量替换语义，重复提交以最后一次为准）, items: { type: string, format: uuid } }

    AgentConfig:
      allOf:
        - $ref: "#/components/schemas/AgentConfigRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            workspacePath: { type: string }
            fileBased: { type: boolean, description: true = 文件型智能体（workspace/agents/ 下直接定义，frontmatter tags 按名同步进标签池） }
            tags: { type: array, description: 关联标签（展示字段，脱敏时保留）, items: { $ref: "#/components/schemas/TagView" } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SessionInfo:
      type: object
      properties:
        sessionId: { type: string, example: main-<uuid> }
        summary: { type: string }
        title: { type: string }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time, description: null = 未归档 }

    SessionTranscript:
      type: object
      properties:
        sessionId: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              role: { type: string }
              name: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
              metadata: { type: object }
              content:
                type: array
                description: 与 AG-UI ContentBlock 对齐
                items:
                  oneOf:
                    - type: object
                      title: TextBlock
                      properties:
                        type: { type: string, example: text }
                        id: { type: string }
                        text: { type: string }
                        createdAt: { type: string }
                    - type: object
                      title: ThinkingBlock
                      properties:
                        type: { type: string, example: thinking }
                        id: { type: string }
                        thinking: { type: string }
                        createdAt: { type: string }
                    - type: object
                      title: ToolCallBlock
                      properties:
                        type: { type: string, example: tool_call }
                        id: { type: string }
                        name: { type: string }
                        input: { type: string, description: JSON 字符串 }
                        state: { type: string }
                        createdAt: { type: string }
                    - type: object
                      title: ToolResultBlock
                      properties:
                        type: { type: string, example: tool_result }
                        id: { type: string }
                        name: { type: string }
                        output: { type: string }
                        state: { type: string }
                        createdAt: { type: string }

    PendingFormInterrupt:
      type: object
      required: [interruptId, toolCallId]
      properties:
        interruptId: { type: string, description: "{replyId}:{toolCallId}" }
        replyId: { type: string }
        toolCallId: { type: string }
        toolName: { type: string, example: ui_gate }
        toolInput: { type: object }
        createdAt: { type: string, format: date-time }

    ArtifactNode:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [dir, file] }
        size: { type: [integer, "null"], description: 目录为 null }
        updatedAt: { type: [integer, "null"], description: epoch 毫秒 }
        children:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ArtifactNode" }

    ExtensionResponse:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        sessionId: { type: string }
        userId: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KnowledgeBase:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [rag, external, text], description: rag=本地 pgvector；external=外部 RAG 平台（RAGFlow/Dify/百炼）；text=文本 grep 检索 }
        owner:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        embeddingModelConfig: { type: object }
        externalProvider: { type: [string, "null"] }
        externalEndpoint: { type: [string, "null"] }
        chunkSize: { type: [integer, "null"] }
        chunkOverlap: { type: [integer, "null"] }
        scope: { type: string, enum: [PERSONAL, PLATFORM], description: PERSONAL=个人知识库（owner 可见）；PLATFORM=平台共享（V52 迁移后全员可见） }
        tags:
          type: array
          description: 关联标签（id/name/color）
          items: { $ref: "#/components/schemas/TagView" }
        editable: { type: boolean }
        permission: { type: string, description: 当前用户对该库的有效权限 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KnowledgeBaseUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        type: { type: string, enum: [rag, external, text] }
        embeddingModelConfig: { type: object, description: 向量维度固定 1536 }
        externalProvider: { type: string }
        externalEndpoint: { type: string }
        externalApiKey: { type: string, description: 不回显；编辑时留空 = 不重加密 }
        externalExtra: { type: object }
        chunkSize: { type: integer }
        chunkOverlap: { type: integer }

    KnowledgeDocument:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        size: { type: integer, description: 实时读盘 }
        contentType: { type: string, description: 按扩展名推断 }
        status: { type: string }
        error: { type: [string, "null"] }
        chunkCount: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KnowledgeGrant:
      type: object
      properties:
        id: { type: string }
        principalType: { type: string, enum: [USER, GROUP] }
        principalId: { type: string, format: uuid }
        principalName: { type: string }
        permission: { type: string, enum: [READ, WRITE], description: WRITE 包含 READ }
        grantedBy: { type: string }
        createdAt: { type: string, format: date-time }

    ResourceUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string }
        status: { type: string, enum: [active, inactive] }
        createdBy: { type: string, maxLength: 128 }

    ResourceItem:
      allOf:
        - $ref: "#/components/schemas/ResourceUpsert"
        - type: object
          properties:
            id: { type: string, format: uuid }
            implementationType: { type: string, maxLength: 64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ToolUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string }
        toolType: { type: string, maxLength: 64 }
        executionMode: { type: string, enum: [internal, external] }
        askConfirmation: { type: boolean }
        inputSchema: { type: object, description: JSON Schema }
        mcpEndpoint: { type: string, maxLength: 512 }
        status: { type: string, enum: [active, inactive] }

    ToolItem:
      allOf:
        - $ref: "#/components/schemas/ToolUpsert"
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    TagView:
      type: object
      description: 标签视图；公开标签池只含 id/name/color，管理接口额外返回管理字段与使用计数。
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, description: "HEX 颜色（如 #2563eb）" }
        sort: { type: [integer, "null"] }
        enabled: { type: [boolean, "null"] }
        agentCount: { type: [integer, "null"] }
        kbCount: { type: [integer, "null"] }
    TagUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 50 }
        color: { type: string, description: "HEX 颜色" }
        sort: { type: [integer, "null"] }
        enabled: { type: [boolean, "null"] }
    TagList:
      type: object
      properties:
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagView" }
        total: { type: integer }

    GroupView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdBy: { type: string }
        createdByName: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              userName: { type: string }
        createdAt: { type: string, format: date-time }
