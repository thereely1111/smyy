var DATA=JSON.parse(document.getElementById('DATA').textContent);

/* ============== 通用工具 ============== */
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(v,dec){
  if(dec===undefined)dec=0;
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function setupCanvas(cv){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520);
  var h=parseFloat(cv.style.height)||cv._h||260;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  return {g:g,w:w,h:h,dpr:dpr};
}

/* ============== 动画引擎 ============== */
/* 每个画布有自己的 enter()，进入幕时被调用。连续动画用 requestAnimationFrame 在自身存活期间运行；幕切换时停止旧的。 */
var activeAnims=[];
function stopAllAnims(){
  activeAnims.forEach(function(a){ if(a._raf) cancelAnimationFrame(a._raf); a._raf=null; });
  activeAnims=[];
}
function runAnim(fn){
  var handle={_raf:null,_alive:true};
  activeAnims.push(handle);
  function loop(t){
    if(!handle._alive) return;
    fn(t);
    handle._raf=requestAnimationFrame(loop);
  }
  handle._raf=requestAnimationFrame(loop);
  return handle;
}

/* ============== 第一幕 · 太空电梯 hero 动画 ============== */
var heroT0=null;
function drawHero(t){
  var cv=$('#cvHero');
  if(!cv) return;
  if(cv._h===undefined) cv._h=340;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tNow=(t-heroT0)/1000;

  // 背景渐变（深空）
  var bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#0b2e36');
  bg.addColorStop(0.55,'#0e3a44');
  bg.addColorStop(1,'#0b2e36');
  g.fillStyle=bg; g.fillRect(0,0,w,h);

  // 星星（缓慢闪烁）
  for(var i=0;i<60;i++){
    var sx=((i*97.13)%w), sy=((i*53.7)%(h-20))+10;
    var tw=0.5+0.5*Math.sin(tNow*1.2+i*0.7);
    g.fillStyle='rgba(205,238,233,'+(0.15+0.5*tw)+')';
    g.fillRect(sx,sy,1.6,1.6);
  }

  // 地球弧（底部）
  var earthR=h*1.4, earthCx=w/2, earthCy=h+earthR*0.85;
  var eg=g.createRadialGradient(earthCx-30,earthCy-earthR+20,10,earthCx,earthCy,earthR);
  eg.addColorStop(0,'#1e9fc4'); eg.addColorStop(0.5,'#0b6e68'); eg.addColorStop(1,'#06303a');
  g.fillStyle=eg;
  g.beginPath(); g.arc(earthCx,earthCy,earthR,Math.PI*1.15,Math.PI*1.85); g.fill();
  // 地球大气光晕
  g.strokeStyle='rgba(30,159,196,.35)'; g.lineWidth=3;
  g.beginPath(); g.arc(earthCx,earthCy,earthR+4,Math.PI*1.15,Math.PI*1.85); g.stroke();

  // 月球（右上）
  var mx=w-50, my=42, mr=16;
  var mg=g.createRadialGradient(mx-5,my-5,2,mx,my,mr);
  mg.addColorStop(0,'#f4e3c1'); mg.addColorStop(1,'#8a6313');
  g.fillStyle=mg; g.beginPath(); g.arc(mx,my,mr,0,Math.PI*2); g.fill();
  // 月球轨道虚线（从地球到月球）
  g.strokeStyle='rgba(127,216,201,.22)'; g.lineWidth=1; g.setLineDash([3,5]);
  g.beginPath(); g.moveTo(w/2,h-12);
  var cpx=w*0.72, cpy=h*0.2;
  g.bezierCurveTo(cpx,h-40, w*0.4,cpy, mx,my+mr);
  g.stroke(); g.setLineDash([]);

  // 太空电梯主线（从地表到同步轨道高度）
  var baseX=w*0.42, baseY=h-18;
  var topX=w*0.42, topY=44;
  // 主缆索
  var cg=g.createLinearGradient(baseX,baseY,baseX,topY);
  cg.addColorStop(0,'rgba(127,216,201,.85)');
  cg.addColorStop(0.5,'rgba(127,216,201,.45)');
  cg.addColorStop(1,'rgba(127,216,201,.85)');
  g.strokeStyle=cg; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(baseX,baseY); g.lineTo(topX,topY); g.stroke();
  // 缆索上的能量流（虚线 dashoffset 流动）
  g.strokeStyle='rgba(18,165,148,.9)'; g.lineWidth=1.6;
  g.setLineDash([4,8]); g.lineDashOffset=-(tNow*30)%12;
  g.beginPath(); g.moveTo(baseX,baseY); g.lineTo(baseX,topY); g.stroke(); g.setLineDash([]);

  // 配重（顶端节点）
  g.fillStyle='#e0a04a';
  g.beginPath(); g.arc(topX,topY,5,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(224,160,74,.4)'; g.lineWidth=6;
  g.beginPath(); g.arc(topX,topY,9+Math.sin(tNow*2)*1.5,0,Math.PI*2); g.stroke();

  // climbers（电梯轿厢，沿缆索上下移动）
  var climbers=[
    {phase:0.0,spd:0.18,col:'#12a594'},
    {phase:0.4,spd:0.22,col:'#1e9fc4'},
    {phase:0.75,spd:0.15,col:'#7fd8c9'}
  ];
  climbers.forEach(function(c){
    var u=(tNow*c.spd+c.phase)%1;
    var y=lerp(baseY,topY,u);
    // 拖尾
    g.fillStyle='rgba(18,165,148,'+(0.25*(1-u*0.6))+')';
    g.fillRect(baseX-3,y+4,6,18);
    // 轿厢
    g.fillStyle=c.col;
    g.fillRect(baseX-5,y-3,10,8);
    g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=1; g.strokeRect(baseX-5,y-3,10,8);
  });

  // 上升粒子（从地表沿缆索向上）
  for(var p=0;p<14;p++){
    var pu=((tNow*0.5+p*0.071)%1);
    var py=lerp(baseY,topY,pu);
    var pa=Math.sin(pu*Math.PI);
    g.fillStyle='rgba(127,216,201,'+(0.6*pa)+')';
    g.beginPath(); g.arc(baseX+Math.sin(p*1.3+tNow*2)*4,py,1.6,0,Math.PI*2); g.fill();
  }

  // 标注线：地球 → 月球
  g.strokeStyle='rgba(127,216,201,.5)'; g.lineWidth=1;
  g.beginPath();
  g.moveTo(earthCx-12,h-20); g.lineTo(earthCx-60,h-50);
  g.moveTo(mx-mr,my); g.lineTo(mx-mr-40,my+20);
  g.stroke();
  g.fillStyle='rgba(205,238,233,.85)'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='right'; g.textBaseline='middle';
  g.fillText('地球', earthCx-65, h-50);
  g.textAlign='left';
  g.fillText('月球', mx-mr-36, my+20);
  g.fillStyle='rgba(127,216,201,.7)'; g.font='11px "PingFang SC",system-ui,sans-serif';
  g.fillText('Cap_SE 5.37×10⁵ t/yr', baseX+10, (baseY+topY)/2);

  // 底部信息条
  g.fillStyle='rgba(127,216,201,.18)';
  g.fillRect(0,h-26,w,26);
  g.fillStyle='rgba(205,238,233,.85)'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('M = 10⁸ t  ·  双目标  min C / min t  ·  NSGA-II', 14, h-13);
}
function startHero(){
  heroT0=performance.now();
  runAnim(function(t){ drawHero(t); });
}

/* ============== 第二幕 · 成本公式可视化 ============== */
var costT0=null;
function drawCost(t){
  var cv=$('#cvCost');
  if(!cv) return;
  if(cv._h===undefined) cv._h=280;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tNow=(t-costT0)/1000;
  var reveal=clamp(tNow/1.6,0,1);
  var revE=easeOutCubic(reveal);

  var L=70,R=26,T=22,B=44, PW=w-L-R, PH=h-T-B;
  var xmax=260, ymax=26000;
  function X(v){return L+PW*v/xmax;}
  function Y(v){return T+PH*(1-v/ymax);}

  // 网格
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=ymax*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText((v/1000).toFixed(0)+'k',L-7,yy);
  }
  // x 刻度
  [{t:0,s:'0'},{t:93.74,s:'94'},{t:186.22,s:'186'},{t:250,s:'250'},{t:280,s:'280'}].forEach(function(o){
    var xx=X(o.t);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(o.s,xx,T+PH+16);
  });
  // 轴框
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  // 轴标题
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('完工时间 t (年)',L+PW/2,T+PH+36);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.fillText('成本 (B USD)',0,0); g.restore();

  // 计算曲线：固定项 + 可变项 + 总成本
  var nPts=80, fixedArr=[], varArr=[], totArr=[];
  for(var i=0;i<nPts;i++){
    var tt=180+80*i/(nPts-1);
    var fixed=1.0*tt;                 // C_main·t (B)
    var variable=22000;               // C_var·M (B) — 几乎常数
    var total=fixed+variable;
    fixedArr.push({t:tt,v:fixed});
    varArr.push({t:tt,v:variable});
    totArr.push({t:tt,v:total});
  }
  // 画固定项堆叠区域
  function drawArea(arr,col,rev){
    g.fillStyle=col;
    g.beginPath();
    arr.forEach(function(p,i){
      var xx=X(p.t), yy=Y(p.v*rev);
      if(i===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
    });
    g.lineTo(X(arr[arr.length-1].t),Y(0)); g.lineTo(X(arr[0].t),Y(0)); g.closePath();
    g.fill();
  }
  drawArea(fixedArr,'rgba(11,110,104,'+(0.55*revE)+')',revE);
  // 可变项堆叠（在固定项之上）
  g.save();
  g.beginPath();
  varArr.forEach(function(p,i){
    var xx=X(p.t), yy=Y((p.v+fixedArr[i].v)*revE);
    if(i===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
  });
  g.lineTo(X(varArr[varArr.length-1].t),Y(fixedArr[fixedArr.length-1].v*revE));
  for(var j=fixedArr.length-1;j>=0;j--){
    g.lineTo(X(fixedArr[j].t),Y(fixedArr[j].v*revE));
  }
  g.closePath();
  g.fillStyle='rgba(224,160,74,'+(0.50*revE)+')'; g.fill();
  g.restore();

  // 总成本线
  g.beginPath();
  totArr.forEach(function(p,i){
    var xx=X(p.t), yy=Y(p.v*revE);
    if(i===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
  });
  g.strokeStyle='#12a594'; g.lineWidth=2.6; g.lineJoin='round';
  // 流动 dashoffset
  g.setLineDash([8,4]); g.lineDashOffset=-(tNow*40)%12;
  g.stroke(); g.setLineDash([]);

  // 容量约束竖线 t_min=186.22
  var vx=X(186.22);
  g.save(); g.setLineDash([5,4]); g.strokeStyle='#b8543a'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(vx,T); g.lineTo(vx,T+PH); g.stroke(); g.restore();
  g.fillStyle='#b8543a'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('Cap_SE 容量约束 t_min=186.22',vx+6,T+12);

  // 参考解点
  var rx=X(186.22), ry=Y(9991.2*revE);
  g.beginPath(); g.arc(rx,ry,5,0,Math.PI*2);
  g.fillStyle='#b8543a'; g.fill();
  g.strokeStyle='#fff'; g.lineWidth=2; g.stroke();
  // 参考解标签
  g.fillStyle='#0b2e36'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  var labelText='参考解  t=186.22 · C=9991.2B';
  var mt=g.measureText(labelText); var tw=mt?mt.width:labelText.length*7;
  g.fillStyle='rgba(255,255,255,.96)'; g.fillRect(rx+8,ry-22,tw+12,18);
  g.strokeStyle='#f0d5cd'; g.lineWidth=1; g.strokeRect(rx+8.5,ry-21.5,tw+11,17);
  g.fillStyle='#b8543a'; g.fillText(labelText,rx+14,ry-13);

  // 流动小点沿总成本线
  if(revE>0.6){
    var flowU=(tNow*0.3)%1, idx=Math.floor(flowU*(nPts-1));
    var fp=totArr[idx];
    var fx=X(fp.t), fy=Y(fp.v*revE);
    g.beginPath(); g.arc(fx,fy,3.5,0,Math.PI*2);
    g.fillStyle='#7fd8c9'; g.fill();
    g.strokeStyle='rgba(127,216,201,.5)'; g.lineWidth=4;
    g.beginPath(); g.arc(fx,fy,6,0,Math.PI*2); g.stroke();
  }
}
function startCost(){ costT0=performance.now(); runAnim(function(t){ drawCost(t); }); }

/* ============== 第三幕 · 帕累托前沿 ============== */
var paretoT0=null;
var popSeed=null;
function drawPareto(t){
  var cv=$('#cvPareto');
  if(!cv) return;
  if(cv._h===undefined) cv._h=360;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tNow=(t-paretoT0)/1000;

  var L=62,R=26,T=26,B=44, PW=w-L-R, PH=h-T-B;
  var xmax=280, ymax=28000;
  function X(v){return L+PW*v/xmax;}
  function Y(v){return T+PH*(1-v/ymax);}

  // 网格 + y 轴
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=ymax*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText((v/1000).toFixed(0)+'k',L-7,yy);
  }
  // x 刻度
  [{t:0,s:'0'},{t:93.74,s:'94'},{t:186.22,s:'186'},{t:250,s:'250'},{t:280,s:'280'}].forEach(function(o){
    var xx=X(o.t);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(o.s,xx,T+PH+16);
  });
  // 轴框
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  // 轴标题
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('完工时间 t (年)',L+PW/2,T+PH+34);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('总成本 C (B USD)',0,0); g.restore();

  // 被支配区域（前沿上方）
  var pc=[[93.74,9052.9],[110,7500],[135,5500],[170,3800],[210,2700],[250,2151.5]];
  // 闪烁的被支配区
  var shimmer=0.5+0.5*Math.sin(tNow*1.4);
  g.fillStyle='rgba(184,84,58,'+(0.04+0.04*shimmer)+')';
  g.beginPath();
  pc.forEach(function(p,i){ var x=X(p[0]),y=Y(p[1]); if(i)g.lineTo(x,y); else g.moveTo(x,y); });
  g.lineTo(X(250),Y(ymax)); g.lineTo(X(93.74),Y(ymax)); g.closePath(); g.fill();

  // NSGA-II 种群点（前沿附近抖动）
  if(!popSeed){
    popSeed=[];
    for(var i=0;i<35;i++){
      var f=i/34;
      var tt=94+(250-94)*f + (Math.random()-0.5)*6;
      var cc=lerp(9052.9,2151.5,f) + (Math.random()-0.5)*900*Math.sin(f*3);
      popSeed.push({t:tt,c:cc});
    }
  }
  var popReveal=clamp(tNow/1.2,0,1);
  popSeed.forEach(function(p,i){
    var ap=clamp(popReveal*1.6-i*0.022,0,1);
    if(ap<=0) return;
    var wobble=Math.sin(tNow*1.5+i*0.7)*4;
    var px=X(p.t+wobble), py=Y(p.c+wobble*8);
    g.beginPath(); g.arc(px,py,2.6,0,Math.PI*2);
    g.fillStyle='rgba(18,165,148,'+(0.45*ap)+')'; g.fill();
  });

  // 帕累托前沿曲线（C1 → C2） 画线动画
  var frontReveal=clamp((tNow-0.6)/1.0,0,1);
  var frE=easeInOutCubic(frontReveal);
  g.save();
  g.setLineDash([7,4]); g.lineDashOffset=-(tNow*16)%11;
  g.strokeStyle='#12a594'; g.lineWidth=2.8;
  g.beginPath();
  var x0=X(93.74), y0=Y(9052.9), x1=X(250), y1=Y(2151.5);
  g.moveTo(x0,y0);
  g.lineTo(x0+(x1-x0)*frE, y0+(y1-y0)*frE);
  g.stroke();
  g.restore();
  // 前沿标签
  if(frontReveal>0.5){
    g.fillStyle='#0b6e68'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    var lx=X(170), ly=Y(5200);
    g.fillStyle='rgba(255,255,255,.92)'; g.fillRect(lx-58,ly-10,116,18);
    g.strokeStyle='#cfe4e4'; g.lineWidth=1; g.strokeRect(lx-57.5,ly-9.5,115,17);
    g.fillStyle='#0b6e68'; g.fillText('帕累托前沿 C1 → C2',lx,ly);
  }

  // 四方案点（按顺序揭示）
  var pts=DATA.schemes;
  pts.forEach(function(p,i){
    var ap=clamp((tNow-0.4-i*0.35)/0.6,0,1);
    if(ap<=0) return;
    var aE=easeOutCubic(ap);
    var x=X(p.t), y=Y(p.c);
    // 入场：从下方升起到目标位置
    var cy=y+(1-aE)*30;
    g.beginPath(); g.arc(x,cy,p.dom?5.5:7,0,Math.PI*2);
    if(p.dom){
      g.fillStyle='#fff'; g.fill();
      g.strokeStyle=p.col; g.lineWidth=2.4; g.stroke();
    } else {
      // 脉冲光晕（前沿点）
      var pulse=0.5+0.5*Math.sin(tNow*3+i*1.2);
      g.fillStyle='rgba(18,165,148,'+(0.25*pulse)+')';
      g.beginPath(); g.arc(x,cy,12+pulse*3,0,Math.PI*2); g.fill();
      g.fillStyle=p.col; g.fill();
      g.strokeStyle='#fff'; g.lineWidth=2.2; g.stroke();
    }
    if(aE>0.6){
      var la=clamp((aE-0.6)/0.4,0,1);
      g.globalAlpha=la;
      g.fillStyle=p.col; g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
      g.textAlign='left'; g.textBaseline='middle';
      var ty=(p.t>200)?cy-14:cy-16;
      g.fillText(p.n,x+12,ty);
      g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
      g.fillText(p.lab,x+12,ty+14);
      g.globalAlpha=1;
    }
  });

  // min C ↑ 与 → min t 标注
  g.fillStyle='#b8543a'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('min C ↑',L+4,T+12);

<section class="scene" id="s1" data-title="第一幕 · 系统失效场景">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题二分析 · 系统失效</div>
    <h1>三类失效：电梯怕断索与热疲，火箭怕一次炸
      <small>电梯对故障更敏感——失效会延长工期、抬高成本；火箭单次失败只损失一载。</small>
    </h1>
    <p class="lead">太空电梯在长期运行中面临三类典型失效：<b class="hl">缆索振动断裂</b>（结构性停运）、<b class="hl-g">热疲劳累积</b>（容量折减）、<b class="hl-t">火箭发射失败</b>（批次可补）。问题二要求在引入失效因子后重新评估运输方案，并给出调整策略。核心发现：电梯的失效是<b>结构性的</b>，一次断裂让整条缆索停运数月；火箭的失效是<b>批次性的</b>，只丢一发，下一发可补。</p>
  </div>
  <div class="stg" id="fCards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"></div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">三类失效的年度/单次失效概率</div>
        <div class="legend">
          <span><i style="background:#b8543a"></i>电梯·缆索断裂</span>
          <span><i style="background:#e0a04a"></i>电梯·热疲劳</span>
          <span><i style="background:#146c87"></i>火箭·发射失败</span>
        </div>
      </div>
      <canvas id="cvFail" height="240"></canvas>
      <p class="note" style="margin-top:8px" id="failNote"></p>
    </div>
  </div>
  <div class="stg grid4" id="sensStats"></div>
  <div class="stg">
    <div class="quote">
      电梯的失效是<b>结构性的</b>——一次断裂让整条缆索停运数月；火箭的失效是<b>批次性的</b>——只丢一发，下一发可以补。两类故障对工期与成本的影响机制根本不同，因此调整模型必须把它们分开处理。
    </div>
  </div>
</div>
</section>

<section class="scene" id="s2" data-title="第二幕 · 失效场景建模">
<div class="wrap">
  <div class="stg">
    <div class="kicker">失效场景建模</div>
    <h1>电梯年运力从 5.37×10⁵ 吨下降——运力损失曲线
      <small>故障使电梯的有效年容量折减，火箭需要补发；工期被拉长，成本被抬高。</small>
    </h1>
    <p class="lead">电梯基线年运力 <b class="num">C<sub>E</sub>=5.37×10⁵ 吨/年</b>。引入缆索断裂概率 P<sub>fr</sub> 与热疲劳概率 P<sub>th</sub> 后，有效年容量折减为 C<sub>E</sub>·(1−P<sub>fr</sub>−P<sub>th</sub>)。三次故障高发窗（约第 18–30、48–60、78–90 月）使运力跌至基线的 <b class="hl">78%–82%</b>，窗后缓慢回升。</p>
  </div>
  <div class="stg grid2">
    <div class="card">
      <h3>原模型（无故障） <em>问题一基线</em></h3>
      <p>运输总量 <b class="num">M</b> 拆给电梯与火箭两路：电梯承担份额 <b class="num">γ</b>，火箭承担 <b class="num">1−γ</b>。</p>
      <p>电梯年运量 <b class="num">C<sub>E</sub></b>，火箭单发运载 <b class="num">c<sub>R</sub></b>、年发射 <b class="num">n</b> 发。</p>
      <div class="formula">T = M / (γ·C<sub>E</sub> + (1−γ)·n·c<sub>R</sub>)
C = γ·C<sub>E</sub>·u<sub>E</sub> + (1−γ)·n·c<sub>R</sub>·u<sub>R</sub></div>
    </div>
    <div class="card">
      <h3>调整后模型（含故障） <em>问题二</em></h3>
      <p>电梯年断裂概率 <b class="hl">P<sub>fr</sub></b>、热疲劳年失效 <b class="hl">P<sub>th</sub></b>：两者叠加后电梯有效年容量折减为
        <b class="num">C<sub>E</sub>·(1−P<sub>fr</sub>−P<sub>th</sub>)</b>，单次断裂还要追加修复工期 <b class="num">Δt<sub>fix</sub></b>。</p>
      <p>火箭单发失败概率 <b class="hl">P<sub>R</sub></b>：期望补发次数 <b class="num">n·P<sub>R</sub>/(1−P<sub>R</sub>)</b>，补发费用按单价累加。</p>
      <div class="formula">T' = T + N<sub>fr</sub>·Δt<sub>fix</sub>
<span class="c">C' = C + 补发费 + 修复费 + 备件冗余</span></div>
    </div>
  </div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">电梯有效年运力损失曲线（基线 5.37×10⁵ 吨/年，含三次故障高发窗）</div>
        <div class="legend">
          <span><i class="ln" style="background:#12a594"></i>有效年运力</span>
          <span><i class="ln" style="background:#8aa3aa;border-top:1px dashed #8aa3aa"></i>基线 537k</span>
          <span><i style="background:rgba(184,84,58,.18)"></i>故障高发窗</span>
        </div>
      </div>
      <canvas id="cvCap" height="270"></canvas>
      <p class="note" style="margin-top:8px" id="capNote"></p>
    </div>
  </div>
  <div class="stg grid4" id="capStats"></div>
</div>
</section>

<section class="scene" id="s3" data-title="第三幕 · 敏感度分析">
<div class="wrap">
  <div class="stg">
    <div class="kicker">敏感度分析</div>
    <h1>电梯敏感度远高于火箭——曲线斜率是 2.5 倍
      <small>同样 6% 故障率：电梯工期延长到 1.48，火箭仅 1.18。</small>
    </h1>
  </div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">故障率 → 工期延长系数：电梯比火箭更陡</div>
        <div class="legend">
          <span><i class="ln" style="background:#b8543a"></i>电梯敏感曲线</span>
          <span><i class="ln" style="background:#146c87"></i>火箭敏感曲线</span>
          <span><i class="ln" style="background:#12a594"></i>混合方案</span>
        </div>
      </div>
      <canvas id="cvSens" height="260"></canvas>
      <p class="note" style="margin-top:8px" id="sensNote"></p>
    </div>
  </div>
  <div class="stg grid2">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">电梯 vs 火箭 · 五维敏感度雷达</div>
        <div class="legend">
          <span><i style="background:#b8543a"></i>电梯</span>
          <span><i style="background:#146c87"></i>火箭</span>
        </div>
      </div>
      <canvas id="cvRadar" height="300"></canvas>
    </div>
    <div class="card">
      <h3>五维敏感度解读</h3>
      <p><b class="hl">工期敏感度：</b>电梯 0.92 / 火箭 0.35——电梯失效直接停运，工期延长系数斜率是火箭的 2.5 倍。</p>
      <p><b class="hl">成本敏感度：</b>电梯 0.85 / 火箭 0.42——缆索修复费用高昂，备件冗余成本随故障率爬升更快。</p>
      <p><b class="hl-g">修复工期：</b>电梯 0.78 / 火箭 0.15——电梯单次断裂需 6–18 月修复，火箭只损失单次发射周期。</p>
      <p><b class="hl-g">结构复杂度：</b>电梯 0.88 / 火箭 0.30——缆索/攀爬器是单点结构失效，火箭可批次冗余。</p>
      <p><b class="hl-t">冗余需求：</b>电梯 0.65 / 火箭 0.25——电梯需整条缆索备份，火箭只需多发备件。</p>
    </div>
  </div>
  <div class="stg grid4" id="sensKPI"></div>
  <div class="stg">
    <div class="quote">
      同样 6% 的故障率，电梯的工期延长系数爬到 <b class="hl">1.48</b>，火箭只到 <b class="hl-t">1.18</b>。电梯的曲线斜率大约是火箭的 <b>2.5 倍</b>——这正是后续要把混合方案里的电梯份额在故障高发期下调的依据。
    </div>
  </div>
</div>
</section>

<section class="scene" id="s4" data-title="第四幕 · 调整策略">
<div class="wrap">
  <div class="stg">

    <h1>无故障 vs 有故障：C1 工期 +13%、C2 成本 +19.2%
      <small>C1 电梯主导 93.74→105.96 年；C2 火箭备份 2151.5→2565.3B USD。</small>
    </h1>
  </div>
  <div class="stg">
    <div class="card">
      <h3>失效前后方案对比 <em>C1 电梯主导 vs C2 火箭备份</em></h3>

  </div>
  <div class="stg">

  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">自适应 γ 随时间调整曲线（含故障率高发窗）</div>
        <div class="legend">
          <span><i class="ln" style="background:#12a594"></i>自适应 γ(t)</span>

          <span><i style="background:rgba(184,84,58,.18)"></i>故障高发窗</span>

  <div class="stg grid3">
    <div class="card">
      <h3>监测触发 <em>step 1</em></h3>
      <p>实时监测缆索张力方差 <b>σ<sub>T</sub></b> 与热循环计数 <b>N<sub>th</sub></b>，当任一项越过阈值，标记当前为故障高发窗。</p>
      <p class="small">触发条件：σ<sub>T</sub> &gt; σ* 或 N<sub>th</sub> &gt; N*。</p>
    </div>
    <div class="card">
      <h3>份额下调 <em>step 2</em></h3>
      <p>高发窗内把电梯份额从基线 <b class="num">γ₀=0.5</b> 下调到 <b class="hl">γ≈0.30</b>，让火箭多承担 <b class="num">+20%</b> 的年运量。</p>
      <p class="small">γ(t) = γ₀ − κ·(故障率偏离)，κ 为响应增益。</p>
    </div>

      <h3>平稳回升 <em>step 3</em></h3>
      <p>故障率回到平稳带后，γ 以 <b class="num">0.02/年</b> 的速率回升到基线，避免长期过度依赖火箭推高成本。</p>

<section class="scene" id="s5" data-title="第五幕 · 结论与KPI">
<div class="wrap">
  <div class="stg">
    <div class="kicker">结论</div>
    <h1>电梯敏感度高于火箭，需要备份策略
      <small>火箭作为备份方案可以弥补电梯失效的运力缺口——自适应策略把可靠度从 0.78 抬到 0.92。</small>
    </h1>
    <p class="lead">问题二的核心结论：电梯对失效的敏感度远高于火箭（工期延长系数 2.5 倍、成本抬高率 2 倍以上）。纯电梯方案在故障下工期延长 <b class="hl">+43.9%</b>、成本抬高 <b class="hl">+41.6%</b>；而火箭备份方案工期仅 <b class="hl-t">+5.0%</b>、成本 <b class="hl-t">+19.2%</b>。混合方案 + 自适应份额调整是兼顾成本与鲁棒性的最优解。</p>
  </div>
  <div class="stg">
    <div class="quote">
      自适应策略把系统可靠度从 <b class="hl">0.78</b> 抬到 <b class="hl-t">0.92</b>，工期方差下降 <b>34%</b>，总成本比固定份额再降 <b class="hl-t">6.4%</b>——它在「电梯的便宜但脆」与「火箭的贵但稳」之间，按故障率的实时信号做加权。
    </div>
  </div>
  <div class="stg">
    <div class="card">
      <h3>KPI 汇总 <em>问题二核心指标</em></h3>
      <div class="grid4" id="finalKPI" style="gap:12px"></div>
    </div>
  </div>
  <div class="stg grid2">
    <div class="note w">
      <b>关键结论：</b>调整后混合方案仍优于纯电梯与纯火箭——它在电梯的高敏感与火箭的高成本之间取了折中。但电梯敏感度更高：C1（电梯主导）的工期延长 <b>+13.0%</b>、成本抬高 <b>+40.0%</b>，远高于 C2（火箭备份）的 <b>+5.0%</b> 与 <b>+19.2%</b>。这意味着在故障高发期，<b>主动下调电梯份额</b>能进一步降低总成本与工期方差。
    </div>
    <div class="note">
      <b>备份策略：</b>火箭作为备份方案可以弥补电梯失效的运力缺口。当电梯有效运力折减 10% 时，火箭补发约 <b>0.36 发/年</b>（按年发射 12 发、单发失败 3% 计），补发费用可被冗余预算吸收。混合方案在故障下的总成本 <b>2565.3B</b> 仍低于纯火箭方案的 <b>3050B</b>，故仍为最优。
    </div>
  </div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">核心指标汇总 · 雷达对比（调整前 vs 调整后）</div>
        <div class="legend">
          <span><i style="background:#b8543a"></i>调整前（固定份额）</span>
          <span><i style="background:#12a594"></i>调整后（自适应）</span>
        </div>
      </div>
      <canvas id="cvFinal" height="280"></canvas>
      <p class="note" style="margin-top:8px" id="finalNote"></p>
    </div>
  </div>
</div>
</section>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var D=JSON.parse($('#DATA').textContent);

/* ---- 动画工具：逐帧绘制 ---- */
function animDraw(cv,drawFn,dur){
  var start=performance.now();
  function frame(t){
    var p=Math.min(1,(t-start)/dur);
    var eased=1-Math.pow(1-p,3);
    drawFn(eased);
    if(p<1) requestAnimationFrame(frame);
  }
  if(document.body.classList.contains('reduce')) drawFn(1);
  else requestAnimationFrame(frame);
}

function genCapacity(){
  var base=D.capacity.baseline, n=D.capacity.n, wins=D.capacity.windows;
  var data=[];
  for(var i=0;i<n;i++){
    var v=base, inWin=false;
    wins.forEach(function(w){
      var lo=w[0],hi=w[1],minR=w[2];
      if(i>=lo&&i<=hi){
        inWin=true;
        var c=(lo+hi)/2, half=(hi-lo)/2;
        var dist=Math.abs(i-c)/half;
        var drop=(1-minR)*(1-0.3*dist*dist);
        v=base*(1-drop);
      } else if(i>hi&&i<hi+8){
        var rp=(i-hi)/8;
        v=base*minR+(base-base*minR)*rp;
      }
    });
    data.push(Math.round(v));
  }
  return data;
}

/* ---- 通用绘图底座（含网格、轴、序列、渐变填充） ---- */
function plot(cv,cfg){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520), h=cfg.h||220;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  var L=cfg.L||44, R=cfg.R||(cfg.y2?54:16), T=cfg.T||18, B=cfg.B||26;
  var PW=w-L-R, PH=h-T-B, n=cfg.n;
  var ymin=cfg.yMin, ymax=cfg.yMax;
  function X(i){ return L+PW*(n<=1?0:i/(n-1)); }
  function Y(v){ return T+PH*(1-(v-ymin)/(ymax-ymin)); }
  var Y2=null;
  if(cfg.y2){ Y2=function(v){ return T+PH*(1-(v-cfg.y2.min)/(cfg.y2.max-cfg.y2.min)); }; }
  var progress=cfg.progress||1;
  if(cfg.band){
    g.fillStyle=cfg.band.c;
    g.fillRect(L,Y(cfg.band.hi),PW,Math.max(0,Y(cfg.band.lo)-Y(cfg.band.hi)));
  }
  g.font='11.5px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var k;
  for(k=0;k<=4;k++){
    var v=ymin+(ymax-ymin)*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(fmt(v,cfg.yFmt),L-7,yy);
  }
  if(cfg.hlines) cfg.hlines.forEach(function(hl){
    var yy=Y(hl.v);
    g.save(); g.setLineDash([5,4]); g.strokeStyle=hl.c||'#b8543a'; g.lineWidth=hl.w||1.3;
    g.beginPath(); g.moveTo(L,yy); g.lineTo(L+PW,yy); g.stroke(); g.restore();
    if(hl.label){
      g.font='600 11.5px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      g.textAlign='left'; g.textBaseline='alphabetic';
      var mt=g.measureText?g.measureText(hl.label):null;
      var tw=(mt&&mt.width)?mt.width:hl.label.length*12;
      g.fillStyle='rgba(255,255,255,.95)';
      g.fillRect(L+3,yy-19,tw+12,16);
      g.strokeStyle='rgba(217,233,233,.95)'; g.lineWidth=1;
      g.strokeRect(L+3.5,yy-18.5,tw+11,15);
      g.fillStyle=hl.c||'#b8543a';
      g.fillText(hl.label,L+9,yy-7);
    }
  });
  if(cfg.xTicks) cfg.xTicks.forEach(function(t){
    var xx=X(t.i);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(t.t,xx,T+PH+16);
  });
  (cfg.series||[]).forEach(function(s){
    var drawN=Math.max(1,Math.ceil(s.d.length*progress));
    var yy=s.ax==='y2'?Y2:Y, pv=null;
    g.beginPath();
    for(var i=0;i<drawN;i++){
      var px=X(i),py=yy(s.d[i]);
      if(!i) g.moveTo(px,py);
      else if(s.step){ g.lineTo(px,pv); g.lineTo(px,py); }
      else g.lineTo(px,py);
      pv=py;
    }
    if(s.fill){
      g.save(); g.lineTo(X(drawN-1),T+PH); g.lineTo(X(0),T+PH); g.closePath();
      g.fillStyle=s.fill; g.fill(); g.restore();
    }
    g.strokeStyle=s.c; g.lineWidth=s.w||1.8;
    if(s.dash) g.setLineDash(s.dash); else g.setLineDash([]);
    g.lineJoin='round'; g.stroke(); g.setLineDash([]);
  });
  if(cfg.tags) cfg.tags.forEach(function(t){
    note(g,t.text,X(t.i),Y(t.v),
         {right:L+PW,left:L+2,top:T+2,line:t.line,tc:t.tc,up:t.up});
  });
  g.strokeStyle='#d9e9e9'; g.lineWidth=1;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  function fmt(v,f){
    if(f==='pct') return (v*100).toFixed(0)+'%';
    if(f==='sci') return v===0?'0':v.toExponential(1);
    if(f==='x') return v.toFixed(2);
    if(f==='k') return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);
    if(f===0) return v.toFixed(0);
    if(typeof f==='number') return v.toFixed(f);
    return String(Math.round(v));
  }
}
function note(g,text,px,py,o){
  o=o||{};
  var dy=o.up===undefined?24:o.up, dx=o.dx===undefined?8:o.dx;
  g.font='600 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var mt=g.measureText?g.measureText(text):null;
  var tw=(mt&&mt.width)?mt.width:text.length*12;
  var x=px+dx, y=py-dy;
  if(o.right!==undefined && x+tw+14>o.right && o.left!==undefined) x=px-dx-tw-12;
  if(o.left!==undefined && x<o.left) x=o.left;
  if(o.top!==undefined && y<o.top) y=py+12;
  g.fillStyle='rgba(255,255,255,.96)'; g.fillRect(x,y,tw+12,18);
  g.strokeStyle=o.line||'#cfe4e4'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,tw+11,17);
  g.fillStyle=o.tc||'#0b6e68'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text,x+6,y+9);
}

/* ---- 1. 失效概率柱状图（带增长动画） ---- */
function drawFail(cv,progress){
  var fs=D.failures, n=fs.length;
  var vals=fs.map(function(f){return f.prob;});
  /* yMax 设为 0.08 → 刻度间隔恰好 2%（0,2,4,6,8） */
  var ymax=0.08;
  plot(cv,{h:240,n:n,yMin:0,yMax:ymax,yFmt:'pct',L:54,R:20,B:46,series:[],xTicks:[],progress:progress});
  var g=cv.getContext('2d');
  var w=cv.clientWidth, hh=240, L=54, Rr=20, T=18, B=46, PW=w-L-Rr, PH=hh-T-B;
  var bw=Math.min(96,PW/n*0.5), step=PW/n;
  fs.forEach(function(f,k){
    var bh=PH*(f.prob/ymax)*progress;
    var x=L+step*(k+0.5)-bw/2, y=T+PH-bh;
    var grad=g.createLinearGradient(0,y,0,y+bh);
    grad.addColorStop(0,f.color); grad.addColorStop(1,f.color+'cc');
    g.fillStyle=grad; g.fillRect(x,y,bw,bh);
    if(progress>0.7){
      g.fillStyle='#0b2e36'; g.font='600 13px "PingFang SC",system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='alphabetic';
      g.fillText((f.prob*100).toFixed(0)+'%',x+bw/2,y-7);
    }
    if(progress>0.85){
      g.fillStyle='#57727c'; g.font='12px "PingFang SC",system-ui,sans-serif';
      g.fillText(f.name,x+bw/2,T+PH+18);
      g.fillText(f.unit,x+bw/2,T+PH+34);
    }
  });
}

/* ---- 2. 运力损失曲线（面积图 + 故障窗阴影） ---- */
function drawCap(cv,progress){
  var data=genCapacity(), n=data.length;
  var base=D.capacity.baseline;
  var wins=D.capacity.windows;
  var ymin=380, ymax=560;
  var xTicks=[];
  for(var i=0;i<=n;i+=20) xTicks.push({i:i,t:i+''});
  var bandItems=wins.map(function(w){ return null; });
  plot(cv,{h:270,n:n,yMin:ymin,yMax:ymax,yFmt:0,L:48,R:20,B:30,progress:progress,
    band:{c:'rgba(184,84,58,.10)',lo:380,hi:560},
    xTicks:xTicks,
    hlines:[{v:base,c:'#8aa3aa',w:1.4,label:'基线 537k',dash:[6,4]}],
    series:[{d:data,c:'#12a594',w:2.6,fill:'rgba(18,165,148,.14)'}],
    tags:[]});
  var g=cv.getContext('2d');
  var w=cv.clientWidth, hh=270, L=48, Rr=20, T=18, B=30, PW=w-L-Rr, PH=hh-T-B;
  function X(i){ return L+PW*(i/(n-1)); }
  function Y(v){ return T+PH*(1-(v-ymin)/(ymax-ymin)); }
  wins.forEach(function(wd){
    var x1=X(wd[0]), x2=X(wd[1]);
    g.fillStyle='rgba(184,84,58,.16)';
    g.fillRect(x1,T,x2-x1,PH);
    if(progress>0.8){
      g.fillStyle='rgba(184,84,58,.7)'; g.font='600 10.5px "PingFang SC",system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='alphabetic';
      g.fillText('▼ '+(base*wd[2]).toFixed(0)+'k',(x1+x2)/2,T+14);
    }
  });
  if(progress>0.9){
    var minV=Math.min.apply(null,data);
    note(g,'最低 '+minV+'k',X(data.indexOf(minV)),Y(minV),
         {right:L+PW,left:L+2,top:T+2,line:'#f0d5cd',tc:'#b8543a',up:28});
  }
}

/* ---- 3. 敏感度曲线（三条线 + 标注） ---- */
function drawSens(cv,progress){
  var c=D.curve, n=c.length;
  var elev=c.map(function(p){return p.elevator;}),
      rock=c.map(function(p){return p.rocket;}),
      mix=c.map(function(p){return p.mixed;}),
      probs=c.map(function(p){return p.p;});
  var xTicks=[];
  for(var i=0;i<n;i+=2) xTicks.push({i:i,t:(probs[i]*100).toFixed(0)+'%'});
  plot(cv,{h:260,n:n,yMin:1.0,yMax:1.9,yFmt:'x',L:48,R:20,B:30,progress:progress,
    xTicks:xTicks,
    hlines:[{v:1.0,c:'#8fb6bd',w:1.2,label:'基线 1.00'}],
    series:[{d:elev,c:'#b8543a',w:2.4,fill:'rgba(184,84,58,.12)'},
            {d:rock,c:'#146c87',w:2.2,dash:[6,4]},
            {d:mix,c:'#12a594',w:2.6}],
    tags:progress>0.85?[
      {i:6,v:1.48,text:'电梯 1.48',tc:'#b8543a',line:'#f0d5cd',up:26},
      {i:6,v:1.18,text:'火箭 1.18',tc:'#146c87',line:'#d5e8ea',up:-16}]:[]});
}

/* ---- 4. 雷达图（五维对比） ---- */
function drawRadar(cv,progress,rad){
  rad=rad||D.radar;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||440), h=rad===D.radar?300:280;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  var cx=w/2, cy=h/2+4;
  var R=Math.min(w,h)/2-46;
  var dims=rad.dims, n=dims.length;
  var series=rad===D.radar?
    [{name:'电梯',data:rad.elevator,color:'#b8543a',fill:'rgba(184,84,58,.16)'},
     {name:'火箭',data:rad.rocket,color:'#146c87',fill:'rgba(20,108,135,.16)'}]:
    [{name:'调整前',data:rad.before,color:'#b8543a',fill:'rgba(184,84,58,.14)'},
     {name:'调整后',data:rad.after,color:'#12a594',fill:'rgba(18,165,148,.16)'}];
  function ang(i){ return -Math.PI/2+i*2*Math.PI/n; }
  function vtx(i,r){ return [cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))]; }
  for(var k=1;k<=4;k++){
    var r=R*k/4;
    g.beginPath();
    for(var i=0;i<=n;i++){
      var v=vtx(i%n,r);
      if(!i) g.moveTo(v[0],v[1]); else g.lineTo(v[0],v[1]);
    }
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.stroke();
  }
  for(var i=0;i<n;i++){
    var v=vtx(i,R);
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(v[0],v[1]);
    g.strokeStyle='#d9e9e9'; g.lineWidth=1; g.stroke();
  }
  series.forEach(function(s){
    g.beginPath();
    for(var i=0;i<=n;i++){
      var r=R*s.data[i%n]*progress;
      var v=vtx(i%n,r);
      if(!i) g.moveTo(v[0],v[1]); else g.lineTo(v[0],v[1]);
    }
    g.closePath();
    g.fillStyle=s.fill; g.fill();
    g.strokeStyle=s.color; g.lineWidth=2; g.stroke();
    if(progress>0.8){
      for(var i=0;i<n;i++){
        var r=R*s.data[i]*progress;
        var v=vtx(i,r);
        g.beginPath(); g.arc(v[0],v[1],3,0,6.2832);
        g.fillStyle=s.color; g.fill();
        g.strokeStyle='#fff'; g.lineWidth=1.4; g.stroke();
      }
    }
  });
  g.font='12px "PingFang SC",system-ui,sans-serif';
  for(var i=0;i<n;i++){
    var v=vtx(i,R+22);
    g.fillStyle='#3d6570'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(dims[i],v[0],v[1]);
  }
  g.font='10px system-ui'; g.fillStyle='#bccfd0'; g.textAlign='left'; g.textBaseline='middle';
  for(var k=1;k<=4;k++) g.fillText((k*25)+'%',cx+3,cy-R*k/4);
}

/* ---- 5. 方案对比柱状图（工期+成本双组） ---- */
function drawCmp(cv,progress){
  var sc=D.schemes, n=sc.length;
  var dMax=Math.max(sc[0].dur_fail,sc[1].dur_fail)*1.2;
  var cMax=Math.max(sc[0].cost_fail,sc[1].cost_fail)*1.15;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520), h=290;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  var halfW=w/2;
  function drawHalf(x0,x1,title,fmt,maxval,getKey,getKeyFail,pctKey){
    var L=46, Rr=14, T=34, B=40, PW=x1-x0-L-Rr, PH=h-T-B;
    g.fillStyle='#0b6e68'; g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(title,(x0+x1)/2,T-12);
    for(var k=0;k<=4;k++){
      var v=maxval*k/4, yy=T+PH*(1-k/4);
      g.strokeStyle='#eaf4f4'; g.lineWidth=1;
      g.beginPath(); g.moveTo(x0+L,yy+.5); g.lineTo(x0+L+PW,yy+.5); g.stroke();
      g.fillStyle='#57727c'; g.font='11px system-ui'; g.textAlign='right'; g.textBaseline='middle';
      g.fillText(fmt(v),x0+L-6,yy);
    }
    var groupW=PW/n, barW=groupW*0.32, gap=groupW*0.06;
    sc.forEach(function(s,idx){
      var gx=x0+L+groupW*idx+groupW/2;
      var vNo=s[getKey], vFail=s[getKeyFail];
      var hNo=PH*(vNo/maxval)*progress, hFail=PH*(vFail/maxval)*progress;
      var xNo=gx-barW-gap/2, xFail=gx+gap/2;
      var yNo=T+PH-hNo, yFail=T+PH-hFail;
      g.fillStyle='#cfe4e4'; g.fillRect(xNo,yNo,barW,hNo);
      var grad=g.createLinearGradient(0,yFail,0,yFail+hFail);
      grad.addColorStop(0,s.color); grad.addColorStop(1,s.color+'dd');
      g.fillStyle=grad; g.fillRect(xFail,yFail,barW,hFail);
      if(progress>0.6){
        g.fillStyle='#0b2e36'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
        g.textAlign='center'; g.textBaseline='alphabetic';
        g.fillText(fmt(vNo),xNo+barW/2,yNo-5);
        g.fillText(fmt(vFail),xFail+barW/2,yFail-5);
      }
      if(progress>0.85){
        g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
        g.fillText(s.name,gx,T+PH+16);
        var pct=s[pctKey];
        g.fillStyle=pct>20?'#b8543a':'#3d6570';
        g.font='600 10.5px "PingFang SC",system-ui,sans-serif';
        g.fillText('+'+pct.toFixed(1)+'%',gx,T+PH+31);
      }
    });
    g.strokeStyle='#d9e9e9'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x0+L,T+PH); g.lineTo(x0+L+PW,T+PH); g.stroke();
  }
  drawHalf(0,halfW,'工期对比（年）',function(v){return v.toFixed(0);},dMax,'dur_no','dur_fail','dur_pct');
  drawHalf(halfW,w,'成本对比（B USD）',function(v){return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);},cMax,'cost_no','cost_fail','cost_pct');
}

/* ---- 6. 自适应 γ 曲线 ---- */
function drawAdapt(cv,progress){
  var G=D.gamma, n=G.n, adapt=G.adapt_curve, base=G.base;
  var ymax=0.7, ymin=0.2;
  var xTicks=[];
  for(var i=0;i<=n;i+=20) xTicks.push({i:i,t:i+''});
  plot(cv,{h:270,n:n,yMin:ymin,yMax:ymax,yFmt:'x',L:48,R:20,B:30,progress:progress,
    xTicks:xTicks,
    hlines:[{v:base,c:'#8aa3aa',w:1.4,label:'基线 γ=0.50'}],
    series:[{d:adapt,c:'#12a594',w:2.6,fill:'rgba(18,165,148,.10)'}],
    tags:[]});
  var g=cv.getContext('2d');
  var w=cv.clientWidth, hh=270, L=48, Rr=20, T=18, B=30, PW=w-L-Rr, PH=hh-T-B;
  function X(i){ return L+PW*(i/(n-1)); }
  function Y(v){ return T+PH*(1-(v-ymin)/(ymax-ymin)); }
  G.windows.forEach(function(wd){
    var x1=X(wd.lo), x2=X(wd.hi);
    g.fillStyle='rgba(184,84,58,.16)';
    g.fillRect(x1,T,x2-x1,PH);
  });
  if(progress>0.85){
    G.windows.forEach(function(wd){
      var cx=X((wd.lo+wd.hi)/2), cy=Y(wd.peak);
      g.beginPath(); g.arc(cx,cy,3.6,0,6.2832);
      g.fillStyle='#b8543a'; g.fill();
      g.strokeStyle='#fff'; g.lineWidth=1.4; g.stroke();
      note(g,'γ≈'+wd.peak.toFixed(2),cx,cy,
           {right:L+PW,left:L+2,top:T+2,line:'#f0d5cd',tc:'#b8543a',up:24});
    });
  }
}

/* ---- 注册绘图函数 ---- */

<body>
<header class="topbar">

  <div class="scene-title" id="scTitle">加载中</div>

</header>

<main id="stage">

<!-- ============== 第一幕 问题三概述 ============== -->
<section class="scene" id="s1" data-title="一 · 问题三概述：月球水循环需求">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第一幕</div>
      <h1>十万人的水：闭环里漏掉的那一截
        <small>月球基地 10 万人、人均日需 50 L，构成一个近似闭环的供水系统。问题三要求建立水循环模型，分析净需水与运输方案。</small>
      </h1>
      <p class="lead">题面给定的关键约束：殖民地设计人口 10 万人，人均日需水 50 L，全年毛用水约 25 Mt。闭环回收后仍有一部分不可回收的损耗，必须由地球通过太空电梯与火箭运送补给。问题三的核心是<b class="hl-t">建立 SIRS 水循环模型</b>，量化年净需水，并给出电梯与火箭的运水最优分配。</p>
    </div>

    <div class="grid4 stg" id="ovKpi"></div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">月球水循环总览 · 从地球补给到闭环回收</div>
        <div class="legend">
          <span><i style="background:#12a594"></i>可再生水流</span>
          <span><i style="background:#1e9fc4"></i>再生水回流</span>
          <span><i style="background:#b8543a"></i>地球补给</span>
          <span><i style="background:#e0a04a"></i>不可回收损耗</span>
        </div>
      </div>
      <canvas id="cvOverview" height="280"></canvas>
      <p class="note" style="margin-top:8px"><span class="badge">总览</span>水从地球（Input_Earth）进入可用洁水库（Stock），分配给生活/农业/工业三路使用（Input），废水经回收进入再生水池（Recycling）回流到 Stock；不可回收的损耗则必须由地球持续补给。年净需水 7.51 Mt 是这条补给线的稳态流量。</p>
    </div>

    <div class="grid2 stg">
      <div class="card">
        <h3>问题三题面要求 <em>逐字摘录</em></h3>
        <div class="quote">「建立月球基地水循环模型，分析水需求与运输方案。考虑殖民地人口、人均用水、水回收率，给出年净需水量与电梯/火箭的运水分配。」</div>
        <p class="small">本题三个输出：① SIRS 水循环模型；② 年净需水测算；③ 电梯与火箭的运水最优分配与成本。</p>
      </div>
      <div class="card">
        <h3>建模思路 <em>三步走</em></h3>
        <p><b class="hl-t">第一步</b>：把水量看作四只箱子 S/I/R/E，写出 dR/dt = η_h·W_h + η_a·W_a 的回收方程。</p>
        <p><b class="hl-g">第二步</b>：扣掉两路回收贡献后，剩下不可回收的损耗之和即年净需水 Input_Earth。</p>
        <p><b class="hl">第三步</b>：在电梯年运水配额 2.06 Mt 与火箭边际成本的约束下，求最优混合分配。</p>
      </div>
    </div>
  </div>
</section>

<!-- ============== 第二幕 SIRS 模型建立 ============== -->
<section class="scene" id="s2" data-title="二 · SIRS 模型：Stock-Input-Recycling-Supply 四箱">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第二幕</div>
      <h1>SIRS 四箱模型：水流的闭环回路
        <small>Stock（库存）→ Input（使用）→ Recycling（再生）→ 回到 Stock；不可回收损耗由 Earth 补给顶上。Canvas 动画展示水流循环。</small>
      </h1>
      <p class="lead">把月球基地水量看成四只箱子：<b>S</b>（可用洁水库存）、<b>I</b>（生活/农业/工业用水输入）、<b>R</b>（再生水池）、<b>E</b>（地球补给 Supply）。两路回收支路分别按 η_h=0.88 与 η_a=0.72 回流到 R；不可回收部分进入损耗箱，必须由 E 持续补给才能维持闭环稳态。</p>
    </div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">SIRS 水循环动态图 · 带流动粒子的闭环</div>
        <div class="legend">
          <span><i style="background:#12a594"></i>Stock 洁水流</span>
          <span><i style="background:#0b6e68"></i>生活用水</span>
          <span><i style="background:#e0a04a"></i>农业用水</span>
          <span><i style="background:#146c87"></i>工业用水</span>
          <span><i style="background:#1e9fc4"></i>再生回流</span>
          <span><i style="background:#b8543a"></i>地球补给</span>
        </div>
      </div>
      <canvas id="cvCycle" height="420"></canvas>
      <p class="note" id="cycleNote" style="margin-top:8px"></p>
    </div>

    <div class="grid2 stg">
      <div class="card">
        <h3>SIRS 四箱定义 <em>每只箱子的物理意义</em></h3>
        <table class="tb">
          <tr><th>箱子</th><th>含义</th><th>年水量</th></tr>
          <tr><td class="l"><b class="hl-t">S</b> Stock</td><td class="l">可用洁水库存（蓄水池）</td><td class="num">25.0 Mt</td></tr>
          <tr><td class="l"><b class="hl-t">I</b> Input</td><td class="l">生活/农业/工业用水流</td><td class="num">25.0 Mt</td></tr>
          <tr><td class="l"><b class="hl-t">R</b> Recycling</td><td class="l">再生水池（回收后）</td><td class="num">17.49 Mt</td></tr>
          <tr><td class="l"><b class="hl">E</b> Supply</td><td class="l">地球补给（Input_Earth）</td><td class="num">7.51 Mt</td></tr>
        </table>
        <p class="small">稳态条件：dS/dt = 0，即 R + E = I（回收 + 补给 = 用水）。</p>
      </div>
      <div class="card">
        <h3>回收方程 <em>两路 η 决定回流比例</em></h3>
        <div class="quote"><span class="badge">核心方程</span>
        dR/dt = η_h · W_h(t) + η_a · W_a(t)<br>
        Input_Earth(t) = I(t) − R(t) = (1−η_h)·W_h + (1−η_a)·W_a + W_ind</div>
        <p>国际空间站水回收率 93–98%。殖民地 10 万人规模放大后：<b>生活废水 η_h ≈ 0.88</b>（淋浴/洗涤/呼吸凝结为主）；<b>农业废水 η_a ≈ 0.72</b>（蒸腾、土壤吸附与渗漏难以收回）。</p>
        <p class="small">两个 η 的差距决定净需水结构：农业损耗占大头。</p>
      </div>
    </div>

    <div class="grid4 stg" id="cycleKpi"></div>
  </div>
</section>

<!-- ============== 第三幕 水需求数据 ============== -->
<section class="scene" id="s3" data-title="三 · 水需求数据：年净需水 7.51 Mt">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第三幕</div>
      <h1>年净需水 7.51 Mt：闭环里漏掉的那一截
        <small>毛用水 25 Mt 减去两路回收 17.49 Mt，剩余 7.51 Mt 是地球必须运送的 Input_Earth。它超过任何单一运输系统的运力。</small>
      </h1>
      <p class="lead">闭环每一轮都有水漏出去：农业蒸腾、呼吸凝结外逸、工业消耗、管网渗漏。这些不可回收项加总后再扣两路回收贡献，剩下的就是年净需水量。<b class="hl-t">7.51 Mt 是问题三所有运送方案的输入边界</b>。</p>
    </div>

    <div class="grid4 stg" id="demandKpi"></div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">年净需水 7.51 Mt 分解 · 四类不可回收损耗</div>
        <div class="legend">
          <span><i style="background:#0b6e68"></i>生活损耗</span>
          <span><i style="background:#e0a04a"></i>农业损耗</span>
          <span><i style="background:#146c87"></i>工业损耗</span>
          <span><i style="background:#b8543a"></i>蒸发与其他</span>
        </div>
      </div>
      <canvas id="cvDemand" height="280"></canvas>
      <p class="note" id="demandNote" style="margin-top:8px"></p>
    </div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">逐年净需水累积：从基建期到稳态</div>
        <div class="legend">
          <span><i class="ln" style="background:#12a594"></i>年净需水</span>
          <span><i class="ln" style="background:#1e9fc4"></i>累计净需水</span>
          <span><i class="ln" style="background:#b8543a"></i>稳态 7.51 Mt/年</span>
        </div>
      </div>
      <canvas id="cvCum" height="240"></canvas>
      <p class="note" id="cumNote" style="margin-top:8px"></p>
    </div>

    <div class="card stg">
      <h3>为什么超过单系统容量 <em>把净需水对到运力上限</em></h3>
      <p>太空电梯单线年运水上限约 2.1 Mt（受配重、climber 节数与基建物资挤占影响）；火箭每发约 15 t 到月轨，全年满负荷约 5.5 Mt。<b class="hl-t">7.51 Mt 同时超出电梯与火箭任何一方的单独运力</b>，所以运送必须混合，这是第四幕要解决的问题。</p>
      <div class="quote"><span class="badge q">关键约束</span>Input_Earth(t) = 7.51 Mt/年，是殖民地稳态运行的最低补水下限。低于这条线，再生水池水位单调下降，闭环失稳。</div>
    </div>
  </div>
</section>

<!-- ============== 第四幕 运输方案对比 ============== -->
<section class="scene" id="s4" data-title="四 · 运输方案：电梯 27.5% + 火箭 72.5%">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第四幕</div>
      <h1>成本最优：电梯 2.06 Mt + 火箭 5.45 Mt
        <small>电梯运力优先配给高密度基建物资，水只能占其 27.5%；剩余 72.5% 由火箭承担，对应每天约 10 次发射。总成本 129.19 B USD。</small>
      </h1>
      <p class="lead">运水两条路成本结构相反：电梯边际成本低、但年运水配额被基建挤到 2.06 Mt 上限；火箭边际成本高、但发次可调。最优解让电梯吃满配额，剩余缺口全交给火箭。</p>
    </div>

    <div class="grid2 stg">
      <div class="canvasbox">
        <div class="cvtop">
          <div class="ct">运水比例：电梯 27.5% / 火箭 72.5%</div>
        </div>
        <canvas id="cvPie" height="280"></canvas>
        <p class="note" id="pieNote" style="margin-top:8px"></p>
      </div>
      <div class="canvasbox">
        <div class="cvtop">
          <div class="ct">两条运水路的成本对比 <em>USD/kg</em></div>
        </div>
        <canvas id="cvCost" height="280"></canvas>
        <p class="note" id="costNote" style="margin-top:8px"></p>
      </div>
    </div>

    <div class="grid4 stg" id="allocKpi"></div>

    <div class="card stg">
      <h3>为什么火箭占大头 <em>不是火箭便宜，是电梯运力被基建挤占</em></h3>
      <p>电梯每公斤运水成本远低于火箭，但 climber 的有效载荷要优先运送：<b>结构材料、生命保障设备、能源系统、辐射屏蔽</b>。这些物资密度高、体积小、不可压缩，占走了电梯约 70% 的年运力配额。水密度大、价值低，在电梯排队里排在基建之后，只能拿到剩余的 27.5%。</p>
      <div class="quote"><span class="badge w">运力约束</span>电梯年运水 2.06 Mt 是其总载荷配额扣去基建物资后的余量，<b>不是物理上限，是排队优先级造成的实际上限</b>。火箭补上 5.45 Mt 是次优但必需的选择。</div>
    </div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">日发射节奏 · 一年 3650 次火箭的分时分布</div>
        <div class="legend">
          <span><i class="ln" style="background:#b8543a"></i>每日发射次数</span>
          <span><i class="ln" style="background:#e0a04a"></i>平均 10 次/日</span>
        </div>
      </div>
      <canvas id="cvLaunch" height="200"></canvas>
      <p class="note" id="launchNote" style="margin-top:8px"></p>
    </div>
  </div>
</section>

<!-- ============== 第五幕 结论 ============== -->
<section class="scene" id="s5" data-title="五 · 结论：年净需水 7.51 Mt · 总成本 129.19 B">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第五幕</div>
      <h1>结论汇总：7.51 Mt 净需水 · 129.19 B USD
        <small>SIRS 闭环模型给出年净需水边界，电梯+火箭混合运送给出最优成本。两个数字定义了问题三的全部答案。</small>
      </h1>
      <p class="lead">问题三的输出可以压缩成两条主线：<b class="hl-t">年净需水 7.51 Mt</b> 是地球必须运送的水量下限；<b class="hl">总成本 129.19 B USD</b> 是在电梯运力被基建挤占的约束下、由电梯 2.06 Mt + 火箭 5.45 Mt 混合运送的最优成本。</p>
    </div>

    <div class="grid4 stg" id="sumKpi"></div>

    <div class="grid2 stg">
      <div class="card">
        <h3>关键结论 <em>三条主线</em></h3>
        <p><b class="hl-t">① 闭环回收率决定净需水</b>：η_h=0.88 与 η_a=0.72 的差距使农业损耗占大头（2.74 Mt），是后续运送方案的结构性来源。</p>
        <p><b class="hl-g">② 运力约束决定混合比例</b>：电梯年运水配额 2.06 Mt 是排队优先级造成的实际上限，不是物理上限。剩余缺口必须由火箭顶上。</p>
        <p><b class="hl">③ 稳态节奏</b>：5.45 Mt/年由约 3650 次火箭发射承担，平均每日 10 次，集中在月球当地白天窗口。</p>
      </div>
      <div class="card">
        <h3>最优分配方案 <em>电梯 + 火箭</em></h3>
        <table class="tb">
          <tr><th>项</th><th>电梯</th><th>火箭</th><th>合计</th></tr>
          <tr class="on"><td class="l">运水量</td><td class="num">2.06 Mt</td><td class="num">5.45 Mt</td><td class="num"><b>7.51 Mt</b></td></tr>
          <tr><td class="l">占比</td><td class="num">27.5%</td><td class="num">72.5%</td><td class="num">100%</td></tr>
          <tr><td class="l">单位成本</td><td class="num">$0.018/kg</td><td class="num">$0.024/kg</td><td class="num">—</td></tr>
          <tr><td class="l">年成本</td><td class="num">37.1 B</td><td class="num">92.1 B</td><td class="num"><b>129.19 B</b></td></tr>
          <tr><td class="l">年发次</td><td class="num">—</td><td class="num">3650</td><td class="num">3650</td></tr>
        </table>
        <div class="quote"><span class="badge q">最优性</span>电梯吃满 2.06 Mt 配额，剩余 5.45 Mt 全交火箭；任何把更多份额从电梯挪给火箭的方案都会提高总成本。</div>
      </div>
    </div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">问题三全景：从毛用水到最优成本</div>
        <div class="legend">
          <span><i style="background:#12a594"></i>毛用水 25 Mt</span>
          <span><i style="background:#1e9fc4"></i>回收 17.49 Mt</span>
          <span><i style="background:#b8543a"></i>地球补给 7.51 Mt</span>
          <span><i style="background:#0b6e68"></i>电梯 2.06 Mt</span>
          <span><i style="background:#e0a04a"></i>火箭 5.45 Mt</span>
        </div>
      </div>
      <canvas id="cvSummary" height="300"></canvas>
      <p class="note" id="sumNote" style="margin-top:8px"></p>
    </div>
  </div>
</section>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var D=JSON.parse($('#DATA').textContent);
D.ui=D.ui||{};
var CY=D.cycle, DM=D.demand, AL=D.alloc, TL=D.timeline;

/* ---------------- 画图基础工具 ---------------- */
function prepCanvas(cv,h){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  return {g:g,w:w,h:h};
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function kpi(v,k,cls){ return '<div class="kpi '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

/* 全局动画时间，用于流动粒子等 */
var T0=Date.now();
function animTime(){ return (Date.now()-T0)/1000; }

/* ---------------- 第一幕 概览图 ---------------- */
var R={};
R.cvOverview=function(cv){
  var d=prepCanvas(cv,280), g=d.g, w=d.w, h=d.h;
  var cx=w/2, cy=h/2;
  var t=animTime();

  /* 三个圆环节点：地球→库存→使用→回收→库存 */
  var nodes=[
    {t:'地球补给\nE=7.51 Mt',x:80, y:cy, c:'#b8543a', r:38},
    {t:'可用洁水\nS=25 Mt',x:cx, y:60, c:'#12a594', r:42},
    {t:'用水输入\nI=25 Mt',x:cx, y:cy+30, c:'#0b6e68', r:38},
    {t:'再生水池\nR=17.49 Mt',x:w-80, y:cy, c:'#1e9fc4', r:42}
  ];

  /* 流向边 */
  var edges=[
    {a:nodes[0],b:nodes[1],c:'#b8543a',label:'Input_Earth',speed:1.0},
    {a:nodes[1],b:nodes[2],c:'#0b6e68',label:'分配',speed:1.2},
    {a:nodes[2],b:nodes[3],c:'#e0a04a',label:'回收 η',speed:1.0,dash:[6,4]},
    {a:nodes[3],b:nodes[1],c:'#1e9fc4',label:'再生回流',speed:1.3},
    {a:nodes[2],b:nodes[0],c:'#b8543a',label:'损耗',speed:0.8,dash:[4,4]}
  ];

  /* 画边 + 流动粒子 */
  edges.forEach(function(e){
    g.save();
    g.strokeStyle=e.c; g.lineWidth=2;
    if(e.dash) g.setLineDash(e.dash); else g.setLineDash([]);
    g.beginPath(); g.moveTo(e.a.x,e.a.y); g.lineTo(e.b.x,e.b.y); g.stroke();
    g.setLineDash([]);
    /* 流动粒子（多个） */
    if(!document.body.classList.contains('reduce')){
      for(var k=0;k<3;k++){
        var p=((t*e.speed+k/3)%1);
        var px=e.a.x+(e.b.x-e.a.x)*p;
        var py=e.a.y+(e.b.y-e.a.y)*p;
        g.fillStyle=e.c; g.globalAlpha=0.85*(1-Math.abs(p-0.5)*0.4);
        g.beginPath(); g.arc(px,py,3.2,0,6.2832); g.fill();
        g.globalAlpha=1;
      }
    }
    /* 箭头 */
    var ang=Math.atan2(e.b.y-e.a.y,e.b.x-e.a.x);
    g.translate(e.b.x-Math.cos(ang)*(e.b.r+2),e.b.y-Math.sin(ang)*(e.b.r+2));
    g.rotate(ang);
    g.fillStyle=e.c; g.beginPath();
    g.moveTo(-7,-4); g.lineTo(0,0); g.lineTo(-7,4); g.closePath(); g.fill();
    g.restore();
    /* 边标签 */
    var mx=(e.a.x+e.b.x)/2, my=(e.a.y+e.b.y)/2;
    g.font='600 10.5px "PingFang SC",system-ui,sans-serif';
    var tw=g.measureText?g.measureText(e.label).width:e.label.length*10;
    g.fillStyle='rgba(255,255,255,.95)'; g.fillRect(mx-tw/2-4,my-8,tw+8,15);
    g.strokeStyle='#d9e9e9'; g.lineWidth=1; g.strokeRect(mx-tw/2-3.5,my-7.5,tw+7,14);
    g.fillStyle=e.c; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(e.label,mx,my);
  });

  /* 画节点 */
  nodes.forEach(function(n){
    g.save();
    /* 脉动光晕 */
    if(!document.body.classList.contains('reduce')){
      var pulse=0.5+0.5*Math.sin(t*2.5);
      g.fillStyle=n.c; g.globalAlpha=0.12+pulse*0.10;
      g.beginPath(); g.arc(n.x,n.y,n.r+8+pulse*4,0,6.2832); g.fill();
      g.globalAlpha=1;
    }
    g.shadowColor='rgba(11,46,54,.10)'; g.shadowBlur=10; g.shadowOffsetY=2;
    g.fillStyle='rgba(255,255,255,.97)'; g.strokeStyle=n.c; g.lineWidth=2;
    g.beginPath(); g.arc(n.x,n.y,n.r,0,6.2832); g.fill(); g.shadowBlur=0;
    g.stroke();
    /* 文字 */
    var lines=n.t.split('\n');
    g.fillStyle=n.c; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(lines[0],n.x,n.y-7);
    g.fillStyle='#57727c'; g.font='10.5px "PingFang SC",system-ui,sans-serif';
    g.fillText(lines[1],n.x,n.y+8);
    g.restore();
  });

  /* 顶部标题 */
  g.fillStyle='#57727c'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('闭环：E→S→I→R→S，损耗由 E 顶上；年净需水 7.51 Mt',12,16);
};

function fillOvKpi(){
  $('#ovKpi').innerHTML=
    kpi(CY.population/10000+' <u>万</u>','殖民地设计人口','')+
    kpi(CY.per_capita_daily+' <u>L/日</u>','人均日需水','b')+
    kpi(CY.gross_annual+' <u>Mt</u>','年毛用水','')+
    kpi(CY.net_annual+' <u>Mt/年</u>','年净需水（地球补给）','w');
}

/* ---------------- 第二幕 SIRS 循环图（核心动画） ---------------- */
R.cvCycle=function(cv){
  var d=prepCanvas(cv,420), g=d.g, w=d.w, h=d.h;
  var cx=w/2, cy=h/2+10;
  var t=animTime();

  /* 节点圆周布局：6 个节点 */
  var nodes=[
    {k:'S', t:'可用洁水\nStock', v:'25.0 Mt', x:cx, y:cy-150, c:'#12a594', r:44},
    {k:'I_h', t:'生活用水\nInput_h', v:CY.life_inflow+' Mt', x:cx-180, y:cy-40, c:'#0b6e68', r:40},
    {k:'I_a', t:'农业用水\nInput_a', v:CY.agri_inflow+' Mt', x:cx+180, y:cy-40, c:'#e0a04a', r:40},
    {k:'I_i', t:'工业用水\nInput_i', v:CY.ind_inflow+' Mt', x:cx, y:cy+40, c:'#146c87', r:40},
    {k:'R', t:'再生水池\nRecycling', v:CY.recycled+' Mt', x:cx, y:cy+150, c:'#1e9fc4', r:44},
    {k:'E', t:'地球补给\nSupply', v:'7.51 Mt', x:cx-230, y:cy+150, c:'#b8543a', r:40}
  ];
  /* 窄画布收紧 */
  if(w<720){ nodes.forEach(function(n){ n.x=cx+(n.x-cx)*0.80; }); }
  if(w<560){ nodes.forEach(function(n){ n.x=cx+(n.x-cx)*0.66; }); }

  function findNode(id){ for(var i=0;i<nodes.length;i++) if(nodes[i].k===id) return nodes[i]; return null; }

  /* 流向边 */
  var edges=[
    {from:'S',to:'I_h',c:'#0b6e68',label:'分配',speed:1.0,curve:0.0},
    {from:'S',to:'I_a',c:'#e0a04a',label:'分配',speed:1.0,curve:0.0},
    {from:'S',to:'I_i',c:'#146c87',label:'分配',speed:0.9,curve:0.0},
    {from:'I_h',to:'R',c:'#12a594',label:'',speed:1.2,recycle:true},
    {from:'I_a',to:'R',c:'#12a594',label:'',speed:1.0,recycle:true},
    {from:'I_i',to:'E',c:'#b8543a',label:'100% 损耗',speed:0.7,dash:[5,4]},
    {from:'R',to:'S',c:'#1e9fc4',label:'再生回流',speed:1.4,curve:0.0},
    {from:'E',to:'S',c:'#b8543a',label:'',speed:0.9,curve:0.0},
    {from:'I_h',to:'E',c:'#e0a04a',label:'',speed:0.6,dash:[4,3],small:true},
    {from:'I_a',to:'E',c:'#e0a04a',label:'',speed:0.6,dash:[4,3],small:true}
  ];

  /* 画边（带弯曲与流动粒子） */
  edges.forEach(function(e){
    var a=findNode(e.from), b=findNode(e.to);
    if(!a||!b) return;
    g.save();
    /* 曲线控制点 */
    var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    var dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/len, ny=dx/len, off=e.recycle?16:10;
    var cpx=mx+nx*off, cpy=my+ny*off;

    g.strokeStyle=e.c; g.lineWidth=e.recycle?2.4:1.8;
    if(e.dash) g.setLineDash(e.dash); else g.setLineDash([]);
    g.beginPath(); g.moveTo(a.x,a.y);
    g.quadraticCurveTo(cpx,cpy,b.x,b.y); g.stroke();
    g.setLineDash([]);

    /* 流动粒子（多个，沿贝塞尔曲线移动） */
    if(!document.body.classList.contains('reduce')){
      var np=e.small?2:3;
      for(var k=0;k<np;k++){
        var p=((t*e.speed+k/np)%1);
        var omp=1-p;
        var px=omp*omp*a.x+2*omp*p*cpx+p*p*b.x;
        var py=omp*omp*a.y+2*omp*p*cpy+p*p*b.y;
        g.fillStyle=e.c; g.globalAlpha=0.9*(1-Math.abs(p-0.5)*0.3);
        g.beginPath(); g.arc(px,py,e.recycle?4:3.4,0,6.2832); g.fill();
        g.globalAlpha=1;
      }
    }

    /* 箭头 */
    var ang=Math.atan2(b.y-cpy,b.x-cpx);
    g.translate(b.x-Math.cos(ang)*(b.r+2),b.y-Math.sin(ang)*(b.r+2));
    g.rotate(ang);
    g.fillStyle=e.c; g.beginPath();
    g.moveTo(-7,-4); g.lineTo(0,0); g.lineTo(-7,4); g.closePath(); g.fill();
    g.restore();

    /* 边标签：偏移量按边两端节点半径取大值 + 外扩 */
    var rPad=Math.max(a.r,b.r)+14;
    var lblOff=e.recycle?rPad+8:rPad+4;
    var lx=mx+nx*lblOff, ly=my+ny*lblOff;
    g.font='600 10.5px "PingFang SC",system-ui,sans-serif';
    var tw=g.measureText?g.measureText(e.label).width:e.label.length*10;
    g.fillStyle='rgba(255,255,255,.96)'; g.fillRect(lx-tw/2-4,ly-8,tw+8,15);
    g.strokeStyle='#d9e9e9'; g.lineWidth=1; g.strokeRect(lx-tw/2-3.5,ly-7.5,tw+7,14);
    g.fillStyle=e.c; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(e.label,lx,ly);
  });

  /* 画节点（带脉动光晕） */
  nodes.forEach(function(n){
    g.save();
    /* 脉动光晕 */
    if(!document.body.classList.contains('reduce')){
      var pulse=0.5+0.5*Math.sin(t*2+n.x*0.01);
      g.fillStyle=n.c; g.globalAlpha=0.10+pulse*0.10;
      g.beginPath(); g.arc(n.x,n.y,n.r+10+pulse*5,0,6.2832); g.fill();
      g.globalAlpha=1;
    }
    /* 主体 */
    g.shadowColor='rgba(11,46,54,.10)'; g.shadowBlur=12; g.shadowOffsetY=3;
    g.fillStyle='rgba(255,255,255,.97)'; g.strokeStyle=n.c; g.lineWidth=2.2;
    g.beginPath(); g.arc(n.x,n.y,n.r,0,6.2832); g.fill(); g.shadowBlur=0;
    g.stroke();
    /* 内圈装饰 */
    g.strokeStyle=n.c; g.globalAlpha=0.25; g.lineWidth=1;
    g.beginPath(); g.arc(n.x,n.y,n.r-5,0,6.2832); g.stroke(); g.globalAlpha=1;
    /* 文字 */
    var lines=n.t.split('\n');
    g.fillStyle=n.c; g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(lines[0],n.x,n.y-10);
    g.fillStyle='#57727c'; g.font='10.5px "PingFang SC",system-ui,sans-serif';
    g.fillText(lines[1],n.x,n.y+4);
    g.fillStyle=n.c; g.font='700 12px "PingFang SC",system-ui,sans-serif';
    g.fillText(n.v,n.x,n.y+18);
    g.restore();
  });

  /* 标题 */
  g.fillStyle='#57727c'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('SIRS 闭环：S→I(生活/农业/工业)→R→S，损耗由 E=Input_Earth 补给；稳态条件 dS/dt=0',12,16);
};
function fillCycleKpi(){
  $('#cycleKpi').innerHTML=
    kpi('10 <u>万人</u>','殖民地设计人口','')+
    kpi(CY.eta_h,'生活废水回收率 η_h','')+
    kpi(CY.eta_a,'农业废水回收率 η_a','g')+

  $('#cycleNote').innerHTML='<span class="badge">SIRS</span>四只水箱：S（可用洁水）→ I（生活/农业/工业用水）→ R（再生水）→ 回到 S。生活废水走 η_h=0.88 支路、农业废水走 η_a=0.72 支路回到 R；不可回收损耗（蒸发、消耗、渗漏）必须由 E=Input_Earth 顶上，年净需水 7.51 Mt。闭环稳态条件：dS/dt=0。';
}

/* ---------------- 第三幕 水需求 ---------------- */
R.cvDemand=function(cv){
  var d=prepCanvas(cv,280), g=d.g, w=d.w, h=d.h;
  var parts=DM.parts, vals=parts.map(function(p){return p.v;}), n=parts.length;
  var ymax=Math.max.apply(null,vals)*1.35;
  var L=52, Rr=18, T=24, B=48, PW=w-L-Rr, PH=h-T-B;
  var bw=Math.min(120,PW/n*0.5), step=PW/n;
  var t=animTime();

  function Y(v){ return T+PH*(1-v/ymax); }

  /* 网格 */
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=ymax*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(2)+' Mt',L-7,yy);
  }
  g.strokeStyle='#d9e9e9'; g.beginPath(); g.moveTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();

  /* 柱（带增长动画） */
  parts.forEach(function(p,k){
    var target=PH*(p.v/ymax);
    /* 增长进度（0→1，2 秒内完成） */
    var prog=document.body.classList.contains('reduce')?1:Math.min(1,t/2);
    prog=Math.max(0,Math.min(1,prog-k*0.15));
    prog=Math.max(0,prog);
    var bh=target*prog;
    var x=L+step*(k+0.5)-bw/2, y=T+PH-bh;
    /* 柱体渐变 */
    var grd=g.createLinearGradient(0,y,0,T+PH);
    grd.addColorStop(0,p.c); grd.addColorStop(1,p.c+'cc');
    g.fillStyle=grd; g.fillRect(x,y,bw,bh);
    /* 顶部高光 */
    g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(x,y,bw,3);
    /* 数值标签 */
    if(prog>0.6){
      g.fillStyle='#0b2e36'; g.font='600 13px "PingFang SC",system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='alphabetic';
      g.fillText(p.v.toFixed(2)+' Mt',x+bw/2,y-7);
    }
    /* X 轴标签 */
    g.fillStyle='#57727c'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
    g.fillText(p.k,x+bw/2,T+PH+18);
    if(p.eta>0){ g.fillStyle='#8aa3aa'; g.fillText('η='+(p.eta*100).toFixed(0)+'%',x+bw/2,T+PH+33); }
    else { g.fillStyle='#8aa3aa'; g.fillText('不可回收',x+bw/2,T+PH+33); }
  });

  /* 合计线 */
  var total=DM.total;
  var ty=Y(total);
  g.save(); g.setLineDash([5,4]); g.strokeStyle='#b8543a'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(L,ty); g.lineTo(L+PW,ty); g.stroke(); g.restore();
  g.fillStyle='#b8543a'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('合计 '+total.toFixed(2)+' Mt/年',L+4,ty-5);
};
function fillDemandKpi(){
  var parts=DM.parts;
  $('#demandKpi').innerHTML=
    kpi(DM.total.toFixed(2)+' <u>Mt/年</u>','年净需水合计','w')+
    kpi(parts[0].v.toFixed(2)+' <u>Mt</u>','生活损耗（η_h=0.88）','')+
    kpi(parts[1].v.toFixed(2)+' <u>Mt</u>','农业损耗（η_a=0.72）','g')+
    kpi((parts[2].v+parts[3].v).toFixed(2)+' <u>Mt</u>','工业 + 蒸发损耗','b');
  $('#demandNote').innerHTML='<span class="badge">分解</span>7.51 Mt 按四个不可回收项分解：农业损耗 2.74 Mt 占比最大（η_a=0.72 最低），生活损耗 1.62 Mt（η_h=0.88 较高），工业消耗 1.70 Mt 全部损失，蒸发与其他 1.45 Mt。四项相加恰好等于地球必须补给的 Input_Earth。';
}
R.cvCum=function(cv){
  var annual=TL.annual, cum=TL.cumulative, n=annual.length;
  var ymax=Math.max(Math.max.apply(null,annual),Math.max.apply(null,cum))*1.1;
  var d=prepCanvas(cv,240), g=d.g, w=d.w, h=d.h;
  var L=54, Rr=54, T=18, B=26, PW=w-L-Rr, PH=h-T-B;
  var t=animTime();

  function X(i){ return L+PW*(n<=1?0:i/(n-1)); }
  function Y(v){ return T+PH*(1-v/ymax); }

  /* 网格 */
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=ymax*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(2)+' Mt',L-7,yy);
  }
  /* X 轴刻度 */
  TL.years.forEach(function(y,i){
    var xx=X(i);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText('Y'+y,xx,T+PH+16);
  });

  /* 稳态线 */
  var sy=Y(7.51);
  g.save(); g.setLineDash([5,4]); g.strokeStyle='#b8543a'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(L,sy); g.lineTo(L+PW,sy); g.stroke(); g.restore();
  g.fillStyle='#b8543a'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('稳态 7.51 Mt/年',L+4,sy-5);

  /* 累计曲线（带动画绘制） */
  var prog=document.body.classList.contains('reduce')?1:Math.min(1,t*0.8);
  var drawN=Math.max(1,Math.floor(n*prog));
  g.strokeStyle='#1e9fc4'; g.lineWidth=2.4; g.lineJoin='round';
  g.beginPath();
  for(var i=0;i<drawN;i++){
    var px=X(i),py=Y(cum[i]);
    if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
  }
  g.stroke();
  /* 填充 */
  g.fillStyle='rgba(30,159,196,.14)';
  g.lineTo(X(drawN-1),T+PH); g.lineTo(X(0),T+PH); g.closePath(); g.fill();

  /* 柱状 */
  annual.forEach(function(v,i){
    var bx=X(i), by=Y(v), bw=18;
    g.fillStyle='#12a594'; g.fillRect(bx-bw/2,by,bw,T+PH-by);
    g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(bx-bw/2,by,bw,2);
  });

  $('#cumNote').innerHTML='<span class="badge">累积</span>蓝色累计线在前三年缓慢爬升，Y5 进入稳态后每年增加 7.51 Mt。柱状为当年净需水，基建期低、稳态期持平 7.51 Mt。';
};

R.cvPie=function(cv){
  var d=prepCanvas(cv,280), g=d.g, w=d.w, h=d.h;
  var cx=w/2-30, cy=h/2, Rr=Math.min(w,h)/2-32;
  var elev=AL.elevator, rock=AL.rocket, total=elev+rock;
  var a1=Math.PI*2*elev/total, a2=Math.PI*2*rock/total;
  var start=-Math.PI/2;
  var t=animTime();

  /* 增长进度 */
  var prog=document.body.classList.contains('reduce')?1:Math.min(1,t*1.2);
  var curA1=a1*prog, curA2=a2*prog;

  /* 电梯扇区（透色渐变，同问题四风格） */
  var grd1=g.createRadialGradient(cx,cy,Rr*0.3,cx,cy,Rr);
  grd1.addColorStop(0,'#12a594'); grd1.addColorStop(1,'#fff');
  g.fillStyle=grd1;
  g.beginPath(); g.moveTo(cx,cy);
  g.arc(cx,cy,Rr,start,start+curA1); g.closePath(); g.fill();
  g.strokeStyle='#12a594'; g.lineWidth=2.2; g.stroke();

  /* 火箭扇区（透色渐变，同问题四风格） */
  var grd2=g.createRadialGradient(cx,cy,Rr*0.3,cx,cy,Rr);
  grd2.addColorStop(0,'#b8543a'); grd2.addColorStop(1,'#fff');
  g.fillStyle=grd2;
  g.beginPath(); g.moveTo(cx,cy);
  g.arc(cx,cy,Rr,start+curA1,start+curA1+curA2); g.closePath(); g.fill();
  g.strokeStyle='#b8543a'; g.lineWidth=2.2; g.stroke();

  /* 中心镂空 */
  g.fillStyle='#fff';
  g.beginPath(); g.arc(cx,cy,Rr*0.45,0,Math.PI*2); g.fill();
  g.strokeStyle='#d9e9e9'; g.lineWidth=1; g.stroke();

  /* 标签 */
  if(prog>0.5){
    function mid(s){ return start + s/2; }
    var m1=mid(a1), m2=start+a1+mid(a2);

      var lx=cx+Math.cos(ang)*(Rr*0.92), ly=cy+Math.sin(ang)*(Rr*0.92);
      g.fillStyle=c; g.font='700 15px "PingFang SC",system-ui,sans-serif';

      g.fillText(txt,lx,ly-8);
      g.fillStyle='#57727c'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
      g.fillText(sub,lx,ly+9);
    }
    putLabel(m1,AL.elevator_pct+'%','电梯 '+elev.toFixed(2)+' Mt','#0b2e36');
    putLabel(m2,AL.rocket_pct+'%','火箭 '+rock.toFixed(2)+' Mt','#0b2e36');
  }

  /* 中心文字 */
  g.fillStyle='#57727c'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('运水合计',cx,cy-9);
  g.fillStyle='#0b6e68'; g.font='700 14px "PingFang SC",system-ui,sans-serif';
  g.fillText(total.toFixed(2)+' Mt',cx,cy+8);

  /* 右侧成本块 */
  g.fillStyle='#0b2e36'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('总成本',w-100,cy-30);
  g.fillStyle='#b8543a'; g.font='700 20px "PingFang SC",system-ui,sans-serif';
  g.fillText(AL.cost_b+' B',w-100,cy-4);
  g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
  g.fillText('USD',w-100+72,cy-4);
  g.fillStyle='#0b2e36'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.fillText('日发射',w-100,cy+24);
  g.fillStyle='#b8543a'; g.font='700 17px "PingFang SC",system-ui,sans-serif';
  g.fillText('≈ '+AL.launches_per_day+' 次',w-100,cy+44);
};

/* ---------------- 第五幕 结论汇总图 ---------------- */
R.cvSummary=function(cv){
  var d=prepCanvas(cv,300), g=d.g, w=d.w, h=d.h;
  var t=animTime();
  var L=60, Rr=20, T=30, B=40, PW=w-L-Rr, PH=h-T-B;

  /* 桑基式水流图：毛用水 → 分解 → 运输 */
  /* 第一层：毛用水 25 Mt（绿） */
  var grossW=PW*0.85;
  var gx=L+(PW-grossW)/2;
  /* 分解：回收 17.49 + 损耗 7.51 */
  var recycledW=grossW*(CY.recycled/CY.gross_annual);
  var netW=grossW*(CY.net_annual/CY.gross_annual);
  /* 运输分解：电梯 2.06 + 火箭 5.45 */
  var elevW=netW*(AL.elevator/CY.net_annual);
  var rockW=netW*(AL.rocket/CY.net_annual);

  /* 增长进度 */
  var prog=document.body.classList.contains('reduce')?1:Math.min(1,t*0.9);

  /* 第一层：毛用水 */
  var y1=T, h1=50;
  var grd=g.createLinearGradient(0,y1,0,y1+h1);
  grd.addColorStop(0,'#12a594'); grd.addColorStop(1,'#0b6e68');
  g.fillStyle=grd;
  g.fillRect(gx,y1,grossW*prog,h1);
  g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(gx,y1,grossW*prog,3);
  g.fillStyle='#fff'; g.font='600 13px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  if(prog>0.5) g.fillText('毛用水 25.0 Mt',gx+grossW*prog/2,y1+h1/2);

  /* 分流连接（回收 + 损耗） */
  var y2=T+h1+30, h2=40;
  var recycledX=gx, netX=gx+recycledW;
  /* 回收流 */
  g.fillStyle='#1e9fc4'; g.globalAlpha=0.6;
  g.beginPath();
  g.moveTo(recycledX,y1+h1);
  g.lineTo(recycledX,y1+h1+15);
  g.lineTo(recycledX+recycledW*prog,y1+h1+15);
  g.lineTo(recycledX+recycledW*prog,y2);
  g.lineTo(recycledX,y2);
  g.closePath(); g.fill(); g.globalAlpha=1;
  /* 损耗流 */
  g.fillStyle='#b8543a'; g.globalAlpha=0.6;
  g.beginPath();
  g.moveTo(netX,y1+h1);
  g.lineTo(netX,y1+h1+15);
  g.lineTo(netX+netW*prog,y1+h1+15);
  g.lineTo(netX+netW*prog,y2);
  g.lineTo(netX,y2);
  g.closePath(); g.fill(); g.globalAlpha=1;

  /* 第二层：回收 + 损耗 */
  var grd2=g.createLinearGradient(0,y2,0,y2+h2);
  grd2.addColorStop(0,'#1e9fc4'); grd2.addColorStop(1,'#0b6e68');
  g.fillStyle=grd2; g.fillRect(recycledX,y2,recycledW*prog,h2);
  g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(recycledX,y2,recycledW*prog,3);
  if(prog>0.5){
    g.fillStyle='#fff'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('回收 '+CY.recycled+' Mt',recycledX+recycledW*prog/2,y2+h2/2);
  }
  var grd3=g.createLinearGradient(0,y2,0,y2+h2);
  grd3.addColorStop(0,'#d6684e'); grd3.addColorStop(1,'#b8543a');
  g.fillStyle=grd3; g.fillRect(netX,y2,netW*prog,h2);
  g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(netX,y2,netW*prog,3);
  if(prog>0.5){
    g.fillStyle='#fff'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('地球补给 7.51 Mt',netX+netW*prog/2,y2+h2/2);
  }

  /* 第三层：电梯 + 火箭 */
  var y3=y2+h2+30, h3=46;
  /* 连接流 */
  g.fillStyle='#0b6e68'; g.globalAlpha=0.5;
  g.beginPath();
  g.moveTo(netX,y2+h2); g.lineTo(netX,y2+h2+15);
  g.lineTo(netX+elevW*prog,y2+h2+15); g.lineTo(netX+elevW*prog,y3);
  g.lineTo(netX,y3); g.closePath(); g.fill();
  g.fillStyle='#e0a04a'; g.globalAlpha=0.5;
  g.beginPath();
  g.moveTo(netX+elevW,y2+h2); g.lineTo(netX+elevW,y2+h2+15);
  g.lineTo(netX+elevW+rockW*prog,y2+h2+15); g.lineTo(netX+elevW+rockW*prog,y3);
  g.lineTo(netX+elevW,y3); g.closePath(); g.fill();
  g.globalAlpha=1;

  var grd4=g.createLinearGradient(0,y3,0,y3+h3);
  grd4.addColorStop(0,'#1ea89c'); grd4.addColorStop(1,'#0b6e68');
  g.fillStyle=grd4; g.fillRect(netX,y3,elevW*prog,h3);
  g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(netX,y3,elevW*prog,3);
  if(prog>0.5){
    g.fillStyle='#fff'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('电梯 '+AL.elevator+' Mt',netX+elevW*prog/2,y3+h3/2);
  }
  var grd5=g.createLinearGradient(0,y3,0,y3+h3);
  grd5.addColorStop(0,'#e0a04a'); grd5.addColorStop(1,'#b8543a');
  g.fillStyle=grd5; g.fillRect(netX+elevW,y3,rockW*prog,h3);
  g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(netX+elevW,y3,rockW*prog,3);
  if(prog>0.5){
    g.fillStyle='#fff'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('火箭 '+AL.rocket+' Mt',netX+elevW+rockW*prog/2,y3+h3/2);
  }

  /* 标签 */
  g.fillStyle='#57727c'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('① 毛用水 25 Mt',12,y1+12);
  g.fillText('② 回收 17.49 / 损耗 7.51',12,y2+12);
  g.fillText('③ 电梯 2.06 / 火箭 5.45',12,y3+12);

  /* 成本标签 */
  g.fillStyle='#b8543a'; g.font='700 14px "PingFang SC",system-ui,sans-serif';
  g.textAlign='right'; g.textBaseline='alphabetic';
  g.fillText('总成本 129.19 B USD',w-10,y3+h3+28);
};

      </div>
    </div>

    <div class="quote">生命周期评估不是简单的「环保排名」，而是把建造、运营、维护、退役每一阶段的物理量，通过货币化系数统一折算成元。当所有影响都被折成同一笔账，电梯与火箭的差距就能直接相减，方案优化也就有了量化依据。</div>
  </div>
</section>

<!-- ===================== 第二幕 LCA评估框架：四阶段流程 ===================== -->
<section class="scene" id="s2" data-title="二 · LCA 四阶段评估框架">
  <div class="wrap">
    <div>
      <div class="kicker">问题四 · LCA 评估框架</div>
      <h1>四阶段流程：从目标定义到结果解释
        <small>ISO 14040 标准框架：目标与范围定义 → 清单分析 → 影响评估 → 解释。</small>
      </h1>
      <p class="lead">LCA 评估严格遵循 ISO 14040/14044 标准的四阶段框架：先确定目标与边界，再列清单算投入产出，然后按影响类别做特征化与货币化，最后对结果做敏感性分析与解释。每一阶段的输出是下一阶段的输入，形成闭环。</p>
    </div>

    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">LCA 四阶段流程图 · 带动效流转</div>
        <div class="legend">
          <span><i style="background:#12a594"></i>目标与范围定义</span>
          <span><i style="background:#e0a04a"></i>清单分析 (LCI)</span>
          <span><i style="background:#146c87"></i>影响评估 (LCIA)</span>
          <span><i style="background:#b8543a"></i>解释</span>
          <span><i class="ln" style="background:#1e9fc4"></i>数据流</span>
        </div>
      </div>
      <canvas id="cvFlow" height="340"></canvas>
      <p class="note" style="margin-top:8px">四个阶段构成闭环：目标定义确定边界，清单分析量化投入产出，影响评估做特征化与货币化，解释阶段对结果做稳健性检查。每个箭头都有流动粒子，表示数据在阶段间传递。解释阶段会反向影响前面阶段——若结果不稳健，需回到目标定义重新界定边界。</p>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>阶段一 · 目标与范围定义 <span class="badge q">Goal</span></h3>
        <p>明确评估目的（比较方案、优化配比）、功能单位（运送 1 吨物资到月球）、系统边界（从地球采矿到月球投送）。</p>
        <p>关键决策：<b>是否计入电梯缆绳的全寿期排放</b>（影响电梯的环境成本，但摊到 50 年寿命后单位成本反而最低）。</p>
        <div class="note" style="margin-top:6px">功能单位选「1 吨·地球到月球」，避免按运力差产生口径偏差。</div>
      </div>
      <div class="card">
        <h3>阶段二 · 清单分析 (LCI) <span class="badge p">Inventory</span></h3>
        <p>对系统每一阶段列出投入产出清单：</p>
        <p><span class="badge n">投入</span>电力 kWh、推进剂 kg、钢材 t、稀土 kg</p>
        <p><span class="badge n">产出</span>CO₂ kg、NOx kg、固体废弃物 kg、噪声 dB·人</p>
        <div class="note" style="margin-top:6px">电梯与火箭两套清单分开列，便于在第三阶段做特征化与对比。</div>
      </div>
      <div class="card">
        <h3>阶段三 · 影响评估 (LCIA) <span class="badge q">Impact</span></h3>
        <p>按四个影响类别（材料、能源、碳、废弃物）分别乘以特征化因子，再乘以货币化系数，得到每类影响的元值。</p>
        <p>特征化因子参考 ExternE 与 EcoIndicator 99 数据库，在题面口径下做量纲归一。</p>
        <div class="note" style="margin-top:6px">货币化后，不同类别的影响可直接相加，得到环境总成本。</div>
      </div>
      <div class="card">
        <h3>阶段四 · 解释 <span class="badge w">Interpretation</span></h3>
        <p>对结果做敏感性分析与稳健性检查：变化 ±20% 的关键参数（货币化系数、清单数据），看最优配比是否漂移。</p>
        <p>核心结论：<b>58.65% 的最优占比在 ±15% 的参数扰动下保持稳定</b>，是真正的鞍点而非数值偶然。</p>
        <div class="note w" style="margin-top:6px">这一阶段的输出回溯到阶段一，若发现边界定义有缺漏，需重新调整范围。</div>
      </div>
    </div>

    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">电梯 vs 火箭 · 单位运量全生命周期排放对比（对数刻度）</div>

          <span><i style="background:#b8543a"></i>火箭 单位排放</span>
        </div>
      </div>
      <canvas id="cvLCA" height="280"></canvas>
      <p class="note" style="margin-top:8px">纵轴取对数刻度：火箭的碳排放与平流层污染比电梯高出两到三个数量级，线性刻度会把电梯的柱子压成一条线。这正是电梯作为「绿色基线」、火箭作为「灵活补缺」的根本原因。</p>
    </div>

    <div class="grid6" id="metricGrid"></div>

    <div class="quote">LCA 的价值不在算出一个数字，而在于把建造、运营、维护、退役每一阶段的物理量统一折成同一笔账。这样「减少环境影响」就不再是空泛口号，而是一组可直接算的边际成本——电网碳强度降一克，总成本降多少；火箭推进剂换一种，平流层成本降多少。</div>
  </div>
</section>

        <h3>为什么是 58.65% / 41.35% <em>最优占比的来历</em></h3>
        <p>电梯的单位运量环境成本远低于火箭，所以「能用电时就不用火箭」是基本取向。但电梯单日运力有上限，在固定预算下把全部运量都交给电梯，会把工期拉到 146 年以上，超出合理工期。</p>
        <p>把 <b>电梯运量占比</b> 当作决策变量，对环境总成本做单变量优化：成本曲线在 58.65% 处取得极小值。占比再往上提，工期拖长带来的维护排放与建造摊销反而抬升总成本；占比往下压，火箭排放快速占主导。</p>
        <div class="note t" style="margin-top:6px">58.65% 是「环境成本-工期」联合目标的鞍点：电梯再多一点，工期成本反超；火箭再多一点，排放成本反超。</div>

        <p><span class="badge q">2</span><b>火箭推进剂替换</b>：用液氧/液氢或甲烷基推进剂替代含氯推进剂，直接削平流层污染这一项。</p>
        <p><span class="badge q">3</span><b>运量调度优化</b>：电梯负责基线、火箭只在峰值补缺，把火箭的发射次数压到最低，噪声与大气污染同步下降。</p>
        <div class="note w" style="margin-top:6px">三条建议的边际成本各不相同：电网清洁化是长期红利，推进剂替换是中期工程，调度优化是即时可执行的运营手段。</div>
