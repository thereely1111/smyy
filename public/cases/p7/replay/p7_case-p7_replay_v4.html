<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var D=JSON.parse($('#DATA').textContent);
var M=D.metrics, Schemes=D.schemes, Scenes=D.scenes, EP=D.endpoints;

/* ---------------- 通用绘图工具 ---------------- */
function setupCanvas(cv,h){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  return {g:g,w:w,h:h};
}

/* ---------------- 图表注册 ---------------- */
var R={};

// 第一幕：总览图（地球-月球 + LCA 节点 + 电梯/火箭路线）
R.cvOverview=function(cv){
  var o=setupCanvas(cv,320), g=o.g, w=o.w, h=o.h;
  var L=20,R=20,T=20,B=30,PW=w-L-R,PH=h-T-B;
  // 背景星空
  g.fillStyle='#fafdfd'; g.fillRect(L,T,PW,PH);
  for(var i=0;i<60;i++){
    var sx=L+Math.random()*PW, sy=T+Math.random()*PH, r=Math.random()*1.2+0.3;
    g.fillStyle='rgba(11,46,54,'+(0.06+Math.random()*0.1)+')';
    g.beginPath(); g.arc(sx,sy,r,0,6.2832); g.fill();
  }
  // 地球（左侧大圆）
  var earthX=L+80, earthY=T+PH/2, earthR=44;
  var grd=g.createRadialGradient(earthX-12,earthY-12,8,earthX,earthY,earthR);
  grd.addColorStop(0,'#5fb8c4'); grd.addColorStop(0.5,'#146c87'); grd.addColorStop(1,'#0b2e36');
  g.fillStyle=grd; g.beginPath(); g.arc(earthX,earthY,earthR,0,6.2832); g.fill();
  g.strokeStyle='#0b2e36'; g.lineWidth=1.5; g.stroke();
  g.fillStyle='#fff'; g.font='600 13px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('地球',earthX,earthY);
  // 月球（右侧小圆）
  var moonX=L+PW-50, moonY=T+PH/2, moonR=22;
  var grd2=g.createRadialGradient(moonX-6,moonY-6,4,moonX,moonY,moonR);
  grd2.addColorStop(0,'#f5e8d0'); grd2.addColorStop(1,'#8a6313');
  g.fillStyle=grd2; g.beginPath(); g.arc(moonX,moonY,moonR,0,6.2832); g.fill();
  g.strokeStyle='#8a6313'; g.lineWidth=1.2; g.stroke();
  g.fillStyle='#0b2e36'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('月球',moonX,moonY);
  // 电梯路线（弧形上方）
  var elevPts=[];
  for(var t=0;t<=1;t+=0.02){
    var x=earthX+(moonX-earthX)*t;
    var y=earthY-60+Math.sin(t*Math.PI)*(-50);
    elevPts.push([x,y]);
  }
  // 电梯路径
  g.strokeStyle='#12a594'; g.lineWidth=2.4;
  g.beginPath();
  elevPts.forEach(function(p,i){ if(!i) g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]); });
  g.stroke();
  // 电梯节点（4 个 LCA 阶段，置于曲线下方）
  var nodes=[
    {x:earthX+90,y:earthY-30,label:'建造',col:'#12a594'},
    {x:earthX+180,y:earthY-38,label:'运营',col:'#e0a04a'},
    {x:earthX+260,y:earthY-32,label:'维护',col:'#146c87'},
    {x:moonX-40,y:moonY-14,label:'退役',col:'#b8543a'}
  ];
  nodes.forEach(function(n){
    g.fillStyle='#fff'; g.strokeStyle=n.col; g.lineWidth=2;
    g.beginPath(); g.arc(n.x,n.y,9,0,6.2832); g.fill(); g.stroke();
    g.fillStyle=n.col; g.font='600 11px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle'; g.fillText(n.label,n.x,n.y+20);
  });
  // 火箭路线（弧形下方，多次发射）
  var rockPts=[];
  for(var t=0;t<=1;t+=0.02){
    var x=earthX+(moonX-earthX)*t;
    var y=earthY+60+Math.sin(t*Math.PI)*(60);
    rockPts.push([x,y]);
  }
  g.strokeStyle='#b8543a'; g.lineWidth=2; g.setLineDash([6,4]);
  g.beginPath();
  rockPts.forEach(function(p,i){ if(!i) g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]); });
  g.stroke(); g.setLineDash([]);
  // 火箭发射点
  for(var k=0;k<5;k++){
    var t=k/4, x=earthX+(moonX-earthX)*t, y=earthY+60+Math.sin(t*Math.PI)*60;
    g.fillStyle='#b8543a';
    g.beginPath(); g.arc(x,y,4,0,6.2832); g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1; g.stroke();
  }
  // 标签
  g.fillStyle='#12a594'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('电梯路线 · 单次往返', (earthX+moonX)/2, earthY-120);
  g.fillStyle='#b8543a'; g.fillText('火箭路线 · 多次发射', (earthX+moonX)/2, earthY+130);
  // 标题
  g.fillStyle='#0b2e36'; g.font='600 13px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('LCA 评估覆盖四个阶段：建造 → 运营 → 维护 → 退役',L+10,T+12);
};

// 第二幕：四阶段流程图（带动效流转）
R.cvFlow=function(cv){
  var o=setupCanvas(cv,340), g=o.g, w=o.w, h=o.h;
  var L=30,R=30,T=60,B=30,PW=w-L-R,PH=h-T-B;
  // 四个阶段方框
  var stages=[
    {label:'一 · 目标与范围',en:'Goal & Scope',col:'#12a594',x:0},
    {label:'二 · 清单分析',en:'LCI',col:'#e0a04a',x:0.33},
    {label:'三 · 影响评估',en:'LCIA',col:'#146c87',x:0.66},
    {label:'四 · 解释',en:'Interpretation',col:'#b8543a',x:1}
  ];
  var boxW=160, boxH=72;
  var baseY=T+50;
  // 顶部弧线
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.5;
  g.beginPath();
  for(var t=0;t<=1;t+=0.02){
    var x=L+10+ (PW-20)*t;
    var y=baseY-20-Math.sin(t*Math.PI)*30;
    if(t===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.stroke();
  // 底部回溯线
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.5; g.setLineDash([4,4]);
  g.beginPath();
  for(var t=0;t<=1;t+=0.02){
    var x=L+10+ (PW-20)*(1-t);
    var y=baseY+boxH+20+Math.sin(t*Math.PI)*30;
    if(t===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.stroke(); g.setLineDash([]);
  // 四个阶段
  stages.forEach(function(s,i){
    var x=L+10+ (PW-20)*s.x - boxW/2;
    var y=baseY;
    // 方框阴影
    g.fillStyle='rgba(11,46,54,0.08)';
    g.fillRect(x+2,y+3,boxW,boxH);
    // 方框主体
    var grd=g.createLinearGradient(x,y,x,y+boxH);
    grd.addColorStop(0,s.col); grd.addColorStop(1,'#fff');
    g.fillStyle=grd;
    g.fillRect(x,y,boxW,boxH);
    g.strokeStyle=s.col; g.lineWidth=2;
    g.strokeRect(x,y,boxW,boxH);
    // 顶部色条
    g.fillStyle=s.col;
    g.fillRect(x,y,boxW,4);
    // 编号圆
    g.fillStyle=s.col;
    g.beginPath(); g.arc(x+18,y+22,10,0,6.2832); g.fill();
    g.fillStyle='#fff'; g.font='700 12px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(String(i+1),x+18,y+22);
    // 标签
    g.fillStyle='#0b2e36'; g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='left'; g.textBaseline='middle';
    g.fillText(s.label,x+36,y+18);
    g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
    g.fillText(s.en,x+36,y+36);
    // 内容简述
    g.fillStyle='#3d6570'; g.font='10.5px "PingFang SC",system-ui,sans-serif';
    g.fillText(['功能单位·边界','投入产出清单','特征化·货币化','敏感性·回溯'][i],x+10,y+62);
  });
  // 顶部箭头与流动粒子（数据流）
  var flowT=(Date.now()/1800)%1;
  for(var i=0;i<3;i++){
    var t0=(flowT+i/3)%1;
    var x=L+10+(PW-20)*t0;
    var y=baseY-20-Math.sin(t0*Math.PI)*30;
    g.fillStyle='#1e9fc4';
    g.beginPath(); g.arc(x,y,3.5,0,6.2832); g.fill();
    g.strokeStyle='rgba(30,159,196,0.4)'; g.lineWidth=1;
    g.beginPath(); g.arc(x,y,5.5,0,6.2832); g.stroke();
  }
  // 底部回溯箭头粒子
  for(var i=0;i<2;i++){
    var t0=(flowT+i/2)%1;
    var x=L+10+(PW-20)*(1-t0);
    var y=baseY+boxH+20+Math.sin(t0*Math.PI)*30;
    g.fillStyle='#b8543a';
    g.beginPath(); g.arc(x,y,3,0,6.2832); g.fill();
  }
  // 标签
  g.fillStyle='#1e9fc4'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('正向数据流 →',L+PW/2,baseY-40);
  g.fillStyle='#b8543a';
  g.fillText('← 回溯修正',L+PW/2,baseY+boxH+50);
};

// 第二幕：电梯 vs 火箭 单位运量排放对比（对数刻度柱状图）
R.cvLCA=function(cv){
  var o=setupCanvas(cv,280), g=o.g, w=o.w, h=o.h;
  var L=54,R=20,T=22,B=38,PW=w-L-R,PH=h-T-B;
  function logY(v){ return T+PH*(1-(Math.log10(v+1)-0)/(Math.log10(100)-0)); }
  var ticks=[1,5,10,50,100];
  g.font='11px "PingFang SC",system-ui,sans-serif';
  ticks.forEach(function(tv){
    var yy=logY(tv);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(String(tv),L-7,yy);
  });
  g.fillStyle='#57727c'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('单位运量排放（对数刻度）',L+PW/2,h-4);
  var n=M.length, bw=PW/n*0.28, step=PW/n;
  M.forEach(function(m,i){
    var cx=L+step*(i+0.5);
    var eh=Math.max(2,T+PH-logY(m.ele));
    g.fillStyle=m.color; g.globalAlpha=0.85;
    g.fillRect(cx-bw-2,logY(m.ele),bw,eh);
    var rh=Math.max(2,T+PH-logY(m.rocket));
    g.fillStyle=m.color;

// 第三幕：雷达图
R.cvRadar=function(cv){
  var o=setupCanvas(cv,340), g=o.g, w=o.w, h=o.h;
  var cx=w/2, cy=h/2+10, Rmax=Math.min(w,h)/2-50;
  var n=M.length;
  // 网格圆
  for(var k=1;k<=5;k++){
    var r=Rmax*k/5;
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath();
    for(var i=0;i<n;i++){
      var ang=-Math.PI/2+i*2*Math.PI/n;
      var x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
      if(!i) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.closePath(); g.stroke();
  }
  // 辐射线
  for(var i=0;i<n;i++){
    var ang=-Math.PI/2+i*2*Math.PI/n;
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(cx,cy);
    g.lineTo(cx+Rmax*Math.cos(ang),cy+Rmax*Math.sin(ang));
    g.stroke();
  }
  // 归一化数据
  var maxV=100;
  // 火箭多边形
  g.beginPath();
  M.forEach(function(m,i){
    var ang=-Math.PI/2+i*2*Math.PI/n;
    var r=Rmax*Math.min(1,m.rocket/maxV);
    var x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
    if(!i) g.moveTo(x,y); else g.lineTo(x,y);
  });
  g.closePath();
  g.fillStyle='rgba(184,84,58,0.18)'; g.fill();
  g.strokeStyle='#b8543a'; g.lineWidth=2; g.stroke();
  // 电梯多边形
  g.beginPath();
  M.forEach(function(m,i){
    var ang=-Math.PI/2+i*2*Math.PI/n;
    var r=Rmax*Math.min(1,m.ele/maxV);
    var x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
    if(!i) g.moveTo(x,y); else g.lineTo(x,y);
  });
  g.closePath();
  g.fillStyle='rgba(11,110,104,0.22)'; g.fill();
  g.strokeStyle='#0b6e68'; g.lineWidth=2; g.stroke();
  // 数据点
  M.forEach(function(m,i){
    var ang=-Math.PI/2+i*2*Math.PI/n;
    var rE=Rmax*Math.min(1,m.ele/maxV), rR=Rmax*Math.min(1,m.rocket/maxV);
    g.fillStyle='#0b6e68';
    g.beginPath(); g.arc(cx+rE*Math.cos(ang),cy+rE*Math.sin(ang),3.5,0,6.2832); g.fill();
    g.fillStyle='#b8543a';
    g.beginPath(); g.arc(cx+rR*Math.cos(ang),cy+rR*Math.sin(ang),3.5,0,6.2832); g.fill();
    // 标签
    var lx=cx+(Rmax+18)*Math.cos(ang), ly=cy+(Rmax+18)*Math.sin(ang);
    g.fillStyle='#3d6570'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(m.name,lx,ly);
  });
};

// 第三幕：柱状图
R.cvBars=function(cv){

  var L=60,R=20,T=24,B=42,PW=w-L-R,PH=h-T-B;
  var ymax=20;

// 第四幕：饼图
R.cvPie=function(cv){
  var o=setupCanvas(cv,320), g=o.g, w=o.w, h=o.h;
  var cx=w/2, cy=h/2, R=Math.min(w,h)/2-30;
  var data=D.pie;
  var start=-Math.PI/2;
  var total=data.reduce(function(s,d){return s+d.val;},0);
  data.forEach(function(d){
    var ang=d.val/total*2*Math.PI;
    // 阴影
    g.fillStyle='rgba(11,46,54,0.12)';
    g.beginPath(); g.moveTo(cx+3,cy+3);
    g.arc(cx+3,cy+3,R,start,start+ang); g.closePath(); g.fill();
    // 主扇形
    var grd=g.createRadialGradient(cx,cy,R*0.3,cx,cy,R);
    grd.addColorStop(0,d.color); grd.addColorStop(1,'#fff');
    g.fillStyle=grd;
    g.beginPath(); g.moveTo(cx,cy);
    g.arc(cx,cy,R,start,start+ang); g.closePath(); g.fill();
    g.strokeStyle=d.color; g.lineWidth=2.5; g.stroke();
    // 标签
    var mid=start+ang/2;
    var lx=cx+(R*0.65)*Math.cos(mid), ly=cy+(R*0.65)*Math.sin(mid);
    g.fillStyle='#fff'; g.font='700 14px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(d.val.toFixed(2)+'%',lx,ly);
    // 外部标签
    var ox=cx+(R+22)*Math.cos(mid), oy=cy+(R+22)*Math.sin(mid);
    g.fillStyle=d.color; g.font='600 12px "PingFang SC",system-ui,sans-serif';
    g.fillText(d.label,ox,oy);
    start+=ang;
  });
  // 中心圈
  g.fillStyle='#fff';
  g.beginPath(); g.arc(cx,cy,R*0.35,0,6.2832); g.fill();
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.5; g.stroke();
  g.fillStyle='#0b2e36'; g.font='600 13px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('最优配比',cx,cy-7);
  g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
  g.fillText('109.61 年',cx,cy+10);
};

// 第五幕：累积成本曲线
R.cvCum=function(cv){
  var o=setupCanvas(cv,320), g=o.g, w=o.w, h=o.h;
  var L=60,R=20,T=24,B=42,PW=w-L-R,PH=h-T-B;
  var xmin=0,xmax=110,ymin=0,ymax=20;
  function X(i){ return L+PW*(i/(D.cumYears)); }
  function Y(v){ return T+PH*(1-(v-ymin)/(ymax-ymin)); }
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=ymin+(ymax-ymin)*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(0),L-7,yy);
  }
  var xt=[{i:0,t:'0'},{i:22,t:'20'},{i:44,t:'40'},{i:66,t:'60'},{i:88,t:'80'},{i:110,t:'110'}];
  xt.forEach(function(t){
    var xx=X(t.i);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(t.t,xx,T+PH+16);
  });
  g.fillStyle='#57727c'; g.font='12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('年份',L+PW/2,h-4);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('累积环境成本（亿元）',0,0); g.restore();
  // 预算上限
  g.strokeStyle='#8aa3aa'; g.lineWidth=1.4; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(L,Y(D.budget)); g.lineTo(L+PW,Y(D.budget)); g.stroke(); g.setLineDash([]);
  g.fillStyle='#8aa3aa'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('预算上限 '+D.budget.toFixed(1),L+6,Y(D.budget)-5);
  // 纯火箭累积
  g.beginPath();
  D.cumRocket.forEach(function(v,i){
    var px=X(i),py=Y(Math.min(v,ymax));
    if(!i) g.moveTo(px,py); else g.lineTo(px,py);
  });
  g.strokeStyle='#b8543a'; g.lineWidth=2.2; g.stroke();
  g.fillStyle='rgba(184,84,58,.08)'; g.lineTo(X(D.cumYears),T+PH); g.lineTo(X(0),T+PH); g.closePath(); g.fill();
  // 最优混合累积
  g.beginPath();
  D.cumMix.forEach(function(v,i){
    var px=X(i),py=Y(Math.min(v,ymax));
    if(!i) g.moveTo(px,py); else g.lineTo(px,py);
  });
  g.strokeStyle='#0b6e68'; g.lineWidth=2.6; g.stroke();
  g.fillStyle='rgba(11,110,104,.1)'; g.lineTo(X(D.cumYears),T+PH); g.lineTo(X(0),T+PH); g.closePath(); g.fill();
  // 终点
  var endMix=D.cumMix[D.cumMix.length-1];
  g.beginPath(); g.arc(X(D.cumYears),Y(endMix),5,0,6.2832);
  g.fillStyle='#0b6e68'; g.fill(); g.strokeStyle='#fff'; g.lineWidth=1.6; g.stroke();
  g.fillStyle='#0b6e68'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('最优混合 '+endMix.toFixed(2)+' 亿元',X(D.cumYears)+8,Y(endMix));
  var ri=38;
  g.beginPath(); g.arc(X(ri),Y(D.cumRocket[ri]),5,0,6.2832);
  g.fillStyle='#b8543a'; g.fill(); g.strokeStyle='#fff'; g.lineWidth=1.6; g.stroke();
  g.fillStyle='#b8543a'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='bottom';
  g.fillText('纯火箭 '+D.cumRocket[ri].toFixed(2)+' 亿元 / 38.5 年完工',X(ri)+8,Y(D.cumRocket[ri])-22);
  g.fillStyle='#e0a04a'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('电梯占比 58.65%',L+PW*0.5,Y(D.cumMix[Math.floor(D.cumYears*0.5)])-10);
};

/* ---------------- 幕调度 ---------------- */
var SCENES=$$('.scene'), N=SCENES.length, cur=-1, TOKEN=0;
var st={last:0,armed:false,fired:0};
var animRAF=null;
function ensure(id){
  var cv=document.getElementById(id);
  if(!cv||cv.dataset.done==='1') return;
  if(!R[id]) return;
  cv.dataset.done='1'; R[id](cv);
}
function revealCanvas(el){ $$('canvas',el).forEach(function(cv){ ensure(cv.id); }); }
function beatsAuto(sc){ return $$('.wrap > *',sc); }
function startAnimLoop(){
  if(animRAF) cancelAnimationFrame(animRAF);
  var count=0;
  function loop(){
    count++;
    // 重绘动画类图表
    var sc=SCENES[cur]; if(!sc) return;
    $$('canvas',sc).forEach(function(cv){
      if(cv.id==='cvFlow' || cv.id==='cvOverview'){
        if(R[cv.id]){ R[cv.id](cv); }
      }
    });
    animRAF=requestAnimationFrame(loop);
  }
  if(!document.body.classList.contains('reduce')) animRAF=requestAnimationFrame(loop);
}
function resetScene(sc){
  $$('canvas',sc).forEach(function(cv){ cv.removeAttribute('data-done'); });
  $$('.wrap > *',sc).forEach(function(b){ b.classList.remove('stg','in'); });
}
function goTo(i,silent){
  i=Math.max(0,Math.min(N-1,i));
  if(i===cur) return;
  if(cur>=0) SCENES[cur].classList.remove('active');
  cur=i; TOKEN++;
  var sc=SCENES[i];
  resetScene(sc);
  sc.scrollTop=0;
  sc.classList.add('active');
  $('#scTitle').textContent=sc.dataset.title||'';
  $$('#dots .dot').forEach(function(d,k){ d.classList.toggle('on',k===i); });
  $('#pgNow').textContent=i+1;
  $('#prog').style.width=(N<=1?100:(i/(N-1))*100)+'%';
  st.armed=false;
  if(animRAF){ cancelAnimationFrame(animRAF); animRAF=null; }
  ensureScene(i); startAnimLoop();
}
function setReduce(v){
  document.body.classList.toggle('reduce',v);
  var b=$('#btnFx'); b.classList.toggle('on',!v); b.textContent=v?'动效 关':'动效 开';
  $$('.wrap > *').forEach(function(e){ if(v) e.classList.remove('stg'); });
  if(v && animRAF){ cancelAnimationFrame(animRAF); animRAF=null; }
}
function ensureScene(i){
  var sc=SCENES[i];
  $$('canvas',sc).forEach(function(cv){ ensure(cv.id); });
}
function init(){
  buildMetrics(); buildLegBar(); buildTbEnv(); buildTbScene(); buildTbOpt();
  var dots='';
  for(var i=0;i<N;i++) dots+='<button class="dot" data-i="'+i+'" title="第 '+(i+1)+' 幕"></button>';
  $('#dots').innerHTML=dots;
  $('#pgAll').textContent=N;
  $('#dots').addEventListener('click',function(e){
    var t=e.target.closest?e.target.closest('.dot'):null; if(t) goTo(+t.dataset.i);
  });
  $('#btnNext').onclick=function(){ goTo(cur+1); };
  $('#btnPrev').onclick=function(){ goTo(cur-1); };
  $('#btnReplay').onclick=function(){ resetScene(SCENES[cur]); ensureScene(cur); };
  $('#btnFx').onclick=function(){ setReduce(!document.body.classList.contains('reduce')); };
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea') return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); goTo(cur+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); goTo(cur-1); }
    else if(k===' '){ e.preventDefault(); goTo(cur+1); }
    else if(k==='Home'){ e.preventDefault(); goTo(0); }
    else if(k==='End'){ e.preventDefault(); goTo(N-1); }
    else if(k==='r'||k==='R'){ $('#btnReplay').click(); }
    else if(k>='1'&&k<='9'&&+k<=N){ e.preventDefault(); goTo(+k-1); }
  });
  window.addEventListener('wheel',function(e){
    var sc=SCENES[cur]; if(!sc) return;
    var max=sc.scrollHeight-sc.clientHeight;
    var atTop=sc.scrollTop<=1, atBot=max<=4||sc.scrollTop>=max-1;
    var want=e.deltaY>0?1:-1;
    var edge=(max<=4)||(want>0&&atBot)||(want<0&&atTop);
    if(!edge){ st.armed=false; st.last=Date.now(); return; }
    e.preventDefault();
    var now=Date.now(), dt=now-st.last;
    if(!st.armed){ st.armed=true; st.last=now; return; }
    if(dt>280 && now-st.fired>1100 && Math.abs(e.deltaY)>=8){
      st.fired=now; st.armed=false;
      goTo(cur+want);
    }
    st.last=now;
  },{passive:false});
  setReduce(false); goTo(0);
}
window.addEventListener('resize',function(){
  $$('canvas').forEach(function(cv){ cv.removeAttribute('data-done'); });
  if(cur>=0) ensureScene(cur);
});
init();
window.__deck={goTo:goTo,get cur(){return cur;},R:R,D:D};
})();
</script>
