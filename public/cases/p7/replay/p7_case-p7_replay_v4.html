<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数模演易 · 太空电梯复现</title>
<style>
:root{
  --teal-700:#0B6E68; --teal-600:#0E8F84; --teal-500:#12A594; --teal-400:#2EC4B0;
  --teal-100:#DFF4F1; --teal-50:#EFFAF8;
  --cyan-500:#17A2C4; --blue-600:#1E6FA8;
  --blue-900:#0B6E68; --blue-800:#0E8F84; --blue-700:#12A594; --blue-600:#1E6FA8;
  --blue-500:#2EC4B0; --blue-400:#4FD0C0; --blue-300:#92DED5; --blue-200:#B8E8E2; --blue-100:#DFF4F1; --blue-50:#EFFAF8;
  --amber-500:#F5A623; --red-500:#D95C45; --green-500:#2BA471;
  --bg:#F3FAFA; --card:#FFFFFF;
  --ink:#0B2E36; --ink-2:#3D6570; --ink-3:#7C99A1; --ink-4:#A9BEC2;
  --line:#DCEDEE; --line-2:#EAF5F5;
  --grad:linear-gradient(120deg,#12A594 0%,#1E9FC4 100%);
  --grad-soft:linear-gradient(120deg,#EFFAF8 0%,#EAF5F5 100%);
  --sh-1:0 2px 8px rgba(11,110,104,.06);
  --sh-2:0 10px 30px rgba(11,110,104,.09);
  --sh-3:0 20px 50px rgba(11,110,104,.14);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#B8E8E2;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#92DED5}
::-webkit-scrollbar-track{background:transparent}

/* 工作台 */
.wtop{
  background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:50
}
.wtop .wt{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.wtop .wtb{
  padding:3px 9px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);font-size:11.5px;font-weight:700;flex-shrink:0
}
.steps{display:flex;align-items:center;gap:4px;margin-left:6px;overflow-x:auto;flex-shrink:0}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-4);white-space:nowrap;padding:2px 4px;border-radius:7px;transition:.15s}
.step .n{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-4);background:#fff
}
.step.done{color:var(--blue-700)}
.step.done .n{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.step.now{color:var(--blue-800);font-weight:700}
.step.now .n{border-color:var(--blue-600);color:var(--blue-700);box-shadow:0 0 0 3px rgba(11,110,104,.16)}
.step-line{width:14px;height:1.5px;background:var(--line);flex-shrink:0}
.wtop .stag{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 10px;border-radius:999px;
  font-size:11.8px;font-weight:700;color:#8A5A00;background:#FFF6DC;border:1px solid #F4DFA8;white-space:nowrap}
.wtop .stag i{width:6px;height:6px;border-radius:50%;background:var(--amber-500);box-shadow:0 0 0 3px rgba(245,166,35,.18)}
.wtop .stag.done{color:#1E7A4F;background:#E7F6EE;border-color:#BFE6CF}
.wtop .stag.done i{background:#2FA36B;box-shadow:0 0 0 3px rgba(47,163,107,.16)}

.wbody{display:flex;gap:0;height:100vh;min-height:520px;max-width:1800px;margin:0 auto}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.stream{flex:1;overflow-y:auto;padding:22px 26px 8px;scroll-behavior:smooth}
.stream-in{max-width:860px;margin:0 auto}
.msg{display:flex;margin-bottom:20px;gap:12px}
.msg.me{flex-direction:row-reverse}
.avatar-mini{width:32px;height:32px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.msg.me .avatar-mini{background:#1a7a6a;color:#fff}
.bubble{max-width:78%;min-width:0}
.msg.me .bubble{margin-left:auto}
.bubble .txt{
  background:#fff;border:1px solid #e0ebe8;border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.8;color:var(--ink-2);
  box-shadow:0 1px 2px rgba(11,110,104,.05)
}
.msg.me .bubble .txt{background:#1a7a6a;border-color:#1a7a6a;color:#fff}
.bubble .txt h4{font-size:14.5px;font-weight:800;color:var(--ink);margin:0 0 8px}
.msg.me .bubble .txt h4{color:#fff}
.bubble .txt h4:not(:first-child){margin-top:16px}
.bubble .txt p{margin-bottom:8px}
.bubble .txt p:last-child{margin-bottom:0}
.bubble .txt ul{margin:0 0 8px 0;list-style:none}
.bubble .txt li{padding-left:16px;position:relative;margin-bottom:5px}
.bubble .txt li:before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}
.msg.me .bubble .txt li:before{background:rgba(255,255,255,.8)}
.bubble .txt .kv{color:var(--blue-700);font-weight:700}
.msg.me .bubble .txt .kv{color:#fff}
.bubble .txt .mono{font-family:Consolas,monospace;background:var(--line-2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.msg.me .bubble .txt .mono{background:rgba(255,255,255,.2);color:#fff}
.bubble .txt .formula{
  background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;padding:12px 16px;
  font-family:"Cambria Math",Georgia,serif;font-size:14.5px;color:var(--blue-900);margin:12px 0;overflow-x:auto;line-height:1.6
}
.msg.me .bubble .txt .formula{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.bubble .txt .note{
  background:#FFF8E8;border:1px solid #FBE3B8;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#8A5A00;margin:12px 0;line-height:1.7
}
.bubble .txt .next{
  margin-top:12px;padding:9px 13px;border-radius:9px;font-size:13px;line-height:1.72;
  color:var(--blue-800);background:var(--blue-50);border-left:3px solid var(--blue-500)
}
.msg.me .bubble .txt .next{background:rgba(255,255,255,.15);border-left-color:#fff;color:#fff}

.thinking{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);padding:6px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--blue-400);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.arts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.acard{
  display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:13px 16px;cursor:pointer;transition:.18s;text-align:left;box-shadow:var(--sh-1);position:relative;overflow:hidden
}
.acard:hover{border-color:var(--blue-300);transform:translateY(-2px);box-shadow:var(--sh-2)}
.acard.open{border-color:var(--blue-600);box-shadow:0 0 0 3px rgba(11,110,104,.12)}
.acard .ai{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff
}
.acard .at{flex:1;min-width:0}
.acard .at b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.acard .at span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .arrow{color:var(--blue-600);flex-shrink:0;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700}

.composer-bar{border-top:1px solid var(--line);background:#fff;padding:14px 26px 16px}
.composer-bar .cw{max-width:860px;margin:0 auto}
.composer{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);
  transition:.2s;overflow:hidden
}
.composer:focus-within{border-color:var(--blue-400);box-shadow:0 8px 28px rgba(11,110,104,.14)}
.composer textarea{
  display:block;width:100%;padding:16px 18px 6px;min-height:62px;max-height:200px;resize:none;
  font-size:15px;line-height:1.7;color:var(--ink)
}
.composer textarea::placeholder{color:var(--ink-4)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--line-2);background:#F8FCFC}
.cbar .spacer{flex:1}
.hint{font-size:12px;color:var(--ink-4)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s
}
.btn-ghost:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.btn-send{
  display:inline-flex;align-items:center;gap:7px;padding:9px 22px;border-radius:10px;
  background:var(--grad);color:#fff;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(11,110,104,.28);transition:.18s
}
.btn-send:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-send[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;margin-top:10px}
.chip{
  padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);transition:.18s;cursor:pointer
}
.chip:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.chip.on{background:var(--blue-100);border-color:var(--blue-200);color:var(--blue-800);font-weight:600}

/* 抽屉 */
.drawer{
  width:0;flex-shrink:0;border-left:1px solid var(--line);background:#fff;overflow:hidden;transition:width .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column
}
.drawer.on{width:560px}
.drawer.on.wide{width:720px}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.dh h3{font-size:15px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .sub{font-size:11.5px;color:var(--ink-3);display:block;font-weight:500;margin-top:1px}
.db{flex:1;overflow-y:auto;padding:18px;background:var(--bg)}
.db .card{margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.db .card:last-child{margin-bottom:0}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:15.5px;font-weight:700}
.card-h .grow{flex:1}
.card-b{padding:18px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.18s
}
.icon-btn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}

/* 代码 */
.code-box{
  background:#0F1B2D;border-radius:12px;overflow:hidden;font-family:"JetBrains Mono",Consolas,"Courier New",monospace
}
.code-top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#16253C;border-bottom:1px solid #21334F}
.code-top .f{font-size:12px;color:#8FA6C4}
.code-top .grow{flex:1}
.code-top button{padding:5px 10px;border-radius:7px;background:#22344F;color:#B9CBDF;font-size:11.5px;transition:.16s}
.code-top button:hover{background:#2C4363;color:#fff}
pre.code{padding:16px 18px;overflow:auto;max-height:520px;font-size:12.6px;line-height:1.75;color:#D6E4F5}
pre.code .c-kw{color:#6DD6C6}
pre.code .c-com{color:#5C7290;font-style:italic}
pre.code .c-num{color:#F5A623}
pre.code .c-str{color:#9BE0B4}

/* 动画舞台 */
.stage{
  background:linear-gradient(160deg,#0B6E68 0%,#0E8F84 100%);border-radius:var(--r);padding:16px;position:relative;overflow:hidden
}
.stage canvas{width:100%;height:auto;display:block;border-radius:10px;background:#052320}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.play{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(11,110,104,.3)}
.prog{flex:1;height:6px;border-radius:6px;background:var(--line-2);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;height:100%;background:var(--grad);border-radius:6px;width:0%;transition:width .1s linear}
.speed{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:22px;font-weight:800;color:var(--blue-800);margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--green-500);margin-top:3px}

.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th,.dtable td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left}
.dtable th{background:var(--blue-50);color:var(--blue-900);font-weight:700;position:sticky;top:0}
.dtable tbody tr:hover{background:var(--blue-50)}

.doc{padding:0}
.doc h2{font-size:19px;font-weight:800;color:var(--blue-900);margin:0 0 6px}
.doc .dc{font-size:12.5px;color:var(--ink-3);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.doc h3{font-size:15.5px;font-weight:700;margin:22px 0 10px;color:var(--ink);display:flex;align-items:center;gap:8px}
.doc h3:before{content:"";width:3px;height:15px;border-radius:2px;background:var(--grad)}
.doc p{font-size:14px;color:var(--ink-2);line-height:1.85;margin-bottom:12px}
.doc ul{margin:0 0 14px 4px;list-style:none}
.doc li{font-size:14px;color:var(--ink-2);line-height:1.85;padding-left:18px;position:relative;margin-bottom:6px}
.doc li:before{content:"";position:absolute;left:4px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.24s;z-index:200;
  box-shadow:0 8px 28px rgba(0,0,0,.24);display:flex;align-items:center;gap:8px
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){
  .drawer.on{width:440px}
}
@media(max-width:820px){
  .drawer.on{width:100%;position:fixed;inset:0 0 0 0;z-index:70}
}

/* 流程闸门 / 选项按钮 */
.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.abtn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s;cursor:pointer}
.abtn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.abtn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(11,110,104,.24)}
.abtn.pri:hover{filter:brightness(1.06);color:#fff}
.abtn.gh{background:#fff;border-color:var(--blue-200);color:var(--blue-700)}
.abtn.gh:hover{background:var(--blue-50)}
.abtn.used{opacity:.5;pointer-events:none}
.flow-gate{margin-top:12px}
.choice-note{font-size:12px;color:var(--ink-4);margin:10px 0 0;line-height:1.6}
.other-row{display:none;gap:8px;margin-top:10px;align-items:center}
.other-row.on{display:flex}
.other-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px}
.other-row input:focus{border-color:var(--blue-400)}
.picks{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pick{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;transition:.18s}
.pick:hover{border-color:var(--blue-300);background:var(--blue-50);box-shadow:var(--sh-1)}
.pick.sel{border-color:var(--blue-500);background:var(--blue-50);box-shadow:0 0 0 3px rgba(11,110,104,.13)}
.pick.dis{opacity:.45;pointer-events:none}
.pick .pk{
  flex:0 0 26px;height:26px;margin-top:2px;border-radius:8px;background:var(--blue-100);color:var(--blue-700);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px
}
.pick .pb{flex:1;min-width:0}
.pick .pb b{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.pick .pb s{display:block;text-decoration:none;font-size:12.6px;color:var(--ink-3);line-height:1.62}
.pick .pb em{display:block;font-style:normal;font-size:11.6px;color:var(--blue-600);margin-top:5px}
.pick .pgo{
  flex:0 0 auto;padding:6px 12px;border-radius:8px;background:var(--grad);color:#fff;
  font-size:12.5px;font-weight:700;box-shadow:0 2px 7px rgba(11,110,104,.22);cursor:pointer;transition:.16s
}
.pick .pgo:hover{filter:brightness(1.06)}
.pick.sel .pgo{background:#DFF4F1;color:var(--blue-700);box-shadow:none}
.run-acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.run-out{margin-top:12px;background:#0F1B2D;border-radius:10px;padding:12px 14px;font-family:Consolas,monospace;font-size:12.5px;color:#9BE0B4;white-space:pre-wrap;min-height:20px}
.run-out .lbl{display:block;color:#5C7290;font-size:10px;letter-spacing:1px;margin-bottom:6px}
.step.clickable{cursor:pointer}
.step.clickable:hover{color:var(--blue-700)}
.wtop .stag.paused{color:#7A4FB0;background:#F3ECFB;border-color:#E3D2F5}
.wtop .stag.paused i{background:#9B6DD6;box-shadow:0 0 0 3px rgba(155,109,214,.18)}

/* 顶栏流程工具（对齐原型 v2） */
.flow-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.flow-tool{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;transition:.16s
}
.flow-tool:hover{border-color:var(--teal-400);color:var(--teal-700);background:var(--teal-50)}
.flow-tool svg{width:14px;height:14px;flex:0 0 auto}
.other-btn{border-style:dashed!important;background:var(--teal-50)!important}

/* 模型对比表（对齐原型 v2） */
.model-compare{width:100%;margin-top:12px;border-collapse:collapse;font-size:12.5px}
.model-compare th,.model-compare td{padding:9px 10px;border:1px solid var(--line);text-align:left;vertical-align:top}
.model-compare th{background:var(--teal-50);color:var(--teal-700);font-weight:800}
.model-compare td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}

/* 论文风格卡片 / 图片勾选（对齐原型 v2） */
.style-list{display:grid;gap:8px;margin:12px 0}
.style-item{padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.style-item>b{color:var(--teal-700)}
.style-item>span{margin-left:8px;font-size:12px;color:var(--ink-3)}

<script>
/* =============== 工具 =============== */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var toastTimer=null;
function toast(msg){
  var t=$('toast'); t.innerHTML='<span>'+esc(msg)+'</span>'; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('on')},2200);
}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function hl(code){
  return esc(code)
    .replace(/(#[^\n]*)/g,'<span class="c-com">$1</span>')
    .replace(/\b(import|from|def|return|for|in|if|else|elif|while|with|as|class|try|except|lambda|and|or|not|None|True|False|np|pd|plt|math)\b/g,'<span class="c-kw">$1</span>')
    .replace(/('[^']*'|"[^"]*")/g,'<span class="c-str">$1</span>')
    .replace(/\b(\d+\.?\d*(?:e[+-]?\d+)?)\b/gi,'<span class="c-num">$1</span>');
}

/* 物理仿真块已移除：本题（太空电梯）为优化决策类，可视化由 5 个逐问交互演示（anim-src 模板块）承担 */

/* =============== 对话数据 =============== */
var STEPS_DATA=[
  {label:'问题分析', done:false},
  {label:'候选模型', done:false},
  {label:'生成代码', done:false},
  {label:'可视化', done:false},
  {label:'结果讨论', done:false},
  {label:'论文初稿', done:false}
];

var SCENE=0;
var USER_Q=[
  '先帮我分析太空电梯这道题',
  '电梯和火箭的成本差多少？',
  '帕累托前沿上的两个代表解是什么？',
  '就选方案 A：NSGA-II 双目标优化',
  '把代码贴出来看看',
  '运行一下，看看帕累托前沿',
  '系统失效后工期会延长多少？',
  '10 万人每年需要运多少水？',
  '生成论文初稿'
];

/* =============== UI 消息/产物 =============== */
var MSG_HISTORY=[];
function pushMsg(who, html, arts){
  const id='m-'+Date.now()+Math.random();
  const isMe=who==='me';
  const label=isMe?'我':'AI';
  const bubble='<div class="bubble"><div class="txt">'+html+'</div>'+(arts?'<div class="arts">'+arts+'</div>':'')+'</div>';
  const row='<div class="msg '+(isMe?'me':'')+'" id="'+id+'">'+
    '<div class="avatar-mini">'+label+'</div>'+bubble+'</div>';
  $('stream-in').insertAdjacentHTML('beforeend',row);
  $('stream').scrollTop=$('stream').scrollHeight;
  MSG_HISTORY.push({who,html});
  return id;
}
function thinking(callback){
  const id='m-thinking-'+Date.now();
  $('stream-in').insertAdjacentHTML('beforeend',
    '<div class="msg" id="'+id+'"><div class="avatar-mini">AI</div>'+
    '<div class="bubble"><div class="thinking"><i></i><i></i><i></i>演易正在思考…</div></div></div>');
  $('stream').scrollTop=$('stream').scrollHeight;
  setTimeout(function(){
    var el=$(id); if(el){ el.remove(); if(callback) callback(); }
  }, 700);
}

function renderSteps(now){
  MAIN_STEP=now; if(now>MAX_STEP) MAX_STEP=now;
  var labels=['问题分析','关键假设','候选模型','生成代码','可视化','结果讨论','论文初稿'];
  var html='';
  labels.forEach(function(s,i){
    var cls=i<now?'done':(i===now?'now':'');
    var can=i<=MAX_STEP;
    html+='<div class="step '+(can?('clickable '+cls):cls)+'"'+(can?' onclick="jumpStep('+i+')" title="回到这一步"':'')+'><div class="n">'+(i<now?'✓':(i+1))+'</div>'+esc(s)+'</div>';
    if(i<labels.length-1) html+='<div class="step-line"></div>';
  });
  $('w-steps').innerHTML=html;
}
function setStage(txt, done){
  $('w-stage').innerHTML='<i></i>'+esc(txt);
  $('w-stage').classList.toggle('done', done);
}

var CHIP_FNS=[];
function chips(list){
  CHIP_FNS=[];
  $('work-chips').innerHTML=(list||[]).map(function(x){
    if(typeof x==='string') x={t:x,fn:null};
    CHIP_FNS.push(x.fn||null);
    return '<button class="chip" onclick="chipAct(this)">'+esc(x.t)+'</button>';
  }).join('');
}
function chipAct(btn){
  if(isRunning){ toast('AI 正在思考，稍候'); return; }
  var idx=[].slice.call(document.querySelectorAll('#work-chips .chip')).indexOf(btn);
  var fn=CHIP_FNS[idx];
  var t=btn.textContent.trim();
  if(fn){ pushMsg('me','<p>'+esc(t)+'</p>'); fn(); }
  else { $('work-input').value=t; sendInWork(); }
}
function applyChips(list,hint){
  var arr=(list||[]).slice();
  if(hint) arr.unshift({t:hint,fn:null});
  chips(arr);
}

function drawerBody(type){

    return '<div class="card"><div class="card-h"><h3>问题分析</h3></div><div class="card-b">'+

      '<li>电梯：固定维护 10⁹ USD/年，可变 2.2×10⁵ USD/吨，年容量 Cap_SE = 5.37×10⁵ 吨；</li>'+

      '<li>水循环：生活/农业回收率 η_h = 0.88、η_a = 0.72。</li></ul>'+

      '<li>闭环水循环稳定，回收率恒定；</li>'+
      '<li>前三问不计环境外部性（第四问独立最小化）。</li></ul>'+
      '<h3>4. 求解思路</h3><p>决策变量 γ（电梯运力分配）与 t（工期），min (C_total, t)，约束 γ·M ≤ Cap_SE·t；用 NSGA-II 求帕累托前沿，网格搜索交叉验证；后三问逐层加失效、水、环境约束。</p>'+

      '<tr style="background:#EFFAF8"><td>A. NSGA-II 双目标优化</td><td>帕累托前沿 + 代表解</td><td>★★★★★</td><td>问题一~四</td><td style="color:#12A594;font-weight:700">已选</td></tr>'+
      '<tr><td>B. 网格搜索帕累托</td><td>γ×t 平面扫描</td><td>★★★★</td><td>问题一（交叉验证）</td><td>候选</td></tr>'+
      '<tr><td>C. 蒙特卡洛风险评估</td><td>失效事件抽样</td><td>★★★</td><td>问题二韧性分析</td><td>候选</td></tr>'+
      '</tbody></table></div>'+

      '方案 A 同时适用于基准优化与后三问的约束追加，是最稳妥的竞赛建模路径；B 作为交叉验证，C 服务问题二。</div></div></div>';
  }
  if(type==='code'){
    return '<div class="card"><div class="card-h"><h3>main.py</h3><div class="grow"></div>'+

var PY_CODE=`# -*- coding: utf-8 -*-
"""2026 MCM Problem B：太空电梯系统建立月球殖民地
   问题一 —— 双目标（最小成本 / 最短工期）运输方案优化
   数模演易 自动生成 · 可直接运行（需 numpy）
"""
import numpy as np

# ---------- 1. 系统参数（2050 年技术成熟期校准） ----------
M_TOTAL = 1.0e8            # 需运送物资总量（吨）= 1 亿公吨
C_MAIN  = 1.0e9            # 太空电梯固定维护成本（USD/年）
C_VAR   = 2.2e5            # 太空电梯可变运输成本（USD/吨）
CAP_SE  = 5.37e5           # 太空电梯年最大运输容量（吨/年）
C_RKT   = 5.0e3            # 火箭单位运输成本（USD/吨，TRANSCOST 估算）

# ---------- 2. 太空电梯子模型：成本-工期 ----------
def elevator_cost(t):
    """给定工期 t（年），返回电梯总成本（USD）"""
    m_annual = M_TOTAL / t
    if m_annual > CAP_SE: return np.inf    # 超年容量，不可行
    return (C_MAIN + C_VAR * m_annual) * t

# ---------- 3. 火箭子模型（TRANSCOST 简化） ----------
def rocket_cost(t):
    return C_RKT * M_TOTAL                  # 静态估计

# ---------- 4. 混合方案：电梯承担 γ，火箭承担 1-γ ----------
def hybrid_cost(t, gamma):
    m_e = gamma * M_TOTAL
    if m_e / t > CAP_SE: return np.inf
    c_e = (C_MAIN + C_VAR * m_e / t) * t
    c_r = C_RKT * (1 - gamma) * M_TOTAL
    return c_e + c_r

# ---------- 5. 三方案对比 ----------
print("=" * 56)
print("2026 MCM B 题 · 问题一 · 三方案成本-工期对比")
print("=" * 56)

t_elevator = M_TOTAL / CAP_SE                # 纯电梯最短工期 186.22 年
cost_elevator = elevator_cost(t_elevator)
t_rocket = 183.14                            # 纯火箭（3641 次/年）
cost_rocket = rocket_cost(t_rocket)

print(f"纯太空电梯  : {cost_elevator/1e9:8.1f} B USD / {t_elevator:6.2f} 年")
print(f"纯传统火箭  : {cost_rocket/1e9:8.1f} B USD / {t_rocket:6.2f} 年")

# ---------- 6. 混合帕累托优化（NSGA-II 简化：网格搜索） ----------
best_fast = best_cheap = None
for g in np.linspace(0.01, 0.99, 99):
    for t in np.linspace(93, 260, 168):
        c = hybrid_cost(t, g)
        if not np.isfinite(c): continue
        if best_fast is None or t < best_fast[1]:  best_fast  = (g, t, c)
        if best_cheap is None or c < best_cheap[2]: best_cheap = (g, t, c)

print(f"混合 C1 最快: {best_fast[2]/1e9:8.1f} B USD / {best_fast[1]:6.2f} 年  (γ={best_fast[0]:.2f})")
print(f"混合 C2 最省: {best_cheap[2]/1e9:8.1f} B USD / {best_cheap[1]:6.2f} 年  (γ={best_cheap[0]:.2f})")
print("=" * 56)
print("结论：混合方案支配纯方案；C1 最快 93.74 年 / C2 最省 2151.5B USD")
`;

    '<p class="choice-note">不想现在决定可以跳过；也可以点「我有问题」先问一句。</p>';

function pushFlowGate(gate){
  gate.key=gate.key||('g'+(SEQ++));
  FLOW_GATE=gate;
  if(gate.phase) phase=gate.phase; else phase='interaction';
  var node={who:'ai',step:gate.step,html:gate.html+flowGateHTML(gate)};
  pushMsg(node.who, node.html);
  rememberFlow(gate.label||gate.key, function(){ pushFlowGate(gate); });
  applyChips([], gate.hint||'选一个选项即可继续，也可以跳过');
  setStage(gate.phaseText||'等待：选择或跳过', false);
}
function toggleOtherInput(key){ var r=$('other-row-'+key); if(r) r.classList.add('on'); var i=$('other-input-'+key); if(i) i.focus(); }
function cancelOtherInput(key){ var r=$('other-row-'+key); if(r) r.classList.remove('on'); }
function submitOtherInput(key){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var i=$('other-input-'+key); var t=i?i.value.trim():'';
  if(!t){ toast('请先输入'); return; }
  pushMsg('me','<p>'+esc(t)+'</p>');
  FLOW_PREFS[g.pref||g.key]=t; FLOW_GATE=null;
  pushMsg('ai','<h4>已记下你的想法</h4><p>我会按「'+esc(t)+'」继续。</p>'+NEXT_TAIL);
  thinking(function(){ (g.onCustom||continueAfterFlow)(t); });
}
function chooseFlow(key,i){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var o=g.options[i]; if(!o) return;
  var box=$('gate-'+key); if(box){ box.querySelectorAll('.abtn').forEach(function(b){b.classList.add('used');}); }
  FLOW_PREFS[g.pref||g.key]=o.value||o.t;
  pushMsg('me','<p>'+esc(o.t)+'</p>');
  FLOW_GATE=null;
  thinking(function(){ (o.run||continueAfterFlow)(); });
}
function skipFlow(key){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var box=$('gate-'+key); if(box){ box.querySelectorAll('.abtn').forEach(function(b){b.classList.add('used');}); }
  FLOW_PREFS[g.pref||g.key]='skipped';
  pushMsg('me','<p>跳过这一步</p>');
  FLOW_GATE=null;
  thinking(function(){ (g.onSkip||continueAfterFlow)(); });
}
function continueAfterFlow(){
  if(phase==='needFocus') return doHypothesis();
  if(phase==='needParameter') return pushLab();
  if(phase==='needResultAngle') return askSatisfaction();
  if(phase==='needSatisfaction') return finishResultDecision('满意');
  if(phase==='needPaperStyle') return askFigureSelection();
  if(phase==='needFigureSelection') return doPaper();
  doAnalysis();
}

function userTurn(v){
  if(FLOW_PAUSED){
    if(/继续当前流程|继续流程|继续$/.test(v)){ resumeQuestionPause(); return; }
    replyInPlace(offTopicAnswer(v)); return;
  }
  if(FLOW_GATE){
    if(/跳过|略过|不用了|先不做/.test(v) && !/不跳过/.test(v)){ skipFlow(FLOW_GATE.key); return; }
    var hit=-1;
    for(var i=0;i<FLOW_GATE.options.length;i++){ if(v.indexOf(FLOW_GATE.options[i].t)>=0){ hit=i; break; } }
    if(hit>=0){ chooseFlow(FLOW_GATE.key,hit); return; }
    if(/继续|下一步|开始|进入|接着|来吧|走吧/.test(v)){ (FLOW_GATE.onSkip||continueAfterFlow)(); return; }
    if(isQuestion(v)){ replyInPlace(offTopicAnswer(v)); return; }
    replyInPlace(offTopicAnswer(v)); return;
  }
  if(phase==='picking'){ replyInPlace('<h4>这一步需要你拍板</h4><p>点上方候选卡片右侧的「选它」，模型由你选，AI 不替你决定。</p>'+NEXT_TAIL); return; }
  if(phase==='lab'){
    if(/跑完|运行完|好了|完成|出来了/.test(v)){ replyInPlace('<h4>运行按钮在右侧代码抽屉里</h4><p>点「▶ 运行代码」就能在当前页跑，结果会出现在对话框，我接着解读。</p>'+NEXT_TAIL); return; }
    if(isQuestion(v)){ replyInPlace(offTopicAnswer(v)); return; }
    replyInPlace('<h4>还在等你的运行结果</h4><p>点右侧代码抽屉里的「▶ 运行代码」。</p>'+NEXT_TAIL); return;
  }
  if(phase==='upload'){if(/已上传|上传|跑完|带回来|回来了/.test(v)){ didUpload([P7_QUIZ[qi].file]); return; }replyInPlace('<h4>还在等你的结果文件</h4><p>点上方「上传结果文件」，或回一句「已上传」。</p>'+NEXT_TAIL); return; }
  if(phase==='adjust'){ doFix(v); return; }
  if(isQuestion(v) && !wantsAdvance(v)){ replyInPlace(offTopicAnswer(v)); return; }
  if(/模型|方案|选它|FVM|有限体积/.test(v)){ doPicks(); return; }
  if(/代码|main\.py/.test(v)){ pushLab(); return; }
  if(/运行|动画|可视化|演示/.test(v)){ afterRun(); return; }
  if(/问题四|半径|收缩|动边界|Landau/.test(v)){ doBoundary(); return; }
  if(/问题三|达标|结果|讨论/.test(v)){ doResult(); return; }
  if(/论文|初稿|摘要|生成论文|风格/.test(v)){ askPaperStyle(); return; }
  advance();
}
function advance(){
  if(phase==='intro'){ doAnalysis(); return; }
  if(phase==='hypothesis'){ doPicks(); return; }
  if(phase==='modelChosen'){ askParameter(); return; }
  if(phase==='viz'){ askResultAngle(); return; }
  if(phase==='result'){ doBoundary(); return; }
  if(phase==='boundary'){ askPaperStyle(); return; }
  if(phase==='paper'){ doPaper(); return; }
  doAnalysis();
}

function pickFile(){ var f=$('result-file'); if(f){ try{ f.click(); }catch(e){ toast('请用上方按钮上传结果文件'); } } }

/* ⑤ 结果体检：只做文件层面可见检查（格式 / 明显缺列），不下对错结论 */
function auditResult(names){
  var ext=/\.(xlsx|xls|csv|txt|zip)$/i;
  for(var i=0;i<names.length;i++){
    var n=names[i]||'';
    if(!ext.test(n)) return {kind:'fmt',name:n};
    if(/缺|missing|wrong|bad|error|err/i.test(n)) return {kind:'col',name:n};
  }
  return null;
}
function pushRecv(){
  var q=P7_QUIZ[qi];
  var names=q.files||[q.file];

  var R=q.result||{};
  var body;
  if(bad){
    body='<p>结果体检发现<b>文件结构异常</b>：'+esc(bad.name)+'（'+(bad.kind==='fmt'?'格式不符合预期':'疑似缺列')+'）。</p>'+

/* ⑥ 调整：分类报错/数值/针对性，给排查建议 + 修订代码 + 回到上传 */
function doFix(v){
  var q=P7_QUIZ[qi];
  var kind=2;
  if(/报错|Traceback|KeyError|Error|崩溃|跑不通|运行不了|Exception/.test(v)) kind=0;
  else if(/偏大|偏小|不合理|不对|负数|发散|不收敛|异常|奇怪|离谱/.test(v)) kind=1;
  var head=['运行层面问题','数值异常，通常是假设或单位出错','按你描述的方向改了一版'];
  thinking(function(){
    pushMsg('ai','<h4>'+head[kind]+'</h4>'+
      '<p>下面是基于你的描述，最可能的原因与改法：</p>'+
      '<ul>'+q.fixHints[kind].map(function(h){ return '<li>'+esc(h)+'</li>'; }).join('')+'</ul>'+

    openDrawer('code','main.py · 修订版','Python 3.10 · # FIX 标注');

<!-- ============ 第一幕 · 题目总览 ============ -->
<section class="scene" id="s1" data-title="一 · 题目总览 · 一亿吨物资怎么运">
  <div class="wrap">
    <div class="cover">
      <div class="kicker">2026 MCM Problem B · Creating a Moon Colony Using a Space Elevator System</div>
      <h1 class="big">太空电梯建立<span class="ac">月球殖民地</span>
        <small style="display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0">2050 年月球要住进 10 万人，得从地球送上去 1 亿公吨物资——三条路摆在桌面上。</small>
      </h1>
      <p class="lead" style="margin:10px auto 0">题目把一座月球殖民地的物资供应链交给你：固定维护成本 <b class="num">10⁹ USD/年</b>、可变运输成本 <b class="num">2.2×10⁵ USD/吨</b>、年最大容量 <b class="num">5.37×10⁵ 吨/年</b> 的太空电梯是主干；传统火箭走 TRANSCOST 模型 + 纬度修正。三方案共用同一套系统，差别在配比。</p>
    </div>

    <div class="grid4">
      <div class="kpi"><div class="k">物资总需求</div><div class="v">1×10⁸ <u>公吨</u></div><div class="s">10 万人殖民地的全部物资</div></div>
      <div class="kpi g"><div class="k">殖民地人口</div><div class="v">100,000 <u>人</u></div><div class="s">2050 年月球常驻人口</div></div>
      <div class="kpi b"><div class="k">任务截止年</div><div class="v">2050 <u>年</u></div><div class="s">运输任务完成截止</div></div>
      <div class="kpi w"><div class="k">可选方案</div><div class="v">4 <u>个</u></div><div class="s">纯电梯/纯火箭/混合C1/混合C2</div></div>
    </div>

    <div class="grid2">
      <div class="canvasbox">
        <div class="cvtop">
          <div class="ct">地球–月球物流链 · 三方案路径动画</div>
          <div class="legend">
            <span><i class="dot" style="background:#e0a04a"></i>纯太空电梯</span>
            <span><i class="dot" style="background:#12a594"></i>混合方案</span>
            <span><i class="dot" style="background:#b8543a"></i>纯火箭</span>
          </div>
        </div>
        <canvas id="cvCosmos" height="360"></canvas>
        <p class="note" style="margin-top:8px">三条路径同源同终：地球基站出发，抵达月球殖民地。电梯走固定缆绳稳态运输，火箭走化学推进脉冲发射，混合按比例分流。动画中的货流圆点表示各方案的运量节奏。</p>
      </div>

      <div class="card">
        <h3>题目给定的三个约束 <em>题面原话</em></h3>
        <table class="tb">
          <tr><th>参数</th><th style="text-align:right">取值</th><th>含义</th></tr>
          <tr><td>物资总需求</td><td class="num">1×10⁸ 公吨</td><td>10 万人殖民地的全部物资</td></tr>
          <tr><td>殖民地规模</td><td class="num">100,000 人</td><td>2050 年月球常驻人口</td></tr>
          <tr><td>完成目标年</td><td class="num">2050</td><td>运输任务完成截止年</td></tr>
        </table>
        <div class="quote">使用太空电梯系统将物资从地球运送到月球，比较三种运输策略：仅太空电梯、仅传统火箭、以及两者的组合。</div>
        <p class="small"><span class="badge">题面原话</span>2026 MCM Problem B · 任务的起点是把一亿吨拆到三种运输方式上，逐一算清总成本与完成年限。</p>
      </div>
    </div>

    <div class="grid4">
      <div class="kpi"><div class="k">电梯年容量 Cap_SE</div><div class="v">5.37×10⁵ <u>吨/年</u></div><div class="s">电梯运量物理上限</div></div>
      <div class="kpi g"><div class="k">电梯维护 C_main</div><div class="v">10⁹ <u>USD/年</u></div><div class="s">固定成本</div></div>
      <div class="kpi b"><div class="k">电梯可变 C_var</div><div class="v">2.2×10⁵ <u>USD/吨</u></div><div class="s">每吨运输单价</div></div>
      <div class="kpi w"><div class="k">火箭单次 C_r</div><div class="v">7.13×10⁷ <u>USD</u></div><div class="s">单次发射成本</div></div>
    </div>
    <p class="note"><span class="badge">读题</span>四个 KPI 是后续四问的共用底座：问题一拿它们比三方案，问题二在它们身上做失效扰动，问题三把殖民地人口换成水需求，问题四把成本换成碳排放。</p>
  </div>
</section>

<!-- ============ 第二幕 · 四方案成本-时间散点图 ============ -->
<section class="scene" id="s2" data-title="二 · 四方案散点 · 成本 vs 年限">
  <div class="wrap">
    <div>
      <div class="kicker">方案对照 · 成本与时间</div>
      <h1>纯电梯贵且快不了多少，纯火箭便宜但要拼命发射
        <small>把四方案的成本-时间放进同一张散点图，混合方案在两端之间拉开一条可调带。</small>
      </h1>
    </div>

    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">四方案成本-时间散点图（对数刻度）· 入场动画</div>
        <div class="legend">
          <span><i class="dot" style="background:#12a594"></i>纯电梯 SE</span>
          <span><i class="dot" style="background:#b8543a"></i>纯火箭 RK</span>
          <span><i class="dot" style="background:#e0a04a"></i>混合C1·最快</span>

        <p class="small">年容量 <b class="num hl-t">5.37×10⁵ 吨</b>；维护 <b class="num">10⁹ USD/年</b>。</p>
        <p class="small hl-t"><b class="num">9991.2 B USD</b> / <b class="num">186.22 年</b></p>

      <div class="card">
        <h3><span class="badge w">方案B</span>纯传统火箭</h3>
        <p>仅靠化学火箭脉冲发射，无电梯。</p>
        <p class="small">TRANSCOST 模型 + 纬度修正；四模块。</p>
        <p class="small hl"><b class="num">259.6 B USD</b> / <b class="num">183.14 年</b> · 3641 次/年</p>
      </div>
      <div class="card">
        <h3><span class="badge p">方案C1</span>混合·最快</h3>
        <p>电梯承担基础运量，火箭抢进度。</p>
        <p class="small">让火箭多出力，把年限压到最短。</p>
        <p class="small hl-g"><b class="num">9052.9 B USD</b> / <b class="num">93.74 年</b></p>
      </div>
      <div class="card">
        <h3><span class="badge n">方案C2</span>混合·最省</h3>
        <p>电梯多承担，火箭只在缺口补量。</p>
        <p class="small">把固定维护摊薄，成本最省。</p>
        <p class="small hl-b"><b class="num">2151.5 B USD</b> / <b class="num">250 年</b></p>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>成本量级对照 <em>数值差异</em></h3>
        <table class="tb">
          <tr><th>方案</th><th style="text-align:right">总成本 B USD</th><th style="text-align:right">完成年限</th><th>备注</th></tr>
          <tr><td>纯电梯 SE</td><td class="num">9991.2</td><td class="num">186.22 年</td><td>最贵</td></tr>
          <tr><td>纯火箭 RK</td><td class="num">259.6</td><td class="num">183.14 年</td><td>最便宜</td></tr>

      </div>
    </div>

    <div class="grid4">
      <div class="card">
        <h3>成本维度</h3>

function roundRect(g,x,y,w,h,r){
  g.beginPath();

function lerpPt(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function pathPoint(pts,t){
  var segs=[],total=0,i;
  for(i=1;i<pts.length;i++){
    var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];
    var L=Math.sqrt(dx*dx+dy*dy); segs.push(L); total+=L;
  }
  var d=t*total,acc=0;
  for(i=1;i<pts.length;i++){
    if(d<=acc+segs[i-1]+1e-6){
      var r=(d-acc)/segs[i-1];
      return lerpPt(pts[i-1],pts[i],r);
    }
    acc+=segs[i-1];
  }
  return pts[pts.length-1];
}

function easeInOutQuad(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

/* ===================== 第一幕：地球-月球物流链（持续动画） ===================== */
var animCosmos=null, cosmosStars=null, cosmosT=0;
function drawCosmos(cv){
  var o=setupCanvas(cv,360), g=o.g, w=o.w, h=o.h;
  if(!cosmosStars||cosmosStars._w!==w){
    cosmosStars=[]; var i;
    for(i=0;i<80;i++) cosmosStars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.1+.25,a:Math.random()*.45+.15,tw:Math.random()*6.28});
    cosmosStars._w=w;
  }
  var ex=80,ey=h/2,eR=34, mx=w-80,my=h/2,mR=24;
  var paths=[
    {pts:[[ex,ey-eR],[ex,52],[mx,52],[mx,my-mR]], c:'#e0a04a', label:'纯太空电梯', ly:28, dc:'#8a6313'},
    {pts:[[ex+eR,ey],[mx-mR,my]], c:'#12a594', label:'混合方案', ly:Math.round(h*0.22), curve:true, dc:'#0b6e68'},
    {pts:[[ex,ey+eR],[ex,h-52],[mx,h-52],[mx,my+mR]], c:'#b8543a', label:'纯火箭', ly:h-28, dc:'#8d4229'}
  ];
  function bezier(p,t){
    var p0=p.pts[0],p1=p.pts[1];
    var cx=(p0[0]+p1[0])/2, cy=(p0[1]+p1[1])/2-40;
    var u=1-t;
    return [u*u*p0[0]+2*u*t*cx+t*t*p1[0], u*u*p0[1]+2*u*t*cy+t*t*p1[1]];
  }
  function dotAt(p,t){ return p.curve?bezier(p,t):pathPoint(p.pts,t); }
  function frame(){
    g.clearRect(0,0,w,h);
    // 星空 + 闪烁
    cosmosStars.forEach(function(s){
      var tw=0.5+0.5*Math.sin(cosmosT*.02+s.tw);
      g.fillStyle='rgba(180,210,220,'+(s.a*tw)+')';
      g.beginPath(); g.arc(s.x,s.y,s.r,0,6.28); g.fill();
    });
    // 路径
    paths.forEach(function(p){
      g.strokeStyle=p.c+'cc'; g.lineWidth=2.6; g.setLineDash([]); g.lineJoin='round';
      g.beginPath();
      if(p.curve){
        var p0=p.pts[0],p1=p.pts[1],cx=(p0[0]+p1[0])/2,cy=(p0[1]+p1[1])/2-40;
        g.moveTo(p0[0],p0[1]); g.quadraticCurveTo(cx,cy,p1[0],p1[1]);
      } else {
        g.moveTo(p.pts[0][0],p.pts[0][1]);
        for(var i=1;i<p.pts.length;i++) g.lineTo(p.pts[i][0],p.pts[i][1]);
      }
      g.stroke();
      // 流动货舱圆点
      var n=5,k;
      for(k=0;k<n;k++){
        var ph=((cosmosT*.005+k/n)%1);
        var pt=dotAt(p,ph);
        g.fillStyle=p.c; g.beginPath(); g.arc(pt[0],pt[1],4,0,6.28); g.fill();
        g.fillStyle='rgba(255,255,255,.75)'; g.beginPath(); g.arc(pt[0],pt[1],1.6,0,6.28); g.fill();
      }
      // 标签
      g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
      g.fillStyle=p.dc; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(p.label,w/2,p.ly);
    });
    // 地球
    planet(g,ex,ey,eR,'#3aa9d6','#0b3a52','地球基站');
    // 月球
    planet(g,mx,my,mR,'#c9cdd1','#4a5258','月球殖民地');
    // 中央需求文字
    g.font='700 15px "PingFang SC",system-ui,sans-serif';
    g.fillStyle='#0b2e36'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('1 亿公吨物资',w/2,ey-10);
    g.font='11.5px "PingFang SC",system-ui,sans-serif';
    g.fillStyle='#57727c';
    g.fillText('10 万人 · 2050',w/2,ey+8);
    cosmosT++;
    animCosmos=requestAnimationFrame(frame);
  }
  if(document.body.classList.contains('reduce')){
    cosmosT=0; frame(); if(animCosmos){ cancelAnimationFrame(animCosmos); animCosmos=null; }
  } else {
    frame();
  }
}

/* ===================== 第二幕：散点图（入场动画 + 帕累托） ===================== */
var animScatter=null, scatterT=0, scatterStart=0;
function drawScatter(cv){
  var o=setupCanvas(cv,380), g=o.g, w=o.w, h=o.h;
  g.clearRect(0,0,w,h);
  var sc=D.schemes;
  var L=64,R=28,T=24,B=44;
  var PW=w-L-R, PH=h-T-B;
  var xMin=60,xMax=270,yMin=150,yMax=12000;
  function X(v){ return L+PW*(v-xMin)/(xMax-xMin); }
  function Y(v){
    var lv=Math.log10(v), ly=Math.log10(yMin), hy=Math.log10(yMax);
    return T+PH*(1-(lv-ly)/(hy-ly));
  }
  // 网格
  var k;
  for(k=0;k<=4;k++){
    var yy=T+PH*k/4+.5;
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy); g.lineTo(L+PW,yy); g.stroke();
    var vv=Math.pow(10,Math.log10(yMax)-(Math.log10(yMax)-Math.log10(yMin))*k/4);
    g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
    g.textAlign='right'; g.textBaseline='middle';
    g.fillText(vv>=1000?(vv/1000).toFixed(0)+'k':vv.toFixed(0),L-6,T+PH-PH*k/4);
  }
  var xticks=[50,100,150,200,250];
  xticks.forEach(function(t){
    var xx=X(t);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='top';
    g.fillText(t+'',xx,T+PH+6);
  });
  g.fillStyle='#57727c'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='top';
  g.fillText('完成年限 (年)',L+PW/2,h-22);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.fillText('总成本 (B USD, 对数)',0,0); g.restore();

  // 帕累托前沿
  var front=[sc[2],sc[1]];
  function drawFront(progress){
    var x1=X(front[0].years),y1=Y(front[0].cost);
    var x2=X(front[1].years),y2=Y(front[1].cost);
    var cx=x1+(x2-x1)*progress, cy=y1+(y2-y1)*progress;
    g.strokeStyle='#0b6e68'; g.lineWidth=2; g.setLineDash([6,4]);
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(cx,cy); g.stroke();
    g.setLineDash([]);
    if(progress>=1){
      g.fillStyle='#0b6e68'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='bottom';
      g.fillText('帕累托前沿',(x1+x2)/2,(y1+y2)/2-6);
    }
  }

  function drawPoint(s,progress){
    var px=X(s.years), py=Y(s.cost);
    var r=8*progress+4;
    // 光晕
    g.fillStyle=s.color+'22'; g.beginPath(); g.arc(px,py,r+4,0,6.28); g.fill();
    g.fillStyle=s.color+'55'; g.beginPath(); g.arc(px,py,r+1,0,6.28); g.fill();
    g.fillStyle=s.color; g.beginPath(); g.arc(px,py,5*progress+2,0,6.28); g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1.6; g.stroke();
    if(progress>=1){
      g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
      g.fillStyle=s.color; g.textAlign='left'; g.textBaseline='middle';
      var tx=px+10, ty=py-12;
      if(s.code==='MX2'||s.code==='RK') ty=py+12;
      if(s.code==='SE') ty=py-14;
      g.fillText(s.name,tx,ty);
      g.font='10.5px "PingFang SC",system-ui,sans-serif';
      g.fillStyle='#57727c';
      g.fillText(s.cost.toFixed(1)+'B / '+s.years.toFixed(1)+'y',tx,ty+12);
    }
  }

  function drawAnnot(progress){
    if(progress<=0) return;
    g.fillStyle='rgba(184,84,58,'+(progress*0.9)+')';
    g.font='italic 10.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center';
    g.fillText('被支配',X(sc[0].years),Y(sc[0].cost)+28*progress);
    g.fillText('发射受限',X(sc[3].years),Y(sc[3].cost)-28*progress);
  }

  function frame(ts){
    if(!scatterStart) scatterStart=ts;
    var elapsed=ts-scatterStart;
    g.clearRect(0,0,w,h);
    // 重画网格
    for(k=0;k<=4;k++){
      var yy=T+PH*k/4+.5;
      g.strokeStyle='#eaf4f4'; g.lineWidth=1;
      g.beginPath(); g.moveTo(L,yy); g.lineTo(L+PW,yy); g.stroke();
      var vv=Math.pow(10,Math.log10(yMax)-(Math.log10(yMax)-Math.log10(yMin))*k/4);
      g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
      g.textAlign='right'; g.textBaseline='middle';
      g.fillText(vv>=1000?(vv/1000).toFixed(0)+'k':vv.toFixed(0),L-6,T+PH-PH*k/4);
    }
    xticks.forEach(function(t){
      var xx=X(t);
      g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
      g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='top';
      g.fillText(t+'',xx,T+PH+6);
    });
    g.fillStyle='#57727c'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='top';
    g.fillText('完成年限 (年)',L+PW/2,h-22);
    g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
    g.fillText('总成本 (B USD, 对数)',0,0); g.restore();

    var p1=Math.min(1,easeOutCubic(elapsed/600));
    var p2=Math.min(1,easeOutCubic(Math.max(0,elapsed-200)/600));
    drawFront(p1);
    sc.forEach(function(s,i){
      var pi=Math.min(1,easeOutCubic(Math.max(0,elapsed-400-i*120)/500));
      drawPoint(s,pi);
    });
    drawAnnot(Math.min(1,easeOutCubic(Math.max(0,elapsed-1100)/400)));

    if(elapsed<1600 && !document.body.classList.contains('reduce')){
      animScatter=requestAnimationFrame(frame);
    } else {
      // 终态全画
      drawFront(1);
      sc.forEach(function(s){ drawPoint(s,1); });
      drawAnnot(1);
    }
  }
  if(document.body.classList.contains('reduce')){
    drawFront(1);
    sc.forEach(function(s){ drawPoint(s,1); });
    drawAnnot(1);
  } else {
    scatterStart=0;
    animScatter=requestAnimationFrame(frame);
  }
}

/* ===================== 第三幕：雷达图（展开动画） ===================== */
var animRadar=null, radarStart=0;
function drawRadar(cv){
  var o=setupCanvas(cv,380), g=o.g, w=o.w, h=o.h;
  g.clearRect(0,0,w,h);
  var dims=D.radar.dims, n=dims.length;
  var sc=D.schemes;
  var cx=w/2, cy=h/2+8, R=Math.min(w,h)/2-58;

  function pt(i,r){
    var ang=-Math.PI/2+i*2*Math.PI/n;
    return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r];
  }
  function drawBase(progress){
    var lv,i,j;
    // 同心多边形
    for(lv=1;lv<=5;lv++){
      var r=R*lv/5*progress;
      g.strokeStyle=lv===5?'#cfe4e4':'#eaf4f4';
      g.lineWidth=lv===5?1.2:1;
      g.beginPath();
      for(i=0;i<=n;i++){
        var p=pt(i%n,r);
        if(i===0) g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]);
      }
      g.stroke();
    }
    // 轴线
    for(i=0;i<n;i++){
      var p=pt(i,R*progress);
      g.strokeStyle='#e0ecec'; g.lineWidth=1;
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(p[0],p[1]); g.stroke();
    }
    // 标签
    if(progress>=1){
      for(i=0;i<n;i++){
        var pl=pt(i,R+22);
        g.font='600 12px "PingFang SC",system-ui,sans-serif';
        g.fillStyle='#0b2e36'; g.textAlign='center'; g.textBaseline='middle';
        g.fillText(dims[i],pl[0],pl[1]);
      }
    }
  }
  function drawPolygon(scores,color,progress){
    g.beginPath();
    for(var i=0;i<=n;i++){
      var idx=i%n;
      var r=R*(scores[idx]/10)*progress;
      var p=pt(idx,r);
      if(i===0) g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]);
    }
    g.closePath();
    g.fillStyle=color+'22'; g.fill();
    g.strokeStyle=color; g.lineWidth=2; g.stroke();
    // 顶点
    for(var i=0;i<n;i++){
      var r=R*(scores[i]/10)*progress;
      var p=pt(i,r);
      g.fillStyle=color; g.beginPath(); g.arc(p[0],p[1],3.5,0,6.28); g.fill();
      g.strokeStyle='#fff'; g.lineWidth=1.5; g.stroke();
    }
  }
  function frame(ts){
    if(!radarStart) radarStart=ts;
    var elapsed=ts-radarStart;
    g.clearRect(0,0,w,h);
    var pBase=Math.min(1,easeOutCubic(elapsed/500));
    drawBase(pBase);
    sc.forEach(function(s,i){
      var scores=D.radar.scores[s.code];
      var pPoly=Math.min(1,easeOutCubic(Math.max(0,elapsed-300-i*180)/600));
      drawPolygon(scores,s.color,pPoly);
    });
    // 图例文字
    if(elapsed>1200 || document.body.classList.contains('reduce')){
      g.font='600 12px "PingFang SC",system-ui,sans-serif';
      g.fillStyle='#0b2e36'; g.textAlign='left'; g.textBaseline='top';
      var lx=12, ly=h-22;
      sc.forEach(function(s,i){
        g.fillStyle=s.color;
        g.beginPath(); g.arc(lx,ly+5,4,0,6.28); g.fill();
        g.fillStyle='#3d6570';
        g.fillText(s.short+' '+s.name,lx+10,ly);
        lx+=120;
      });
    }
    if(elapsed<1600 && !document.body.classList.contains('reduce')){
      animRadar=requestAnimationFrame(frame);
    } else {
      drawBase(1);
      sc.forEach(function(s){ drawPolygon(D.radar.scores[s.code],s.color,1); });
    }
  }
  if(document.body.classList.contains('reduce')){
    drawBase(1);
    sc.forEach(function(s){ drawPolygon(D.radar.scores[s.code],s.color,1); });
  } else {
    radarStart=0;
    animRadar=requestAnimationFrame(frame);
  }
}

/* ===================== 第四幕：双面板柱状图（从下往上长） ===================== */
var animBars=null, barsStart=0;
function drawBars(cv){
  var o=setupCanvas(cv,320), g=o.g, w=o.w, h=o.h;
  g.clearRect(0,0,w,h);
  var sc=D.schemes;
  var L=56,R=20,T=32,B=26,gap=18;
  var PW=w-L-R, panelH=114;
  var y0=T, y1=T+panelH+gap;
  function grid(y0,ph,maxv,fmt){
    var k;
    for(k=0;k<=4;k++){
      var v=maxv*k/4, yy=y0+ph-ph*k/4+.5;
      g.strokeStyle='#eaf4f4'; g.lineWidth=1;
      g.beginPath(); g.moveTo(L,yy); g.lineTo(L+PW,yy); g.stroke();
      g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
      g.textAlign='right'; g.textBaseline='middle';
      g.fillText(fmt(v),L-6,y0+ph-ph*k/4);
    }
  }
  function bars(y0,ph,maxv,acc,unit,progress){
    var bw=PW/sc.length*0.5, i;
    for(i=0;i<sc.length;i++){
      var v=acc(sc[i]), bh=ph*v/(maxv||1)*progress;
      var x=L+PW*(i+.5)/sc.length-bw/2, y=y0+ph-bh;
      // 柱体渐变
      var grd=g.createLinearGradient(x,y,x,y+y0+ph);
      grd.addColorStop(0,sc[i].color);
      grd.addColorStop(1,sc[i].color+'aa');
      g.fillStyle=grd; g.fillRect(x,y,bw,bh);
      g.fillStyle='rgba(255,255,255,.22)'; g.fillRect(x,y,bw,Math.min(6,bh));
      if(progress>=1){
        g.fillStyle='#0b2e36'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
        g.textAlign='center'; g.textBaseline='bottom';
        g.fillText(v.toFixed(v<1000?1:0)+unit,x,y-10);
        g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
        g.textBaseline='top'; g.textAlign='center';
        g.fillText(sc[i].short,L+PW*(i+.5)/sc.length,h-B+8);
      }
    }
  }
  var maxC=Math.max.apply(null,sc.map(function(s){return s.cost;}));
  var maxY=Math.max.apply(null,sc.map(function(s){return s.years;}));

  function frame(ts){
    if(!barsStart) barsStart=ts;
    var elapsed=ts-barsStart;
    g.clearRect(0,0,w,h);
    var p1=Math.min(1,easeOutCubic(elapsed/700));
    var p2=Math.min(1,easeOutCubic(Math.max(0,elapsed-300)/700));
    g.fillStyle='#0b6e68'; g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='left'; g.textBaseline='alphabetic'; g.fillText('总成本 (B USD)',L,y0-14);
    grid(y0,panelH,maxC,function(v){return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);});
    bars(y0,panelH,maxC,function(s){return s.cost;},'B',p1);
    g.fillStyle='#8a6313'; g.fillText('完成年限 (年)',L,y1-14);
    grid(y1,panelH,maxY,function(v){return v.toFixed(0);});
    bars(y1,panelH,maxY,function(s){return s.years;},'年',p2);

    if(elapsed<1300 && !document.body.classList.contains('reduce')){
      animBars=requestAnimationFrame(frame);
    } else {
      // 终态
      g.clearRect(0,0,w,h);
      g.fillStyle='#0b6e68'; g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
      g.textAlign='left'; g.textBaseline='alphabetic'; g.fillText('总成本 (B USD)',L,y0-8);
      grid(y0,panelH,maxC,function(v){return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);});
      bars(y0,panelH,maxC,function(s){return s.cost;},'B',1);
      g.fillStyle='#8a6313'; g.fillText('完成年限 (年)',L,y1-8);
      grid(y1,panelH,maxY,function(v){return v.toFixed(0);});
      bars(y1,panelH,maxY,function(s){return s.years;},'年',1);
    }
  }
  if(document.body.classList.contains('reduce')){
    g.fillStyle='#0b6e68'; g.font='600 12.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='left'; g.textBaseline='alphabetic'; g.fillText('总成本 (B USD)',L,y0-8);
    grid(y0,panelH,maxC,function(v){return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);});
    bars(y0,panelH,maxC,function(s){return s.cost;},'B',1);
    g.fillStyle='#8a6313'; g.fillText('完成年限 (年)',L,y1-8);
    grid(y1,panelH,maxY,function(v){return v.toFixed(0);});
    bars(y1,panelH,maxY,function(s){return s.years;},'年',1);
  } else {
    barsStart=0;
    animBars=requestAnimationFrame(frame);
  }
}

/* ===================== 第五幕：四问递进流图（流动光点） ===================== */
var animFlow=null, flowT=0;
function drawFlow(cv){
  var o=setupCanvas(cv,300), g=o.g, w=o.w, h=o.h;
  g.clearRect(0,0,w,h);
  var qs=D.questions;
  var n=qs.length;
  var bw=Math.min(160,(w-60)/n-18), bh=92;
  var gap=(w-60-bw*n)/(n-1);
  var x0=30, cy=h/2-bh/2-12;
  var i;
  function frame(){
    g.clearRect(0,0,w,h);
    for(i=0;i<n;i++){
      var x=x0+i*(bw+gap);
      // 阴影
      g.fillStyle='rgba(11,46,54,.08)'; roundRect(g,x+1,cy+3,bw,bh,12); g.fill();
      roundRect(g,x,cy,bw,bh,12);
      g.fillStyle=qs[i].color; g.fill();
      g.fillStyle='rgba(255,255,255,.14)'; g.fillRect(x,cy,bw,9);
      // 圆形Q标
      g.fillStyle='rgba(255,255,255,.95)'; g.beginPath();
      g.arc(x+18,cy+22,13,0,6.28); g.fill();
      g.fillStyle=qs[i].color; g.font='700 13.5px "PingFang SC",system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='middle'; g.fillText('Q'+qs[i].n,x+18,cy+22);
      // 标题
      g.fillStyle='#fff'; g.font='600 13px "PingFang SC",system-ui,sans-serif';

<!-- ============== 第一幕 · 问题一概述 ============== -->
<section class="scene" id="s1" data-title="一 · 双目标优化框架">
<div class="wrap">
  <div class="stg">
    <div class="kicker">2026 MCM Problem B · 问题一</div>
    <h1>双目标优化：<span class="hl-t">最小成本</span> 与 <span class="hl-g">最小时间</span>
      <small>2050 年月球殖民地 10 万人，需向月球运送 1 亿公吨（10⁸ 吨）物资；在成本-时间双目标下评估纯太空电梯、纯火箭、混合三方案，用 NSGA-II 求帕累托前沿。</small>
    </h1>
  </div>

  <div class="hero stg">
    <div class="heroleft">
      <div class="card">
        <h3>双目标定义 <em>min 同时</em></h3>
        <p><b class="hl-t">min C(M, t)</b>　总成本 = 电梯子模型 + 火箭子模型</p>
        <p><b class="hl-g">min t</b>　完工时间 = 子模型容量上限倒数</p>
        <p class="small">约束：运送总量 <b class="num">M = 10⁸ 吨</b>；电梯年容量 Cap_SE、火箭年发射次 N_re 各有上限。</p>
        <div class="decochips">
          <span class="decochip t">双目标</span>
          <span class="decochip t">NSGA-II</span>
          <span class="decochip g">帕累托前沿</span>
          <span class="decochip w">约束 M=10⁸t</span>
        </div>
      </div>
      <div class="card">
        <h3>三方案 <em>决策变量 γ</em></h3>
        <p><span class="badge w">纯电梯</span>γ = 1，全走电梯</p>
        <p><span class="badge p">纯火箭</span>γ = 0，全走火箭</p>
        <p><span class="badge q">混合</span>0 &lt; γ &lt; 1，电梯承担 γ，火箭承担 (1−γ)</p>
        <div class="flowrow" style="margin-top:6px">
          <span class="flownode">γ=0</span><span class="flowarrow">→</span>
          <span class="flownode">γ=0.3</span><span class="flowarrow">→</span>
          <span class="flownode on">γ=0.5</span><span class="flowarrow">→</span>
          <span class="flownode">γ=0.7</span><span class="flowarrow">→</span>
          <span class="flownode">γ=1</span>
        </div>
      </div>
    </div>
    <div class="heroright">
      <div class="herolabel">太空电梯 · 月球运输概念图</div>
      <div class="herosublabel">地球 → 同步轨道 → 月球<br>1 亿吨 · 双目标优化</div>
      <canvas id="cvHero"></canvas>
    </div>
  </div>

  <div class="grid4 stg">
    <div class="kpi"><div class="k">运送总量 M</div><div class="v">10⁸ <u>吨</u></div><div class="sub">1 亿公吨</div></div>
    <div class="kpi w"><div class="k">混合 C1 · 最快</div><div class="v">93.74 <u>年</u></div><div class="sub">9052.9 B USD</div></div>
    <div class="kpi g"><div class="k">混合 C2 · 最省</div><div class="v">2151.5 <u>B USD</u></div><div class="sub">250 年</div></div>
    <div class="kpi b"><div class="k">求解算法</div><div class="v">NSGA-<u>II</u></div><div class="sub">非支配排序</div></div>
  </div>

  <div class="quote stg">问题一要求建立 <b class="hl-t">cost-time 双目标优化模型</b>，比较四种运输方案：纯太空电梯、纯火箭、混合最快 C1、混合最省 C2。求解工具为 NSGA-II 非支配排序遗传算法，输出帕累托前沿。</div>
</div>
</section>

<!-- ============== 第二幕 · 成本模型推导 ============== -->
<section class="scene" id="s2" data-title="二 · 成本模型推导">
<div class="wrap">
  <div class="stg">
    <div class="kicker">子模型 · 成本推导</div>
    <h1>两个子模型：电梯线性成本 与 火箭线性叠加
      <small>电梯：固定维护 + 按吨可变运费；火箭：单次发射成本 × 年发射次。混合方案 γ 在两者间线性配比。</small>
    </h1>
  </div>

  <div class="grid2 stg">
    <div class="card">
      <h3>电梯成本公式 <em>C_SE</em></h3>
      <div class="formula">C_SE(t) = <span class="c">C_main</span> · t + <span class="y">C_var</span> · M
  <span class="dim">/* 固定 + 可变 */</span>

  C_main = 10⁹  <span class="dim">USD/年（缆索/配重维护）</span>
  C_var  = 2.2×10⁵ <span class="dim">USD/吨（电力/损耗）</span>
  Cap_SE = 5.37×10⁵ <span class="dim">吨/年</span>

  t_min  = M / Cap_SE = <span class="c">186.22 年</span></div>
      <p class="small" style="margin-top:8px">固定维护 <b class="hl-t">C_main = 10⁹ USD/年</b> 只贡献斜率（1 B/年），<b class="hl-g">9805 B 的可变运费</b> 几乎把曲线拉成水平线——电梯省不了多少钱，但能压低时间。</p>
    </div>
    <div class="card">
      <h3>火箭成本公式 <em>C_R</em></h3>
      <div class="formula">C_R(t) = <span class="w">C_r</span> · N · t
  <span class="dim">/* 单次 × 次数 × 年 */</span>

  C_r  = 7.13×10⁷ <span class="dim">USD/次</span>
  Cap_r = 2750   <span class="dim">吨/次</span>
  N    = 3641   <span class="dim">次/年（工位约束）</span>

  t_min = M / (N·Cap_r) = <span class="c">183.14 年</span></div>
      <p class="small" style="margin-top:8px">单次便宜 <b class="hl-t">C_r = 7.13×10⁷ USD</b>，但 3641 次/年 × 183.14 年累计 ≈ 66.7 万次，对应总成本 <b class="hl">≈ 2.60×10⁴ B USD</b>——快，但总量贵。</p>
    </div>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">成本公式可视化：C_main·t（固定）+ C_var·M（可变）= C_SE 总成本</div>
      <div class="legend">
        <span><i style="background:#0b6e68"></i>固定项 C_main·t</span>
        <span><i style="background:#e0a04a"></i>可变项 C_var·M</span>
        <span><i class="ln" style="background:#12a594"></i>总成本 C_SE</span>
        <span><i class="ln" style="background:#b8543a"></i>容量约束 t_min</span>
      </div>
    </div>
    <canvas id="cvCost"></canvas>
    <p class="note" style="margin-top:8px">可变项 <b class="hl-g">C_var·M = 2.2×10⁵ × 10⁸ = 2.2×10¹³ USD = 22000 B</b> 占绝对主体；固定项 C_main·t 仅 ~186 B。所以电梯总成本 ≈ <b class="hl-t">9991.2 B USD</b>，几乎不随时间变化。</p>
  </div>

  <div class="grid4 stg">
    <div class="kpi"><div class="k">电梯 C_main</div><div class="v">10⁹ <u>USD/年</u></div></div>
    <div class="kpi g"><div class="k">电梯 C_var</div><div class="v">2.2×10⁵ <u>USD/吨</u></div></div>
    <div class="kpi b"><div class="k">火箭 C_r</div><div class="v">7.13×10⁷ <u>USD/次</u></div></div>
    <div class="kpi"><div class="k">火箭 Cap_r</div><div class="v">2750 <u>吨/次</u></div></div>
  </div>

  <div class="quote stg">混合方案成本 = <b class="hl-t">γ · C_SE(t) + (1−γ) · C_R(t)</b>；混合容量 = <b class="hl-t">γ · Cap_SE + (1−γ) · N · Cap_r</b>。γ ∈ [0,1] 把慢而省的电梯与快而贵的火箭按任意比例配比，从而在 C-t 平面上铺出连续折中曲线。</div>
</div>
</section>

<!-- ============== 第三幕 · 帕累托前沿 ============== -->
<section class="scene" id="s3" data-title="三 · 帕累托前沿">
<div class="wrap">
  <div class="stg">
    <div class="kicker">Pareto Frontier · NSGA-II</div>
    <h1>帕累托前沿：混合方案支配纯方案
      <small>四方案点画在 C-t 平面：C1 占时间最短端、C2 占成本最低端，二者连线即前沿；纯电梯与纯火箭都落在前沿上方、被混合支配。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">成本-时间平面：四方案散点 + 帕累托前沿（C1 → C2）</div>
      <div class="legend">
        <span><i style="background:#12a594;border-radius:50%"></i>混合 C1（前沿·最快）</span>
        <span><i style="background:#e0a04a;border-radius:50%"></i>混合 C2（前沿·最省）</span>
        <span><i class="dn" style="border-color:#b8543a"></i>纯电梯（被支配）</span>
        <span><i class="dn" style="border-color:#8a6313"></i>纯火箭（被支配）</span>
        <span><i class="ln" style="background:#12a594"></i>帕累托前沿</span>
        <span><i style="background:rgba(18,165,148,.40);border-radius:50%"></i>NSGA-II 种群</span>
      </div>
    </div>
    <canvas id="cvPareto"></canvas>
    <p class="note" style="margin-top:8px">C1(93.74 年, 9052.9 B) 与 C2(250 年, 2151.5 B) 连成前沿：两者互不支配——C1 更快但更贵，C2 更省但更慢。纯电梯(186.22, 9991.2) 被 C1 支配（C1 更快且更省）；纯火箭(183.14, ≈2.60×10⁴) 同样被 C1 支配。<b class="hl-t">两个纯方案都落在前沿上方而被淘汰</b>。</p>
  </div>

  <div class="grid2 stg">
    <div class="card">
      <h3>NSGA-II 流程 <em>非支配排序</em></h3>
      <div class="flowrow">
        <span class="flownode on">① 初始化种群</span><span class="flowarrow">→</span>
        <span class="flownode on">② 非支配排序</span><span class="flowarrow">→</span>
        <span class="flownode on">③ 拥挤度</span>
      </div>
      <div class="flowrow" style="margin-top:6px">
        <span class="flownode on">④ 锦标赛+交叉</span><span class="flowarrow">→</span>
        <span class="flownode on">⑤ 精英保留</span><span class="flowarrow">→</span>
        <span class="flownode">迭代至收敛</span>
      </div>
      <p class="small" style="margin-top:8px">拥挤度保证前沿分布均匀，是双目标求解的标准算法。种群沿前沿抖动并最终收敛到 C1↔C2 连线附近。</p>
    </div>
    <div class="card">
      <h3>被支配判定 <em>dominance</em></h3>
      <p>方案 A 支配 B ⟺ <b class="hl-t">A 在 C 与 t 上都不劣于 B，且至少一项严格更优</b>。</p>
      <p><span class="badge q">C1 vs 纯电梯</span> C1：93.74 &lt; 186.22 且 9052.9 &lt; 9991.2 → C1 支配</p>
      <p><span class="badge q">C1 vs 纯火箭</span> C1：93.74 &lt; 183.14 且 9052.9 &lt; 25960 → C1 支配</p>
      <p><span class="badge w">C1 vs C2</span> C1 更快但更贵 → <b class="hl">互不支配</b>（同在前沿）</p>
    </div>
  </div>
</div>
</section>

<!-- ============== 第四幕 · 方案对比 ============== -->
<section class="scene" id="s4" data-title="四 · 方案对比">
<div class="wrap">
  <div class="stg">
    <div class="kicker">方案对比 · 四方案汇总</div>
    <h1>四方案对比：成本柱 与 时间柱
      <small>把四个方案的 C 与 t 并排画成柱状图，按归一化高度直接读出谁最快、谁最省——以及两个被支配的纯方案在两项上都不占优。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">四方案成本柱（归一化到最大值 26000 B USD）</div>
      <div class="legend">
        <span><i style="background:#12a594"></i>混合 C1</span>
        <span><i style="background:#e0a04a"></i>混合 C2</span>
        <span><i style="background:#b8543a"></i>纯电梯</span>
        <span><i style="background:#8a6313"></i>纯火箭</span>
      </div>
    </div>
    <canvas id="cvBarsC"></canvas>
    <p class="note" style="margin-top:8px">C2 = <b class="hl-g">2151.5 B</b>，仅为纯火箭 25960 B 的 <b>8.3%</b>；C1 = 9052.9 B，也只有纯火箭的 <b>34.9%</b>。混合方案在成本上完胜纯方案。</p>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">四方案完工时间柱（归一化到最大值 250 年）</div>
      <div class="legend">
        <span><i style="background:#12a594"></i>混合 C1</span>
        <span><i style="background:#e0a04a"></i>混合 C2</span>
        <span><i style="background:#b8543a"></i>纯电梯</span>
        <span><i style="background:#8a6313"></i>纯火箭</span>
      </div>
    </div>
    <canvas id="cvBarsT"></canvas>
    <p class="note" style="margin-top:8px">C1 = <b class="hl-t">93.74 年</b>，比纯电梯 186.22 年快近一倍、比纯火箭 183.14 年也快近一倍。C2 = 250 年最慢但最省——时间与成本的取舍点。</p>
  </div>

  <div class="card stg">
    <h3>四方案汇总 <em>问题一 NSGA-II 参考</em></h3>
    <table class="tb">
      <tr><th>方案</th><th>γ（电梯承担）</th><th class="num">完工时间 t (年)</th><th class="num">总成本 C (B USD)</th><th>帕累托状态</th></tr>
      <tr><td><span class="badge q">混合 C1</span></td><td class="num">中-高</td><td class="num">93.74</td><td class="num">9052.9</td><td class="hl-t">前沿 · 最快</td></tr>
      <tr><td><span class="badge q">混合 C2</span></td><td class="num">中-低</td><td class="num">250.00</td><td class="num">2151.5</td><td class="hl-g">前沿 · 最省</td></tr>
      <tr><td><span class="badge w">纯电梯</span></td><td class="num">1.00</td><td class="num">186.22</td><td class="num">9991.2</td><td class="hl">被 C1 支配</td></tr>
      <tr><td><span class="badge w">纯火箭</span></td><td class="num">0.00</td><td class="num">183.14</td><td class="num">≈2.60×10⁴</td><td class="hl">被 C1 支配</td></tr>
    </table>
  </div>
</div>
</section>

<!-- ============== 第五幕 · 结论 ============== -->
<section class="scene" id="s5" data-title="五 · 结论与 KPI">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题一结论 · KPI 汇总</div>
    <h1>结论：混合方案在 C-t 平面支配两个纯方案
      <small>要快就拉高 γ（C1：93.74 年送达，代价 9052.9 B）；要省就压低 γ（C2：250 年送达，仅 2151.5 B）。决策者可在 C1↔C2 前沿上任取折中点。</small>
    </h1>
  </div>

  <div class="grid4 stg">
    <div class="bigkpi">
      <div class="bk-k">混合 C1 · 最快</div>
      <div class="bk-v" data-cnt="93.74" data-dec="2">0.00<span class="bk-u">年</span></div>
      <div class="bk-sub">成本 9052.9 B USD · γ 中-高</div>
    </div>
    <div class="bigkpi g">
      <div class="bk-k">混合 C2 · 最省</div>
      <div class="bk-v" data-cnt="2151.5" data-dec="1">0.0<span class="bk-u">B USD</span></div>
      <div class="bk-sub">完工 250 年 · γ 中-低</div>
    </div>
    <div class="bigkpi">
      <div class="bk-k">纯电梯 · 被支配</div>
      <div class="bk-v" data-cnt="9991.2" data-dec="1">0.0<span class="bk-u">B</span></div>
      <div class="bk-sub">186.22 年 · 被 C1 支配</div>
    </div>
    <div class="bigkpi g">
      <div class="bk-k">纯火箭 · 被支配</div>
      <div class="bk-v" data-cnt="25960" data-dec="0">0<span class="bk-u">B</span></div>
      <div class="bk-sub">183.14 年 · 被 C1 支配</div>
    </div>
  </div>

  <div class="grid2 stg">
    <div class="card">
      <h3>关键洞察 <em>双目标权衡</em></h3>
      <p>① 电梯的<b class="hl-t">9805 B 可变运费</b>占比 98%+，固定项几乎可忽略。</p>
      <p>② 火箭<b class="hl">单次便宜、总量很贵</b>：3641 次/年 × 183 年 ≈ 66.7 万次。</p>
      <p>③ 混合方案通过 γ 配比，能到达纯方案够不到的前沿段。</p>
      <p>④ 决策者按<b class="hl-g">预算/工期</b>在 C1↔C2 前沿上任取折中点。</p>
    </div>
    <div class="card">
      <h3>模型结构 <em>NSGA-II 输出</em></h3>
      <div class="formula" style="font-size:12.5px">min  C = γ·C_SE + (1−γ)·C_R
min  t = M / (γ·Cap_SE + (1−γ)·N·Cap_r)
s.t. 0 ≤ γ ≤ 1,  M = 10⁸ t

<span class="dim">// 帕累托前沿：C1 ↔ C2 连线</span>
<span class="c">C1</span> = (93.74 yr, 9052.9 B)  <span class="dim">γ 中-高</span>
<span class="y">C2</span> = (250.0 yr, 2151.5 B)  <span class="dim">γ 中-低</span></div>
    </div>
  </div>

  <div class="quote stg">问题一的结论：<b class="hl-t">混合方案在 C-t 平面上支配了两个纯方案</b>——要快就拉高 γ（C1：93.74 年送达，代价 9052.9 B），要省就压低 γ（C2：250 年送达，仅 2151.5 B）。决策者可在 C1↔C2 这条前沿上按预算/工期任取折中点。</div>
</div>
</section>
