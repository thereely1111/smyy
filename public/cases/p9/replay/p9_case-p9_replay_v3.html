<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数模演易 · 体育管理复现</title>
<style>
:root{
  --teal-700:#0B6E68; --teal-600:#0E8F84; --teal-500:#12A594; --teal-400:#2EC4B0;
  --teal-100:#DFF4F1; --teal-50:#EFFAF8;
  --cyan-500:#17A2C4; --blue-600:#1E6FA8;
  --blue-900:#0B6E68; --blue-800:#0E8F84; --blue-700:#12A594; --blue-600:#1E6FA8;
  --blue-500:#2EC4B0; --blue-400:#4FD0C0; --blue-300:#92DED5; --blue-200:#B8E8E2; --blue-100:#DFF4F1; --blue-50:#EFFAF8;
  --amber-500:#F5A623; --red-500:#D95C45; --green-500:#2BA471;
  --bg:#F3FAFA; --card:#FFFFFF;
  --ink:#0B2E36; --ink-2:#3D6570; --ink-3:#7C99A1; --ink-4:#A9BEC2;
  --line:#DCEDEE; --line-2:#EAF5F5;
  --grad:linear-gradient(120deg,#12A594 0%,#1E9FC4 100%);
  --grad-soft:linear-gradient(120deg,#EFFAF8 0%,#EAF5F5 100%);
  --sh-1:0 2px 8px rgba(11,110,104,.06);
  --sh-2:0 10px 30px rgba(11,110,104,.09);
  --sh-3:0 20px 50px rgba(11,110,104,.14);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#B8E8E2;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#92DED5}
::-webkit-scrollbar-track{background:transparent}

/* 工作台 */
.wtop{
  background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:50
}
.wtop .wt{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.wtop .wtb{
  padding:3px 9px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);font-size:11.5px;font-weight:700;flex-shrink:0
}
.steps{display:flex;align-items:center;gap:4px;margin-left:6px;overflow-x:auto;flex-shrink:0}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-4);white-space:nowrap;padding:2px 4px;border-radius:7px;transition:.15s}
.step .n{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-4);background:#fff
}
.step.done{color:var(--blue-700)}
.step.done .n{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.step.now{color:var(--blue-800);font-weight:700}
.step.now .n{border-color:var(--blue-600);color:var(--blue-700);box-shadow:0 0 0 3px rgba(11,110,104,.16)}
.step-line{width:14px;height:1.5px;background:var(--line);flex-shrink:0}
.wtop .stag{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 10px;border-radius:999px;
  font-size:11.8px;font-weight:700;color:#8A5A00;background:#FFF6DC;border:1px solid #F4DFA8;white-space:nowrap}
.wtop .stag i{width:6px;height:6px;border-radius:50%;background:var(--amber-500);box-shadow:0 0 0 3px rgba(245,166,35,.18)}
.wtop .stag.done{color:#1E7A4F;background:#E7F6EE;border-color:#BFE6CF}
.wtop .stag.done i{background:#2FA36B;box-shadow:0 0 0 3px rgba(47,163,107,.16)}

.wbody{display:flex;gap:0;height:100vh;min-height:520px;max-width:1800px;margin:0 auto}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.stream{flex:1;overflow-y:auto;padding:22px 26px 8px;scroll-behavior:smooth}
.stream-in{max-width:860px;margin:0 auto}
.msg{display:flex;margin-bottom:20px;gap:12px}
.msg.me{flex-direction:row-reverse}
.avatar-mini{width:32px;height:32px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.msg.me .avatar-mini{background:#1a7a6a;color:#fff}
.bubble{max-width:78%;min-width:0}
.msg.me .bubble{margin-left:auto}
.bubble .txt{
  background:#fff;border:1px solid #e0ebe8;border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.8;color:var(--ink-2);
  box-shadow:0 1px 2px rgba(11,110,104,.05)
}
.msg.me .bubble .txt{background:#1a7a6a;border-color:#1a7a6a;color:#fff}
.bubble .txt h4{font-size:14.5px;font-weight:800;color:var(--ink);margin:0 0 8px}
.msg.me .bubble .txt h4{color:#fff}
.bubble .txt h4:not(:first-child){margin-top:16px}
.bubble .txt p{margin-bottom:8px}
.bubble .txt p:last-child{margin-bottom:0}
.bubble .txt ul{margin:0 0 8px 0;list-style:none}
.bubble .txt li{padding-left:16px;position:relative;margin-bottom:5px}
.bubble .txt li:before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}
.msg.me .bubble .txt li:before{background:rgba(255,255,255,.8)}
.bubble .txt .kv{color:var(--blue-700);font-weight:700}
.msg.me .bubble .txt .kv{color:#fff}
.bubble .txt .mono{font-family:Consolas,monospace;background:var(--line-2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.msg.me .bubble .txt .mono{background:rgba(255,255,255,.2);color:#fff}
.bubble .txt .formula{
  background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;padding:12px 16px;
  font-family:"Cambria Math",Georgia,serif;font-size:14.5px;color:var(--blue-900);margin:12px 0;overflow-x:auto;line-height:1.6
}
.msg.me .bubble .txt .formula{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.bubble .txt .note{
  background:#FFF8E8;border:1px solid #FBE3B8;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#8A5A00;margin:12px 0;line-height:1.7
}
.bubble .txt .next{
  margin-top:12px;padding:9px 13px;border-radius:9px;font-size:13px;line-height:1.72;
  color:var(--blue-800);background:var(--blue-50);border-left:3px solid var(--blue-500)
}
.msg.me .bubble .txt .next{background:rgba(255,255,255,.15);border-left-color:#fff;color:#fff}

.thinking{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);padding:6px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--blue-400);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.arts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.acard{
  display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:13px 16px;cursor:pointer;transition:.18s;text-align:left;box-shadow:var(--sh-1);position:relative;overflow:hidden
}
.acard:hover{border-color:var(--blue-300);transform:translateY(-2px);box-shadow:var(--sh-2)}
.acard.open{border-color:var(--blue-600);box-shadow:0 0 0 3px rgba(11,110,104,.12)}
.acard .ai{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff
}
.acard .at{flex:1;min-width:0}
.acard .at b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.acard .at span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .arrow{color:var(--blue-600);flex-shrink:0;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700}

.composer-bar{border-top:1px solid var(--line);background:#fff;padding:14px 26px 16px}
.composer-bar .cw{max-width:860px;margin:0 auto}
.composer{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);
  transition:.2s;overflow:hidden
}
.composer:focus-within{border-color:var(--blue-400);box-shadow:0 8px 28px rgba(11,110,104,.14)}
.composer textarea{
  display:block;width:100%;padding:16px 18px 6px;min-height:62px;max-height:200px;resize:none;
  font-size:15px;line-height:1.7;color:var(--ink)
}
.composer textarea::placeholder{color:var(--ink-4)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--line-2);background:#F8FCFC}
.cbar .spacer{flex:1}
.hint{font-size:12px;color:var(--ink-4)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s
}
.btn-ghost:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.btn-send{
  display:inline-flex;align-items:center;gap:7px;padding:9px 22px;border-radius:10px;
  background:var(--grad);color:#fff;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(11,110,104,.28);transition:.18s
}
.btn-send:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-send[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;margin-top:10px}
.chip{
  padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);transition:.18s;cursor:pointer
}
.chip:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.chip.on{background:var(--blue-100);border-color:var(--blue-200);color:var(--blue-800);font-weight:600}

/* 抽屉 */
.drawer{
  width:0;flex-shrink:0;border-left:1px solid var(--line);background:#fff;overflow:hidden;transition:width .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column
}
.drawer.on{width:560px}
.drawer.on.wide{width:720px}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.dh h3{font-size:15px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .sub{font-size:11.5px;color:var(--ink-3);display:block;font-weight:500;margin-top:1px}
.db{flex:1;overflow-y:auto;padding:18px;background:var(--bg)}
.db .card{margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.db .card:last-child{margin-bottom:0}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:15.5px;font-weight:700}
.card-h .grow{flex:1}
.card-b{padding:18px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.18s
}
.icon-btn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}

/* 代码 */
.code-box{
  background:#0F1B2D;border-radius:12px;overflow:hidden;font-family:"JetBrains Mono",Consolas,"Courier New",monospace
}
.code-top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#16253C;border-bottom:1px solid #21334F}
.code-top .f{font-size:12px;color:#8FA6C4}
.code-top .grow{flex:1}
.code-top button{padding:5px 10px;border-radius:7px;background:#22344F;color:#B9CBDF;font-size:11.5px;transition:.16s}
.code-top button:hover{background:#2C4363;color:#fff}
pre.code{padding:16px 18px;overflow:auto;max-height:520px;font-size:12.6px;line-height:1.75;color:#D6E4F5}
pre.code .c-kw{color:#6DD6C6}
pre.code .c-com{color:#5C7290;font-style:italic}
pre.code .c-num{color:#F5A623}
pre.code .c-str{color:#9BE0B4}

/* 动画舞台 */
.stage{
  background:linear-gradient(160deg,#0B6E68 0%,#0E8F84 100%);border-radius:var(--r);padding:16px;position:relative;overflow:hidden
}
.stage canvas{width:100%;height:auto;display:block;border-radius:10px;background:#052320}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.play{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(11,110,104,.3)}
.prog{flex:1;height:6px;border-radius:6px;background:var(--line-2);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;height:100%;background:var(--grad);border-radius:6px;width:0%;transition:width .1s linear}
.speed{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:22px;font-weight:800;color:var(--blue-800);margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--green-500);margin-top:3px}

.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th,.dtable td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left}
.dtable th{background:var(--blue-50);color:var(--blue-900);font-weight:700;position:sticky;top:0}
.dtable tbody tr:hover{background:var(--blue-50)}

.doc{padding:0}
.doc h2{font-size:19px;font-weight:800;color:var(--blue-900);margin:0 0 6px}
.doc .dc{font-size:12.5px;color:var(--ink-3);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.doc h3{font-size:15.5px;font-weight:700;margin:22px 0 10px;color:var(--ink);display:flex;align-items:center;gap:8px}
.doc h3:before{content:"";width:3px;height:15px;border-radius:2px;background:var(--grad)}
.doc p{font-size:14px;color:var(--ink-2);line-height:1.85;margin-bottom:12px}
.doc ul{margin:0 0 14px 4px;list-style:none}
.doc li{font-size:14px;color:var(--ink-2);line-height:1.85;padding-left:18px;position:relative;margin-bottom:6px}
.doc li:before{content:"";position:absolute;left:4px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.24s;z-index:200;
  box-shadow:0 8px 28px rgba(0,0,0,.24);display:flex;align-items:center;gap:8px
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){
  .drawer.on{width:440px}
}
@media(max-width:820px){
  .drawer.on{width:100%;position:fixed;inset:0 0 0 0;z-index:70}
}

/* 流程闸门 / 选项按钮 */
.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.abtn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s;cursor:pointer}
.abtn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.abtn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(11,110,104,.24)}
.abtn.pri:hover{filter:brightness(1.06);color:#fff}
.abtn.gh{background:#fff;border-color:var(--blue-200);color:var(--blue-700)}
.abtn.gh:hover{background:var(--blue-50)}
.abtn.used{opacity:.5;pointer-events:none}
.flow-gate{margin-top:12px}
.choice-note{font-size:12px;color:var(--ink-4);margin:10px 0 0;line-height:1.6}
.other-row{display:none;gap:8px;margin-top:10px;align-items:center}
.other-row.on{display:flex}
.other-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px}
.other-row input:focus{border-color:var(--blue-400)}
.picks{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pick{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;transition:.18s}
.pick:hover{border-color:var(--blue-300);background:var(--blue-50);box-shadow:var(--sh-1)}
.pick.sel{border-color:var(--blue-500);background:var(--blue-50);box-shadow:0 0 0 3px rgba(11,110,104,.13)}
.pick.dis{opacity:.45;pointer-events:none}
.pick .pk{
  flex:0 0 26px;height:26px;margin-top:2px;border-radius:8px;background:var(--blue-100);color:var(--blue-700);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px
}
.pick .pb{flex:1;min-width:0}
.pick .pb b{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.pick .pb s{display:block;text-decoration:none;font-size:12.6px;color:var(--ink-3);line-height:1.62}
.pick .pb em{display:block;font-style:normal;font-size:11.6px;color:var(--blue-600);margin-top:5px}
.pick .pgo{
  flex:0 0 auto;padding:6px 12px;border-radius:8px;background:var(--grad);color:#fff;
  font-size:12.5px;font-weight:700;box-shadow:0 2px 7px rgba(11,110,104,.22);cursor:pointer;transition:.16s
}
.pick .pgo:hover{filter:brightness(1.06)}
.pick.sel .pgo{background:#DFF4F1;color:var(--blue-700);box-shadow:none}
.run-acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.run-out{margin-top:12px;background:#0F1B2D;border-radius:10px;padding:12px 14px;font-family:Consolas,monospace;font-size:12.5px;color:#9BE0B4;white-space:pre-wrap;min-height:20px}
.run-out .lbl{display:block;color:#5C7290;font-size:10px;letter-spacing:1px;margin-bottom:6px}
.step.clickable{cursor:pointer}
.step.clickable:hover{color:var(--blue-700)}
.wtop .stag.paused{color:#7A4FB0;background:#F3ECFB;border-color:#E3D2F5}
.wtop .stag.paused i{background:#9B6DD6;box-shadow:0 0 0 3px rgba(155,109,214,.18)}

/* 顶栏流程工具（对齐原型 v2） */
.flow-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.flow-tool{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;transition:.16s
}
.flow-tool:hover{border-color:var(--teal-400);color:var(--teal-700);background:var(--teal-50)}
.flow-tool svg{width:14px;height:14px;flex:0 0 auto}
.other-btn{border-style:dashed!important;background:var(--teal-50)!important}

/* 模型对比表（对齐原型 v2） */
.model-compare{width:100%;margin-top:12px;border-collapse:collapse;font-size:12.5px}
.model-compare th,.model-compare td{padding:9px 10px;border:1px solid var(--line);text-align:left;vertical-align:top}
.model-compare th{background:var(--teal-50);color:var(--teal-700);font-weight:800}
.model-compare td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}

/* 论文风格卡片 / 图片勾选（对齐原型 v2） */
.style-list{display:grid;gap:8px;margin:12px 0}
.style-item{padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.style-item>b{color:var(--teal-700)}
.style-item>span{margin-left:8px;font-size:12px;color:var(--ink-3)}

<script>
/* =============== 工具 =============== */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var toastTimer=null;
function toast(msg){
  var t=$('toast'); t.innerHTML='<span>'+esc(msg)+'</span>'; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('on')},2200);
}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function hl(code){
  return esc(code)
    .replace(/(#[^\n]*)/g,'<span class="c-com">$1</span>')
    .replace(/\b(import|from|def|return|for|in|if|else|elif|while|with|as|class|try|except|lambda|and|or|not|None|True|False|np|pd|plt|math)\b/g,'<span class="c-kw">$1</span>')
    .replace(/('[^']*'|"[^"]*")/g,'<span class="c-str">$1</span>')
    .replace(/\b(\d+\.?\d*(?:e[+-]?\d+)?)\b/gi,'<span class="c-num">$1</span>');
}

/* 物理仿真块已移除：本题（体育管理）为动态决策类，可视化由 5 个逐问交互演示（anim-src 模板块）承担 */

  {label:'问题分析', done:false},
  {label:'候选模型', done:false},
  {label:'生成代码', done:false},
  {label:'可视化', done:false},
  {label:'结果讨论', done:false},
  {label:'论文初稿', done:false}
];

  '先帮我分析体育管理这道题',

  '动态规划的状态和动作怎么定义？',

];

/* =============== UI 消息/产物 =============== */
var MSG_HISTORY=[];
function pushMsg(who, html, arts){
  const id='m-'+Date.now()+Math.random();
  const isMe=who==='me';
  const label=isMe?'我':'AI';
  const bubble='<div class="bubble"><div class="txt">'+html+'</div>'+(arts?'<div class="arts">'+arts+'</div>':'')+'</div>';
  const row='<div class="msg '+(isMe?'me':'')+'" id="'+id+'">'+
    '<div class="avatar-mini">'+label+'</div>'+bubble+'</div>';
  $('stream-in').insertAdjacentHTML('beforeend',row);
  $('stream').scrollTop=$('stream').scrollHeight;
  MSG_HISTORY.push({who,html});
  return id;
}
function thinking(callback){
  const id='m-thinking-'+Date.now();
  $('stream-in').insertAdjacentHTML('beforeend',
    '<div class="msg" id="'+id+'"><div class="avatar-mini">AI</div>'+
    '<div class="bubble"><div class="thinking"><i></i><i></i><i></i>演易正在思考…</div></div></div>');
  $('stream').scrollTop=$('stream').scrollHeight;
  setTimeout(function(){
    var el=$(id); if(el){ el.remove(); if(callback) callback(); }
  }, 700);
}

function renderSteps(now){
  MAIN_STEP=now; if(now>MAX_STEP) MAX_STEP=now;
  var labels=['问题分析','关键假设','候选模型','生成代码','可视化','结果讨论','论文初稿'];
  var html='';
  labels.forEach(function(s,i){
    var cls=i<now?'done':(i===now?'now':'');
    var can=i<=MAX_STEP;
    html+='<div class="step '+(can?('clickable '+cls):cls)+'"'+(can?' onclick="jumpStep('+i+')" title="回到这一步"':'')+'><div class="n">'+(i<now?'✓':(i+1))+'</div>'+esc(s)+'</div>';
    if(i<labels.length-1) html+='<div class="step-line"></div>';
  });
  $('w-steps').innerHTML=html;
}
function setStage(txt, done){
  $('w-stage').innerHTML='<i></i>'+esc(txt);
  $('w-stage').classList.toggle('done', done);
}

var CHIP_FNS=[];
function chips(list){
  CHIP_FNS=[];
  $('work-chips').innerHTML=(list||[]).map(function(x){
    if(typeof x==='string') x={t:x,fn:null};
    CHIP_FNS.push(x.fn||null);
    return '<button class="chip" onclick="chipAct(this)">'+esc(x.t)+'</button>';
  }).join('');
}
function chipAct(btn){
  if(isRunning){ toast('AI 正在思考，稍候'); return; }
  var idx=[].slice.call(document.querySelectorAll('#work-chips .chip')).indexOf(btn);
  var fn=CHIP_FNS[idx];
  var t=btn.textContent.trim();
  if(fn){ pushMsg('me','<p>'+esc(t)+'</p>'); fn(); }
  else { $('work-input').value=t; sendInWork(); }
}
function applyChips(list,hint){
  var arr=(list||[]).slice();
  if(hint) arr.unshift({t:hint,fn:null});
  chips(arr);
}

var PY_CODE=`# -*- coding: utf-8 -*-
"""2026 MCM Problem D：成功的体育管理
   问题二 —— 薪资档 × 运营档的动态规划（5 年，末年接估值）
   数模演易 自动生成 · 可直接运行（纯标准库）
"""
import math

# ---------- 1. 现状参数 ----------
SEATS, GAMES = 18000, 41          # 主场容量 / 每赛季主场数
C_FIXED, LEAGUE = 95.0, 130.0     # 固定成本 / 联盟分成（M$）
REV_MULT = 6.0                    # 估值 = 6.0 × 年收入
RATE = 0.07                       # 折现率
PS_LEVELS = [110, 135, 160, 185, 210]            # 薪资档（M$）
OPS_LEVELS = [0, 8, 20]                          # 运营档（M$）
OPS_GAIN = {0: 1.00, 8: 1.07, 20: 1.15}          # 运营放大商品+赞助收入
COST_UP, COST_DOWN = 18.0, 25.0                  # 换档成本（M$）
P_NOW = 75                                        # 现状票价（$）
YEARS = 5

# ---------- 2. 传导链 ----------
def rating(ps):  return 50 + 18 * math.log(ps / 140.0)      # 阵容评级 R
def win_rate(r): return min(0.72, max(0.25, 1 / (1 + math.exp(-(r - 50) / 8))))
def demand(w, p): return 12000 + 9000 * (w - 0.5) - 70 * (p - 75)  # 每场需求

def profit(ps, ops, p=P_NOW):
    """给定薪资档 / 运营档 / 票价，返回当年利润与估值"""
    w = win_rate(rating(ps))
    d = max(0, demand(w, p))
    ticket = GAMES * d * p / 1e6                          # 票务收入（M$）
    extra = GAMES * d * 22 / 1e6 * OPS_GAIN[ops]          # 每人附加收入 × 运营放大
    rev = ticket + extra + LEAGUE                         # 年收入
    return rev - C_FIXED - ps - ops, REV_MULT * rev       # 利润, 估值

# ---------- 3. 动态规划（倒推） ----------
states = [(ps, ops) for ps in PS_LEVELS for ops in OPS_LEVELS]
def step_cost(a, b):                                       # 换档成本（薪资档移动）
    if a == b: return 0.0
    return COST_UP if b > a else COST_DOWN

B = {}                                                     # 第 5 年末：接估值
for s in states:
    B[s] = profit(*s)[1]
for t in range(YEARS - 1, -1, -1):                         # 第 4→0 年倒推
    B_new = {}
    for s in states:
        ps = s[0]
        best = -1e18
        for ps2 in PS_LEVELS:
            if abs(PS_LEVELS.index(ps2) - PS_LEVELS.index(ps)) > 1: continue
            a = (ps2, s[1])
            val = profit(*s)[0] - step_cost(ps, ps2) + B[a] / (1 + RATE)
            best = max(best, val)
        B_new[s] = best
    B = B_new

# ---------- 4. 输出 ----------
print("=" * 56)
print("2026 MCM D 题 · 问题二 · 动态规划（5 年）")
print("=" * 56)
start = (160, 8)
print(f"现状状态  : 薪资 {start[0]} M$ + 运营 {start[1]} M$")
print(f"最优效用  : U* = {B[start]:.1f} M$（5 年利润现值 + 末年估值现值）")
print(f"末年估值  : {profit(210, 20)[1]:.1f} M$（顶档阵容）")
print("=" * 56)
print("结论：前 3 年守住中档（160/8），第 4~5 年集中升档冲顶")
`;

function flowGateHTML(gate){

  }).join('');

    '<div class="other-row" id="other-row-'+key+'"><input id="other-input-'+key+'" type="text" placeholder="输入你的想法…" onkeydown="if(event.key===\'Enter\')submitOtherInput(\''+key+'\')"><button class="abtn pri" onclick="submitOtherInput(\''+key+'\')">发送</button></div>'+
    '<p class="choice-note">不想现在决定可以跳过；也可以点「我有问题」先问一句。</p>';

function pushFlowGate(gate){
  gate.key=gate.key||('g'+(SEQ++));
  FLOW_GATE=gate;
  if(gate.phase) phase=gate.phase; else phase='interaction';
  var node={who:'ai',step:gate.step,html:gate.html+flowGateHTML(gate)};
  pushMsg(node.who, node.html);
  rememberFlow(gate.label||gate.key, function(){ pushFlowGate(gate); });
  applyChips([], gate.hint||'选一个选项即可继续，也可以跳过');
  setStage(gate.phaseText||'等待：选择或跳过', false);
}
function toggleOtherInput(key){ var r=$('other-row-'+key); if(r) r.classList.add('on'); var i=$('other-input-'+key); if(i) i.focus(); }
function cancelOtherInput(key){ var r=$('other-row-'+key); if(r) r.classList.remove('on'); }
function submitOtherInput(key){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var i=$('other-input-'+key); var t=i?i.value.trim():'';
  if(!t){ toast('请先输入'); return; }
  pushMsg('me','<p>'+esc(t)+'</p>');
  FLOW_PREFS[g.pref||g.key]=t; FLOW_GATE=null;
  pushMsg('ai','<h4>已记下你的想法</h4><p>我会按「'+esc(t)+'」继续。</p>'+NEXT_TAIL);
  thinking(function(){ (g.onCustom||continueAfterFlow)(t); });
}
function chooseFlow(key,i){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var o=g.options[i]; if(!o) return;
  var box=$('gate-'+key); if(box){ box.querySelectorAll('.abtn').forEach(function(b){b.classList.add('used');}); }
  FLOW_PREFS[g.pref||g.key]=o.value||o.t;
  pushMsg('me','<p>'+esc(o.t)+'</p>');
  FLOW_GATE=null;
  thinking(function(){ (o.run||continueAfterFlow)(); });
}
function skipFlow(key){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var box=$('gate-'+key); if(box){ box.querySelectorAll('.abtn').forEach(function(b){b.classList.add('used');}); }
  FLOW_PREFS[g.pref||g.key]='skipped';
  pushMsg('me','<p>跳过这一步</p>');
  FLOW_GATE=null;
  thinking(function(){ (g.onSkip||continueAfterFlow)(); });
}
function continueAfterFlow(){
  if(phase==='needFocus') return doHypothesis();
  if(phase==='needParameter') return pushLab();
  if(phase==='needResultAngle') return askSatisfaction();
  if(phase==='needSatisfaction') return finishResultDecision('满意');
  if(phase==='needPaperStyle') return askFigureSelection();
  if(phase==='needFigureSelection') return doPaper();
  doAnalysis();
}

function userTurn(v){
  if(FLOW_PAUSED){
    if(/继续当前流程|继续流程|继续$/.test(v)){ resumeQuestionPause(); return; }
    replyInPlace(offTopicAnswer(v)); return;
  }
  if(FLOW_GATE){
    if(/跳过|略过|不用了|先不做/.test(v) && !/不跳过/.test(v)){ skipFlow(FLOW_GATE.key); return; }
    var hit=-1;
    for(var i=0;i<FLOW_GATE.options.length;i++){ if(v.indexOf(FLOW_GATE.options[i].t)>=0){ hit=i; break; } }
    if(hit>=0){ chooseFlow(FLOW_GATE.key,hit); return; }
    if(/继续|下一步|开始|进入|接着|来吧|走吧/.test(v)){ (FLOW_GATE.onSkip||continueAfterFlow)(); return; }
    if(isQuestion(v)){ replyInPlace(offTopicAnswer(v)); return; }
    replyInPlace(offTopicAnswer(v)); return;
  }
  if(phase==='picking'){ replyInPlace('<h4>这一步需要你拍板</h4><p>点上方候选卡片右侧的「选它」，模型由你选，AI 不替你决定。</p>'+NEXT_TAIL); return; }
  if(phase==='lab'){
    if(/跑完|运行完|好了|完成|出来了/.test(v)){ replyInPlace('<h4>运行按钮在右侧代码抽屉里</h4><p>点「▶ 运行代码」就能在当前页跑，结果会出现在对话框，我接着解读。</p>'+NEXT_TAIL); return; }
    if(isQuestion(v)){ replyInPlace(offTopicAnswer(v)); return; }
    replyInPlace('<h4>还在等你的运行结果</h4><p>点右侧代码抽屉里的「▶ 运行代码」。</p>'+NEXT_TAIL); return;
  }
  if(phase==='upload'){if(/已上传|上传|跑完|带回来|回来了/.test(v)){ didUpload([P9_QUIZ[qi].file]); return; }replyInPlace('<h4>还在等你的结果文件</h4><p>点上方「上传结果文件」，或回一句「已上传」。</p>'+NEXT_TAIL); return; }
  if(phase==='adjust'){ doFix(v); return; }
  if(isQuestion(v) && !wantsAdvance(v)){ replyInPlace(offTopicAnswer(v)); return; }
  if(/模型|方案|选它|FVM|有限体积/.test(v)){ doPicks(); return; }
  if(/代码|main\.py/.test(v)){ pushLab(); return; }
  if(/运行|动画|可视化|演示/.test(v)){ afterRun(); return; }
  if(/问题四|半径|收缩|动边界|Landau/.test(v)){ doBoundary(); return; }
  if(/问题三|达标|结果|讨论/.test(v)){ doResult(); return; }
  if(/论文|初稿|摘要|生成论文|风格/.test(v)){ askPaperStyle(); return; }
  advance();
}
function advance(){
  if(phase==='intro'){ doAnalysis(); return; }
  if(phase==='hypothesis'){ doPicks(); return; }
  if(phase==='modelChosen'){ askParameter(); return; }
  if(phase==='viz'){ askResultAngle(); return; }
  if(phase==='result'){ doBoundary(); return; }
  if(phase==='boundary'){ askPaperStyle(); return; }
  if(phase==='paper'){ doPaper(); return; }
  doAnalysis();
}

function auditResult(names){
  var ext=/\.(xlsx|xls|csv|txt|zip)$/i;
  for(var i=0;i<names.length;i++){
    var n=names[i]||'';
    if(!ext.test(n)) return {kind:'fmt',name:n};
    if(/缺|missing|wrong|bad|error|err/i.test(n)) return {kind:'col',name:n};
  }
  return null;
}

function doFix(v){

  var head=['运行层面问题','数值异常，通常是假设或单位出错','按你描述的方向改了一版'];
  thinking(function(){
    pushMsg('ai','<h4>'+head[kind]+'</h4>'+

    <h1>一支球队的<b>战绩</b>与<b>财务</b>如何互相驱动——从薪资到胜率、从胜率到利润与估值
      <small>球队业主一方面要用薪资招募阵容换取战绩，另一方面要靠票房、赞助与场馆把战绩变成收入；本题把「阵容招募 → 战绩 → 收入 → 利润 → 估值」这条传导链写成一个可优化的动态决策模型。</small>
    </h1>

      <span class="decochip t">动态规划</span>

      <span class="decochip w">中等难度 · 3 人</span>

  <div class="hero stg">

        <h3>题目定位 <em>protoId · p9</em></h3>
        <p><b class="hl-t">对象</b>：一支职业篮球俱乐部（主场容量 <b>18000 座</b>，每赛季 <b>41 个主场</b>）。</p>
        <p><b class="hl-t">任务</b>：为球队业主设计一套随战绩与财务变化<b>动态调整</b>阵容招募与运营策略的决策模型，并量化门票定价、场馆投资等商业决策对利润与球队估值的影响。</p>
        <p class="small">标签：2026美赛D题 · 美赛ICM · 2026 · 本科 · 动态决策 · 中等难度 · 3 人</p>
      </div>
      <div class="card">
        <h3>业主面临的三类决策 <em>决策空间</em></h3>
        <p><b class="hl-t">阵容招募</b>：薪资 110~210 M$ 共五档 —— 110 / 135 / 160 / 185 / 210，对应胜率 0.368 / 0.480 / 0.575 / 0.652 / 0.713。</p>
        <p><b class="hl-t">运营投入</b>：0 / 8 / 20 M$ 三档，影响球迷体验与每人附加收入。</p>
        <p><b class="hl-t">商业决策</b>：门票定价（现状 $75）与场馆投资（扩容 / 新建）。</p>
      </div>

<!-- ===== 第二幕 · 四问关系 ===== -->
<section class="scene" id="s2" data-title="全局分析 · 二 · 四问关系链">

    <h1>问题一 <b>建现状模型</b> → 问题二 <b>做动态决策</b> → 问题三 <b>定门票价格</b> → 问题四 <b>投场馆</b>
      <small>问题一先把现状算清并排定关键驱动；问题二在薪资档 × 运营档的 15 个状态上做多期动态规划；问题三在需求曲线上找均衡票价；问题四评估场馆扩容对需求、利润与估值的整体影响。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">四问链路：现状 → 动态决策 → 定价 → 场馆</div>

        <span><i class="ln" style="background:#1e9fc4"></i>数据流</span>
      </div>
    </div>
    <canvas id="cvChain"></canvas>
  </div>

  <div class="grid3 stg">
    <div class="card">
      <h3>问题一 <em>现状与 KPI</em></h3>
      <p>建立现状收入与成本模型：收入 317.80 M$、成本 270.79 M$，得到利润 <b class="hl">47.01 M$</b> 与球队估值 <b class="hl-t">1906.8 M$</b>。</p>
      <p class="small">关键驱动排序：战绩 &gt; 薪资 &gt; 票价 &gt; 运营 &gt; 附加。</p>
    </div>
    <div class="card">
      <h3>问题二 <em>动态决策 · 15 状态 DP</em></h3>
      <p>在 5 薪资档 × 3 运营档共 15 个状态上做多期动态规划，得到随时间推进的最优决策路径。</p>
      <p class="small">最优路径：前 3 年维持 160 M$ / 8 M$，第 4 年升到 185 M$，第 5 年升到 210 M$ 并加码运营；末年估值 2170.8 M$。</p>
    </div>
    <div class="card">
      <h3>问题三 <em>定价优化</em></h3>

      <p class="small">票务收入最大价 $128.01、贡献利润最大价 $124.51；均衡价下贡献利润 48.62 M$、球迷效用 32.41 M$。</p>
    </div>
  </div>

  <div class="quote stg">四问共享同一套«薪资 → 胜率 → 收入 → 利润 / 估值»的传导链：谁的决策都先改战绩，再改收入，最后改利润与估值。</div>
</div>

<section class="scene" id="s1" data-title="问题一 · 一 · 战绩—财务传导链">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题一 · 现状建模与指标体系</div>
    <h1><b>薪资 → 评级 → 胜率 → 收入 → 利润 / 估值</b>：用一条传导链把竞技与财务打通
      <small>薪资 PS 决定阵容评级 R = 50 + 18·ln(PS/140)；评级经 Logistic 映射为胜率 w；胜率与票价 p 共同决定每场需求 D；需求折成收入与利润；估值 V = 6.0 × 年收入。</small>
    </h1>
    <div class="decochips">
      <span class="decochip t">战绩 ↔ 财务传导链</span>
      <span class="decochip t">41 个主场</span>
      <span class="decochip g">估值倍数 6.0</span>
      <span class="decochip w">现状：薪资 160 · 票价 $75</span>
    </div>
  </div>

  <div class="hero stg">
    <div class="heroleft">
      <div class="card">
        <h3>传导链方程 <em>问题一定式</em></h3>
        <div class="formula"><span class="c">R</span> = 50 + 18·ln(PS/140)

<span class="c">w</span> = 1/(1+exp(−(R−50)/8))，∈ [0.25, 0.72]

<span class="c">D(p)</span> = 12000 + 9000(w−0.5) − 70(p−75)

<span class="y">利润</span> = 收入 − 成本，V = 6.0 × 年收入</div>
        <p class="small" style="margin-top:8px">链条自左向右单向传导：薪资 → 阵容评级 → 胜率 → 每场需求 → 收入 → 利润；估值再由年收入按 6.0 倍放大。</p>
      </div>
      <div class="card">
        <h3>现状参数 <em>薪资 160 · 运营 8 · 票价 $75</em></h3>
        <p>主场容量 <b class="hl-t">18000</b> 座 · 每赛季 <b class="hl-t">41</b> 个主场 · 联盟分成 <b class="hl-t">130</b> M$</p>
        <p>固定成本 <b class="hl-t">95</b> M$ · 每人附加收入 <b class="hl-g">$22</b> · 每人边际成本 <b class="hl">$15</b></p>
        <p class="small">现状每场需求 <b class="hl-t">12671</b> 座、上座率 <b class="hl-t">70.4%</b>；估值 V = 6.0 × 317.80 = <b class="hl-g">1906.8</b> M$。</p>
      </div>
    </div>
    <div class="heroright">
      <div class="herolabel">传导链 · 竞技端 → 财务端</div>
      <div class="herosublabel">现状：薪资 160 M$<br>V = 6.0 × 年收入</div>
      <canvas id="cvFlow"></canvas>
    </div>
  </div>

  <div class="grid4 stg">
    <div class="kpi"><div class="k">阵容评级 R</div><div class="v">52.40</div><div class="sub">R = 50 + 18·ln(PS/140)</div></div>

    <div class="kpi g"><div class="k">每场需求 D</div><div class="v">12671 <u>座</u></div><div class="sub">上座率 70.4%</div></div>
    <div class="kpi w"><div class="k">估值 V</div><div class="v">1906.8 <u>M$</u></div><div class="sub">V = 6.0 × 年收入</div></div>
  </div>

  <div class="quote stg">问题一关键：把竞技端（<b class="hl-t">薪资 → 评级 → 胜率</b>）与财务端（<b class="hl-t">需求 → 收入 → 利润 → 估值</b>）用一条可辨识的传导链打通；现状利润 <b>47.01</b> M$、估值 <b class="hl-g">1906.8</b> M$，任何一端变动都会沿链条传到利润。</div>
</div>

    </h1>
  </div>

<section class="scene" id="s3" data-title="问题一 · 三 · 关键驱动辨识">
<div class="wrap">
  <div class="stg">

      <small>对现状模型分别施加同等强度的扰动，观察利润的相对变化；按利润变化量排序为 战绩 &gt; 薪资 &gt; 票价 &gt; 运营 &gt; 附加。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">关键驱动辨识：扰动后利润变化（M$，零轴为现状 47.01 M$）</div>
      <div class="legend">
        <span><i style="background:#12a594"></i>正向驱动</span>
        <span><i style="background:#b8543a"></i>负向驱动</span>
      </div>
    </div>
    <canvas id="cvSens"></canvas>
    <p class="note" style="margin-top:8px">同等强度扰动：战绩 w +0.05 → 利润 <b>58.15</b>（+11.14，+23.7%）；薪资 PS +10% → <b>42.46</b>（−4.54，−9.7%）；票价 p +10% → <b>48.98</b>（+1.97，+4.2%）；运营投入 8→20 → <b>45.28</b>（−1.73，−3.7%）；附加收入 +10% → <b>48.15</b>（+1.14，+2.4%）。</p>
  </div>

  <div class="card stg">
    <h3>驱动解读 <em>谁最值得优先调整</em></h3>
    <p>胜率每提高 0.05 即可带来 <b class="hl-t">+23.7%</b> 的利润，是唯一的<b class="hl-t">一级驱动</b>：它同时抬高每场需求与上座率，且不增加薪资以外的大额固定支出。</p>
    <p>薪资是按档位可调的成本杠杆，票价是可调的收入杠杆，二者方向相反——薪资 +10% 使利润 <b class="hl">−9.7%</b>，票价 +10% 使利润 <b class="hl-t">+4.2%</b>。</p>
    <p class="small">运营投入（8→20）与附加收入（+10%）的量级最弱，属于二级驱动，适合在主杠杆确定后做微调。</p>
  </div>

  <div class="stg">

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmt(v,dec){ if(dec===undefined)dec=0;
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function setupCanvas(cv){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520);
  var h=parseFloat(cv.style.height)||cv._h||260;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  return {g:g,w:w,h:h,dpr:dpr};
}
function tag(g,x,y,text,col,align){
  g.font='600 11px "PingFang SC",system-ui,sans-serif';
  var tw=g.measureText(text).width;
  var bx=(align==='right')?(x-tw-10):(x-2);
  g.fillStyle='rgba(255,255,255,.95)';
  g.fillRect(bx,y-9,tw+10,18);
  g.strokeStyle='#d9e9e9'; g.lineWidth=1; g.strokeRect(bx+.5,y-8.5,tw+9,17);
  g.fillStyle=col; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text,bx+5,y);
}
function tagDark(g,x,y,text,col,align){
  g.font='600 11px "PingFang SC",system-ui,sans-serif';
  var tw=g.measureText(text).width;
  var bx=(align==='right')?(x-tw-8):(x-4);
  g.fillStyle='rgba(11,46,54,.82)';
  g.fillRect(bx,y-9,tw+10,18);
  g.fillStyle=col; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text,bx+5,y);
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}

/* ===== 动画引擎 ===== */
var activeAnims=[];
function stopAllAnims(){
  activeAnims.forEach(function(a){ if(a._raf) cancelAnimationFrame(a._raf); a._raf=null; });
  activeAnims=[];
}
function runAnim(fn){
  var handle={_raf:null,_alive:true};
  activeAnims.push(handle);
  function loop(t){ if(!handle._alive) return; fn(t); handle._raf=requestAnimationFrame(loop); }
  handle._raf=requestAnimationFrame(loop);
  return handle;
}

/* ===== 第一幕 · 传导链 hero ===== */
var flowT0=null;
function drawFlow(t){
  var cv=$('#cvFlow'); if(!cv)return;
  if(cv._h===undefined) cv._h=320;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-flowT0)/1000;

  var bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#0b2e36'); bg.addColorStop(.55,'#0e3a44'); bg.addColorStop(1,'#0b2e36');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  for(var i=0;i<44;i++){
    var sx=((i*97.13)%w), sy=((i*53.7)%(h-20))+10;
    var tw=0.5+0.5*Math.sin(tN*1.1+i*0.6);
    g.fillStyle='rgba(205,238,233,'+(0.05+0.16*tw)+')';
    g.fillRect(sx,sy,1.5,1.5);
  }

  var nodes=[
    {k:'薪资 PS',    v:'160 M$',    s:''},
    {k:'阵容评级 R', v:'52.40',     s:''},
    {k:'胜率 w',     v:'0.575',     s:'约 47.1 胜'},
    {k:'年收入',     v:'317.80 M$', s:''},
    {k:'估值 V',     v:'1906.8 M$', s:''}
  ];
  var n=nodes.length, padX=10;
  var bw=Math.min(98,Math.max(44,(w-2*padX)*0.72/n));
  var gapX=Math.max(8,(w-2*padX-n*bw)/(n-1));
  var bh=66, cy=h*0.46, by=cy-bh/2;
  function nx(j){ return padX+j*(bw+gapX); }

  function flow(pts,phase,col){
    if(!pts||!pts.length) return;
    var u=((tN*0.55+phase)%1+1)%1;
    var idx=Math.max(0,Math.min(pts.length-1,Math.floor(u*(pts.length-1))));
    var p=pts[idx]; if(!p) return;
    g.beginPath(); g.arc(p[0],p[1],3.0,0,Math.PI*2);
    g.fillStyle=col; g.fill();
    g.beginPath(); g.arc(p[0],p[1],5.6,0,Math.PI*2);
    g.fillStyle=col.replace(/[\d.]+\)$/,'0.18)'); g.fill();
  }

      <small>每一年，业主只要在 15 个状态里挑一个：薪资档决定阵容质量与胜率，运营档把商品 + 赞助收入放大 1.00 / 1.07 / 1.15 倍，两者共同决定当年利润 Π 与末年估值 V。</small>

      <p><b class="hl-t">运营档 OPS</b> ∈ {0, 8, 20} M$，把商品 + 赞助收入放大 1.00 / 1.07 / 1.15 倍。</p>
      <p class="small"><b class="hl">动作约束</b>：每年每档最多移动一档（阵容重建需要时间）；<b class="hl">换档成本</b>：升档 18 M$、降档 25 M$。</p>

<!-- ===== 第二幕 · 动态规划最优路径 ===== -->
<section class="scene" id="s2" data-title="问题二 · 二 · 动态规划最优路径">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题二 · 动态决策模型</div>
    <h1>从现状 <b>160 / 8</b> 出发：前 3 年守住中档阵容，第 4、5 年集中升档冲顶
      <small>倒推求解：末年估值 V(s) 越高，越值得在前一年牺牲一点当年利润去升档；递推式把 5 年经营利润现值与末年估值现值一起最大化。</small>
    </h1>
    <div class="decochips">
      <span class="decochip t">状态 15 个</span>
      <span class="decochip t">每年各档最多移动一档</span>
      <span class="decochip g">末年估值 2170.8 M$</span>
      <span class="decochip w">U* = 1632.6 M$</span>
    </div>
  </div>

  <div class="flexrow stg">
    <div class="card" style="flex:0 0 320px">
      <h3>递推式 <em>Bellman 方程</em></h3>
      <div class="formula">F_t(sp) = max_s [ Π(s) − 换档(sp,s) + γ·F_{t+1}(s) ]

F_6(s) = V(s)          <span class="c"># 末年估值</span>

γ = 1/1.08             <span class="dim"># 折现因子</span></div>
      <p class="small" style="margin-top:8px">换档成本：升档 18 M$、降档 25 M$；业主效用 = 5 年经营利润现值 + 末年估值现值。</p>
    </div>

        <div class="ct">最优路径：当年利润（柱）+ 胜率（折线）</div>

          <span><i style="background:#12a594"></i>前 3 年 · 薪资 160</span>
          <span><i style="background:#e0a04a"></i>第 4、5 年 · 升档</span>
          <span><i class="ln" style="background:#0b6e68"></i>胜率（右轴 0~0.8）</span>
        </div>
      </div>
      <canvas id="cvPath"></canvas>
    </div>
  </div>

  <div class="grid3 stg">
    <div class="kpi"><div class="k">累计利润（5 年）</div><div class="v">208.50 <u>M$</u></div><div class="sub">47.01 + 47.01 + 47.01 + 39.23 + 28.24</div></div>
    <div class="kpi g"><div class="k">末年估值</div><div class="v">2170.8 <u>M$</u></div><div class="sub">第 5 年冲到 210 / 20</div></div>
    <div class="kpi b"><div class="k">最优业主效用 U*</div><div class="v">1632.6 <u>M$</u></div><div class="sub">5 年利润现值 + 末年估值现值</div></div>
  </div>

  <p class="note stg">最优路径的解读：<b class="hl-t">前 3 年维持高利润的中档阵容（160 / 8，47.01 M$/年）、把现金攒住</b>；在 <b class="hl-g">第 4、5 年集中升档冲顶</b>（185 / 8 → 210 / 20，各付换档 18 M$），用最小的利润代价把末年估值拉到最高的 2170.8 M$。</p>
</div>

<!-- ===== 第三幕 · 三条策略对照 ===== -->
<section class="scene" id="s3" data-title="问题二 · 三 · 三条策略对照">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题二 · 动态决策模型</div>
    <h1>三条对照策略 vs DP 最优：业主效用从 <span class="hl-t">1276.4 M$</span> 到 <span class="hl-t">1632.6 M$</span>
      <small>统一口径：5 年窗，含换档成本与末年估值。自适应反馈规则不需要未来信息，却能逼近动态规划最优解。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">四条策略的业主效用 U（M$）</div>
      <div class="legend">

        <span><i style="background:#0b6e68"></i>DP 最优路径</span>
      </div>
    </div>
    <canvas id="cvCmp"></canvas>
    <p class="note" style="margin-top:8px">DP 最优路径的业主效用 <b class="hl-t">1632.6 M$</b> 最高；自适应反馈策略 <b class="hl-t">1536.7 M$</b> 达到 DP 最优的 <b>94.1%</b>，且不需要未来信息；稳健经营累计利润最高，但业主效用垫底。</p>
  </div>

  <div class="grid3 stg">
    <div class="card">
      <h3>A 争冠冲刺 <em>顶档 210 + 高运营 20</em></h3>
      <p>5 年一直顶档高投入：当年利润最差（累计 159.97 M$），但末年估值最高（2170.8 M$），业主效用 1601.3 M$。</p>
      <p class="small">平均胜率 0.686；估值与 DP 相同，代价是 5 年经营利润的损失。</p>
    </div>
    <div class="card">
      <h3>B 稳健经营 <em>最低档 110 + 零运营</em></h3>
      <p>始终最低档零运营：累计利润最高 <b class="hl-t">257.01 M$</b>，但末年估值只有 1584.9 M$、业主效用垫底 1276.4 M$。</p>
      <p class="small">平均胜率 0.409；省钱不等于增值。</p>
    </div>
    <div class="card">

      <p>以目标胜率 0.60 为标尺滚动修正薪资档、按利润率修正运营档：业主效用 <b class="hl-t">1536.7 M$</b>，达到 DP 最优的 94.1%，且不需要未来信息。</p>
      <p class="small">累计利润 228.14 M$、平均胜率 0.575、末年估值 1968.4 M$。</p>
    </div>
  </div>

  <div class="quote stg">动态决策的价值在于「<b class="hl-t">用规则代替拍脑袋</b>」——自适应反馈规则在信息不完整时仍能逼近动态规划最优解（1536.7 / 1632.6 = 94.1%），而两条极端路线各自输掉一部分：争冠冲刺输在经营利润，稳健经营输在末年估值。</div>
</div>

<!-- ===== 第一幕 · 需求曲线与定价点 ===== -->
<section class="scene" id="s1" data-title="问题三 · 一 · 需求曲线与定价点">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题三 · 门票定价优化</div>
    <h1>一条<b>线性需求曲线</b>决定四个定价方案的取舍
      <small>单场需求 D(p) = 17921 − 70p，需求为零的价格上界 $256；门票收入、贡献利润、球迷效用三个目标都只由同一个票价 p 决定，因此四个方案落在同一条需求直线上。</small>
    </h1>
    <div class="decochips">
      <span class="decochip t">容量 18000 座</span>
      <span class="decochip t">每赛季 41 个主场</span>
      <span class="decochip g">每人附加收入 $22</span>
      <span class="decochip g">每人边际成本 $15</span>
      <span class="decochip w">现状价 $75</span>
    </div>
  </div>

  <div class="flexrow stg">
    <div class="card grow">
      <h3>需求与三个目标函数 <em>票价 p → 单场需求 D(p) → 三目标</em></h3>
      <div class="formula"><span class="c">D(p) = 17921 − 70p</span>，需求上界 $256
票务收入 = 41·D(p)·p
贡献利润 = 41·D(p)·(p + 22 − 15)
球迷效用 = 41·½·($256 − p)·D(p)</div>
      <p class="small" style="margin-top:8px">容量 18000 座、每赛季 41 个主场；需求上界 $256 由 17921 ÷ 70 得到。每人附加收入 $22 与每人边际成本 $15 之差为 $7，计入贡献利润（不含薪资与固定成本，属既定支出）。</p>
    </div>
    <div class="grow" style="max-width:440px">
      <div class="grid2">
        <div class="kpi"><div class="k">现状上座率</div><div class="v">70.4 <u>%</u></div><div class="sub">需求 12671 / 容量 18000</div></div>
        <div class="kpi b"><div class="k">现状贡献利润</div><div class="v">42.60 <u>M$</u></div><div class="sub">41·D(p)·(p+7)，$75</div></div>
        <div class="kpi b"><div class="k">现状票务收入</div><div class="v">38.96 <u>M$</u></div><div class="sub">41·D(p)·p，$75</div></div>
        <div class="kpi w"><div class="k">现状需求弹性</div><div class="v">0.414</div><div class="sub">|p·D′(p)/D(p)|，$75</div></div>
      </div>
    </div>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">需求直线 D(p) = 17921 − 70p 与四个定价点</div>
      <div class="legend">
        <span><i class="ln" style="background:#12a594"></i>需求直线</span>
        <span><i class="ln" style="background:#0b6e68"></i>容量 18000 座</span>
        <span><i class="dn" style="border-color:#146c87"></i>定价点</span>
        <span><i style="background:#eff8f7"></i>需求曲线与容量线之间</span>
      </div>
    </div>
    <canvas id="cvDemand"></canvas>
    <p class="note" style="margin-top:8px">四个方案（现状 $75 / ① $128.01 / ② $124.51 / ③ $105.72）都落在<b class="hl-t">同一条需求直线</b>上；阴影为需求曲线与容量线之间的差额座位。现状 <b class="hl-t">上座率 70.4%</b>（需求 12671 / 容量 18000），弹性 <b class="hl">0.414 &lt; 1</b> —— 需求对票价不敏感，说明现状票价偏低、还有提价空间。</p>
  </div>
</div>
</section>

<!-- ===== 第二幕 · 三目标对比 ===== -->
<section class="scene" id="s2" data-title="问题三 · 二 · 三目标对比">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题三 · 门票定价优化（三目标对比）</div>
    <h1>三目标互相拉扯：<b>票务收入</b>、<b>贡献利润</b>与<b>球迷效用</b>
      <small>把票价从 $75 推到 $124.51–$128.01，贡献利润由 42.60 M$ 抬到最高的 49.63 M$，但球迷效用从 47.02 M$ 掉到 23.51–24.82 M$；均衡价 $105.72 只让 2.0% 的利润，却把效用拉回 32.41 M$。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">四个定价方案的贡献利润与球迷效用（M$）</div>

  </div>

  <div class="grid2 stg">
    <div class="card">
      <h3>① 目标一 <em>票务收入最大</em></h3>
      <p>只看门票收入，把票价推到 <b class="hl-t">$128.01</b>、单场需求 8960 座。</p>
      <p class="small">票务收入 47.03 M$（四方案最高），但<b class="hl">上座率掉到 49.8%</b>、球迷效用降到 23.51 M$、需求价格弹性正好 1.000（收入拐点）。</p>
    </div>
    <div class="card">
      <h3>② 目标二 <em>贡献利润最大</em></h3>
      <p>票价 <b class="hl-t">$124.51</b>，单场需求 9205 座，贡献利润 <b class="hl-t">49.63 M$（全场最高）</b>，票务收入 46.99 M$。</p>
      <p class="small">作为交换，上座率 51.1%、球迷效用仅 24.82 M$，是本方案最贵的部分。</p>
      <p style="margin-top:10px;border-top:1px dashed var(--line);padding-top:10px"><b class="hl-t">③ 目标三 · 均衡</b> 在贡献利润上只让 <b class="hl">2.0%</b>（49.63 → 48.62 M$），却把球迷效用从 24.82 抬到 <b class="hl-g">32.41 M$</b>、上座率从 51.1% 抬到 <b>58.4%</b>（均衡价 $105.72）。</p>
    </div>
  </div>

  <div class="quote stg">现状价 $75 的贡献利润 <b>42.60 M$</b> 是四个方案里<b class="hl">最低的</b>，说明现行定价明显低于最优区间 —— 提价是本题最直接的价值来源。</div>
</div>
</section>

<!-- ===== 第三幕 · 定价平台区与推荐价 ===== -->
<section class="scene" id="s3" data-title="问题三 · 三 · 定价平台区与推荐价">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题三 · 门票定价优化（平台区与推荐价）</div>
    <h1>$106–$128 是一条<b>利润平台区</b>：定价对利润不敏感，对上座率与球迷效用高度敏感
      <small>贡献利润曲线在 $106–$128 之间近乎平坦，整段最大差异仅约 2.0%；球迷效用曲线则随票价单调下降。取偏低一侧的均衡价 $105.72，用约 2.0% 的利润让步换取球迷效用 +30.6%、上座率 +7.3 个百分点。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">贡献利润曲线（平台区 $106–$128）与球迷效用曲线</div>
      <div class="legend">
        <span><i class="ln" style="background:#12a594"></i>贡献利润 M$</span>
        <span><i class="ln" style="background:#e0a04a"></i>球迷效用 M$</span>
        <span><i style="background:#e8f5fa"></i>利润平台区 $106–$128</span>
      </div>
    </div>
    <canvas id="cvPlateau"></canvas>
    <p class="note" style="margin-top:8px">在 <b class="hl-t">$106–$128</b> 的整段宽区间内，贡献利润最大差异仅约 <b class="hl-t">2.0%</b>；定价对利润不敏感、对上座率与球迷效用高度敏感。推荐均衡价 <b class="hl-t">$105.72</b>：贡献利润 48.62 M$、球迷效用 32.41 M$。</p>
  </div>

  <div class="grid3 stg">
    <div class="kpi b"><div class="k">平台区宽度</div><div class="v">$22.29</div><div class="sub">$128.01 − $105.72</div></div>
    <div class="kpi"><div class="k">平台内利润差异</div><div class="v">2.0 <u>%</u></div><div class="sub">$106–$128 整段</div></div>
    <div class="kpi g"><div class="k">球迷效用提升</div><div class="v">+30.6 <u>%</u></div><div class="sub">24.82 → 32.41 M$</div></div>
  </div>

  <div class="note stg">推荐定价策略的完整表述：<b class="hl-t">在 $106–$128 区间内取偏低价 $106，既保住 48.6 M$ 的贡献利润，又比利润最大价多留下 7.3 个百分点的上座率和 +30.6% 的球迷效用</b>。解析解：贡献利润最大价 p* = (A1 − 70·每人边际贡献) / (2·70) = $124.51；均衡价 p* = (A1·(1−λ) − 70·7) / (2·70 − 70·λ)，λ = 0.25 → $105.72。</div>
</div>

<script>
(function(){

var $=function(s,r){return (r||document).querySelector(s);};

}

  g.fillStyle=col; g.textAlign='left'; g.textBaseline='middle';

var dT0=null;
function drawDemand(t){

<!-- ===== 第一幕 · 投资前后的球队基本面 ===== -->
<section class="scene" id="s1" data-title="问题四 · 一 · 投资前后的球队基本面">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题四 · 场馆投资与长期价值</div>
    <h1>一支争冠球队要不要花 <b>420 M$</b>（自付 168 M$）建新馆？
      <small>评估基准为争冠态：胜率 w = 0.713（薪资 210 M$ + 高运营），定价采用问题三推荐均衡价 $105.72，估值口径 V = 6.0 × 年收入。新馆把容量从 18000 提到 21500 座，每场需求上移 +7500 座。</small>
    </h1>
    <div class="decochips">
      <span class="decochip t">总投资 420 M$</span>
      <span class="decochip t">球队出资 168 M$</span>
      <span class="decochip g">容量 18000 → 21500 座</span>
      <span class="decochip w">需求上移 +7500 座/场</span>
    </div>
  </div>

  <div class="flexrow stg">
    <div class="card grow">
      <h3>投资方案清单 <em>PPP 融资结构</em></h3>
      <table class="tb">
        <tr><th>项目</th><th class="num">数值</th></tr>
        <tr><td>总投资</td><td class="num">420 M$</td></tr>
        <tr class="on"><td>球队自有出资（40%）</td><td class="num">168 M$</td></tr>
        <tr><td>公共部门分担（60%）</td><td class="num">420 − 168 = 252 M$</td></tr>
        <tr><td>场馆容量</td><td class="num">18000 → 21500 座</td></tr>
        <tr><td>新增每场需求</td><td class="num">+7500 座</td></tr>
        <tr><td>每人附加收入</td><td class="num">22 → 30 $</td></tr>
        <tr><td>年运营成本增量</td><td class="num">+14 M$</td></tr>
      </table>
      <p class="small" style="margin-top:8px">球队仅需自付 40%，公共部门分担 60% —— 这是美国职业体育场馆常见的 <b class="hl-t">PPP 融资安排</b>，它把球队的实际出资压到 168 M$，也让后面「经营口径 NPV」的分母更小。</p>
    </div>

    <div class="canvasbox grow">
      <div class="cvtop">
        <div class="ct">现状场馆 vs 新馆：五项基本面（每组按本组最大值归一化）</div>

          <span><i style="background:#8aa3aa"></i>现状场馆</span>
          <span><i style="background:#12a594"></i>新馆</span>
          <span><i style="background:#e0a04a"></i>估值项</span>
        </div>
      </div>
      <canvas id="cvBefore"></canvas>
      <p class="note" style="margin-top:8px">五项全面上移：每场需求 11771 → 19271（+7500 座）、上座率 65.4% → 89.6%（+24.2 个百分点）、年收入 368.08 → 413.67（+45.59）、年利润 35.84 → 62.82（+26.98）、球队估值 2208.46 → 2482.03（+273.57）。</p>
    </div>
  </div>

  <div class="grid4 stg">
    <div class="bigkpi">
      <div class="bk-k">总投资</div>
      <div class="bk-v" data-cnt="420" data-dec="0">0<span class="bk-u">M$</span></div>
      <div class="bk-sub">公共部门分担 60%</div>
    </div>

      <div class="bk-k">球队出资</div>

      <div class="bk-sub">总投资的 40%</div>
    </div>
    <div class="bigkpi">
      <div class="bk-k">增量年利润</div>

<!-- ===== 第二幕 · 15 年增量现金流与累计 NPV ===== -->
<section class="scene" id="s2" data-title="问题四 · 二 · 15 年增量现金流与累计 NPV">
<div class="wrap">
  <div class="stg">
    <div class="kicker">NPV 推导 · 15 年评估期 · 折现率 7%</div>
    <h1>15 年增量现金流现值 <span class="hl-t">245.75 M$</span>，扣掉出资 168 M$ 得经营口径 NPV <span class="hl-t">+77.75 M$</span>
      <small>每年增量现金流 +26.98 M$（第 0 年为初始出资 −168 M$）；按 7% 折现、15 年年金系数 9.108，累计折现现金流从 −168 起步逐年抬升，到第 15 年恰好落在 +77.75 M$。</small>
    </h1>
  </div>

  <div class="flexrow stg">
    <div class="card grow">
      <h3>NPV 与估值增量 <em>核心两式</em></h3>
      <div class="formula">年增量现金流   ΔCF = 26.98 M$
年金系数       A(7%,15) = 9.108
现值           PV = 26.98 × 9.108 = 245.75 M$
净现值         NPV = 26.98 × 9.108 − 168 = <span class="c">+77.75</span> M$
估值增量       ΔV = 6.0 × 45.59 = <span class="y">273.57</span> M$
静态回收期     = 6.2 年</div>
      <p class="small" style="margin-top:8px">年收入增量 45.59 M$ 经 6 倍估值乘数放大为 <b class="hl-g">273.57 M$</b> 的球队估值增量。</p>
    </div>

    <div class="canvasbox grow">
      <div class="cvtop">
        <div class="ct">每年增量现金流（柱）与累计折现现金流（线）</div>
        <div class="legend">
          <span><i style="background:#146c87"></i>每年增量现金流 +26.98</span>
          <span><i style="background:#b8543a"></i>第 0 年出资 −168</span>
          <span><i class="ln" style="background:#12a594"></i>累计折现现金流</span>
          <span><i class="ln" style="background:#e0a04a"></i>NPV = +77.75</span>
        </div>
      </div>
      <canvas id="cvNpv"></canvas>
      <p class="note" style="margin-top:8px">横轴为第 0 ~ 15 年；折现率 7%、年金系数 9.108。累计折现现金流约在评估期中段穿越 0 轴，第 15 年到达 <b class="hl-t">+77.75 M$</b>。</p>
    </div>
  </div>

  <div class="grid3 stg">
    <div class="kpi"><div class="k">15 年增量现金流现值</div><div class="v">245.75 <u>M$</u></div><div class="sub">26.98 × 9.108</div></div>
    <div class="kpi b"><div class="k">球队出资</div><div class="v">168 <u>M$</u></div><div class="sub">总投资的 40%</div></div>
    <div class="kpi w"><div class="k">经营口径 NPV</div><div class="v">+77.75 <u>M$</u></div><div class="sub">245.75 − 168</div></div>
  </div>

  <div class="note stg">估值增量（<b class="hl-g">+273.57 M$</b>）远大于经营口径 NPV（<b class="hl-t">+77.75 M$</b>）：场馆投资的价值主体是<b>资产增值</b>，而不是当年现金流。</div>
</div>
</section>

<!-- ===== 第三幕 · 敏感性分析与稳健性 ===== -->
<section class="scene" id="s3" data-title="问题四 · 三 · 敏感性分析与稳健性">
<div class="wrap">
  <div class="stg">
    <div class="kicker">敏感性分析 · 稳健性与保本门槛</div>
    <h1>需求上移是<span class="hl-t">第一敏感变量</span>：同一方案，NPV 从 +210.36 M$ 一直摆到 −81.79 M$
      <small>六个情景围绕基准 NPV +77.75 M$ 左右展开。乐观（+10500 座）与悲观（+4500 座）之间的落差最大；造价超支 20% 与折现率变动只带来中等幅度收缩。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">增量 NPV 龙卷风图（中线 = 基准 +77.75 M$，左右展开）</div>
      <div class="legend">
        <span><i style="background:#12a594"></i>需求情景</span>
        <span><i style="background:#1e9fc4"></i>折现率情景</span>
        <span><i style="background:#e0a04a"></i>造价情景</span>
        <span><i class="ln" style="background:#0b6e68"></i>基准中线 +77.75</span>
      </div>
    </div>
    <canvas id="cvTornado"></canvas>
    <p class="note" style="margin-top:8px">横轴 −150 ~ +250 M$；中线＝基准情景 NPV <b class="hl-t">+77.75 M$</b>；红色虚线为 0 轴（保本线）。六根条由动画逐条展开。</p>
  </div>

  <div class="grid3 stg">
    <div class="card">
      <h3>① 需求上移 <em>第一敏感变量</em></h3>
      <p>乐观情景增量年利润 41.54 M$、经营口径 NPV <b class="hl-t">+210.36 M$</b>；悲观情景只有 9.47 M$ 与 <b class="hl">−81.79 M$</b>。</p>
      <p class="small">同一变量的两个取值，把结论从「很赚」一路推到「亏损」，跨度远大于其他变量。</p>
    </div>
    <div class="card">
      <h3>② 造价与折现率 <em>弹性有限</em></h3>
      <p>造价超支 20% 只把 NPV 从 77.75 压到 <b class="hl-g">44.15 M$</b>；折现率升至 9% 为 <b class="hl-t">+49.50 M$</b>。</p>
      <p class="small">折现率降至 5% 也只升到 +112.07 M$。二者都在基准附近小范围摆动，不改变可行结论。</p>
    </div>
    <div class="card">
      <h3>③ 保本门槛与稳健性 <em>安全边际 30%</em></h3>
      <p>需求上移 ≥ <b class="hl-t">5775 座/场</b>即可覆盖新增运营成本与 168 M$ 球队出资；基准 +7500 座，安全边际 <b>30%</b>。</p>
      <p class="small">悲观情形经营 NPV 虽为 −81.79 M$，但估值增量 +157.40 M$ 完全抵消，综合净收益仍为 <b class="hl-g">+75.61 M$</b>。</p>
    </div>
  </div>

  <div class="quote stg">结论：建议<b class="hl-t">分期建设</b>，以「首年上座率是否达到 89%」作为继续投入的触发条件；场馆投资在<b class="hl-t">基准与乐观</b>情景下均可行。</div>
</div>
</section>

  return handle;
}

/* ===== 第一幕 · 现状 vs 新馆 成对条形 ===== */
var bfT0=null;
var BF=[
  {k:'每场需求 (座)', a:11771,   b:19271,   dec:0},
  {k:'上座率 (%)',    a:65.4,    b:89.6,    dec:1},
  {k:'年收入 (M$)',   a:368.08,  b:413.67,  dec:2},
  {k:'年利润 (M$)',   a:35.84,   b:62.82,   dec:2},
  {k:'球队估值 (M$)', a:2208.46, b:2482.03, dec:2, gold:true}
];
function drawBefore(t){
  var cv=$('#cvBefore'); if(!cv)return;
  if(cv._h===undefined) cv._h=300;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-bfT0)/1000;
  var rev=easeOutCubic(clamp(tN/1.6,0,1));
  var L=clamp(w*0.20,96,132), R=clamp(w*0.16,88,140);
  var T=22, B=24, PW=Math.max(60,w-L-R), PH=h-T-B;
  var n=BF.length, slot=PH/n, bh=12, gap=8;
  BF.forEach(function(row,i){
    var vmax=Math.max(row.a,row.b);
    var cy=T+slot*(i+.5);
    var y1=cy-(bh*2+gap)/2, y2=y1+bh+gap;
    var cA='#8aa3aa', cB=row.gold?'#e0a04a':'#12a594';
    var wA=PW*(row.a/vmax)*rev, wB=PW*(row.b/vmax)*rev;
    g.fillStyle=cA; g.globalAlpha=.9; rr(g,L,y1,wA,bh,4); g.fill(); g.globalAlpha=1;
    g.fillStyle=cB; g.globalAlpha=.92; rr(g,L,y2,wB,bh,4); g.fill(); g.globalAlpha=1;
    g.fillStyle=row.gold?'#8a6313':'#0b2e36';
    g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='right'; g.textBaseline='middle';
    g.fillText(row.k, L-8, cy);
    if(rev>0.85){
      tag(g, L+wA+8, y1+bh/2, row.a.toFixed(row.dec), '#57727c');
      tag(g, L+wB+8, y2+bh/2, row.b.toFixed(row.dec), row.gold?'#8a6313':'#0b6e68');
    }
  });
}
function startBefore(){ bfT0=performance.now(); runAnim(function(t){ drawBefore(t); }); }

/* ===== 第二幕 · 增量现金流柱 + 累计折现现金流线 ===== */
var npvT0=null;
var NPVC0=-168, NPVDELTA=26.98, NPVBASE=77.75;
var NPVCUM=[];
(function(){
  for(var k=0;k<=15;k++){
    NPVCUM.push(NPVC0+NPVDELTA*(1-Math.pow(1.07,-k))/0.07);
  }
  NPVCUM[15]=NPVBASE;
})();
function drawNpv(t){
  var cv=$('#cvNpv'); if(!cv)return;
  if(cv._h===undefined) cv._h=300;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-npvT0)/1000;
  var rev=easeOutCubic(clamp(tN/2.0,0,1));
  var L=clamp(w*0.07,30,54), R=clamp(w*0.05,20,42);
  var T=26, B=44, PW=Math.max(60,w-L-R), PH=h-T-B;
  var ymin=-190, ymax=200;
  function X(k){return L+PW*k/15;}
  function Y(v){return T+PH*(1-(v-ymin)/(ymax-ymin));}
  g.font='11px "PingFang SC",system-ui,sans-serif';
  [-150,-100,-50,0,50,100,150,200].forEach(function(v){
    var yy=Y(v);
    g.strokeStyle=(v===0)?'#cfe4e4':'#eaf4f4'; g.lineWidth=(v===0)?1.3:1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v, L-6, yy);
  });
  for(var k=0;k<=15;k++){
    var xx=X(k);
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(k, xx, T+PH+16);
  }
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('年份（第 0 ~ 15 年）', L+PW/2, T+PH+32);
  g.save(); g.translate(13,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('现金流 (M$)',0,0); g.restore();

  var y0=Y(0);
  var slot=PW/15, bw=Math.max(4,slot*0.46), vy;

  /* 第 0 年：初始出资，向下红色柱 */
  var x00=X(0), yb=Y(NPVC0*rev);
  g.fillStyle='#b8543a'; g.globalAlpha=.9;
  rr(g, x00-bw/2, y0, bw, Math.max(0,yb-y0), 3); g.fill(); g.globalAlpha=1;

  /* 第 1~15 年：每年增量现金流，向上蓝色柱 */
  vy=NPVDELTA*rev;
  var yt=Y(vy);
  g.fillStyle='#146c87'; g.globalAlpha=.62;
  for(var kk=1;kk<=15;kk++){
    rr(g, X(kk)-bw/2, yt, bw, Math.max(0,y0-yt), 3); g.fill();
  }
  g.globalAlpha=1;

  /* 累计折现现金流折线 */
  var totalPts=NPVCUM.length;
  var shown=rev*(totalPts-1);
  g.strokeStyle='#12a594'; g.lineWidth=2.6; g.lineJoin='round';
  g.beginPath();
  var first=true, kk2;
  for(kk2=0;kk2<totalPts;kk2++){
    if(kk2>shown) break;
    var px=X(kk2), py=Y(NPVCUM[kk2]);
    if(first){ g.moveTo(px,py); first=false; } else g.lineTo(px,py);
  }
  if(shown<totalPts-1){
    var k0=clamp(Math.floor(shown),0,totalPts-2), frac=shown-k0;
    var xa=X(k0), ya=Y(NPVCUM[k0]), xb=X(k0+1), yb2=Y(NPVCUM[k0+1]);
    g.lineTo(xa+(xb-xa)*frac, ya+(yb2-ya)*frac);
  }
  g.stroke();

  /* 沿折线移动的高亮点（非负取模 + 下界保护） */
  if(shown>0.02){
    var u=((tN*0.45)%1+1)%1;
    var idx0=Math.floor(u*shown);
    var idx=clamp(idx0,0,totalPts-1);
    var mx=X(idx), my=Y(NPVCUM[idx]);
    g.beginPath(); g.arc(mx,my,4.2,0,Math.PI*2); g.fillStyle='#0b6e68'; g.fill();
    g.beginPath(); g.arc(mx,my,4.2,0,Math.PI*2); g.strokeStyle='#fff'; g.lineWidth=1.5; g.stroke();
  }

  /* NPV 基准水平虚线 */
  g.save(); g.setLineDash([6,4]); g.strokeStyle='#e0a04a'; g.lineWidth=1.8;
  g.beginPath(); g.moveTo(L,Y(NPVBASE)); g.lineTo(L+PW,Y(NPVBASE)); g.stroke(); g.restore();

  /* 静态回收期标记（第 6.2 年，竖向虚线） */
  g.save(); g.setLineDash([5,4]); g.strokeStyle='rgba(20,108,135,.55)'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(X(6.2),T); g.lineTo(X(6.2),T+PH); g.stroke(); g.restore();

  if(rev>0.9){
    tag(g, L+PW-4, Y(NPVBASE)-16, 'NPV = +77.75 M$', '#8a6313', 'right');
    tag(g, X(6.2)+6, T+12, '静态回收期 6.2 年', '#146c87');
  }
}
function startNpv(){ npvT0=performance.now(); runAnim(function(t){ drawNpv(t); }); }

/* ===== 第三幕 · 增量 NPV 龙卷风图 ===== */
var torT0=null;
var BASE=77.75;
var TOR3=[
  {k:'乐观 +10500 座',   v:210.36, c:'#12a594'},
  {k:'折现率降至 5%',    v:112.07, c:'#1e9fc4'},
  {k:'折现率升至 9%',    v:49.50,  c:'#146c87'},
  {k:'造价超支 +20%',    v:44.15,  c:'#e0a04a'},
  {k:'悲观 +4500 座',    v:-81.79, c:'#b8543a'},
  {k:'基准 +7500 座',    v:77.75,  c:'#0b6e68', base:true}
];
function drawTornado(t){
  var cv=$('#cvTornado'); if(!cv)return;
  if(cv._h===undefined) cv._h=300;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-torT0)/1000;
  var rev=easeOutCubic(clamp(tN/2.2,0,1));
  var L=clamp(w*0.20,100,168), R=34, T=26, B=44;
  var PW=Math.max(60,w-L-R), PH=h-T-B;
  var vmin=-150, vmax=250;
  function X(v){return L+PW*(v-vmin)/(vmax-vmin);}
  g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var vv=-150;vv<=250;vv+=50){
    var xx=X(vv);
    if(vv===0) continue;
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(vv, xx, T+PH+16);
  }
  g.fillStyle='#57727c'; g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText(0, X(0), T+PH+16);
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('增量 NPV (M$)', L+PW/2, T+PH+32);

  /* 0 轴：虚线（保本线） */
  g.save(); g.setLineDash([5,4]); g.strokeStyle='rgba(184,84,58,.55)'; g.lineWidth=1.3;
  g.beginPath(); g.moveTo(X(0),T); g.lineTo(X(0),T+PH); g.stroke(); g.restore();
  /* 基准中线 */
  g.save(); g.setLineDash([7,4]); g.strokeStyle='rgba(11,110,104,.85)'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(X(BASE),T); g.lineTo(X(BASE),T+PH); g.stroke(); g.restore();

  var n=TOR3.length, slot=PH/n, bh=Math.min(20,slot*0.5);
  TOR3.forEach(function(r,i){
    var cy=T+slot*(i+.5);
    var seg=clamp(rev*n-i,0,1);
    g.fillStyle='#0b2e36'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='right'; g.textBaseline='middle'; g.fillText(r.k, L-8, cy);
    if(r.base){
      g.fillStyle=r.c; g.globalAlpha=seg;
      rr(g, X(BASE)-4, cy-bh/2, 8, bh, 2); g.fill(); g.globalAlpha=1;
      if(seg>0.9) tag(g, X(BASE)+12, cy, '+'+r.v.toFixed(2), '#0b6e68');
      return;
    }
    var x0=X(BASE), x1=X(r.v);
    var wid=Math.abs(x1-x0)*seg;
    var tagCol=(r.c==='#b8543a')?'#b8543a':(r.c==='#e0a04a'?'#8a6313':'#0b6e68');
    g.fillStyle=r.c; g.globalAlpha=.92;
    if(r.v>=BASE) rr(g, x0, cy-bh/2, wid, bh, 4);
    else rr(g, x0-wid, cy-bh/2, wid, bh, 4);
    g.fill(); g.globalAlpha=1;
    if(seg>0.9){
      var lab=(r.v>0?'+':'')+r.v.toFixed(2);
      if(r.v>=BASE) tag(g, x1+8, cy, lab, tagCol);
      else tag(g, x1-8, cy, lab, tagCol, 'right');
    }
  });
}
function startTornado(){ torT0=performance.now(); runAnim(function(t){ drawTornado(t); }); }

/* ===== KPI count-up ===== */
var kpiStarted=false;
function startKPIs(){
  if(kpiStarted) return; kpiStarted=true;
  $$('[data-cnt]').forEach(function(el){
    var target=parseFloat(el.dataset.cnt);
    var dec=parseInt(el.dataset.dec||'0',10);
    var uspan=el.querySelector('.bk-u');
    var unitHtml=uspan?uspan.outerHTML:'';
    var t0=performance.now(), dur=1100;
    function step(tt){
      var p=clamp((tt-t0)/dur,0,1);
      el.innerHTML=fmt(target*easeOutCubic(p),dec)+unitHtml;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* ===== 调度 ===== */
var SCENES=$$('.scene'), N=SCENES.length, cur=-1;
var starters=[startBefore, startNpv, startTornado];
function goTo(i){
  i=Math.max(0,Math.min(N-1,i));
  if(i===cur) return;
  if(cur>=0) SCENES[cur].classList.remove('active');
  cur=i; stopAllAnims(); kpiStarted=false;
  var sc=SCENES[i]; sc.scrollTop=0; sc.classList.add('active');
  $('#scTitle').textContent=sc.dataset.title||'';
  $$('#dots .dot').forEach(function(d,k){ d.classList.toggle('on',k===i); });
  $('#pgNow').textContent=i+1;
  $('#prog').style.width=(N<=1?100:(i/(N-1))*100)+'%';
  $$('.wrap > *',sc).forEach(function(b){ b.classList.add('in'); });
  if(starters[i]) starters[i]();
  if(i===0) startKPIs();
}
function setReduce(v){
  document.body.classList.toggle('reduce',v);
  var b=$('#btnFx'); b.classList.toggle('on',!v); b.textContent=v?'动效 关':'动效 开';
  if(v){ $$('.wrap > *').forEach(function(e){ e.classList.add('in'); }); stopAllAnims(); }
}
function init(){
  var dots=''; for(var i=0;i<N;i++) dots+='<button class="dot" data-i="'+i+'" title="第 '+(i+1)+' 幕"></button>';
  $('#dots').innerHTML=dots; $('#pgAll').textContent=N;
  $('#dots').addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('.dot'):null; if(t) goTo(+t.dataset.i); });
  $('#btnNext').onclick=function(){ goTo(cur+1); };
  $('#btnPrev').onclick=function(){ goTo(cur-1); };
  $('#btnReplay').onclick=function(){ stopAllAnims(); kpiStarted=false; if(starters[cur]) starters[cur](); if(cur===0) startKPIs(); };
  $('#btnFx').onclick=function(){ var nv=!document.body.classList.contains('reduce'); setReduce(nv);
    if(!nv && cur>=0){ if(starters[cur]) starters[cur](); if(cur===0) startKPIs(); } };
  document.addEventListener('keydown',function(e){
    var tn=(e.target.tagName||'').toLowerCase(); if(tn==='input'||tn==='textarea') return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){ e.preventDefault(); goTo(cur+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); goTo(cur-1); }
    else if(k==='Home'){ e.preventDefault(); goTo(0); }
    else if(k==='End'){ e.preventDefault(); goTo(N-1); }
    else if(k==='r'||k==='R'){ $('#btnReplay').click(); }
    else if(k>='1'&&k<='9'&&+k<=N){ e.preventDefault(); goTo(+k-1); }
  });
  setReduce(false); goTo(0);
}
window.addEventListener('resize',function(){ if(cur>=0 && starters[cur] && !document.body.classList.contains('reduce')) starters[cur](); });
init();
})();
</script>
