<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数模演易 · 电池耗电复现</title>
<style>
:root{
  --teal-700:#0B6E68; --teal-600:#0E8F84; --teal-500:#12A594; --teal-400:#2EC4B0;
  --teal-100:#DFF4F1; --teal-50:#EFFAF8;
  --cyan-500:#17A2C4; --blue-600:#1E6FA8;
  --blue-900:#0B6E68; --blue-800:#0E8F84; --blue-700:#12A594; --blue-600:#1E6FA8;
  --blue-500:#2EC4B0; --blue-400:#4FD0C0; --blue-300:#92DED5; --blue-200:#B8E8E2; --blue-100:#DFF4F1; --blue-50:#EFFAF8;
  --amber-500:#F5A623; --red-500:#D95C45; --green-500:#2BA471;
  --bg:#F3FAFA; --card:#FFFFFF;
  --ink:#0B2E36; --ink-2:#3D6570; --ink-3:#7C99A1; --ink-4:#A9BEC2;
  --line:#DCEDEE; --line-2:#EAF5F5;
  --grad:linear-gradient(120deg,#12A594 0%,#1E9FC4 100%);
  --grad-soft:linear-gradient(120deg,#EFFAF8 0%,#EAF5F5 100%);
  --sh-1:0 2px 8px rgba(11,110,104,.06);
  --sh-2:0 10px 30px rgba(11,110,104,.09);
  --sh-3:0 20px 50px rgba(11,110,104,.14);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#B8E8E2;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#92DED5}
::-webkit-scrollbar-track{background:transparent}

/* 工作台 */
.wtop{
  background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:50
}
.wtop .wt{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.wtop .wtb{
  padding:3px 9px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);font-size:11.5px;font-weight:700;flex-shrink:0
}
.steps{display:flex;align-items:center;gap:4px;margin-left:6px;overflow-x:auto;flex-shrink:0}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-4);white-space:nowrap;padding:2px 4px;border-radius:7px;transition:.15s}
.step .n{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-4);background:#fff
}
.step.done{color:var(--blue-700)}
.step.done .n{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.step.now{color:var(--blue-800);font-weight:700}
.step.now .n{border-color:var(--blue-600);color:var(--blue-700);box-shadow:0 0 0 3px rgba(11,110,104,.16)}
.step-line{width:14px;height:1.5px;background:var(--line);flex-shrink:0}
.wtop .stag{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 10px;border-radius:999px;
  font-size:11.8px;font-weight:700;color:#8A5A00;background:#FFF6DC;border:1px solid #F4DFA8;white-space:nowrap}
.wtop .stag i{width:6px;height:6px;border-radius:50%;background:var(--amber-500);box-shadow:0 0 0 3px rgba(245,166,35,.18)}
.wtop .stag.done{color:#1E7A4F;background:#E7F6EE;border-color:#BFE6CF}
.wtop .stag.done i{background:#2FA36B;box-shadow:0 0 0 3px rgba(47,163,107,.16)}

.wbody{display:flex;gap:0;height:100vh;min-height:520px;max-width:1800px;margin:0 auto}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.stream{flex:1;overflow-y:auto;padding:22px 26px 8px;scroll-behavior:smooth}
.stream-in{max-width:860px;margin:0 auto}
.msg{display:flex;margin-bottom:20px;gap:12px}
.msg.me{flex-direction:row-reverse}
.avatar-mini{width:32px;height:32px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.msg.me .avatar-mini{background:#1a7a6a;color:#fff}
.bubble{max-width:78%;min-width:0}
.msg.me .bubble{margin-left:auto}
.bubble .txt{
  background:#fff;border:1px solid #e0ebe8;border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.8;color:var(--ink-2);
  box-shadow:0 1px 2px rgba(11,110,104,.05)
}
.msg.me .bubble .txt{background:#1a7a6a;border-color:#1a7a6a;color:#fff}
.bubble .txt h4{font-size:14.5px;font-weight:800;color:var(--ink);margin:0 0 8px}
.msg.me .bubble .txt h4{color:#fff}
.bubble .txt h4:not(:first-child){margin-top:16px}
.bubble .txt p{margin-bottom:8px}
.bubble .txt p:last-child{margin-bottom:0}
.bubble .txt ul{margin:0 0 8px 0;list-style:none}
.bubble .txt li{padding-left:16px;position:relative;margin-bottom:5px}
.bubble .txt li:before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}
.msg.me .bubble .txt li:before{background:rgba(255,255,255,.8)}
.bubble .txt .kv{color:var(--blue-700);font-weight:700}
.msg.me .bubble .txt .kv{color:#fff}
.bubble .txt .mono{font-family:Consolas,monospace;background:var(--line-2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.msg.me .bubble .txt .mono{background:rgba(255,255,255,.2);color:#fff}
.bubble .txt .formula{
  background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;padding:12px 16px;
  font-family:"Cambria Math",Georgia,serif;font-size:14.5px;color:var(--blue-900);margin:12px 0;overflow-x:auto;line-height:1.6
}
.msg.me .bubble .txt .formula{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.bubble .txt .note{
  background:#FFF8E8;border:1px solid #FBE3B8;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#8A5A00;margin:12px 0;line-height:1.7
}
.bubble .txt .next{
  margin-top:12px;padding:9px 13px;border-radius:9px;font-size:13px;line-height:1.72;
  color:var(--blue-800);background:var(--blue-50);border-left:3px solid var(--blue-500)
}
.msg.me .bubble .txt .next{background:rgba(255,255,255,.15);border-left-color:#fff;color:#fff}

.thinking{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);padding:6px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--blue-400);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.arts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.acard{
  display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:13px 16px;cursor:pointer;transition:.18s;text-align:left;box-shadow:var(--sh-1);position:relative;overflow:hidden
}
.acard:hover{border-color:var(--blue-300);transform:translateY(-2px);box-shadow:var(--sh-2)}
.acard.open{border-color:var(--blue-600);box-shadow:0 0 0 3px rgba(11,110,104,.12)}
.acard .ai{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff
}
.acard .at{flex:1;min-width:0}
.acard .at b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.acard .at span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .arrow{color:var(--blue-600);flex-shrink:0;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700}

.composer-bar{border-top:1px solid var(--line);background:#fff;padding:14px 26px 16px}
.composer-bar .cw{max-width:860px;margin:0 auto}
.composer{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);
  transition:.2s;overflow:hidden
}
.composer:focus-within{border-color:var(--blue-400);box-shadow:0 8px 28px rgba(11,110,104,.14)}
.composer textarea{
  display:block;width:100%;padding:16px 18px 6px;min-height:62px;max-height:200px;resize:none;
  font-size:15px;line-height:1.7;color:var(--ink)
}
.composer textarea::placeholder{color:var(--ink-4)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--line-2);background:#F8FCFC}
.cbar .spacer{flex:1}
.hint{font-size:12px;color:var(--ink-4)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s
}
.btn-ghost:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.btn-send{
  display:inline-flex;align-items:center;gap:7px;padding:9px 22px;border-radius:10px;
  background:var(--grad);color:#fff;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(11,110,104,.28);transition:.18s
}
.btn-send:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-send[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;margin-top:10px}
.chip{
  padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);transition:.18s;cursor:pointer
}
.chip:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.chip.on{background:var(--blue-100);border-color:var(--blue-200);color:var(--blue-800);font-weight:600}

/* 抽屉 */
.drawer{
  width:0;flex-shrink:0;border-left:1px solid var(--line);background:#fff;overflow:hidden;transition:width .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column
}
.drawer.on{width:560px}
.drawer.on.wide{width:720px}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.dh h3{font-size:15px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .sub{font-size:11.5px;color:var(--ink-3);display:block;font-weight:500;margin-top:1px}
.db{flex:1;overflow-y:auto;padding:18px;background:var(--bg)}
.db .card{margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.db .card:last-child{margin-bottom:0}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:15.5px;font-weight:700}
.card-h .grow{flex:1}
.card-b{padding:18px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.18s
}
.icon-btn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}

/* 代码 */
.code-box{
  background:#0F1B2D;border-radius:12px;overflow:hidden;font-family:"JetBrains Mono",Consolas,"Courier New",monospace
}
.code-top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#16253C;border-bottom:1px solid #21334F}
.code-top .f{font-size:12px;color:#8FA6C4}
.code-top .grow{flex:1}
.code-top button{padding:5px 10px;border-radius:7px;background:#22344F;color:#B9CBDF;font-size:11.5px;transition:.16s}
.code-top button:hover{background:#2C4363;color:#fff}
pre.code{padding:16px 18px;overflow:auto;max-height:520px;font-size:12.6px;line-height:1.75;color:#D6E4F5}
pre.code .c-kw{color:#6DD6C6}
pre.code .c-com{color:#5C7290;font-style:italic}
pre.code .c-num{color:#F5A623}
pre.code .c-str{color:#9BE0B4}

/* 动画舞台 */
.stage{
  background:linear-gradient(160deg,#0B6E68 0%,#0E8F84 100%);border-radius:var(--r);padding:16px;position:relative;overflow:hidden
}
.stage canvas{width:100%;height:auto;display:block;border-radius:10px;background:#052320}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.play{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(11,110,104,.3)}
.prog{flex:1;height:6px;border-radius:6px;background:var(--line-2);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;height:100%;background:var(--grad);border-radius:6px;width:0%;transition:width .1s linear}
.speed{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:22px;font-weight:800;color:var(--blue-800);margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--green-500);margin-top:3px}

.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th,.dtable td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left}
.dtable th{background:var(--blue-50);color:var(--blue-900);font-weight:700;position:sticky;top:0}
.dtable tbody tr:hover{background:var(--blue-50)}

.doc{padding:0}
.doc h2{font-size:19px;font-weight:800;color:var(--blue-900);margin:0 0 6px}
.doc .dc{font-size:12.5px;color:var(--ink-3);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.doc h3{font-size:15.5px;font-weight:700;margin:22px 0 10px;color:var(--ink);display:flex;align-items:center;gap:8px}
.doc h3:before{content:"";width:3px;height:15px;border-radius:2px;background:var(--grad)}
.doc p{font-size:14px;color:var(--ink-2);line-height:1.85;margin-bottom:12px}
.doc ul{margin:0 0 14px 4px;list-style:none}
.doc li{font-size:14px;color:var(--ink-2);line-height:1.85;padding-left:18px;position:relative;margin-bottom:6px}
.doc li:before{content:"";position:absolute;left:4px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.24s;z-index:200;
  box-shadow:0 8px 28px rgba(0,0,0,.24);display:flex;align-items:center;gap:8px
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){
  .drawer.on{width:440px}
}
@media(max-width:820px){
  .drawer.on{width:100%;position:fixed;inset:0 0 0 0;z-index:70}
}

/* 流程闸门 / 选项按钮 */
.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.abtn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s;cursor:pointer}
.abtn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.abtn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(11,110,104,.24)}
.abtn.pri:hover{filter:brightness(1.06);color:#fff}
.abtn.gh{background:#fff;border-color:var(--blue-200);color:var(--blue-700)}
.abtn.gh:hover{background:var(--blue-50)}
.abtn.used{opacity:.5;pointer-events:none}
.flow-gate{margin-top:12px}
.choice-note{font-size:12px;color:var(--ink-4);margin:10px 0 0;line-height:1.6}
.other-row{display:none;gap:8px;margin-top:10px;align-items:center}
.other-row.on{display:flex}
.other-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px}
.other-row input:focus{border-color:var(--blue-400)}
.picks{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pick{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;transition:.18s}
.pick:hover{border-color:var(--blue-300);background:var(--blue-50);box-shadow:var(--sh-1)}
.pick.sel{border-color:var(--blue-500);background:var(--blue-50);box-shadow:0 0 0 3px rgba(11,110,104,.13)}
.pick.dis{opacity:.45;pointer-events:none}
.pick .pk{
  flex:0 0 26px;height:26px;margin-top:2px;border-radius:8px;background:var(--blue-100);color:var(--blue-700);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px
}
.pick .pb{flex:1;min-width:0}
.pick .pb b{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.pick .pb s{display:block;text-decoration:none;font-size:12.6px;color:var(--ink-3);line-height:1.62}
.pick .pb em{display:block;font-style:normal;font-size:11.6px;color:var(--blue-600);margin-top:5px}
.pick .pgo{
  flex:0 0 auto;padding:6px 12px;border-radius:8px;background:var(--grad);color:#fff;
  font-size:12.5px;font-weight:700;box-shadow:0 2px 7px rgba(11,110,104,.22);cursor:pointer;transition:.16s
}
.pick .pgo:hover{filter:brightness(1.06)}
.pick.sel .pgo{background:#DFF4F1;color:var(--blue-700);box-shadow:none}
.run-acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.run-out{margin-top:12px;background:#0F1B2D;border-radius:10px;padding:12px 14px;font-family:Consolas,monospace;font-size:12.5px;color:#9BE0B4;white-space:pre-wrap;min-height:20px}
.run-out .lbl{display:block;color:#5C7290;font-size:10px;letter-spacing:1px;margin-bottom:6px}
.step.clickable{cursor:pointer}
.step.clickable:hover{color:var(--blue-700)}
.wtop .stag.paused{color:#7A4FB0;background:#F3ECFB;border-color:#E3D2F5}
.wtop .stag.paused i{background:#9B6DD6;box-shadow:0 0 0 3px rgba(155,109,214,.18)}

/* 顶栏流程工具（对齐原型 v2） */
.flow-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.flow-tool{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;transition:.16s
}
.flow-tool:hover{border-color:var(--teal-400);color:var(--teal-700);background:var(--teal-50)}
.flow-tool svg{width:14px;height:14px;flex:0 0 auto}
.other-btn{border-style:dashed!important;background:var(--teal-50)!important}

/* 模型对比表（对齐原型 v2） */
.model-compare{width:100%;margin-top:12px;border-collapse:collapse;font-size:12.5px}
.model-compare th,.model-compare td{padding:9px 10px;border:1px solid var(--line);text-align:left;vertical-align:top}
.model-compare th{background:var(--teal-50);color:var(--teal-700);font-weight:800}
.model-compare td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}

/* 论文风格卡片 / 图片勾选（对齐原型 v2） */
.style-list{display:grid;gap:8px;margin:12px 0}
.style-item{padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.style-item>b{color:var(--teal-700)}
.style-item>span{margin-left:8px;font-size:12px;color:var(--ink-3)}

<script>
/* =============== 工具 =============== */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var toastTimer=null;
function toast(msg){
  var t=$('toast'); t.innerHTML='<span>'+esc(msg)+'</span>'; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('on')},2200);
}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function hl(code){
  return esc(code)
    .replace(/(#[^\n]*)/g,'<span class="c-com">$1</span>')
    .replace(/\b(import|from|def|return|for|in|if|else|elif|while|with|as|class|try|except|lambda|and|or|not|None|True|False|np|pd|plt|math)\b/g,'<span class="c-kw">$1</span>')
    .replace(/('[^']*'|"[^"]*")/g,'<span class="c-str">$1</span>')
    .replace(/\b(\d+\.?\d*(?:e[+-]?\d+)?)\b/gi,'<span class="c-num">$1</span>');
}

/* 物理仿真块已移除：本题（电池耗电）为机理建模类，可视化由 5 个逐问交互演示（anim-src 模板块）承担 */

/* =============== 对话数据 =============== */
var STEPS_DATA=[
  {label:'问题分析', done:false},
  {label:'候选模型', done:false},
  {label:'生成代码', done:false},
  {label:'可视化', done:false},
  {label:'结果讨论', done:false},
  {label:'论文初稿', done:false}
];

var SCENE=0;
var USER_Q=[
  '先帮我分析电池耗电这道题',
  '温度修正因子 φ(T) 是什么？',
  '四场景的续航分别是多少？',
  '就选方案 A：能量视角 SOC 模型',
  '把代码贴出来看看',
  '运行一下，看看四场景预测',
  '怎么优化续航最有效？',
  '哪个参数对续航影响最大？',
  '生成论文初稿'
];

/* =============== UI 消息/产物 =============== */
var MSG_HISTORY=[];
function pushMsg(who, html, arts){
  const id='m-'+Date.now()+Math.random();
  const isMe=who==='me';
  const label=isMe?'我':'AI';
  const bubble='<div class="bubble"><div class="txt">'+html+'</div>'+(arts?'<div class="arts">'+arts+'</div>':'')+'</div>';
  const row='<div class="msg '+(isMe?'me':'')+'" id="'+id+'">'+
    '<div class="avatar-mini">'+label+'</div>'+bubble+'</div>';
  $('stream-in').insertAdjacentHTML('beforeend',row);
  $('stream').scrollTop=$('stream').scrollHeight;
  MSG_HISTORY.push({who,html});
  return id;
}
function thinking(callback){
  const id='m-thinking-'+Date.now();
  $('stream-in').insertAdjacentHTML('beforeend',
    '<div class="msg" id="'+id+'"><div class="avatar-mini">AI</div>'+
    '<div class="bubble"><div class="thinking"><i></i><i></i><i></i>演易正在思考…</div></div></div>');
  $('stream').scrollTop=$('stream').scrollHeight;
  setTimeout(function(){
    var el=$(id); if(el){ el.remove(); if(callback) callback(); }
  }, 700);
}

function renderSteps(now){
  MAIN_STEP=now; if(now>MAX_STEP) MAX_STEP=now;
  var labels=['问题分析','关键假设','候选模型','生成代码','可视化','结果讨论','论文初稿'];
  var html='';
  labels.forEach(function(s,i){
    var cls=i<now?'done':(i===now?'now':'');
    var can=i<=MAX_STEP;
    html+='<div class="step '+(can?('clickable '+cls):cls)+'"'+(can?' onclick="jumpStep('+i+')" title="回到这一步"':'')+'><div class="n">'+(i<now?'✓':(i+1))+'</div>'+esc(s)+'</div>';
    if(i<labels.length-1) html+='<div class="step-line"></div>';
  });
  $('w-steps').innerHTML=html;
}
function setStage(txt, done){
  $('w-stage').innerHTML='<i></i>'+esc(txt);
  $('w-stage').classList.toggle('done', done);
}

var CHIP_FNS=[];
function chips(list){
  CHIP_FNS=[];
  $('work-chips').innerHTML=(list||[]).map(function(x){
    if(typeof x==='string') x={t:x,fn:null};
    CHIP_FNS.push(x.fn||null);
    return '<button class="chip" onclick="chipAct(this)">'+esc(x.t)+'</button>';
  }).join('');
}
function chipAct(btn){
  if(isRunning){ toast('AI 正在思考，稍候'); return; }
  var idx=[].slice.call(document.querySelectorAll('#work-chips .chip')).indexOf(btn);
  var fn=CHIP_FNS[idx];
  var t=btn.textContent.trim();
  if(fn){ pushMsg('me','<p>'+esc(t)+'</p>'); fn(); }
  else { $('work-input').value=t; sendInWork(); }
}
function applyChips(list,hint){
  var arr=(list||[]).slice();
  if(hint) arr.unshift({t:hint,fn:null});
  chips(arr);
}

var PY_CODE=`# -*- coding: utf-8 -*-
"""2026 MCM Problem A：智能手机电池耗电建模
   问题一 —— 能量视角 SOC 连续时间模型 + 附件1最小二乘辨识
   数模演易 自动生成 · 可直接运行（需 numpy）
"""
import numpy as np

# ---------- 1. 模型定式 ----------
# dSOC/dt = -P_total / C * 100%  (SOC 以 % 计)
# P_total = phi(T) * (P_base + a_s*L + a_c*u + a_n*n)
# phi(T)  = 1 + 0.006*|T-25| + 0.00035*(T-25)^2
C_WH = 15.4                      # 电池额定能量（Wh）= 4000mAh * 3.85V

def phi(T):
    return 1 + 0.006 * abs(T - 25) + 0.00035 * (T - 25) ** 2

def p_total(L, u, n, T, params):
    P_base, a_s, a_c, a_n = params
    return phi(T) * (P_base + a_s * L + a_c * u + a_n * n)

def endurance_hours(L, u, n, T, params):
    """SOC 100% -> 0% 的可用时长（小时）"""
    return C_WH / p_total(L, u, n, T, params)

# ---------- 2. 附件1辨识（示意：全量最小二乘） ----------
# 附件1：25℃ 恒温箱扫描 L/u/n（归一化0~1），逐秒记录放电功率
# 线性模型 P = phi(T)*(P_base + a_s*L + a_c*u + a_n*n) 对参数线性
# -> 构造设计矩阵 [phi, phi*L, phi*u, phi*n] 求解 theta = lstsq(X, P)
def fit_params(rows):
    """rows: [(L,u,n,T,P_measured), ...] -> [P_base,a_s,a_c,a_n]"""
    X, y = [], []
    for L, u, n, T, P in rows:
        f = phi(T)
        X.append([f, f * L, f * u, f * n]); y.append(P)
    theta, *_ = np.linalg.lstsq(np.array(X), np.array(y), rcond=None)
    return theta

# 辨识结果（附件1 拟合值）
PARAMS = np.array([0.15, 1.35, 1.80, 1.10])   # P_base, a_s, a_c, a_n (W)

# ---------- 3. 问题二：四场景续航预测 ----------
SCENES = [
    ("A 轻度", 0.20, 0.10, 0.05, 25),
    ("B 中度", 0.55, 0.35, 0.40, 25),
    ("C 重度", 0.90, 0.90, 0.80, 25),
    ("D 极端", 0.70, 0.50, 0.60, 35),
]
print("=" * 60)
print("2026 MCM A 题 · 问题二 · 四场景续航预测（C = 15.4 Wh）")
print("=" * 60)
for name, L, u, n, T in SCENES:
    P = p_total(L, u, n, T, PARAMS)
    t = endurance_hours(L, u, n, T, PARAMS)
    print(f"{name}: phi({T}℃)={phi(T):.3f}  P_total={P:6.3f} W  续航={t:6.2f} h")
print("=" * 60)
print("问题三：亮度阈值(0.55->0.35)+后台网络(0.40->0.22) 联合 -> B 场景 10.30 h (+31.3%)")
`;

function pushFlowGate(gate){

function toggleOtherInput(key){ var r=$('other-row-'+key); if(r) r.classList.add('on'); var i=$('other-input-'+key); if(i) i.focus(); }
function cancelOtherInput(key){ var r=$('other-row-'+key); if(r) r.classList.remove('on'); }
function submitOtherInput(key){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var i=$('other-input-'+key); var t=i?i.value.trim():'';
  if(!t){ toast('请先输入'); return; }
  pushMsg('me','<p>'+esc(t)+'</p>');

  pushMsg('ai','<h4>已记下你的想法</h4><p>我会按「'+esc(t)+'」继续。</p>'+NEXT_TAIL);
  thinking(function(){ (g.onCustom||continueAfterFlow)(t); });
}
function chooseFlow(key,i){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var o=g.options[i]; if(!o) return;
  var box=$('gate-'+key); if(box){ box.querySelectorAll('.abtn').forEach(function(b){b.classList.add('used');}); }
  FLOW_PREFS[g.pref||g.key]=o.value||o.t;
  pushMsg('me','<p>'+esc(o.t)+'</p>');
  FLOW_GATE=null;
  thinking(function(){ (o.run||continueAfterFlow)(); });
}
function skipFlow(key){
  var g=FLOW_GATE; if(!g||g.key!==key) return;
  var box=$('gate-'+key); if(box){ box.querySelectorAll('.abtn').forEach(function(b){b.classList.add('used');}); }
  FLOW_PREFS[g.pref||g.key]='skipped';
  pushMsg('me','<p>跳过这一步</p>');
  FLOW_GATE=null;
  thinking(function(){ (g.onSkip||continueAfterFlow)(); });
}
function continueAfterFlow(){
  if(phase==='needFocus') return doHypothesis();

}

function userTurn(v){
  if(FLOW_PAUSED){
    if(/继续当前流程|继续流程|继续$/.test(v)){ resumeQuestionPause(); return; }
    replyInPlace(offTopicAnswer(v)); return;
  }
  if(FLOW_GATE){
    if(/跳过|略过|不用了|先不做/.test(v) && !/不跳过/.test(v)){ skipFlow(FLOW_GATE.key); return; }
    var hit=-1;
    for(var i=0;i<FLOW_GATE.options.length;i++){ if(v.indexOf(FLOW_GATE.options[i].t)>=0){ hit=i; break; } }
    if(hit>=0){ chooseFlow(FLOW_GATE.key,hit); return; }
    if(/继续|下一步|开始|进入|接着|来吧|走吧/.test(v)){ (FLOW_GATE.onSkip||continueAfterFlow)(); return; }
    if(isQuestion(v)){ replyInPlace(offTopicAnswer(v)); return; }
    replyInPlace(offTopicAnswer(v)); return;
  }
  if(phase==='picking'){ replyInPlace('<h4>这一步需要你拍板</h4><p>点上方候选卡片右侧的「选它」，模型由你选，AI 不替你决定。</p>'+NEXT_TAIL); return; }
  if(phase==='lab'){
    if(/跑完|运行完|好了|完成|出来了/.test(v)){ replyInPlace('<h4>运行按钮在右侧代码抽屉里</h4><p>点「▶ 运行代码」就能在当前页跑，结果会出现在对话框，我接着解读。</p>'+NEXT_TAIL); return; }
    if(isQuestion(v)){ replyInPlace(offTopicAnswer(v)); return; }
    replyInPlace('<h4>还在等你的运行结果</h4><p>点右侧代码抽屉里的「▶ 运行代码」。</p>'+NEXT_TAIL); return;
  }
  if(phase==='upload'){if(/已上传|上传|跑完|带回来|回来了/.test(v)){ didUpload([P6_QUIZ[qi].file]); return; }replyInPlace('<h4>还在等你的结果文件</h4><p>点上方「上传结果文件」，或回一句「已上传」。</p>'+NEXT_TAIL); return; }
  if(phase==='adjust'){ doFix(v); return; }
  if(isQuestion(v) && !wantsAdvance(v)){ replyInPlace(offTopicAnswer(v)); return; }
  if(/模型|方案|选它|FVM|有限体积/.test(v)){ doPicks(); return; }
  if(/代码|main\.py/.test(v)){ pushLab(); return; }
  if(/运行|动画|可视化|演示/.test(v)){ afterRun(); return; }
  if(/问题四|半径|收缩|动边界|Landau/.test(v)){ doBoundary(); return; }
  if(/问题三|达标|结果|讨论/.test(v)){ doResult(); return; }
  if(/论文|初稿|摘要|生成论文|风格/.test(v)){ askPaperStyle(); return; }
  advance();
}
function advance(){
  if(phase==='intro'){ doAnalysis(); return; }
  if(phase==='hypothesis'){ doPicks(); return; }
  if(phase==='modelChosen'){ askParameter(); return; }

function pickFile(){ var f=$('result-file'); if(f){ try{ f.click(); }catch(e){ toast('请用上方按钮上传结果文件'); } } }

/* ⑤ 结果体检：只做文件层面可见检查（格式 / 明显缺列），不下对错结论 */
function auditResult(names){
  var ext=/\.(xlsx|xls|csv|txt|zip)$/i;
  for(var i=0;i<names.length;i++){
    var n=names[i]||'';
    if(!ext.test(n)) return {kind:'fmt',name:n};
    if(/缺|missing|wrong|bad|error|err/i.test(n)) return {kind:'col',name:n};
  }
  return null;
}
function pushRecv(){
  var q=P6_QUIZ[qi];
  var names=q.files||[q.file];

  var R=q.result||{};
  var body;
  if(bad){
    body='<p>结果体检发现<b>文件结构异常</b>：'+esc(bad.name)+'（'+(bad.kind==='fmt'?'格式不符合预期':'疑似缺列')+'）。</p>'+
      '<p class="tip-line">可忽略继续，或调整后重传。</p>';

    body='<p>结果体检：<b>数值在合理范围，与问题'+q.cn+'假设吻合</b>。'+esc(R.audit||'')+'</p>';

  pushFlowGate({key:'recv',phase:'verdict',phaseText:'等待：选择走向',
    html:'<h4>结果分析 · 问题'+q.cn+'</h4>'+fileChipsHTML(names)+body+'<p>选择下一步走向：</p>',

/* ⑥ 调整：分类报错/数值/针对性，给排查建议 + 修订代码 + 回到上传 */
function doFix(v){
  var q=P6_QUIZ[qi];
  var kind=2;
  if(/报错|Traceback|KeyError|Error|崩溃|跑不通|运行不了|Exception/.test(v)) kind=0;
  else if(/偏大|偏小|不合理|不对|负数|发散|不收敛|异常|奇怪|离谱/.test(v)) kind=1;
  var head=['运行层面问题','数值异常，通常是假设或单位出错','按你描述的方向改了一版'];
  thinking(function(){
    pushMsg('ai','<h4>'+head[kind]+'</h4>'+
      '<p>下面是基于你的描述，最可能的原因与改法：</p>'+
      '<ul>'+q.fixHints[kind].map(function(h){ return '<li>'+esc(h)+'</li>'; }).join('')+'</ul>'+
      '<p>改动已写进新版代码（改动处都用 <span class="mono"># FIX</span> 标注）。</p>'+
      '<p class="next">带新版代码再跑一遍，跑完把结果文件传回来；还有问题就把新报错贴回来。</p>');
    openDrawer('code','main.py · 修订版','Python 3.10 · # FIX 标注');

      <small>屏幕亮度 L、处理器负载 u、网络活动 n 共同决定基础功耗，环境温度 T 通过温度修正因子 φ(T) 放大或缩小整机功率；功率再决定 SOC 随时间下降的快慢，最终决定从满电到自动关机的可用时长。</small>

        <p><b class="hl-t">任务</b>：建立 SOC 连续时间模型并辨识参数 → 预测四类典型场景续航 → 给出可落地的续航优化建议。</p>

        <p><b class="hl-t">附件 2 · 真实日志</b>：20 名志愿者两周的亮屏时长、负载曲线、网络状态与温度序列，以及每次充电起止 SOC 与时刻。</p>

<section class="scene" id="s2" data-title="全局分析 · 二 · 三个问题与总结的关系">

    <h1>问题一 <span class="hl-t">建模型</span> → 问题二 <span class="hl-t">做预测</span> → 问题三 <span class="hl-t">提建议</span> → 总结复盘
      <small>问题一给出模型与被辨识的参数；问题二在模型上做四场景外推并给 95% 置信区间；问题三再对模型做参数约束，量化优化收益；总结幕做灵敏度分析与结论清单。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">问题链路：模型 → 预测 → 优化 → 总结</div>

      </div>
    </div>

    <p class="note" style="margin-top:8px">四环节共享<b class="hl-t">同一套参数</b>：问题一辨识的 P_base / a_s / a_c / a_n / C 被问题二、三、总结逐层复用，形成「一次辨识、多问复用」的闭环。</p>
  </div>

  <div class="grid3 stg">
    <div class="card">
      <h3>问题一 <em>辨识</em></h3>
      <p>建立 SOC 连续时间模型，显式含 L、u、n、T 四项；用附件 1 全量拟合辨识参数，用附件 2 检验精度。</p>
      <p class="small">输出：RMSE = 0.021 SOC、R² = 0.988；日志 MAPE = 4.6%。</p>
    </div>
    <div class="card">
      <h3>问题二 <em>预测</em></h3>
      <p>预测 A 轻度 / B 中度 / C 重度 / D 极端四场景从满电到自动关机的剩余可用时间，并给 95% 置信区间。</p>

    </div>

</div>

<!-- ===== 第一幕 · 模型表达式 ===== -->
<section class="scene" id="s1" data-title="问题一 · 一 · SOC 连续时间模型">
<div class="wrap">
  <div class="stg">
    <div class="kicker">2026 美赛 A 题 · 问题一</div>
    <h1>建立 SOC 连续时间模型：<span class="hl-t">能量视角的四项耗电</span>
      <small>从能量守恒出发：SOC 下降速率等于总放电功率除以电池额定能量；总功率由屏幕、处理器、网络三项耗电叠加，再乘温度修正因子 φ(T)。</small>
    </h1>
    <div class="decochips">
      <span class="decochip t">连续时间</span>
      <span class="decochip t">显式含 4 项</span>
      <span class="decochip g">φ(T) 温度修正</span>
      <span class="decochip w">最小二乘辨识</span>
    </div>
  </div>

  <div class="hero stg">
    <div class="heroleft">
      <div class="card">
        <h3>模型主式 <em>问题一定式</em></h3>
        <div class="formula">dSOC/dt = −P_total(t,L,u,n,T) / C × 100%

P_total = φ(T) · [ P_base + a_s·L + a_c·u + a_n·n ]

<span class="dim">/* L 亮度、u 负载、n 网络 均归一化 0～1 */</span></div>
      </div>
      <div class="card">
        <h3>温度修正因子 <em>容量衰减 + 内阻上升</em></h3>
        <div class="formula">φ(T) = 1 + 0.006·|T−25| + 0.00035·(T−25)^2

<span class="c">φ(25) = 1.000</span>   <span class="y">φ(35) = 1.095</span>
<span class="w">φ(−10) = 1.639</span>  φ(40) = 1.169</div>
        <p class="small" style="margin-top:8px">高温与低温都会抬高 φ：低温可用容量骤减、内阻上升；高温副反应加剧，同样拉低有效容量。</p>
      </div>
    </div>
    <div class="heroright">
      <div class="herolabel">能量账本 · 功率 → SOC 下降</div>
      <div class="herosublabel">C = 15.4 Wh<br>dSOC/dt = −P_total / C × 100%</div>
      <canvas id="cvModel"></canvas>
    </div>
  </div>

  <div class="grid4 stg">
    <div class="kpi"><div class="k">基础功耗 P_base</div><div class="v">0.15 <u>W</u></div><div class="sub">待机</div></div>
    <div class="kpi"><div class="k">屏幕系数 a_s</div><div class="v">1.35 <u>W</u></div><div class="sub">满亮度</div></div>
    <div class="kpi g"><div class="k">处理器系数 a_c</div><div class="v">1.80 <u>W</u></div><div class="sub">满载</div></div>
    <div class="kpi b"><div class="k">网络系数 a_n</div><div class="v">1.10 <u>W</u></div><div class="sub">满强度</div></div>
  </div>

  <div class="quote stg">问题一关键：模型<b class="hl-t">显式包含 L、u、n、T 四个耗电项</b>，其中 T 以 φ(T) 作用于整体功率；参数由附件 1 全量最小二乘拟合得到，C 固定为电池额定能量 15.4 Wh。</div>
</div>
</section>

<!-- ===== 第二幕 · φ(T) 曲线 ===== -->
<section class="scene" id="s2" data-title="问题一 · 二 · φ(T) 温度修正曲线">
<div class="wrap">
  <div class="stg">
    <div class="kicker">温度修正因子 · 曲线形态</div>
    <h1>φ(T) 关于 25 ℃ <span class="hl-t">对称</span>，偏离越大抬升越快
      <small>φ(T) 关于 25 ℃ 对称：令 ΔT=|T−25|，ΔT 越大 φ 越大，高温与低温同样抬高整机功率。低温端 −10 ℃（ΔT=35）φ=1.639，高温端 40 ℃（ΔT=15）φ=1.169。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">φ(T) 曲线（T = −15～45 ℃）</div>
      <div class="legend">
        <span><i class="ln" style="background:#12a594"></i>φ(T) 曲线</span>
        <span><i class="dn" style="border-color:#e0a04a"></i>关键温度点</span>
        <span><i class="ln" style="background:#8aa3aa"></i>φ=1 基准线</span>
      </div>
    </div>
    <canvas id="cvPhi"></canvas>
    <p class="note" style="margin-top:8px">四个温度实测点：<b class="hl">φ(−10)=1.639</b>、<b class="hl-t">φ(0)=1.369</b>、φ(25)=1.000（基准）、<b class="hl-g">φ(40)=1.169</b>；问题二场景 D 用到 <b>φ(35)=1.095</b>。</p>
  </div>

  <div class="grid2 stg">
    <div class="card">
      <h3>关键温度点 <em>φ 与续航影响</em></h3>
      <table class="tb">
        <tr><th>T (℃)</th><th class="num">φ(T)</th><th>相对 25 ℃ 的功率倍数</th></tr>
        <tr><td>−10</td><td class="num">1.639</td><td>功率 ×1.64</td></tr>
        <tr><td>0</td><td class="num">1.369</td><td>功率 ×1.37</td></tr>
        <tr class="on"><td>25</td><td class="num">1.000</td><td>基准</td></tr>
        <tr><td>35</td><td class="num">1.095</td><td>场景 D</td></tr>
        <tr><td>40</td><td class="num">1.169</td><td>功率 ×1.17</td></tr>
      </table>
      <p class="small" style="margin-top:8px">温度 |T−25| 每升高 5 ℃，φ 上升约 <b class="hl-t">3.9%</b>，续航下降约 <b class="hl">3.7%</b>。</p>
    </div>
    <div class="card">
      <h3>为什么用二次型 <em>建模动机</em></h3>
      <p>① <b class="hl-t">对称性</b>：高温与低温都损害可用容量，故用 |T−25| 保证以 25 ℃ 为最优。</p>
      <p>② <b class="hl-t">平滑放大</b>：一次项刻画线性内阻上升，二次项刻画副反应/析锂的非线性加剧。</p>
      <p class="small">系数 0.006 与 0.00035 同样由附件 1 四个温度点的可用容量与瞬时功率辨识得到。</p>
    </div>
  </div>
</div>
</section>

<!-- ===== 第三幕 · 最小二乘辨识 ===== -->
<section class="scene" id="s3" data-title="问题一 · 三 · 最小二乘辨识（残差收敛）">
<div class="wrap">
  <div class="stg">
    <div class="kicker">参数辨识 · 残差随迭代收敛</div>
    <h1>最小二乘辨识：<span class="hl-t">残差逐轮收缩</span>至 RMSE = 0.021 SOC
      <small>以 P_base、a_s、a_c、a_n 为待估参数，对附件 1 全量数据做最小二乘拟合；残差范数随迭代快速下降，数轮后进入平台，残余误差稳定在 2.1% 附近。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">残差收敛过程：柱状残差 + RMSE 收敛曲线</div>
      <div class="legend">
        <span><i style="background:#cfe4e4"></i>初期残差</span>
        <span><i style="background:#12a594"></i>收敛后残差</span>
        <span><i class="ln" style="background:#b8543a"></i>RMSE 曲线</span>
      </div>
    </div>
    <canvas id="cvLsq"></canvas>
    <p class="note" style="margin-top:8px">辨识结果：<b class="hl-t">P_base = 0.15 W</b>、<b class="hl-t">a_s = 1.35 W</b>、<b class="hl-g">a_c = 1.80 W</b>、<b class="hl-t">a_n = 1.10 W</b>；附件 1 拟合残差最终收敛到 <b class="hl">RMSE = 0.021 SOC（2.1%）</b>。</p>
  </div>

  <div class="grid3 stg">
    <div class="kpi"><div class="k">迭代轮次</div><div class="v">8 <u>轮</u></div><div class="sub">进入平台</div></div>
    <div class="kpi b"><div class="k">观测样本</div><div class="v">附件1 <u>全量</u></div><div class="sub">三变量扫描</div></div>
    <div class="kpi g"><div class="k">收敛残差 RMSE</div><div class="v">0.021 <u>SOC</u></div><div class="sub">2.1%</div></div>
  </div>

  <div class="card stg">
    <h3>辨识要点 <em>为什么能收敛</em></h3>
    <p>① <b class="hl-t">可控变量扫描</b>：附件 1 固定单一变量，使各耗电项彼此可分离，避免参数耦合导致的病态。</p>
    <p>② <b class="hl-t">三项线性可分离</b>：屏幕、处理器、网络三项均为线性项（a_s·L + a_c·u + a_n·n，无幂次），各项贡献可直接分离，仅需辨识系数。</p>
    <p>③ <b class="hl-t">温度正交</b>：φ(T) 由四个温度点独立标定，与三变量扫描解耦，整体拟合稳定收敛。</p>
  </div>
</div>
</section>

<!-- ===== 第四幕 · 拟合优度 ===== -->
<section class="scene" id="s4" data-title="问题一 · 四 · 拟合优度与检验">
<div class="wrap">
  <div class="stg">
    <div class="kicker">模型检验 · 附件 1 拟合 + 附件 2 日志</div>
    <h1>拟合优度：<span class="hl-t">R² = 0.988</span>，日志 MAPE = 4.6%
      <small>模型在受控实验上 R² 高达 0.988；迁移到 20 名志愿者的真实日志，MAPE 仅 4.6%、最大瞬时偏差 0.083 SOC，说明模型具备跨工况泛化能力。</small>
    </h1>
  </div>

  <div class="grid4 stg">
    <div class="bigkpi">
      <div class="bk-k">附件1 拟合 R²</div>
      <div class="bk-v" data-cnt="0.988" data-dec="3">0.000<span class="bk-u">—</span></div>
      <div class="bk-sub">越高越好</div>
    </div>
    <div class="bigkpi">
      <div class="bk-k">附件1 RMSE</div>
      <div class="bk-v" data-cnt="0.021" data-dec="3">0.000<span class="bk-u">SOC</span></div>
      <div class="bk-sub">= 2.1%</div>
    </div>
    <div class="bigkpi g">
      <div class="bk-k">附件2 MAPE</div>
      <div class="bk-v" data-cnt="4.6" data-dec="1">0.0<span class="bk-u">%</span></div>
      <div class="bk-sub">真实日志</div>
    </div>
    <div class="bigkpi g">
      <div class="bk-k">最大瞬时偏差</div>
      <div class="bk-v" data-cnt="0.083" data-dec="3">0.000<span class="bk-u">SOC</span></div>
      <div class="bk-sub">日志峰值</div>
    </div>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">预测 SOC vs 实测 SOC（附件 2 抽样，含 ±0.083 偏差带）</div>
      <div class="legend">
        <span><i class="dn" style="border-color:#146c87"></i>实测点</span>
        <span><i class="ln" style="background:#12a594"></i>理想 y = x</span>
        <span><i style="background:#eaf4f4"></i>±0.083 偏差带</span>
      </div>
    </div>
    <canvas id="cvFit"></canvas>
    <p class="note" style="margin-top:8px">绝大多数点落在 <b class="hl-t">±0.083 SOC</b> 带内，全程贴合 y = x 理想线；少数大负载切换瞬间偏差略大，被记录为最大瞬时偏差。</p>
  </div>

  <div class="quote stg">问题一结论：模型 <b class="hl-t">dSOC/dt = −φ(T)·[P_base + a_s·L + a_c·u + a_n·n] / C × 100%</b> 在附件 1 上 <b>R² = 0.988、RMSE = 0.021 SOC</b>；在附件 2 真实日志上 <b>MAPE = 4.6%、最大瞬时偏差 0.083 SOC</b>，精度足以支撑问题二的续航预测。</div>
</div>
</section>

  g.fillStyle='rgba(255,255,255,.95)';
  g.fillRect(bx,y-9,tw+10,18);
  g.strokeStyle='#d9e9e9'; g.lineWidth=1; g.strokeRect(bx+.5,y-8.5,tw+9,17);
  g.fillStyle=col; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text,bx+5,y);
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}

var activeAnims=[];
function stopAllAnims(){
  activeAnims.forEach(function(a){ if(a._raf) cancelAnimationFrame(a._raf); a._raf=null; });
  activeAnims=[];
}
function runAnim(fn){
  var handle={_raf:null,_alive:true};
  activeAnims.push(handle);
  function loop(t){ if(!handle._alive) return; fn(t); handle._raf=requestAnimationFrame(loop); }
  handle._raf=requestAnimationFrame(loop);
  return handle;
}

/* ===== 第一幕 · 能量账本 ===== */
var modelT0=null;
function drawModel(t){
  var cv=$('#cvModel'); if(!cv)return;
  if(cv._h===undefined) cv._h=360;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-modelT0)/1000;
  var bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#0b2e36'); bg.addColorStop(.55,'#0e3a44'); bg.addColorStop(1,'#0b2e36');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  for(var i=0;i<40;i++){
    var sx=((i*97.13)%w), sy=((i*53.7)%(h-20))+10;
    var tw=0.5+0.5*Math.sin(tN+i*0.6);
    g.fillStyle='rgba(205,238,233,'+(0.05+0.14*tw)+')'; g.fillRect(sx,sy,1.5,1.5);
  }
  var rev=easeOutCubic(clamp(tN/1.6,0,1));

  /* 左：功率堆叠条 */
  var bx=w*0.10, byy=h*0.20, bwid=Math.max(60,w*0.24), bh=h*0.60;
  var items=[{k:'网络 a_n·n',v:1.10,c:'#12a594'},{k:'处理器 a_c·u',v:1.80,c:'#e0a04a'},
             {k:'屏幕 a_s·L',v:1.35,c:'#1e9fc4'},{k:'基础 P_base',v:0.15,c:'#8aa3aa'}];
  var tot=4.40, acc=0;
  g.strokeStyle='rgba(205,238,233,.30)'; g.lineWidth=1; rr(g,bx,byy,bwid,bh,9); g.stroke();
  var drawn=rev*tot;
  items.forEach(function(it){
    var sh=Math.max(0,Math.min(it.v, drawn-acc));
    if(sh>0.001){
      var yTop=byy+bh-(acc+it.v)/tot*bh, hh=sh/tot*bh;
      g.fillStyle=it.c; g.globalAlpha=.88; g.fillRect(bx+1,yTop,bwid-2,hh); g.globalAlpha=1;
    }
    if(sh>0.001 && it.v>=1.0){
      g.fillStyle='rgba(11,46,54,.85)'; g.font='600 10.5px "PingFang SC",system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      var yc=byy+bh-((acc+it.v/2)/tot*bh);
      if(bhidSafe(yc,byy,bh)) g.fillText(it.k, bx+bwid/2, yc);
    }
    acc+=it.v;
  });
  g.fillStyle='rgba(205,238,233,.9)'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('满开功率堆叠 ≈ 4.4 W', bx+bwid/2, byy-14);

  /* 右：SOC(t) 下降 */
  var L=bx+bwid+ (w-bx-bwid)*0.22, R=16, T=34, B=40, PW=w-L-R, PH=h-T-B;
  if(PW<40){ return; }
  var tmax=20, ymin=0, ymax=110;
  function X(v){return L+PW*v/tmax;} function Y(v){return T+PH*(1-(v-ymin)/(ymax-ymin));}
  g.font='10.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=ymin+(ymax-ymin)*k/4, yy=Y(v);
    g.strokeStyle='rgba(205,238,233,.12)'; g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='rgba(205,238,233,.65)'; g.textAlign='right'; g.textBaseline='middle'; g.fillText(v.toFixed(0),L-6,yy);
  }
  g.strokeStyle='rgba(205,238,233,.35)'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='rgba(205,238,233,.75)'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('时间 t (h)', L+PW/2, T+PH+18);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('SOC (%)',0,0); g.restore();

  var P=1.963, slope=-P/15.4*100;
  var tPlan=100/-slope;
  g.strokeStyle='#e0a04a'; g.lineWidth=2.6; g.lineJoin='round';
  var tt=Math.min(tmax*tN/3.0, tmax)*rev;
  g.beginPath(); g.moveTo(X(0),Y(100));
  g.lineTo(X(Math.min(tt,tPlan)),Y(Math.max(0,100+slope*Math.min(tt,tPlan))));
  g.stroke();
  var curT=Math.min(tt,tPlan), curS=Math.max(0,100+slope*curT);
  g.beginPath(); g.arc(X(curT),Y(curS),4,0,Math.PI*2); g.fillStyle='#e0a04a'; g.fill();
  g.strokeStyle='#fff'; g.lineWidth=1.6; g.stroke();
  if(rev>0.9){
    g.fillStyle='rgba(205,238,233,.85)'; g.font='11px "PingFang SC",system-ui,sans-serif';
    g.textAlign='left'; g.textBaseline='middle';
    g.fillText('示例：P=1.963 W → 斜率 −12.7 %/h', L+4, T+14);
  }
  g.fillStyle='rgba(127,216,201,.15)'; g.fillRect(0,h-22,w,22);
  g.fillStyle='rgba(205,238,233,.9)'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('C = 15.4 Wh  ·  φ(25) = 1.000  ·  4 项耗电叠加', 12, h-11);
}
function bhidSafe(y,byy,bh){ return y>byy+8 && y<byy+bh-8; }
function startModel(){ modelT0=performance.now(); runAnim(function(t){ drawModel(t); }); }

/* ===== 第二幕 · φ(T) 曲线 ===== */
var phiT0=null;
function drawPhi(t){
  var cv=$('#cvPhi'); if(!cv)return;
  if(cv._h===undefined) cv._h=290;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-phiT0)/1000;
  var rev=easeOutCubic(clamp(tN/1.8,0,1));
  var L=52,R=22,T=26,B=44, PW=w-L-R, PH=h-T-B;
  var tmin=-15, tmax=45, ymin=0.9, ymax=1.75;
  function X(v){return L+PW*(v-tmin)/(tmax-tmin);} function Y(v){return T+PH*(1-(v-ymin)/(ymax-ymin));}
  g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=5;k++){
    var v=ymin+(ymax-ymin)*k/5, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle'; g.fillText(v.toFixed(1),L-7,yy);
  }
  [-10,0,10,20,25,30,40].forEach(function(o){
    var xx=X(o);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText(o, xx, T+PH+16);
  });
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('环境温度 T (℃)', L+PW/2, T+PH+34);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('φ(T)',0,0); g.restore();

  g.save(); g.setLineDash([5,4]); g.strokeStyle='rgba(138,163,170,.85)'; g.lineWidth=1.3;
  g.beginPath(); g.moveTo(L,Y(1.0)); g.lineTo(L+PW,Y(1.0)); g.stroke(); g.restore();

  g.strokeStyle='#12a594'; g.lineWidth=2.6; g.lineJoin='round';
  g.beginPath(); var first=true;
  var tEnd=tmin+(tmax-tmin)*rev;
  for(var Tt=tmin;Tt<=tEnd+0.001;Tt+=0.5){
    var px=X(Tt), py=Y(phiT(Tt));
    if(first){ g.moveTo(px,py); first=false; } else g.lineTo(px,py);
  }
  g.stroke();

  var marks=[{T:-10,c:'#b8543a'},{T:0,c:'#0b6e68'},{T:25,c:'#0b2e36'},{T:35,c:'#8a6313'},{T:40,c:'#e0a04a'}];
  marks.forEach(function(m){
    if(m.T>tEnd+0.001) return;
    var px=X(m.T), py=Y(phiT(m.T));
    g.beginPath(); g.arc(px,py,4,0,Math.PI*2); g.fillStyle=m.c; g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1.5; g.stroke();
  });
  if(rev>0.85){
    tag(g, X(-10)+4, Y(phiT(-10))-14, 'φ(−10)=1.639','#b8543a');
    tag(g, X(0)+4,  Y(phiT(0))+18,  'φ(0)=1.369','#0b6e68');
    tag(g, X(25)-2, Y(phiT(25))+20, 'φ(25)=1.000 基准','#0b2e36','right');
    tag(g, X(35)+4, Y(phiT(35))-16, 'φ(35)=1.095','#8a6313');
    tag(g, X(40)-4, Y(phiT(40))-16, 'φ(40)=1.169','#e0a04a','right');
  }
}
function startPhi(){ phiT0=performance.now(); runAnim(function(t){ drawPhi(t); }); }

/* ===== 第三幕 · 最小二乘辨识 ===== */
var lsqT0=null;
function drawLsq(t){
  var cv=$('#cvLsq'); if(!cv)return;
  if(cv._h===undefined) cv._h=290;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-lsqT0)/1000;
  var iters=8;
  var it=Math.min(iters-1, tN/0.32);
  var rmse=0.021 + (0.35-0.021)*Math.exp(-it*0.75);

  var L=56,R=20,T=26,B=46, PW=w-L-R, PH=h-T-B;
  g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=0.4*k/4, yy=T+PH*(1-v/0.4);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle'; g.fillText(v.toFixed(1),L-7,yy);
  }
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('迭代轮次', L+PW/2, T+PH+32);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('残差 / RMSE (SOC)',0,0); g.restore();

  /* 残差柱：12 根，随迭代收缩 */
  var n=12, slot=PW/n, bw=slot*0.42;
  var targets=[0.051,0.023,0.061,0.034,0.017,0.045,0.029,0.062,0.038,0.024,0.058,0.031];
  var conv=Math.exp(-it*0.75);
  for(var i=0;i<n;i++){
    var cx=L+slot*(i+.5), x=cx-bw/2;
    var mag=targets[i]*(0.42+0.58*conv)+0.021*(1-conv);
    var hh=PH*Math.min(0.4,mag)/0.4;
    var bin=i%4;
    var col=(bin===0)?'#cfe4e4':(bin===1?'#7fd8c9':(bin===2?'#12a594':'#0b6e68'));
    g.fillStyle=col; g.globalAlpha=.9; rr(g,x,T+PH-hh,bw,hh,3); g.fill(); g.globalAlpha=1;
  }

  /* RMSE 收敛曲线 */
  g.strokeStyle='#b8543a'; g.lineWidth=2.4; g.lineJoin='round';
  g.beginPath();
  var first2=true;
  for(var ii=0;ii<=it+0.001;ii+=0.08){
    var r=0.021+(0.35-0.021)*Math.exp(-ii*0.75);
    var px=L+PW*(ii/iters), py=T+PH*(1-r/0.4);
    if(first2){ g.moveTo(px,py); first2=false; } else g.lineTo(px,py);
  }
  g.stroke();

  var curX=L+PW*(it/iters), curY=T+PH*(1-rmse/0.4);
  g.beginPath(); g.arc(curX,curY,4.5,0,Math.PI*2); g.fillStyle='#b8543a'; g.fill();
  g.strokeStyle='#fff'; g.lineWidth=1.6; g.stroke();
  tag(g, L+PW-6, T+16, 'RMSE 收敛曲线', '#b8543a','right');
  tag(g, L+8, T+PH*0.9, '第 '+Math.floor(it+1)+' 轮 · RMSE = '+rmse.toFixed(3), '#0b6e68','left');
  tag(g, L+PW-6, T+PH*0.18, '4 参数：P_base / a_s / a_c / a_n', '#57727c','right');
}
function startLsq(){ lsqT0=performance.now(); runAnim(function(t){ drawLsq(t); }); }

/* ===== 第四幕 · 拟合优度 ===== */
var fitT0=null;
var FITX=[5,12,20,28,36,44,52,60,68,76,84,92,99,108,116,124];
var FITY=[6.2,11.1,19.4,28.9,35.2,45.3,51.1,61.4,67.3,76.9,83.2,91.4,99.6,107.1,116.5,123.3];
function drawFit(t){
  var cv=$('#cvFit'); if(!cv)return;
  if(cv._h===undefined) cv._h=300;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-fitT0)/1000;
  var rev=easeOutCubic(clamp(tN/1.8,0,1));
  var L=56,R=22,T=26,B=44, PW=w-L-R, PH=h-T-B;
  var vmin=0, vmax=130;
  function X(v){return L+PW*(v-vmin)/(vmax-vmin);} function Y(v){return T+PH*(1-(v-vmin)/(vmax-vmin));}
  g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=vmin+(vmax-vmin)*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle'; g.fillText(v.toFixed(0),L-7,yy);
  }
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('实测 SOC (%)', L+PW/2, T+PH+32);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('预测 SOC (%)',0,0); g.restore();

  /* ±0.083 SOC 偏差带（按百分比刻度直接换算，作为示意） */
  var bandHalf=(vmax-vmin)*0.083;
  g.save(); g.beginPath();
  g.moveTo(X(vmin),Y(vmin)); g.lineTo(X(vmax),Y(vmax));
  g.strokeStyle='rgba(18,165,148,.35)'; g.lineWidth=2.4; g.stroke();
  g.restore();

  g.fillStyle='rgba(18,165,148,.10)';
  g.beginPath();
  g.moveTo(X(vmin),Y(vmin+bandHalf*0.9));
  g.lineTo(X(vmax),Y(vmax+bandHalf*0.9));
  g.lineTo(X(vmax),Y(vmax-bandHalf*0.9));
  g.lineTo(X(vmin),Y(vmin-bandHalf*0.9));
  g.closePath(); g.fill();

  var show=rev*FITX.length;
  for(var i=0;i<FITX.length;i++){
    if(i>show) break;
    var px=X(FITX[i]), py=Y(FITY[i]);
    g.beginPath(); g.arc(px,py,3.4,0,Math.PI*2); g.fillStyle='#146c87'; g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1.3; g.stroke();
  }
  tag(g, X(30)+8, Y(38)-2, '理想 y = x', '#0b6e68','left');
  tag(g, L+PW-6, T+16, '±0.083 SOC 偏差带', '#57727c','right');
}
function startFit(){ fitT0=performance.now(); runAnim(function(t){ drawFit(t); }); }

/* ===== KPI count-up ===== */
var kpiStarted=false;
function startKPIs(){
  if(kpiStarted) return; kpiStarted=true;
  $$('[data-cnt]').forEach(function(el){
    var target=parseFloat(el.dataset.cnt);
    var dec=parseInt(el.dataset.dec||'0',10);
    var uspan=el.querySelector('.bk-u');
    var unitHtml=uspan?uspan.outerHTML.replace(/[\d.]+/,'—'):'';
    var t0=performance.now(), dur=1100;
    function step(tt){
      var p=clamp((tt-t0)/dur,0,1);
      el.innerHTML=fmt(target*easeOutCubic(p),dec)+unitHtml;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* ===== 调度 ===== */
var SCENES=$$('.scene'), N=SCENES.length, cur=-1;
var starters=[startModel, startPhi, startLsq, startFit];
var st={last:0,armed:false,fired:0};
function goTo(i){
  i=Math.max(0,Math.min(N-1,i));
  if(i===cur) return;
  if(cur>=0) SCENES[cur].classList.remove('active');
  cur=i; stopAllAnims(); kpiStarted=false;
  var sc=SCENES[i]; sc.scrollTop=0; sc.classList.add('active');
  $('#scTitle').textContent=sc.dataset.title||'';
  $$('#dots .dot').forEach(function(d,k){ d.classList.toggle('on',k===i); });
  $('#pgNow').textContent=i+1;
  $('#prog').style.width=(N<=1?100:(i/(N-1))*100)+'%';
  st.armed=false;
  $$('.wrap > *',sc).forEach(function(b){ b.classList.add('in'); });
  if(starters[i]) starters[i]();
  if(i===3) startKPIs();
}
function setReduce(v){
  document.body.classList.toggle('reduce',v);
  var b=$('#btnFx'); b.classList.toggle('on',!v); b.textContent=v?'动效 关':'动效 开';
  if(v){ $$('.wrap > *').forEach(function(e){ e.classList.add('in'); }); stopAllAnims(); }
}
function init(){
  var dots=''; for(var i=0;i<N;i++) dots+='<button class="dot" data-i="'+i+'" title="第 '+(i+1)+' 幕"></button>';
  $('#dots').innerHTML=dots; $('#pgAll').textContent=N;
  $('#dots').addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('.dot'):null; if(t) goTo(+t.dataset.i); });
  $('#btnNext').onclick=function(){ goTo(cur+1); };
  $('#btnPrev').onclick=function(){ goTo(cur-1); };
  $('#btnReplay').onclick=function(){ stopAllAnims(); kpiStarted=false; if(starters[cur]) starters[cur](); if(cur===3) startKPIs(); };
  $('#btnFx').onclick=function(){ var nv=!document.body.classList.contains('reduce'); setReduce(nv);
    if(!nv && cur>=0){ if(starters[cur]) starters[cur](); if(cur===3) startKPIs(); } };
  document.addEventListener('keydown',function(e){
    var tn=(e.target.tagName||'').toLowerCase(); if(tn==='input'||tn==='textarea') return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){ e.preventDefault(); goTo(cur+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); goTo(cur-1); }
    else if(k==='Home'){ e.preventDefault(); goTo(0); }
    else if(k==='End'){ e.preventDefault(); goTo(N-1); }
    else if(k==='r'||k==='R'){ $('#btnReplay').click(); }
    else if(k>='1'&&k<='9'&&+k<=N){ e.preventDefault(); goTo(+k-1); }
  });
  setReduce(false); goTo(0);
}
window.addEventListener('resize',function(){ if(cur>=0){ if(starters[cur] && !document.body.classList.contains('reduce')) starters[cur](); } });
init();
})();
</script>

.navbar{
  position:fixed;left:0;right:0;bottom:0;height:76px;z-index:40;

.progwrap{position:fixed;left:0;right:0;top:56px;height:2px;background:transparent;z-index:41}

}

.bigkpi .bk-k{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase}

.bigkpi .bk-u{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.bigkpi .bk-sub{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.6}
.decochips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.decochip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--ink2)}

.decochip.g{background:#fdf4e8;color:var(--gold-d)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
</style>
</head>

<header class="topbar">

<!-- ===== 第一幕 · 四场景功率对比 ===== -->
<section class="scene" id="s1" data-title="问题二 · 一 · 四场景功率对比">
<div class="wrap">
  <div class="stg">
    <div class="kicker">2026 美赛 A 题 · 问题二</div>
    <h1>四类典型场景：把 <span class="hl-t">(L, u, n, T)</span> 代入同一模型算功率
      <small>场景差异全部体现在输入四元组上：轻度以低亮度低负载为主，重度把亮度、负载、网络都推到高位，极端场景额外叠加 35 ℃ 的环境温度修正 φ(35)=1.095。</small>
    </h1>
    <div class="decochips">
      <span class="decochip t">A 轻度</span>
      <span class="decochip t">B 中度</span>
      <span class="decochip g">C 重度</span>
      <span class="decochip w">D 极端 · 35℃</span>
    </div>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">四场景总放电功率 P_total（W）</div>
      <div class="legend">
        <span><i style="background:#12a594"></i>A 轻度</span>
        <span><i style="background:#1e9fc4"></i>B 中度</span>
        <span><i style="background:#e0a04a"></i>C 重度</span>
        <span><i style="background:#b8543a"></i>D 极端</span>
      </div>
    </div>
    <canvas id="cvPower"></canvas>
    <p class="note" style="margin-top:8px">功率排序：<b class="hl-t">A 0.655 W</b> < B 1.963 W < D 2.907 W < <b class="hl">C 3.865 W</b>。D 场景虽输入不强，但高温修正把它推到第二高功率。</p>
  </div>

  <div class="grid4 stg">
    <div class="kpi"><div class="k">A 轻度 P_total</div><div class="v">0.655 <u>W</u></div><div class="sub">φ=1.000</div></div>
    <div class="kpi b"><div class="k">B 中度 P_total</div><div class="v">1.963 <u>W</u></div><div class="sub">φ=1.000</div></div>
    <div class="kpi g"><div class="k">C 重度 P_total</div><div class="v">3.865 <u>W</u></div><div class="sub">φ=1.000</div></div>
    <div class="kpi w"><div class="k">D 极端 P_total</div><div class="v">2.907 <u>W</u></div><div class="sub">φ(35)=1.095</div></div>
  </div>

  <div class="card stg">
    <h3>四场景输入四元组 <em>L / u / n / T</em></h3>
    <table class="tb">
      <tr><th>场景</th><th class="num">亮度 L</th><th class="num">负载 u</th><th class="num">网络 n</th><th class="num">温度 T (℃)</th><th class="num">φ(T)</th><th class="num">P_total (W)</th></tr>
      <tr><td>A 轻度</td><td class="num">0.20</td><td class="num">0.10</td><td class="num">0.05</td><td class="num">25</td><td class="num">1.000</td><td class="num">0.655</td></tr>
      <tr><td>B 中度</td><td class="num">0.55</td><td class="num">0.35</td><td class="num">0.40</td><td class="num">25</td><td class="num">1.000</td><td class="num">1.963</td></tr>
      <tr><td>C 重度</td><td class="num">0.90</td><td class="num">0.90</td><td class="num">0.80</td><td class="num">25</td><td class="num">1.000</td><td class="num">3.865</td></tr>
      <tr class="on"><td>D 极端</td><td class="num">0.70</td><td class="num">0.50</td><td class="num">0.60</td><td class="num">35</td><td class="num">1.095</td><td class="num">2.907</td></tr>
    </table>
    <p class="small" style="margin-top:8px">场景 D：φ(35) = 1 + 0.06 + 0.035 = 1.095；P_total = 1.095 × [0.15+0.945+0.90+0.66] = 2.907 W，故 15.4 / 2.907 ≈ <b class="hl-t">5.30 h</b>。</p>
  </div>
</div>
</section>

<!-- ===== 第二幕 · SOC-t 曲线 ===== -->
<section class="scene" id="s2" data-title="问题二 · 二 · SOC-t 下降曲线与 95% 置信带">
<div class="wrap">
  <div class="stg">
    <div class="kicker">续航预测 · SOC 由 100% 到 0%</div>
    <h1>四条 <span class="hl-t">SOC–t</span> 直线，斜率即耗电速率
      <small>模型为能量线性消耗，SOC 随时间近似直线下降：功率越大越陡。阴影为 95% 置信带，带宽由各场景的不确定度决定。</small>
    </h1>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">四场景 SOC–t 曲线（含 95% 带）</div>
      <div class="legend">
        <span><i class="ln" style="background:#12a594"></i>A 轻度 23.51 h</span>
        <span><i class="ln" style="background:#1e9fc4"></i>B 中度 7.85 h</span>
        <span><i class="ln" style="background:#e0a04a"></i>C 重度 3.98 h</span>
        <span><i class="ln" style="background:#b8543a"></i>D 极端 5.30 h</span>
        <span><i style="background:rgba(18,165,148,.14)"></i>95% 带</span>
      </div>
    </div>
    <canvas id="cvSoc"></canvas>
    <p class="note" style="margin-top:8px">续航（SOC 100% → 0%）：<b class="hl-t">A 23.51 ± 2.32 h</b>、<b class="hl-t">B 7.85 ± 0.77 h</b>、<b class="hl-g">C 3.98 ± 0.39 h</b>、<b class="hl">D 5.30 ± 0.52 h</b>。</p>
  </div>

  <div class="grid2 stg">
    <div class="card">
      <h3>为什么是直线 <em>能量视角</em></h3>
      <p>在单一场景内 L、u、n、T 基本恒定，P_total 为常数，故 dSOC/dt 恒定 → SOC 随时间<b class="hl-t">线性下降</b>。</p>
      <p class="small">若场景内出现负载突变（如游戏切后台），曲线会呈分段折线，但均值斜率仍由平均功率决定。</p>
    </div>
    <div class="card">
      <h3>置信带来源 <em>±CI</em></h3>
      <p>不确定性 = 参数不确定度 ⊕ 场景载荷波动（按 5% 计）：功率越高、预测时段越短，绝对误差越小。</p>
      <p class="small">A 场景时长最长（23.51 h），绝对不确定度最大（±2.32 h）；C 场景最短，仅 ±0.39 h。</p>
    </div>
  </div>
</div>
</section>

<!-- ===== 第三幕 · 结果汇总 ===== -->
<section class="scene" id="s3" data-title="问题二 · 三 · 续航结果汇总">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题二结论 · 续航 + 置信区间</div>
    <h1>续航从 <span class="hl-t">23.51 h</span> 一路跌到 <span class="hl">3.98 h</span>
      <small>轻度与重度场景续航相差约 5.9 倍，说明使用行为对续航的影响远大于电池本身。（续航带为 95% 带＝参数不确定度 ⊕ 载荷波动 5%）</small>
    </h1>
  </div>

  <div class="grid4 stg">
    <div class="bigkpi">
      <div class="bk-k">A 轻度续航</div>
      <div class="bk-v" data-cnt="23.51" data-dec="2">0.00<span class="bk-u">h</span></div>
      <div class="bk-sub">95% CI ±2.32 h</div>
    </div>
    <div class="bigkpi">
      <div class="bk-k">B 中度续航</div>
      <div class="bk-v" data-cnt="7.85" data-dec="2">0.00<span class="bk-u">h</span></div>
      <div class="bk-sub">95% CI ±0.77 h</div>
    </div>
    <div class="bigkpi g">
      <div class="bk-k">C 重度续航</div>
      <div class="bk-v" data-cnt="3.98" data-dec="2">0.00<span class="bk-u">h</span></div>
      <div class="bk-sub">95% CI ±0.39 h</div>
    </div>
    <div class="bigkpi g">
      <div class="bk-k">D 极端续航</div>
      <div class="bk-v" data-cnt="5.30" data-dec="2">0.00<span class="bk-u">h</span></div>
      <div class="bk-sub">95% CI ±0.52 h</div>
    </div>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">续航条形 + 95% 带</div>
      <div class="legend">
        <span><i style="background:#12a594"></i>续航时长</span>
        <span><i class="ln" style="background:#b8543a"></i>CI 误差棒</span>
      </div>

/* ===== 第一幕 · 龙卷风图 ===== */
var torT0=null;
var TOR=[{k:'a_s 屏幕',v:3.7,c:'#12a594'},{k:'a_c 处理器',v:3.1,c:'#e0a04a'},
         {k:'a_n 网络',v:2.2,c:'#1e9fc4'},{k:'P_base 基础',v:0.8,c:'#8aa3aa'}];
function drawTornado(t){
  var cv=$('#cvTornado'); if(!cv)return;
  if(cv._h===undefined) cv._h=280;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-torT0)/1000;
  var rev=easeOutCubic(clamp(tN/1.6,0,1));
  var L=118,R=118,T=30,B=34, PW=w-L-R, PH=h-T-B;
  var half=4.5, cx=L+PW/2;
  function X(v){return cx+PW/2*(v/half);}
  g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var v=-4.5;v<=4.5;v+=1.5){
    var xx=X(v);
    g.strokeStyle=(v===0)?'#cfe4e4':'#eaf4f4'; g.lineWidth=(v===0)?1.4:1;
    g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText(v, xx, T+PH+16);
  }
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('续航变动 (%)', cx, T+PH+30);

  var n=TOR.length, slot=PH/n, bh=Math.min(26,slot*0.46);
  TOR.forEach(function(r2,i){
    var cy=T+slot*(i+.5), y=cy-bh/2;
    var ww=PW/2*(r2.v*rev/half);
    g.fillStyle='#146c87'; g.globalAlpha=.85; rr(g,cx-ww,y,ww,bh,4); g.fill(); g.globalAlpha=1;
    g.fillStyle=r2.c; g.globalAlpha=.92; rr(g,cx,y,ww,bh,4); g.fill(); g.globalAlpha=1;
    g.fillStyle='#0b2e36'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='right'; g.textBaseline='middle'; g.fillText(r2.k, L-10, cy);
    if(rev>0.9){
      tag(g, cx+ww+8, y+9, '−'+r2.v.toFixed(1)+'%', '#b8543a');
      tag(g, cx-ww-8, y+bh-8, '+'+r2.v.toFixed(1)+'%', '#146c87','right');
    }
  });
  if(rev>0.95){
    g.fillStyle='#57727c'; g.font='11px "PingFang SC",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('参数 +10% → 续航下降；参数 −10% → 续航上升', cx, T-14);
  }
}
function startTornado(){ torT0=performance.now(); runAnim(function(t){ drawTornado(t); }); }

/* ===== 第二幕 · 温度影响 ===== */
var tmpT0=null;
function drawTemp(t){
  var cv=$('#cvTemp'); if(!cv)return;
  if(cv._h===undefined) cv._h=290;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-tmpT0)/1000;
  var rev=easeOutCubic(clamp(tN/1.8,0,1));
  var L=54,R=34,T=26,B=44, PW=w-L-R, PH=h-T-B;
  var tmin=15, tmax=45, ymin=0.98, ymax=1.32;
  function X(v){return L+PW*(v-tmin)/(tmax-tmin);} function Y(v){return T+PH*(1-(v-ymin)/(ymax-ymin));}
  g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=4;k++){
    var v=ymin+(ymax-ymin)*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle'; g.fillText(v.toFixed(2),L-7,yy);
  }
  [15,20,25,30,35,40,45].forEach(function(o){
    var xx=X(o);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText(o, xx, T+PH+16);
  });
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('环境温度 T (℃)', L+PW/2, T+PH+34);
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('φ(T)',0,0); g.restore();

  g.save(); g.setLineDash([5,4]); g.strokeStyle='rgba(138,163,170,.85)'; g.lineWidth=1.3;
  g.beginPath(); g.moveTo(L,Y(1.0)); g.lineTo(L+PW,Y(1.0)); g.stroke(); g.restore();

  g.strokeStyle='#12a594'; g.lineWidth=2.6; g.lineJoin='round';
  g.beginPath(); var first=true;
  var tEnd=tmin+(tmax-tmin)*rev;
  for(var Tt=tmin;Tt<=tEnd+0.001;Tt+=0.25){
    var px=X(Tt), py=Y(phiT(Tt));
    if(first){ g.moveTo(px,py); first=false; } else g.lineTo(px,py);
  }
  g.stroke();

  /* 5 ℃ 台阶：25 → 30 */
  var showStep=clamp((rev-0.55)/0.3,0,1);
  if(showStep>0){
    var x1=X(25), x2=X(30), y1=Y(phiT(25)), y2=Y(phiT(30));
    g.save(); g.globalAlpha=showStep;
    g.strokeStyle='#e0a04a'; g.lineWidth=1.6; g.setLineDash([4,3]);
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y1); g.lineTo(x2,y2); g.stroke(); g.setLineDash([]);
    g.fillStyle='#e0a04a';
    g.beginPath(); g.arc(x1,y1,4.2,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(x2,y2,4.2,0,Math.PI*2); g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1.5;
    g.beginPath(); g.arc(x1,y1,4.2,0,Math.PI*2); g.stroke();
    g.beginPath(); g.arc(x2,y2,4.2,0,Math.PI*2); g.stroke();
    g.restore();
  }
  if(rev>0.9){
    tag(g, X(25)-4, Y(phiT(25))+18, '25 ℃ 基准 φ=1.000','#0b2e36','right');
    tag(g, X(30)+6, Y(phiT(30))-4, '25→30 ℃：φ +3.9% · 续航 −3.7%','#8a6313');
  }
}
function startTemp(){ tmpT0=performance.now(); runAnim(function(t){ drawTemp(t); }); }

/* ===== 第三幕 · 优先级得分 ===== */
var rankT0=null;
var RANK=[{l:'屏幕亮度（阈值 0.35）',v:3.7,c:'#12a594'},{l:'处理器负载（调度缓解）',v:3.1,c:'#e0a04a'},
          {l:'网络活动（后台限制）',v:2.2,c:'#1e9fc4'},{l:'温度（被动散热）',v:3.7,c:'#b8543a'}];
function drawRank(t){
  var cv=$('#cvRank'); if(!cv)return;
  if(cv._h===undefined) cv._h=230;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tN=(t-rankT0)/1000;
  var rev=easeOutCubic(clamp(tN/1.4,0,1));
  var L=170,R=60,T=26,B=36, PW=w-L-R, PH=h-T-B;
  var vmax=4.5;
  g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var xv=0;xv<=4.5;xv+=1.5){
    var xx=L+PW*xv/vmax;
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.beginPath(); g.moveTo(xx+.5,T); g.lineTo(xx+.5,T+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText(xv, xx, T+PH+16);
  }
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  g.fillStyle='#57727c'; g.font='600 12px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillText('优先级得分（≈ 续航灵敏度 %）', L+PW/2, T+PH+30);

  var n=RANK.length, slot=PH/n, bh=Math.min(24,slot*0.5);
  RANK.forEach(function(r2,i){
    var cy=T+slot*(i+.5), y=cy-bh/2, bwid=PW*(r2.v*rev)/vmax;
    g.fillStyle=r2.c; g.globalAlpha=.9; rr(g,L,y,bwid,bh,5); g.fill(); g.globalAlpha=1;
    g.fillStyle='#0b2e36'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
    g.textAlign='right'; g.textBaseline='middle'; g.fillText(r2.l, L-8, cy);
    if(rev>0.9){
      var lab=(i===0)?('+'+r2.v.toFixed(1)+'% 最优先'):(r2.v.toFixed(1)+'%');
      tag(g, L+bwid+8, cy, lab, '#0b6e68');
    }
  });
}
function startRank(){ rankT0=performance.now(); runAnim(function(t){ drawRank(t); }); }

var kpiStarted=false;
function startKPIs(){
  if(kpiStarted) return; kpiStarted=true;
  $$('[data-cnt]').forEach(function(el){
    var target=parseFloat(el.dataset.cnt);
    var dec=parseInt(el.dataset.dec||'0',10);
    var uspan=el.querySelector('.bk-u');
    var unitHtml=uspan?uspan.outerHTML:'';
    var t0=performance.now(), dur=1100;
    function step(tt){
      var p=clamp((tt-t0)/dur,0,1);
      el.innerHTML=fmt(target*easeOutCubic(p),dec)+unitHtml;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

var SCENES=$$('.scene'), N=SCENES.length, cur=-1;
var starters=[startTornado, startTemp, startRank];
function goTo(i){
  i=Math.max(0,Math.min(N-1,i));
  if(i===cur) return;
  if(cur>=0) SCENES[cur].classList.remove('active');
  cur=i; stopAllAnims(); kpiStarted=false;
  var sc=SCENES[i]; sc.scrollTop=0; sc.classList.add('active');
  $('#scTitle').textContent=sc.dataset.title||'';
  $$('#dots .dot').forEach(function(d,k){ d.classList.toggle('on',k===i); });
  $('#pgNow').textContent=i+1;
  $('#prog').style.width=(N<=1?100:(i/(N-1))*100)+'%';
  $$('.wrap > *',sc).forEach(function(b){ b.classList.add('in'); });
  if(starters[i]) starters[i]();
  if(i===2) startKPIs();
}
function setReduce(v){
  document.body.classList.toggle('reduce',v);
  var b=$('#btnFx'); b.classList.toggle('on',!v); b.textContent=v?'动效 关':'动效 开';
  if(v){ $$('.wrap > *').forEach(function(e){ e.classList.add('in'); }); stopAllAnims(); }
}
function init(){
  var dots=''; for(var i=0;i<N;i++) dots+='<button class="dot" data-i="'+i+'" title="第 '+(i+1)+' 幕"></button>';
  $('#dots').innerHTML=dots; $('#pgAll').textContent=N;
  $('#dots').addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('.dot'):null; if(t) goTo(+t.dataset.i); });
  $('#btnNext').onclick=function(){ goTo(cur+1); };
  $('#btnPrev').onclick=function(){ goTo(cur-1); };
  $('#btnReplay').onclick=function(){ stopAllAnims(); kpiStarted=false; if(starters[cur]) starters[cur](); if(cur===2) startKPIs(); };
  $('#btnFx').onclick=function(){ var nv=!document.body.classList.contains('reduce'); setReduce(nv);
    if(!nv && cur>=0){ if(starters[cur]) starters[cur](); if(cur===2) startKPIs(); } };
  document.addEventListener('keydown',function(e){
    var tn=(e.target.tagName||'').toLowerCase(); if(tn==='input'||tn==='textarea') return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){ e.preventDefault(); goTo(cur+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); goTo(cur-1); }
    else if(k==='Home'){ e.preventDefault(); goTo(0); }
    else if(k==='End'){ e.preventDefault(); goTo(N-1); }
    else if(k==='r'||k==='R'){ $('#btnReplay').click(); }
    else if(k>='1'&&k<='9'&&+k<=N){ e.preventDefault(); goTo(+k-1); }
  });
  setReduce(false); goTo(0);
}
window.addEventListener('resize',function(){ if(cur>=0 && starters[cur] && !document.body.classList.contains('reduce')) starters[cur](); });
init();
})();
</script>
</body>
