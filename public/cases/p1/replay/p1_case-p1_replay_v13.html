<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数模演易 · 中药材热风烘干复现</title>
<style>
:root{
  --teal-700:#0B6E68; --teal-600:#0E8F84; --teal-500:#12A594; --teal-400:#2EC4B0;
  --teal-100:#DFF4F1; --teal-50:#EFFAF8;
  --cyan-500:#17A2C4; --blue-600:#1E6FA8;
  --blue-900:#0B6E68; --blue-800:#0E8F84; --blue-700:#12A594; --blue-600:#1E6FA8;
  --blue-500:#2EC4B0; --blue-400:#4FD0C0; --blue-300:#92DED5; --blue-200:#B8E8E2; --blue-100:#DFF4F1; --blue-50:#EFFAF8;
  --amber-500:#F5A623; --red-500:#D95C45; --green-500:#2BA471;
  --bg:#F3FAFA; --card:#FFFFFF;
  --ink:#0B2E36; --ink-2:#3D6570; --ink-3:#7C99A1; --ink-4:#A9BEC2;
  --line:#DCEDEE; --line-2:#EAF5F5;
  --grad:linear-gradient(120deg,#12A594 0%,#1E9FC4 100%);
  --grad-soft:linear-gradient(120deg,#EFFAF8 0%,#EAF5F5 100%);
  --sh-1:0 2px 8px rgba(11,110,104,.06);
  --sh-2:0 10px 30px rgba(11,110,104,.09);
  --sh-3:0 20px 50px rgba(11,110,104,.14);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#B8E8E2;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#92DED5}
::-webkit-scrollbar-track{background:transparent}

/* 工作台 */
.wtop{
  background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:50
}
.wtop .wt{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.wtop .wtb{
  padding:3px 9px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);font-size:11.5px;font-weight:700;flex-shrink:0
}
.steps{display:flex;align-items:center;gap:4px;margin-left:6px;overflow-x:auto;flex-shrink:0}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-4);white-space:nowrap;padding:2px 4px;border-radius:7px;transition:.15s}
.step .n{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-4);background:#fff
}
.step.done{color:var(--blue-700)}
.step.done .n{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.step.now{color:var(--blue-800);font-weight:700}
.step.now .n{border-color:var(--blue-600);color:var(--blue-700);box-shadow:0 0 0 3px rgba(11,110,104,.16)}
.step-line{width:14px;height:1.5px;background:var(--line);flex-shrink:0}
.wtop .stag{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 10px;border-radius:999px;
  font-size:11.8px;font-weight:700;color:#8A5A00;background:#FFF6DC;border:1px solid #F4DFA8;white-space:nowrap}
.wtop .stag i{width:6px;height:6px;border-radius:50%;background:var(--amber-500);box-shadow:0 0 0 3px rgba(245,166,35,.18)}
.wtop .stag.done{color:#1E7A4F;background:#E7F6EE;border-color:#BFE6CF}
.wtop .stag.done i{background:#2FA36B;box-shadow:0 0 0 3px rgba(47,163,107,.16)}

.wbody{display:flex;gap:0;height:100vh;min-height:520px;max-width:1800px;margin:0 auto}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.stream{flex:1;overflow-y:auto;padding:22px 26px 8px;scroll-behavior:smooth}
.stream-in{max-width:860px;margin:0 auto}
.msg{display:flex;margin-bottom:20px;gap:12px}
.msg.me{flex-direction:row-reverse}
.avatar-mini{width:32px;height:32px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.msg.me .avatar-mini{background:#1a7a6a;color:#fff}
.bubble{max-width:78%;min-width:0}
.msg.me .bubble{margin-left:auto}
.bubble .txt{
  background:#fff;border:1px solid #e0ebe8;border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.8;color:var(--ink-2);
  box-shadow:0 1px 2px rgba(11,110,104,.05)
}
.msg.me .bubble .txt{background:#1a7a6a;border-color:#1a7a6a;color:#fff}
.bubble .txt h4{font-size:14.5px;font-weight:800;color:var(--ink);margin:0 0 8px}
.msg.me .bubble .txt h4{color:#fff}
.bubble .txt h4:not(:first-child){margin-top:16px}
.bubble .txt p{margin-bottom:8px}
.bubble .txt p:last-child{margin-bottom:0}
.bubble .txt ul{margin:0 0 8px 0;list-style:none}
.bubble .txt li{padding-left:16px;position:relative;margin-bottom:5px}
.bubble .txt li:before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}
.msg.me .bubble .txt li:before{background:rgba(255,255,255,.8)}
.bubble .txt .kv{color:var(--blue-700);font-weight:700}
.msg.me .bubble .txt .kv{color:#fff}
.bubble .txt .mono{font-family:Consolas,monospace;background:var(--line-2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.msg.me .bubble .txt .mono{background:rgba(255,255,255,.2);color:#fff}
.bubble .txt .formula{
  background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;padding:12px 16px;
  font-family:"Cambria Math",Georgia,serif;font-size:14.5px;color:var(--blue-900);margin:12px 0;overflow-x:auto;line-height:1.6
}
.msg.me .bubble .txt .formula{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.bubble .txt .note{
  background:#FFF8E8;border:1px solid #FBE3B8;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#8A5A00;margin:12px 0;line-height:1.7
}
.bubble .txt .next{
  margin-top:12px;padding:9px 13px;border-radius:9px;font-size:13px;line-height:1.72;
  color:var(--blue-800);background:var(--blue-50);border-left:3px solid var(--blue-500)
}
.msg.me .bubble .txt .next{background:rgba(255,255,255,.15);border-left-color:#fff;color:#fff}

.thinking{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);padding:6px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--blue-400);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.arts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.acard{
  display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:13px 16px;cursor:pointer;transition:.18s;text-align:left;box-shadow:var(--sh-1);position:relative;overflow:hidden
}
.acard:hover{border-color:var(--blue-300);transform:translateY(-2px);box-shadow:var(--sh-2)}
.acard.open{border-color:var(--blue-600);box-shadow:0 0 0 3px rgba(11,110,104,.12)}
.acard .ai{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff
}
.acard .at{flex:1;min-width:0}
.acard .at b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.acard .at span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .arrow{color:var(--blue-600);flex-shrink:0;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700}

.composer-bar{border-top:1px solid var(--line);background:#fff;padding:14px 26px 16px}
.composer-bar .cw{max-width:860px;margin:0 auto}
.composer{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);
  transition:.2s;overflow:hidden
}
.composer:focus-within{border-color:var(--blue-400);box-shadow:0 8px 28px rgba(11,110,104,.14)}
.composer textarea{
  display:block;width:100%;padding:16px 18px 6px;min-height:62px;max-height:200px;resize:none;
  font-size:15px;line-height:1.7;color:var(--ink)
}
.composer textarea::placeholder{color:var(--ink-4)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--line-2);background:#F8FCFC}
.cbar .spacer{flex:1}
.hint{font-size:12px;color:var(--ink-4)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s
}
.btn-ghost:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.btn-send{
  display:inline-flex;align-items:center;gap:7px;padding:9px 22px;border-radius:10px;
  background:var(--grad);color:#fff;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(11,110,104,.28);transition:.18s
}
.btn-send:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-send[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;margin-top:10px}
.chip{
  padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);transition:.18s;cursor:pointer
}
.chip:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.chip.on{background:var(--blue-100);border-color:var(--blue-200);color:var(--blue-800);font-weight:600}

/* 抽屉 */
.drawer{
  width:0;flex-shrink:0;border-left:1px solid var(--line);background:#fff;overflow:hidden;transition:width .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column
}
.drawer.on{width:560px}
.drawer.on.wide{width:720px}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.dh h3{font-size:15px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .sub{font-size:11.5px;color:var(--ink-3);display:block;font-weight:500;margin-top:1px}
.db{flex:1;overflow-y:auto;padding:18px;background:var(--bg)}
.db .card{margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.db .card:last-child{margin-bottom:0}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:15.5px;font-weight:700}
.card-h .grow{flex:1}
.card-b{padding:18px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.18s
}
.icon-btn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}

/* 代码 */
.code-box{
  background:#0F1B2D;border-radius:12px;overflow:hidden;font-family:"JetBrains Mono",Consolas,"Courier New",monospace
}
.code-top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#16253C;border-bottom:1px solid #21334F}
.code-top .f{font-size:12px;color:#8FA6C4}
.code-top .grow{flex:1}
.code-top button{padding:5px 10px;border-radius:7px;background:#22344F;color:#B9CBDF;font-size:11.5px;transition:.16s}
.code-top button:hover{background:#2C4363;color:#fff}
pre.code{padding:16px 18px;overflow:auto;max-height:520px;font-size:12.6px;line-height:1.75;color:#D6E4F5}
pre.code .c-kw{color:#6DD6C6}
pre.code .c-com{color:#5C7290;font-style:italic}
pre.code .c-num{color:#F5A623}
pre.code .c-str{color:#9BE0B4}

/* 动画舞台 */
.stage{
  background:linear-gradient(160deg,#0B6E68 0%,#0E8F84 100%);border-radius:var(--r);padding:16px;position:relative;overflow:hidden
}
.stage canvas{width:100%;height:auto;display:block;border-radius:10px;background:#052320}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.play{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(11,110,104,.3)}
.prog{flex:1;height:6px;border-radius:6px;background:var(--line-2);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;height:100%;background:var(--grad);border-radius:6px;width:0%;transition:width .1s linear}
.speed{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:22px;font-weight:800;color:var(--blue-800);margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--green-500);margin-top:3px}

.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th,.dtable td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left}
.dtable th{background:var(--blue-50);color:var(--blue-900);font-weight:700;position:sticky;top:0}
.dtable tbody tr:hover{background:var(--blue-50)}

.doc{padding:0}
.doc h2{font-size:19px;font-weight:800;color:var(--blue-900);margin:0 0 6px}
.doc .dc{font-size:12.5px;color:var(--ink-3);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.doc h3{font-size:15.5px;font-weight:700;margin:22px 0 10px;color:var(--ink);display:flex;align-items:center;gap:8px}
.doc h3:before{content:"";width:3px;height:15px;border-radius:2px;background:var(--grad)}
.doc p{font-size:14px;color:var(--ink-2);line-height:1.85;margin-bottom:12px}
.doc ul{margin:0 0 14px 4px;list-style:none}
.doc li{font-size:14px;color:var(--ink-2);line-height:1.85;padding-left:18px;position:relative;margin-bottom:6px}
.doc li:before{content:"";position:absolute;left:4px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue-400)}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.24s;z-index:200;
  box-shadow:0 8px 28px rgba(0,0,0,.24);display:flex;align-items:center;gap:8px
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){
  .drawer.on{width:440px}
}
@media(max-width:820px){
  .drawer.on{width:100%;position:fixed;inset:0 0 0 0;z-index:70}
}

/* 流程闸门 / 选项按钮 */
.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.abtn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:13.5px;transition:.18s;cursor:pointer}
.abtn:hover{border-color:var(--blue-300);color:var(--blue-700);background:var(--blue-50)}
.abtn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(11,110,104,.24)}
.abtn.pri:hover{filter:brightness(1.06);color:#fff}
.abtn.gh{background:#fff;border-color:var(--blue-200);color:var(--blue-700)}
.abtn.gh:hover{background:var(--blue-50)}
.abtn.used{opacity:.5;pointer-events:none}
.flow-gate{margin-top:12px}
.choice-note{font-size:12px;color:var(--ink-4);margin:10px 0 0;line-height:1.6}
.other-row{display:none;gap:8px;margin-top:10px;align-items:center}
.other-row.on{display:flex}
.other-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px}
.other-row input:focus{border-color:var(--blue-400)}
.picks{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pick{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;transition:.18s}
.pick:hover{border-color:var(--blue-300);background:var(--blue-50);box-shadow:var(--sh-1)}
.pick.sel{border-color:var(--blue-500);background:var(--blue-50);box-shadow:0 0 0 3px rgba(11,110,104,.13)}
.pick.dis{opacity:.45;pointer-events:none}
.pick .pk{
  flex:0 0 26px;height:26px;margin-top:2px;border-radius:8px;background:var(--blue-100);color:var(--blue-700);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px
}
.pick .pb{flex:1;min-width:0}
.pick .pb b{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.pick .pb s{display:block;text-decoration:none;font-size:12.6px;color:var(--ink-3);line-height:1.62}
.pick .pb em{display:block;font-style:normal;font-size:11.6px;color:var(--blue-600);margin-top:5px}
.pick .pgo{
  flex:0 0 auto;padding:6px 12px;border-radius:8px;background:var(--grad);color:#fff;
  font-size:12.5px;font-weight:700;box-shadow:0 2px 7px rgba(11,110,104,.22);cursor:pointer;transition:.16s
}
.pick .pgo:hover{filter:brightness(1.06)}
.pick.sel .pgo{background:#DFF4F1;color:var(--blue-700);box-shadow:none}
.run-acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.run-out{margin-top:12px;background:#0F1B2D;border-radius:10px;padding:12px 14px;font-family:Consolas,monospace;font-size:12.5px;color:#9BE0B4;white-space:pre-wrap;min-height:20px}
.run-out .lbl{display:block;color:#5C7290;font-size:10px;letter-spacing:1px;margin-bottom:6px}
.step.clickable{cursor:pointer}
.step.clickable:hover{color:var(--blue-700)}
.wtop .stag.paused{color:#7A4FB0;background:#F3ECFB;border-color:#E3D2F5}
.wtop .stag.paused i{background:#9B6DD6;box-shadow:0 0 0 3px rgba(155,109,214,.18)}

/* 顶栏流程工具（对齐原型 v2） */
.flow-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.flow-tool{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;transition:.16s
}
.flow-tool:hover{border-color:var(--teal-400);color:var(--teal-700);background:var(--teal-50)}
.flow-tool svg{width:14px;height:14px;flex:0 0 auto}
.other-btn{border-style:dashed!important;background:var(--teal-50)!important}

/* 模型对比表（对齐原型 v2） */
.model-compare{width:100%;margin-top:12px;border-collapse:collapse;font-size:12.5px}
.model-compare th,.model-compare td{padding:9px 10px;border:1px solid var(--line);text-align:left;vertical-align:top}
.model-compare th{background:var(--teal-50);color:var(--teal-700);font-weight:800}
.model-compare td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}

/* 论文风格卡片 / 图片勾选（对齐原型 v2） */
.style-list{display:grid;gap:8px;margin:12px 0}
.style-item{padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.style-item>b{color:var(--teal-700)}
.style-item>span{margin-left:8px;font-size:12px;color:var(--ink-3)}

<script>
/* =============== 工具 =============== */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var toastTimer=null;
function toast(msg){
  var t=$('toast'); t.innerHTML='<span>'+esc(msg)+'</span>'; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('on')},2200);
}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function hl(code){
  return esc(code)
    .replace(/(#[^\n]*)/g,'<span class="c-com">$1</span>')
    .replace(/\b(import|from|def|return|for|in|if|else|elif|while|with|as|class|try|except|lambda|and|or|not|None|True|False|np|pd|plt|math)\b/g,'<span class="c-kw">$1</span>')
    .replace(/('[^']*'|"[^"]*")/g,'<span class="c-str">$1</span>')
    .replace(/\b(\d+\.?\d*(?:e[+-]?\d+)?)\b/gi,'<span class="c-num">$1</span>');
}

/* =============== 物理仿真 =============== */
const R0=0.02, L=0.25, N=21, dr=R0/(N-1);
const lambda=0.5, rho=1000, cp=3500, alpha=lambda/(rho*cp);
const h=25, km=8e-7, Ca=0.02, D0=2.4e-8;
const TAMB=28, TSET=50.165;
const THRESH=0.15;
const END_T=18*3600, dt=2;
const SAMPLE=300; // 每 10 分钟采样一帧
const STEPS=Math.ceil(END_T/dt);
const FRAMES=[];

function Dof(C){ return D0*Math.exp(-0.89*C); }

function simulate(){
  let T=new Array(N).fill(TAMB), C=new Array(N).fill(2.55);
  let R=R0, doneT=null, doneStage='fixed';
  for(let s=0;s<STEPS;s++){
    const t=s*dt;
    const Tair=t<300 ? TAMB+(TSET-TAMB)*(t/300) : TSET;
    const shrink=t>3600 ? Math.exp(-2.8e-5*(t-3600)) : 1; // 问题四演示用
    const Tn=T.slice(), Cn=C.slice();
    // 扩散项
    for(let i=0;i<N;i++){
      const ri=i===0?dr/2:i*dr;
      if(i===0){
        Tn[i]=T[i]+dt*alpha*2*(T[1]-T[0])/(dr*dr);
        Cn[i]=C[i]+dt*Dof(C[i])*2*(C[1]-C[0])/(dr*dr);
      }else if(i===N-1){
        const Ts=(lambda/dr*T[N-2]+h*Tair)/(lambda/dr+h);
        const Cs=(Dof(C[N-1])/dr*C[N-2]+km*Ca)/(Dof(C[N-1])/dr+km);
        Tn[i]=Ts; Cn[i]=Cs;
      }else{
        const lapT=(T[i+1]-2*T[i]+T[i-1])/(dr*dr)+(1/ri)*(T[i+1]-T[i-1])/(2*dr);
        Tn[i]=T[i]+dt*alpha*lapT;
        const Dip=Dof(C[i]), Dim=Dof(C[i-1]), Din=Dof(C[i+1]);
        const Dl=2*Dim*Dip/(Dim+Dip), Dr=2*Dip*Din/(Dip+Din);
        const flux=(ri+dr/2)*Dr*(C[i+1]-C[i])/dr - (ri-dr/2)*Dl*(C[i]-C[i-1])/dr;
        Cn[i]=C[i]+dt*(1/ri)*(flux/dr);
      }
    }
    T=Tn; C=Cn;
    const Cmax=Math.max(...C);
    if(Cmax<THRESH && doneT===null){ doneT=t; doneStage='fixed'; }
    if(s%SAMPLE===0) FRAMES.push({t:t,T:T.slice(),C:C.slice(),Cmax:Cmax,R:R0*shrink,done:doneT!==null});
  }
  return {doneT, finalCmax:Math.max(...C)};
}
const SIM = simulate();

/* =============== 动画绘制 =============== */
var animMode='T';
var playing=false, speed=1, fidx=0, playTimer=null;
function colorT(v){ /* 28~55 映射到青-黄-红 */
  const t=(Math.max(28,Math.min(55,v))-28)/27;
  if(t<0.5){ const r=t*2; return `rgb(${Math.round(18+r*150)},${Math.round(122+r*130)},${Math.round(148-r*40)})`; }
  else{ const r=(t-0.5)*2; return `rgb(${Math.round(168+r*70)},${Math.round(252-r*80)},${Math.round(108-r*40)})`; }
}
function colorC(v){ /* 2.55~0 映射到深蓝-浅青 */
  const t=Math.max(0,Math.min(1,v/2.55));
  return `rgb(${Math.round(5+t*25)},${Math.round(46+t*120)},${Math.round(54+t*140)})`;
}
function drawFrame(){
  const cvs=$('anim-canvas'); if(!cvs) return;
  const ctx=cvs.getContext('2d');
  const W=cvs.width, H=cvs.height, cx=W/2, cy=H/2+10, scale=(W*0.38)/R0;
  const fr=FRAMES[Math.min(Math.max(0,fidx),FRAMES.length-1)];
  ctx.fillStyle='#052320'; ctx.fillRect(0,0,W,H);
  // 截面圆
  const rPx=fr.R*scale;
  ctx.beginPath(); ctx.arc(cx,cy,rPx,0,Math.PI*2);
  ctx.fillStyle='#0a3a36'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.stroke();
  // 径向色带
  for(let i=0;i<N;i++){
    const rv=i/(N-1)*rPx;
    const val=animMode==='T'?fr.T[i]:fr.C[i];
    ctx.beginPath(); ctx.arc(cx,cy,rv,0,Math.PI*2);
    ctx.fillStyle=(animMode==='T'?colorT(val):colorC(val));
    ctx.fill();
  }
  // 外皮
  ctx.beginPath(); ctx.arc(cx,cy,rPx,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2; ctx.stroke();
  // 热气箭头
  const ang=Date.now()/800;
  for(let k=0;k<8;k++){
    const a=ang+k*(Math.PI*2/8);
    const x1=cx+Math.cos(a)*(rPx+18), y1=cy+Math.sin(a)*(rPx+18);
    const x2=cx+Math.cos(a)*(rPx+34), y2=cy+Math.sin(a)*(rPx+34);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  // 读数
  ctx.fillStyle='#fff'; ctx.font='13px sans-serif'; ctx.textAlign='left';
  ctx.fillText('t = '+(fr.t/3600).toFixed(2)+' h', 16, 26);
  ctx.fillText('T_表面 = '+fr.T[N-1].toFixed(1)+' °C', 16, 46);
  ctx.fillText('T_中心 = '+fr.T[0].toFixed(1)+' °C', 16, 66);
  ctx.fillText('C_中心 = '+fr.C[0].toFixed(2)+' kg/kg', 16, 86);
  ctx.fillText('C_最大 = '+fr.Cmax.toFixed(3), 16, 106);
  $('anim-time').textContent=(fr.t/3600).toFixed(2)+' h';
  $('anim-progress').style.width=(fidx/(FRAMES.length-1)*100)+'%';
}
function togglePlay(){
  playing=!playing; $('play-icon').innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M5 3l18 9-18 9z"/>';
  if(playing) playLoop(); else cancelAnimationFrame(playTimer);
}
function playLoop(){
  if(!playing) return;
  fidx+=speed; if(fidx>=FRAMES.length-1){ fidx=FRAMES.length-1; playing=false; $('play-icon').innerHTML='<path d="M5 3l18 9-18 9z"/>'; }
  drawFrame();
  playTimer=requestAnimationFrame(playLoop);
}
function setSpeed(s){ speed=s; document.querySelectorAll('.speed').forEach(b=>b.classList.toggle('on',b.dataset.s==s)); }
function seek(e){ const r=e.target.getBoundingClientRect(); fidx=Math.floor(((e.clientX-r.left)/r.width)*(FRAMES.length-1)); drawFrame(); }
function setMode(m){ animMode=m; drawFrame(); }

/* =============== 对话数据 =============== */
var STEPS_DATA=[
  {label:'问题分析', done:false},
  {label:'候选模型', done:false},
  {label:'生成代码', done:false},
  {label:'可视化', done:false},
  {label:'结果讨论', done:false},
  {label:'论文初稿', done:false}
];

var SCENE=0;
var USER_Q=[
  '先帮我分析中药材热风烘干这道题',
  '热湿耦合的关键假设是什么？',
  '推荐用什么数值方法？',
  '就选方案 A：有限体积法',
  '把代码贴出来看看',
  '运行一下，看看动画',
  '问题三怎么确定达标烘干时间？',
  '问题四的半径收缩怎么处理？',
  '生成论文初稿'
];

/* =============== UI 消息/产物 =============== */
var MSG_HISTORY=[];
function pushMsg(who, html, arts){
  const id='m-'+Date.now()+Math.random();
  const isMe=who==='me';
  const label=isMe?'我':'AI';
  const bubble='<div class="bubble"><div class="txt">'+html+'</div>'+(arts?'<div class="arts">'+arts+'</div>':'')+'</div>';
  const row='<div class="msg '+(isMe?'me':'')+'" id="'+id+'">'+
    '<div class="avatar-mini">'+label+'</div>'+bubble+'</div>';
  $('stream-in').insertAdjacentHTML('beforeend',row);
  $('stream').scrollTop=$('stream').scrollHeight;
  MSG_HISTORY.push({who,html});
  return id;
}
function thinking(callback){
  const id='m-thinking-'+Date.now();
  $('stream-in').insertAdjacentHTML('beforeend',
    '<div class="msg" id="'+id+'"><div class="avatar-mini">AI</div>'+
    '<div class="bubble"><div class="thinking"><i></i><i></i><i></i>演易正在思考…</div></div></div>');
  $('stream').scrollTop=$('stream').scrollHeight;
  setTimeout(function(){
    var el=$(id); if(el){ el.remove(); if(callback) callback(); }
  }, 700);
}

function renderSteps(now){
  MAIN_STEP=now; if(now>MAX_STEP) MAX_STEP=now;
  var labels=['问题分析','关键假设','候选模型','生成代码','可视化','结果讨论','论文初稿'];
  var html='';
  labels.forEach(function(s,i){
    var cls=i<now?'done':(i===now?'now':'');
    var can=i<=MAX_STEP;

var PY_CODE=`import numpy as np

# 参数
R = 0.02          # 半径 m
L = 0.25          # 长度 m
N = 21            # 径向节点
dr = R / (N-1)
lambda_ = 0.5     # W/(m·K)
rho = 1000        # kg/m3
cp = 3500         # J/(kg·K)
alpha = lambda_ / (rho*cp)
h = 25            # W/(m2·K)
km = 8e-7         # m/s
Ca = 0.02         # kg/m3
D0 = 2.4e-8       # m2/s
Tair_end = 50.165
C0, T0 = 2.55, 28.0

def Dof(C): return D0 * np.exp(-0.89*C)

# 初始化
T = np.full(N, T0)
C = np.full(N, C0)
dt = 2.0
done = None

for step in range(int(18*3600/dt)):
    t = step*dt
    Tair = T0 + (Tair_end-T0)*min(t/300, 1)
    Tn, Cn = T.copy(), C.copy()
    for i in range(N):
        if i == 0:
            Tn[i] += dt*alpha*2*(T[1]-T[0])/dr**2
            Cn[i] += dt*Dof(C[i])*2*(C[1]-C[0])/dr**2
        elif i == N-1:
            Tn[i] = (lambda_/dr*T[N-2] + h*Tair)/(lambda_/dr + h)
            Cn[i] = (Dof(C[i])/dr*C[N-2] + km*Ca)/(Dof(C[i])/dr + km)
        else:
            ri = i*dr
            lapT = (T[i+1]-2*T[i]+T[i-1])/dr**2 + (1/ri)*(T[i+1]-T[i-1])/(2*dr)
            Tn[i] += dt*alpha*lapT
            # 水分扩散（调和平均）
            Dp = Dof(C[i]); Dm = Dof(C[i-1]); Dn = Dof(C[i+1])
            Dl = 2*Dm*Dp/(Dm+Dp); Dr = 2*Dp*Dn/(Dp+Dn)
            flux = (ri+dr/2)*Dr*(C[i+1]-C[i])/dr - (ri-dr/2)*Dl*(C[i]-C[i-1])/dr
            Cn[i] += dt*(1/ri)*(flux/dr)
    T, C = Tn, Cn
    if C.max() < 0.15 and done is None:
        done = t/3600
        print(f"达标时间 {done:.2f} h")
print(f"最终最大含水率 {C.max():.4f}")`;

  if(/代码|main\.py/.test(v)){ pushLab(); return; }
  if(/运行|动画|可视化|演示/.test(v)){ afterRun(); return; }
  if(/问题四|半径|收缩|动边界|Landau/.test(v)){ doBoundary(); return; }
  if(/问题三|达标|结果|讨论/.test(v)){ doResult(); return; }
  if(/论文|初稿|摘要|生成论文|风格/.test(v)){ askPaperStyle(); return; }
  advance();
}
function advance(){
  if(phase==='intro'){ doAnalysis(); return; }
  if(phase==='hypothesis'){ doPicks(); return; }
  if(phase==='modelChosen'){ askParameter(); return; }
  if(phase==='viz'){ askResultAngle(); return; }
  if(phase==='result'){ doBoundary(); return; }
  if(phase==='boundary'){ askPaperStyle(); return; }
  if(phase==='paper'){ doPaper(); return; }
  doAnalysis();
}

<!-- ============ 第一幕 · 概述 ============ -->
<section class="scene" id="s1" data-title="一 · 概述 · 中药材热风烘干热湿耦合">
  <div class="wrap">
    <div class="cover">
      <div class="kicker">2026 全国大学生数学建模竞赛 A 题 · 全局分析</div>
      <h1 class="big">中药材热风烘干：圆柱体内的<span class="ac">热湿耦合</span>传热传质
        <small style="display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0">长 25 cm、半径 2 cm 的圆柱药材，初始 28 °C、干基含水率 2.55 kg/kg。热风把表面加热到 50.165 °C，水分沿浓度梯度由内向外迁移，目标是把干基含水率降到 0.15 kg/kg 以下。</small>
      </h1>
      <p class="lead" style="margin:10px auto 0">本题把一根圆柱药材的烘干过程交给一套「温度场 + 含水率场」的双场耦合模型：内部靠导热 λ 与 Fick 扩散 D，表面叠加对流换热 h 与水分蒸发/吸收 km。四个问题沿「预热平衡 → 全过程 → 达标时长 → 动边界收缩」逐层加约束。</p>
    </div>

    <div class="grid4">
      <div class="kpi"><div class="k">圆柱长度 L</div><div class="v">25 <u>cm</u></div><div class="s">轴向均匀，按一维径向处理</div></div>
      <div class="kpi g"><div class="k">圆柱半径 R</div><div class="v">2 <u>cm</u></div><div class="s">径向计算域 0 → 2 cm</div></div>
      <div class="kpi b"><div class="k">初始温度</div><div class="v">28 <u>°C</u></div><div class="s">药材与热风初始同温</div></div>
      <div class="kpi w"><div class="k">初始干基含水率 C₀</div><div class="v">2.55 <u>kg/kg</u></div><div class="s">干燥起点</div></div>
    </div>

    <div class="grid2">
      <div class="canvasbox">
        <div class="cvtop">
          <div class="ct">圆柱药材径向截面示意 · 半径 2 cm</div>
          <div class="legend">
            <span><i class="dot" style="background:#e0a04a"></i>热风环绕加热</span>
            <span><i class="dot" style="background:#12a594"></i>径向位置 0 → 2 cm</span>
          </div>
        </div>
        <canvas id="cvSect" height="340"></canvas>
        <p class="note" style="margin-top:8px">外圈金色箭头表示热风环绕药材表面流动；内部虚线同心环为径向剖面示意。沿半径从中心（0 cm）到表面（2 cm）取 0 / 0.5 / 1.0 / 1.5 / 2.0 cm 五个特征位置，是后续剖面与达标判据的采样点。</p>
      </div>

      <div class="card">
        <h3>题目给定的核心参数 <em>题面与附件</em></h3>
        <table class="tb">
          <tr><th>参数</th><th style="text-align:right">取值</th><th>含义</th></tr>
          <tr><td>圆柱长度 L</td><td class="num">25 cm</td><td>轴向均匀</td></tr>
          <tr><td>圆柱半径 R</td><td class="num">2 cm</td><td>径向计算域 0 → 2 cm</td></tr>
          <tr><td>初始温度</td><td class="num">28 °C</td><td>药材与热风初始同温</td></tr>
          <tr><td>初始干基含水率 C₀</td><td class="num">2.55 kg/kg</td><td>干燥起点</td></tr>
          <tr class="on"><td>干燥目标</td><td class="num">&lt; 0.15 kg/kg</td><td>干基含水率达标阈值</td></tr>
          <tr class="on"><td>热风终温</td><td class="num">50.165 °C</td><td>0–300 s 升温后稳定</td></tr>
          <tr class="on"><td>热风含水率（对应值）</td><td class="num">0.04986 kg/kg</td><td>环境水分载荷</td></tr>
        </table>
        <div class="quote">建立圆柱药材热风烘干的热湿耦合模型，分析温度与含水率随时间、径向位置的变化，并回答预热平衡、全过程、达标时长与半径收缩四个问题。</div>
      </div>
    </div>

    <p class="note"><span class="badge">读题</span>结局指标只有一个：把干基含水率降到 <b class="hl">0.15 kg/kg</b> 以下。四个问题分别是这个目标在「短时预热」「全程变物性」「全域同时达标」「半径随含水率收缩」四种约束下的展开。</p>
  </div>
</section>

<!-- ============ 第二幕 · 物理机理 ============ -->
<section class="scene" id="s2" data-title="二 · 物理机理 · 热湿耦合">
  <div class="wrap">
    <div>
      <div class="kicker">物理机理 · 热湿耦合</div>
      <h1>表面先热、内部后热；水分受浓度梯度由内向外迁移
        <small>温度场与含水率场互相耦合：温度升高加快水分扩散与蒸发，水分蒸发又带走潜热、反作用于温度。</small>
      </h1>
    </div>

    <div class="grid2">
      <div class="canvasbox">
        <div class="cvtop">
          <div class="ct">径向剖面示意 · 温度 T(r) 与含水率 C(r)</div>
          <div class="legend">
            <span><i class="ln" style="background:#12a594"></i>温度剖面</span>
            <span><i class="ln" style="background:#e0a04a"></i>含水率剖面</span>
          </div>
        </div>
        <canvas id="cvProfile" height="340"></canvas>
        <p class="note" style="margin-top:8px">上panel：温度由中心向表面升高（外高内低），1800 s 时中心 33.42 °C、表面 36.59 °C；下panel：含水率由中心向表面降低（内高外低），中心仍保持 2.55，表面降到 1.312 kg/kg。</p>
      </div>

      <div class="card">
        <h3>控制方程 <em>传热 / 传质</em></h3>
        <div class="formula"><span class="c">// 传热：内部导热 λ + 表面对流 h</span>
∂T/∂t = (λ/(ρ·cp))·(1/r)·∂/∂r( r·∂T/∂r )
表面： q = h·(T_air − T_s)   <span class="n">h = 25 W/(m²·K)</span>
T_air: 0–300 s 由 28 °C 升到 <span class="n">50.165 °C</span> 后稳定

<span class="c">// 传质：内部 Fick 扩散 D + 表面蒸发/吸收 km</span>
∂C/∂t = (1/r)·∂/∂r( D·r·∂C/∂r )
表面： j = km·(C_s − C_a)   <span class="n">km = 8×10⁻⁷ m/s</span>
C_a（热风含水率）：最终 <span class="n">0.04986 kg/kg</span></div>
        <p class="small" style="margin-top:10px"><span class="badge q">耦合</span>温度决定扩散系数 D 与表面蒸发速率；蒸发带走潜热又降低表面温度，两场需联立求解。</p>
      </div>
    </div>

    <div class="card">
      <h3>热湿耦合链条 <em>表面 → 内部</em></h3>
      <div class="flowrow">
        <span class="flownode on">热风加热表面</span>
        <span class="flowarrow">→</span>
        <span class="flownode g">表面水分蒸发（km）</span>
        <span class="flowarrow">→</span>
        <span class="flownode">内部形成浓度梯度</span>
        <span class="flowarrow">→</span>
        <span class="flownode">水分由内向外迁移</span>
      </div>
      <p class="small" style="margin-top:10px">表面先失水、内部仍高湿，形成从中心指向表面的浓度梯度，驱动水分持续外迁；这正是「中心含水率几乎不变、表面快速下降」的物理原因。</p>
    </div>

    <div class="grid3">
      <div class="card">
        <h3><span class="badge p">附件1</span>烘房热风环境</h3>
        <p class="small">热风温度 0–300 s 由约 28 °C 升到 <b class="hl-t num">50.165 °C</b> 后稳定。</p>
        <p class="small">热风含水率对应值最终 <b class="num">0.04986 kg/kg</b>，作为表面传质的远场浓度 Cₐ。</p>
      </div>
      <div class="card">
        <h3><span class="badge q">边界条件</span>表面换热 / 传质</h3>
        <p class="small">表面对流换热系数 <b class="hl-t num">h = 25 W/(m²·K)</b>。</p>
        <p class="small">表面传质系数 <b class="hl-g num">km = 8×10⁻⁷ m/s</b>，控制蒸发/吸收强度。</p>
      </div>
      <div class="card">
        <h3><span class="badge n">物性来源</span>附录 2 / 3</h3>
        <p class="small">问题一采用附录 2 的<b>常物性</b>（导热 λ、扩散 D 视为常数）。</p>
        <p class="small">问题二全过程采用附录 3 的<b>变物性</b>，λ 与 D 随温度/含水率变化。</p>
      </div>
    </div>
  </div>
</section>

<!-- ============ 第三幕 · 数值方法 ============ -->
<section class="scene" id="s3" data-title="三 · 数值方法 · 有限体积法 21 节点">
  <div class="wrap">
    <div>
      <div class="kicker">数值方法 · 有限体积法</div>
      <h1>径向 21 节点 + 显式欧拉推进：中心胞元用 dr²/8，表面叠加两类通量
        <small>把连续的圆柱径向方程离散成 21 个控制体，逐时步显式更新温度与含水率。</small>
      </h1>
    </div>

    <div class="grid2">
      <div class="canvasbox">
        <div class="cvtop">
          <div class="ct">径向网格示意 · 21 节点（i = 1 … 21）</div>
          <div class="legend">
            <span><i class="dot" style="background:#12a594"></i>节点</span>
            <span><i class="ln" style="background:#cfe4e4"></i>控制体界面</span>
          </div>
        </div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

/* ===================== 通用工具 ===================== */
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmt(v,dec){ if(dec===undefined)dec=0;
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function setupCanvas(cv,h){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(280,cv.clientWidth||520);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);

}
function roundRect(g,x,y,w,h,r){
  if(h<r) r=h;
  g.beginPath();
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h); g.lineTo(x,y+h); g.lineTo(x,y+r);
  g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
/* 按进度绘制折线（0..1） */
function polyline(g,pts,prog,color,lw){
  var segs=pts.length-1, total=prog*segs;
  g.strokeStyle=color; g.lineWidth=lw; g.lineJoin='round'; g.lineCap='round';
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(var i=0;i<segs;i++){
    var f=clamp(total-i,0,1);
    if(f<=0) break;
    g.lineTo(pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f);
    if(f<1) break;
  }
  g.stroke();
}

/* ===================== 动画引擎 ===================== */
var activeAnims=[];
function stopAllAnims(){
  activeAnims.forEach(function(a){ if(a._raf) cancelAnimationFrame(a._raf); a._raf=null; a._alive=false; });
  activeAnims=[];
}
function runAnim(fn){
  var handle={_raf:null,_alive:true};
  activeAnims.push(handle);
  function loop(ts){
    if(!handle._alive) return;
    fn(ts);
    handle._raf=requestAnimationFrame(loop);
  }
  handle._raf=requestAnimationFrame(loop);
  return handle;
}
/* 连续动画（带入场进度 p，之后持续循环） */
function playLoop(cvId,drawFn,dur){

}
/* 一次性入场动画（p 到 1 后停止） */
function playOnce(cvId,drawFn,dur){
  var cv=document.getElementById(cvId); if(!cv) return;
  if(document.body.classList.contains('reduce')){ drawFn(cv,1,0); return; }
  var h={_raf:null,_alive:true}; activeAnims.push(h);
  var t0=null;
  function step(ts){
    if(!h._alive) return;
    if(t0===null) t0=ts;
    var el=(ts-t0)/1000, p=clamp(el/dur,0,1);
    drawFn(cv,p,el);
    if(p<1) h._raf=requestAnimationFrame(step); else h._raf=null;
  }
  h._raf=requestAnimationFrame(step);
}

    g.beginPath(); g.arc(cx,cy,Rpx*k/5,0,6.2832); g.stroke();

/* ===================== 第二幕：温度/含水率剖面 ===================== */
function drawProfile(cv,p){

/* ===================== 第四幕：四问递进流图 ===================== */
var QINFO=[
  {q:'Q1',t:'预热平衡',m:'0–1800 s · 常物性',d:'短时径向剖面',c:'#12a594'},

function drawPath(cv,p,clk){

        g.strokeStyle='#8fb6bd'; g.lineWidth=2; g.setLineDash([5,3]);

        g.fillStyle='#8fb6bd'; g.beginPath();
        g.moveTo(ax2-2,ay); g.lineTo(ax2-9,ay-5); g.lineTo(ax2-9,ay+5); g.closePath(); g.fill();
        var ph=(clk*0.5+i*0.25)%1, fx=ax1+2+(ax2-6-ax1-2)*ph;

      }

    roundRect(g,x,cy,bw,bh,12); g.fillStyle=QINFO[i].c; g.fill();

}

/* ===================== 第五幕：表面含水率曲线 ===================== */
function drawSurface(cv,p){
  var o=setupCanvas(cv,300), g=o.g, w=o.w, h=o.h;
  g.clearRect(0,0,w,h);
  var L=54,R=26,T=26,B=46,PW=w-L-R,PH=h-T-B;
  function X(t){ return L+PW*t/22; }
  var Ymax=0.7;
  function Y(v){ return T+PH*(1-v/Ymax); }
  // 网格
  g.font='11px "PingFang SC",system-ui,sans-serif';
  [0,0.2,0.4,0.6].forEach(function(v){
    var y=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.beginPath(); g.moveTo(L,y+.5); g.lineTo(L+PW,y+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle'; g.fillText(v.toFixed(1),L-7,y);
  });
  g.strokeStyle='#cfe4e4'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,T); g.lineTo(L,T+PH); g.lineTo(L+PW,T+PH); g.stroke();
  // 轴标题
  g.save(); g.translate(14,T+PH/2); g.rotate(-Math.PI/2);
  g.fillStyle='#57727c'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillText('表面含水率 Cs (kg/kg)',0,0); g.restore();
  // 达标线
  var yt=Y(0.15);
  g.strokeStyle='#b8543a'; g.lineWidth=1.6; g.setLineDash([6,4]);
  g.beginPath(); g.moveTo(L,yt); g.lineTo(L+PW,yt); g.stroke(); g.setLineDash([]);
  g.fillStyle='#b8543a'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='bottom'; g.fillText('达标线 C = 0.15',L+6,yt-4);
  // 数据序列
  var s3=[[6,TAB5[6][4]],[12,TAB5[12][4]],[17,TAB5[17][4]]];
  var s4=[[6,TAB6[6][3]],[12,TAB6[12][3]],[18,TAB6[18][3]],[21,TAB6[21][3]]];
  function toPts(s){ return s.map(function(q){ return [X(q[0]),Y(q[1])]; }); }
  var P3=toPts(s3), P4=toPts(s4);
  polyline(g,P3,p,'#12a594',2.6);
  polyline(g,P4,p,'#e0a04a',2.6);
  var tot3=p*(P3.length-1), tot4=p*(P4.length-1);
  P3.forEach(function(pt,i){ if(i<=tot3+1e-9){ g.fillStyle='#12a594'; g.beginPath(); g.arc(pt[0],pt[1],3.4,0,6.2832); g.fill(); g.strokeStyle='#fff'; g.lineWidth=1.3; g.stroke(); } });
  P4.forEach(function(pt,i){ if(i<=tot4+1e-9){ g.fillStyle='#e0a04a'; g.beginPath(); g.arc(pt[0],pt[1],3.4,0,6.2832); g.fill(); g.strokeStyle='#fff'; g.lineWidth=1.3; g.stroke(); } });
  // 端点标注
  if(p>0.92){
    g.font='600 11.5px "PingFang SC",system-ui,sans-serif'; g.textAlign='center';
    g.fillStyle='#0b6e68'; g.textBaseline='top';
    g.fillText('16.87 h',X(17),Y(s3[2][1])+8);
    g.fillStyle='#8a6313'; g.textBaseline='bottom';
    g.fillText('21.49 h',X(21),Y(s4[3][1])-8);
  }
  // x 刻度
  g.textAlign='center'; g.textBaseline='top'; g.fillStyle='#8aa3aa'; g.font='11px "PingFang SC",system-ui,sans-serif';

  g.fillStyle='#57727c'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.fillText('烘干时间 (h)',L+PW/2,h-16);
}

/* ===================== KPI count-up ===================== */
var kpiStarted=false;
function startKPIs(){
  if(kpiStarted) return; kpiStarted=true;
  var els=$$('.bigkpi .bk-v[data-cnt]');
  if(document.body.classList.contains('reduce')){
    els.forEach(function(el){
      var u=el.querySelector('.bk-u'); el.innerHTML=fmt(parseFloat(el.dataset.cnt),parseInt(el.dataset.dec||'0',10))+(u?u.outerHTML:'');
    });
    return;
  }
  els.forEach(function(el){
    var target=parseFloat(el.dataset.cnt), dec=parseInt(el.dataset.dec||'0',10);
    var u=el.querySelector('.bk-u'), unitHtml=u?u.outerHTML:'';
    var t0=performance.now(), dur=1200;
    (function step(t){
      var pr=clamp((t-t0)/dur,0,1);
      el.innerHTML=fmt(target*easeOutCubic(pr),dec)+unitHtml;
      if(pr<1) requestAnimationFrame(step);
    })(performance.now());
  });
}
function resetKPIs(){
  kpiStarted=false;
  $$('.bigkpi .bk-v[data-cnt]').forEach(function(el){
    var u=el.querySelector('.bk-u'); el.innerHTML=fmt(0,parseInt(el.dataset.dec||'0',10))+(u?u.outerHTML:'');
  });
}

/* ===================== 幕调度 ===================== */
var SCENES=$$('.scene'), N=SCENES.length, cur=-1;
var st={last:0,armed:false,fired:0};
var sceneStarters=[
  function(){ playLoop('cvSect',drawSect,0.9); },
  function(){ playOnce('cvProfile',drawProfile,1.3); },
  function(){ playOnce('cvMesh',drawMesh,1.1); },
  function(){ playLoop('cvPath',drawPath,1.1); },
  function(){ playOnce('cvSurface',drawSurface,1.3); startKPIs(); }
];
function resetScene(sc){
  stopAllAnims();
  $$('.wrap > *',sc).forEach(function(b){ b.classList.remove('stg','in'); });
  resetKPIs();
}
function goTo(i){
  i=Math.max(0,Math.min(N-1,i));
  if(i===cur) return;
  if(cur>=0){ SCENES[cur].classList.remove('active'); }
  cur=i;
  var sc=SCENES[i];
  resetScene(sc);
  sc.scrollTop=0;
  sc.classList.add('active');
  $('#scTitle').textContent=sc.dataset.title||'';
  $$('#dots .dot').forEach(function(d,k){ d.classList.toggle('on',k===i); });
  $('#pgNow').textContent=i+1;
  $('#prog').style.width=(N<=1?100:(i/(N-1))*100)+'%';
  st.armed=false;
  if(sceneStarters[i]) sceneStarters[i]();
}
function setReduce(v){
  document.body.classList.toggle('reduce',v);
  var b=$('#btnFx'); b.classList.toggle('on',!v); b.textContent=v?'动效 关':'动效 开';
  $$('.wrap > *').forEach(function(e){ if(v) e.classList.remove('stg'); });
  stopAllAnims();
  if(cur>=0){ resetKPIs(); sceneStarters[cur](); }
}
function init(){
  var dots='', i;
  for(i=0;i<N;i++) dots+='<button class="dot" data-i="'+i+'" title="第 '+(i+1)+' 幕"></button>';
  $('#dots').innerHTML=dots;
  $('#pgAll').textContent=N;
  $('#dots').addEventListener('click',function(e){
    var t=e.target.closest?e.target.closest('.dot'):null; if(t) goTo(+t.dataset.i);
  });
  $('#btnNext').onclick=function(){ goTo(cur+1); };
  $('#btnPrev').onclick=function(){ goTo(cur-1); };
  $('#btnReplay').onclick=function(){ resetScene(SCENES[cur]); if(sceneStarters[cur]) sceneStarters[cur](); };
  $('#btnFx').onclick=function(){ setReduce(!document.body.classList.contains('reduce')); };
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea') return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); goTo(cur+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); goTo(cur-1); }
    else if(k===' '){ e.preventDefault(); goTo(cur+1); }
    else if(k==='Home'){ e.preventDefault(); goTo(0); }
    else if(k==='End'){ e.preventDefault(); goTo(N-1); }
    else if(k==='r'||k==='R'){ $('#btnReplay').click(); }
    else if(k>='1'&&k<='9'&&+k<=N){ e.preventDefault(); goTo(+k-1); }
  });
  window.addEventListener('wheel',function(e){
    var sc=SCENES[cur]; if(!sc) return;
    var max=sc.scrollHeight-sc.clientHeight;
    var atTop=sc.scrollTop<=1, atBot=max<=4||sc.scrollTop>=max-1;
    var want=e.deltaY>0?1:-1;
    var edge=(max<=4)||(want>0&&atBot)||(want<0&&atTop);
    if(!edge){ st.armed=false; st.last=Date.now(); return; }
    e.preventDefault();
    var now=Date.now(), dt=now-st.last;
    if(!st.armed){ st.armed=true; st.last=now; return; }
    if(dt>280 && now-st.fired>1100 && Math.abs(e.deltaY)>=8){
      st.fired=now; st.armed=false; goTo(cur+want);
    }
    st.last=now;
  },{passive:false});
  setReduce(false);
  goTo(0);
}
window.addEventListener('resize',function(){
  if(cur>=0 && sceneStarters[cur]){ stopAllAnims(); sceneStarters[cur](); }
});
init();
window.__deck={goTo:goTo,get cur(){return cur;}};
})();
</script>

  --gold:#e0a04a; --gold-d:#8a6313; --warn:#b8543a; --warn-bg:#fbf0ec;
  --sh:0 1px 2px rgba(11,46,54,.05),0 8px 24px rgba(11,46,54,.06);
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.72 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
b,strong{font-weight:600;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;left:0;right:0;top:0;height:56px;z-index:40;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{font-size:12.5px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.brand i{font-style:normal;color:var(--teal);font-weight:600}
.scene-title{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--teal-d);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px}
.tbtn{
  font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.18s;
}
.tbtn:hover{border-color:var(--teal);color:var(--teal-d)}
.tbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* ---------- 舞台与幕 ---------- */
#stage{position:fixed;left:0;right:0;top:56px;bottom:76px;overflow:hidden}
.scene{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 28px;
  opacity:0;visibility:hidden;transform:translateY(22px) scale(.994);
  transition:opacity .45s ease,transform .5s cubic-bezier(.22,.8,.3,1),visibility .45s;
}
.scene::-webkit-scrollbar{width:9px}
.scene::-webkit-scrollbar-thumb{background:#cfe4e4;border-radius:9px}
.scene.active{opacity:1;visibility:visible;transform:none}
.wrap{max-width:1180px;margin:0 auto}
.wrap>*{margin-bottom:16px}
.wrap>*:last-child{margin-bottom:0}

/* 逐拍露出 */
.wrap>.stg{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.22,.8,.3,1)}
.wrap>.stg.in{opacity:1;transform:none}

/* ---------- 文字块 ---------- */
.kicker{font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:600;text-transform:uppercase}
h1{font-size:26px;line-height:1.4;margin:6px 0 8px;font-weight:600;letter-spacing:-.01em}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:0}
.lead{font-size:15px;color:var(--ink2);line-height:1.85;max-width:960px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--teal-d);display:flex;align-items:center;gap:8px}
.card h3 em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.card p{margin:0 0 8px;font-size:14px;color:var(--ink2);line-height:1.8}
.card p:last-child{margin-bottom:0}
.quote{
  font-size:14px;line-height:1.9;color:var(--ink);background:var(--line2);
  border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 14px;margin:10px 0;
}
.small{font-size:12.5px;color:var(--muted);line-height:1.75}
.hl{color:var(--warn);font-weight:600}
.hl-t{color:var(--teal-d);font-weight:600}
.hl-g{color:var(--gold-d);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flexrow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.grow{flex:1;min-width:320px}
@media(max-width:960px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .scene{padding:16px 14px 24px}
}

/* ---------- 徽标 ---------- */
.badge{display:inline-block;font-size:11px;line-height:1.6;padding:1px 7px;border-radius:5px;
  background:var(--line2);color:var(--blue);border:1px solid #d5e8ea;margin-right:6px;white-space:nowrap}
.badge.p{background:#fdf4e8;color:var(--gold-d);border-color:#f0dcbb}
.badge.q{background:#eef7f6;color:var(--teal-d);border-color:#cfe7e5}
.badge.w{background:var(--warn-bg);color:var(--warn);border-color:#f0d5cd}
.badge.n{background:#f6f8f9;color:var(--muted);border-color:#e3eaec}

/* ---------- 指标 ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--teal);opacity:.6}
.kpi.g::before{background:var(--gold)}
.kpi.w::before{background:var(--warn)}
.kpi.b::before{background:var(--blue)}
.kpi .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em;margin-bottom:3px}
.kpi .v{font-size:19px;font-weight:600;color:var(--teal-d);line-height:1.3}
.kpi .v u{text-decoration:none;font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi.g .v{color:var(--gold-d)}
.kpi.b .v{color:var(--blue)}
.kpi.w .v{color:var(--warn)}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}

/* ---------- 表格 ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:left}
table.tb th{font-size:11.5px;color:var(--muted);font-weight:600;background:#fafdfd;letter-spacing:.03em}
table.tb td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tb tr.on td{background:#eef8f6}
table.tb tr:hover td{background:#f6fbfb}

/* ---------- 图区 ---------- */
.canvasbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 8px;box-shadow:var(--sh)}
.canvasbox canvas{display:block;width:100%}
.cvtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.cvtop .ct{font-size:13px;font-weight:600;color:var(--teal-d)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:3px;width:16px;border-radius:2px;vertical-align:3px}
.legend i.dn{height:11px;width:11px;border-radius:50%;border:2px solid;background:transparent}

/* ---------- 提示条 ---------- */
.note{
  font-size:12.5px;color:var(--muted);background:#fafdfd;border:1px dashed var(--line);
  border-radius:9px;padding:9px 12px;line-height:1.75;
}
.note.w{background:var(--warn-bg);border-color:#eed8d1;color:#8d4229}
.hint{font-size:12px;color:var(--teal-d);background:#eef8f6;border-radius:8px;padding:7px 11px;display:inline-block}

/* ---------- 底栏 ---------- */
.navbar{
  position:fixed;left:0;right:0;bottom:0;height:76px;z-index:40;
  display:flex;align-items:center;justify-content:center;gap:16px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
}
.navbar button.nb{
  font:inherit;font-size:19px;line-height:1;width:40px;height:40px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.18s;
}
.navbar button.nb:hover{border-color:var(--teal);color:var(--teal-d);background:#f4fbfa}
#dots{display:flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#cfe4e4;border:0;padding:0;cursor:pointer;transition:.2s}
.dot:hover{background:var(--cyan)}
.dot.on{background:var(--teal-d);width:24px;border-radius:5px}
.pageind{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.pageind b{color:var(--teal-d);font-size:14px}
.progwrap{position:fixed;left:0;right:0;top:56px;height:2px;background:transparent;z-index:41}
#prog{height:2px;background:linear-gradient(90deg,var(--teal),var(--cyan));width:0;transition:width .45s ease}
.kbd{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}
.splitnav{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:12px;white-space:nowrap}
.splitnav a{color:var(--ink2);text-decoration:none;padding:4px 7px;border:1px solid var(--line);border-radius:6px}
.splitnav a:hover{color:var(--teal-d);border-color:var(--teal)}
.splitnav a.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff;font-weight:600}

/* 动效总开关 */
body.reduce .pulse,body.reduce .blink,body.reduce .floaty,body.reduce .shimmer{animation:none !important}
body.reduce .wrap>.stg{transition:none}
body.reduce .wrap>.stg{opacity:1;transform:none}
body.reduce .scene{transition:none}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shimmer{
  background:linear-gradient(110deg,transparent 0%,transparent 40%,rgba(18,165,148,.18) 50%,transparent 60%,transparent 100%);
  background-size:200% 100%;animation:shimmer 2.4s linear infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.floaty{animation:floaty 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.0)}50%{box-shadow:0 0 0 6px rgba(18,165,148,.10)}}
.glow{animation:glow 2.4s ease-in-out infinite}

/* 公式块 */
.formula{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  background:#0b2e36;color:#cdeee9;border-radius:10px;padding:14px 16px;
  font-size:13.5px;line-height:1.85;overflow:auto;white-space:pre;
  box-shadow:inset 0 0 0 1px rgba(127,216,201,.15),0 6px 18px rgba(11,46,54,.12);
}
.formula .c{color:#7fd8c9}
.formula .y{color:#e0a04a}
.formula .w{color:#ffb59d}
.formula .dim{opacity:.5}

/* hero 区 */
.hero{
  display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:stretch;
}
@media(max-width:960px){.hero{grid-template-columns:1fr}}
.heroleft{display:flex;flex-direction:column;gap:14px}
.heroright{
  position:relative;background:#0b2e36;border-radius:var(--r);overflow:hidden;
  box-shadow:0 8px 26px rgba(11,46,54,.18);min-height:340px;
}
.heroright canvas{position:absolute;inset:0;width:100%;height:100%}
.herolabel{
  position:absolute;left:14px;top:12px;color:#cdeee9;font-size:12px;letter-spacing:.06em;
  font-weight:600;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.5)
}
.herosublabel{
  position:absolute;right:14px;bottom:12px;color:rgba(205,238,233,.7);font-size:11.5px;z-index:2;
  text-align:right;line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,.5)
}

/* 大号 KPI（结论幕） */
.bigkpi{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  position:relative;overflow:hidden;box-shadow:var(--sh);
}
.bigkpi::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:50%;background:radial-gradient(circle,rgba(18,165,148,.10),transparent 70%);}
.bigkpi.g::after{background:radial-gradient(circle,rgba(224,160,74,.14),transparent 70%);}
.bigkpi .bk-k{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase}
.bigkpi .bk-v{font-size:32px;font-weight:700;color:var(--teal-d);line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.bigkpi.g .bk-v{color:var(--gold-d)}
.bigkpi .bk-u{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.bigkpi .bk-sub{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.6}

/* 流程节点 */
.flowrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flownode{
  font-size:12px;padding:6px 11px;border-radius:8px;background:#fff;border:1px solid var(--line);
  color:var(--ink2);font-weight:600;position:relative;
}
.flownode.on{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
.flowarrow{color:var(--cyan);font-size:14px;font-weight:700}

/* 装饰条 */
.decochips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.decochip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.decochip.t{background:#eef7f6;color:var(--teal-d)}
.decochip.g{background:#fdf4e8;color:var(--gold-d)}
.decochip.w{background:var(--warn-bg);color:var(--warn)}

</style>
</head>

<main id="stage">

<!-- ============== 第一幕 · 问题一概述 ============== -->
<section class="scene" id="s1" data-title="一 · 问题一概述">
<div class="wrap">
  <div class="stg">
    <div class="kicker">2026 全国大学生数学建模竞赛 A 题 · 问题一</div>
    <h1>预热平衡阶段：<span class="hl-t">0–1800s</span> 的温度与水分场
      <small>药材热风烘干刚开始的 1800 秒，采用附录 2 的常物性参数。此阶段热量主要用于整体升温，温度场呈「外高内低」，水分几乎不流失。</small>
    </h1>
  </div>

  <div class="hero stg">
    <div class="heroleft">
      <div class="card">
        <h3>问题一研究什么 <em>preheat · 0–1800s</em></h3>
        <p>研究圆柱形药材被热风加热初期 <b class="hl-t">0–1800s</b> 的<b>预热平衡阶段</b>：物料由初温 28℃ 缓慢升温，内部建立径向温度梯度。</p>
        <p class="small">采用<b>附录 2 常物性参数</b>（不随温度/含水率变化），是后续问题二、三变物性分析的基准工况。</p>
        <div class="decochips">
          <span class="decochip t">预热阶段</span>
          <span class="decochip t">常物性</span>
          <span class="decochip g">外高内低</span>
          <span class="decochip w">水分少流失</span>
        </div>
      </div>
      <div class="card">
        <h3>建模对象 <em>圆柱状药材</em></h3>
        <p><b class="hl-t">几何</b>：圆柱体，长 L=25cm，半径 R=2cm</p>
        <p><b class="hl-t">初始条件</b>：温度 28℃；干基含水率 C₀=2.55 kg/kg</p>
        <p><b class="hl-t">环境（附件1）</b>：热风温度 0–300s 由约 28℃ 升至 50.165℃ 后稳定</p>
      </div>
    </div>
    <div class="heroright">
      <div class="herolabel">圆柱径向截面 · 节点 0 / 0.5 / 1 / 1.5 / 2 cm</div>
      <div class="herosublabel">0–1800s 预热平衡<br>附录 2 常物性</div>
      <canvas id="cvHero"></canvas>
    </div>
  </div>

  <div class="grid4 stg">
    <div class="kpi"><div class="k">初始温度 T₀</div><div class="v">28 <u>℃</u></div><div class="sub">全场均匀</div></div>
    <div class="kpi b"><div class="k">研究时长</div><div class="v">1800 <u>s</u></div><div class="sub">预热平衡阶段</div></div>
    <div class="kpi g"><div class="k">初始含水率 C₀</div><div class="v">2.55 <u>kg/kg</u></div><div class="sub">干基</div></div>
    <div class="kpi"><div class="k">物性参数</div><div class="v">附录 <u>2</u></div><div class="sub">常物性</div></div>
  </div>

  <div class="quote stg">问题一聚焦<b class="hl-t">预热平衡阶段</b>：0–1800s 内热风持续向物料传热，温度整体上升并形成外高内低的径向梯度，而含水率变化主要局限在近表面薄层，中心含水率基本保持 2.55。</div>
</div>
</section>

<!-- ============== 第二幕 · 模型与参数 ============== -->
<section class="scene" id="s2" data-title="二 · 模型与参数">
<div class="wrap">
  <div class="stg">
    <div class="kicker">模型与参数 · 附录 2 常物性</div>
    <h1>热湿耦合：能量方程 与 水分扩散方程
      <small>沿圆柱半径方向建模：温度由径向导热 + 表面对流换热控制，含水率由内部扩散 + 表面蒸发控制。</small>
    </h1>
  </div>

  <div class="grid2 stg">
    <div class="card">
      <h3>能量方程 <em>heat</em></h3>
      <div class="formula">∂(ρ·cp·T)/∂t = (1/r)·∂/∂r( r·λ·∂T/∂r )

边界 r=R：
  −λ·∂T/∂r = <span class="c">h</span>·(T − T_air)
  <span class="dim">/* 表面对流换热 h=25 W/(m²·K) */</span>

中心 r=0：∂T/∂r = 0 <span class="dim">（对称）</span></div>
    </div>
    <div class="card">
      <h3>水分扩散方程 <em>moisture</em></h3>
      <div class="formula">∂C/∂t = (1/r)·∂/∂r( r·D·∂C/∂r )

扩散系数：
  D = <span class="y">7×10⁻⁹</span>·e^(−0.89·C)  m²/s

边界 r=R：
  −D·∂C/∂r = <span class="w">km</span>·(C − C_air)
  <span class="dim">/* 对流传质 km=8×10⁻⁷ m/s */</span></div>
    </div>
  </div>

  <div class="canvasbox stg">
    <div class="cvtop">
      <div class="ct">径向温度剖面示意：外圈热、内圈冷</div>
      <div class="legend">
        <span><i style="background:#12a594"></i>内圈 · 中心较冷</span>
        <span><i style="background:#e0a04a"></i>外圈 · 表面较热</span>
        <span><i class="ln" style="background:#146c87"></i>T(r) 剖面 @1800s</span>
      </div>
    </div>
    <canvas id="cvProfile"></canvas>
    <p class="note" style="margin-top:8px">中心 33.42℃ → 表面 36.59℃，径向温差约 <b class="hl">3.17℃</b>；热量由表面向内传导，越靠近中心升温越滞后，形成稳定的「外高内低」梯度。</p>
  </div>

  <div class="card stg">
    <h3>附录 2 常物性参数 <em>数值方法：有限体积法</em></h3>
    <table class="tb">
      <tr><th>参数</th><th>符号</th><th class="num">取值</th><th>说明</th></tr>
      <tr><td>密度</td><td>ρ</td><td class="num">820 kg/m³</td><td>药材表观密度</td></tr>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var D1=window.D1, TAB1=window.TAB1, TAB2=window.TAB2;
var POS=[0,0.5,1,1.5,2];
var TLAB=['100','300','600','900','1200','1500','1800'];

/* ============== 通用工具 ============== */
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmt(v,dec){
  if(dec===undefined)dec=0;
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function setupCanvas(cv){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520);
  var h=parseFloat(cv.style.height)||cv._h||260;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  return {g:g,w:w,h:h,dpr:dpr};
}
/* 带白底的标签，避免与网格/曲线互相遮挡 */
function tag(g,x,y,text,col,align){
  g.font='600 11px "PingFang SC",system-ui,sans-serif';
  var tw=g.measureText(text).width;
  var bx=(align==='right')?(x-tw-10):(x-2);
  g.fillStyle='rgba(255,255,255,.95)';
  g.fillRect(bx,y-9,tw+10,18);
  g.strokeStyle='#d9e9e9'; g.lineWidth=1; g.strokeRect(bx+.5,y-8.5,tw+9,17);
  g.fillStyle=col; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text,bx+5,y);
}

/* ============== 动画引擎 ============== */
var activeAnims=[];
function stopAllAnims(){
  activeAnims.forEach(function(a){ if(a._raf) cancelAnimationFrame(a._raf); a._raf=null; });
  activeAnims=[];
}
function runAnim(fn){
  var handle={_raf:null,_alive:true};
  activeAnims.push(handle);
  function loop(t){
    if(!handle._alive) return;
    fn(t);
    handle._raf=requestAnimationFrame(loop);
  }
  handle._raf=requestAnimationFrame(loop);
  return handle;
}

/* ============== 第一幕 · 圆柱径向截面 hero ============== */
var heroT0=null;
function drawHero(t){
  var cv=$('#cvHero');
  if(!cv) return;
  if(cv._h===undefined) cv._h=360;
  var st=setupCanvas(cv), g=st.g, w=st.w, h=st.h;
  g.clearRect(0,0,w,h);
  var tNow=(t-heroT0)/1000;

  var bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#0b2e36'); bg.addColorStop(.55,'#0e3a44'); bg.addColorStop(1,'#0b2e36');
  g.fillStyle=bg; g.fillRect(0,0,w,h);

  for(var i=0;i<46;i++){
    var sx=((i*97.13)%w), sy=((i*53.7)%(h-20))+10;
    var tw=0.5+0.5*Math.sin(tNow*1.1+i*0.6);
    g.fillStyle='rgba(205,238,233,'+(0.06+0.18*tw)+')';
    g.fillRect(sx,sy,1.5,1.5);
  }

  var cx=w*0.44, cy=h*0.5, Rr=Math.min(w*0.30,h*0.40);

  var gr=g.createRadialGradient(cx,cy,2,cx,cy,Rr);
  gr.addColorStop(0,'#0f8f84');
  gr.addColorStop(.5,'#c98f43');
  gr.addColorStop(1,'#e8794a');
  g.fillStyle=gr;
  g.beginPath(); g.arc(cx,cy,Rr,0,Math.PI*2); g.fill();

  var pulse=0.5+0.5*Math.sin(tNow*1.6);
  g.strokeStyle='rgba(127,216,201,'+(0.15+0.25*pulse)+')'; g.lineWidth=2;
  g.beginPath(); g.arc(cx,cy,Rr+6+pulse*3,0,Math.PI*2); g.stroke();

  for(var k=0;k<3;k++){
    var u=((tNow*0.25+k*0.333)%1);
    g.strokeStyle='rgba(205,238,233,'+(0.28*(1-u))+')'; g.lineWidth=1.4;
    g.beginPath(); g.arc(cx,cy,Rr*(1-u),0,Math.PI*2); g.stroke();
  }

  for(var n=1;n<=4;n++){
    g.strokeStyle='rgba(255,255,255,.28)'; g.lineWidth=1; g.setLineDash([4,5]);
    g.beginPath(); g.arc(cx,cy,Rr*n/4,0,Math.PI*2); g.stroke();
  }
  g.setLineDash([]);

  /* 径向标尺（+x） */
  g.strokeStyle='rgba(205,238,233,.5)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Rr+26,cy); g.stroke();
  g.font='10.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='alphabetic';
  for(var q=0;q<POS.length;q++){
    var px=cx+Rr*q/4;
    g.beginPath(); g.arc(px,cy,3,0,Math.PI*2);
    g.fillStyle='#fff'; g.fill();
    g.fillStyle='rgba(205,238,233,.9)';
    g.fillText(String(POS[q]), px, cy-8);
  }
  g.fillStyle='rgba(205,238,233,.75)';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('r (cm)', cx+Rr+12, cy-14);

  /* 热风箭头（由外指向表面） */
  var angs=[-0.55,0.15,0.85];
  for(var a=0;a<angs.length;a++){
    var th=angs[a];
    var x0=cx+Math.cos(th)*(Rr+42), y0=cy+Math.sin(th)*(Rr+42);
    var x1=cx+Math.cos(th)*(Rr+8),  y1=cy+Math.sin(th)*(Rr+8);
    g.strokeStyle='rgba(255,181,157,.9)'; g.lineWidth=2;
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
    var hx=x1-x0, hy=y1-y0, ll=Math.sqrt(hx*hx+hy*hy)||1;
    hx/=ll; hy/=ll;
    g.beginPath();
    g.moveTo(x1,y1);
    g.lineTo(x1-hx*8-hy*4, y1-hy*8+hx*4);
    g.lineTo(x1-hx*8+hy*4, y1-hy*8-hx*4);
    g.closePath(); g.fillStyle='rgba(255,181,157,.95)'; g.fill();
  }
  g.fillStyle='rgba(255,181,157,.95)';
  g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('热风 · h=25', cx+Rr+16, cy-Rr*0.6);

  /* 底部信息 */
  g.fillStyle='rgba(205,238,233,.7)';
  g.font='11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText('圆柱药材  L = 25 cm   R = 2 cm', 14, h-46);

  g.fillStyle='rgba(127,216,201,.16)'; g.fillRect(0,h-26,w,26);
  g.fillStyle='rgba(205,238,233,.9)';
  g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='middle';

<section class="scene" id="s1" data-title="第一幕 · 问题二概述">
<div class="wrap">
  <div class="stg">
    <div class="kicker">问题二分析 · 全过程热湿耦合演化</div>
    <h1>问题二：0–16.87 h 全过程的热湿耦合演化
      <small>采用附录3 的变物性参数，追踪圆柱药材从预热升温到整体干燥的完整过程。</small>
    </h1>
    <p class="lead">问题一在<b>附录2 常物性</b>下只分析了前 0.5 h 的短时预热；问题二则要求刻画<b class="hl-t">全过程</b>——从室温 28 °C 被热风加热、到中心与表面温度趋同、再到含水率整体下降到目标水位（C=0.15）的 <b class="hl">0–16.87 h</b>。控制方程仍为圆柱一维径向的导热与导湿耦合，但物性改用<b class="hl">附录3 的变物性</b>：扩散系数与导热系数都随温度、含水率变化，其中扩散系数的温度依赖项 <b class="hl">e^(−3850/T)</b> 让干燥速率对温度极其敏感。</p>
  </div>
  <div class="stg grid2">
    <div class="card">
      <h3><span class="badge q">问题定位</span>问题二研究什么</h3>
      <p>药材为圆柱体，长 <b class="num">L=25 cm</b>、半径 <b class="num">R=2 cm</b>，初始温度 <b class="num">28 °C</b>、初始干基含水率 <b class="num">C₀=2.55 kg/kg</b>。</p>
      <p>变量是径向位置 r（0→R）与时间 t（0→16.87 h）上的温度场 <b>T(r,t)</b> 与含水率场 <b>C(r,t)</b>；输出 5 个径向位置（0/0.5/1/1.5/2 cm）随时间的演化。</p>
    </div>
    <div class="card">
      <h3><span class="badge p">关键设定</span>烘房环境与目标</h3>
      <p>烘房热风温度在前 <b class="num">0–300 s</b> 由室温升到 <b class="num">50.165 °C</b> 后稳定；热风含水率对应值最终降到 <b class="num">0.04986 kg/kg</b>。</p>
      <p>干燥目标是让整体最大含水率 <b class="num">C<sub>max</sub></b> 降到目标水位 <b class="hl">0.15 kg/kg</b>——全过程实测用时 <b class="hl-t">16.87 h</b>，这也为问题三的工艺时间设定了基准。</p>
    </div>
  </div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">圆柱药材截面示意 · 一维径向网格（L=25 cm，R=2 cm，21 节点）</div>
        <div class="legend">
          <span><i style="background:#12a594"></i>热湿耦合体</span>
          <span><i style="background:#146c87"></i>圆柱轴向</span>
          <span><i style="background:#e0a04a"></i>热风 / 蒸发边界</span>
        </div>
      </div>
      <canvas id="cvCyl" height="250"></canvas>
      <p class="note" style="margin-top:8px">左图为横截面（俯视 r 方向）：含水率与温度在径向分层，中心 r=0、表面 r=R=2 cm 是两个极端位置；右图为圆柱轴向（L=25 cm）侧视。热风自上而下掠过表面，表面同时发生对流换热（h=25 W/(m²·K)）与水分蒸发（k<sub>m</sub>=8×10⁻⁷ m/s）。</p>
    </div>
  </div>
  <div class="stg grid4" id="s1KPI"></div>
</div>
</section>

<section class="scene" id="s2" data-title="第二幕 · 模型与变物性">
<div class="wrap">
  <div class="stg">
    <div class="kicker">模型与变物性</div>
    <h1>常物性 → 变物性：温度因子 e^(−3850/T) 改写干燥全过程
      <small>附录3 让 D 随温度与含水率双重变化，λ、ρcp 也随含水率漂移——比附录2 的常数更贴近真实。</small>
    </h1>
    <p class="lead">问题一用附录2 的常物性：<b class="num">λ=0.36 W/(m·K)</b>、<b class="num">D=7×10⁻⁹·e^(−0.89C)</b>——扩散系数只随含水率变化、<b class="hl">没有温度项</b>。问题二改用附录3 的变物性：D 多了一个 <b class="hl">e^(−3850/T)</b> 因子，温度每变化都强烈改变扩散速率；λ 与 ρcp 也随含水率 C 变化。这正是「全过程」与「短时预热」在机理上的分水岭。</p>
  </div>
  <div class="stg grid2">
    <div class="card">
      <h3><span class="badge n">附录2</span>常物性 <em>问题一所用</em></h3>
      <p>导热系数 <b class="num">λ = 0.36 W/(m·K)</b>，为常数，不随温度与含水率变化。</p>
      <p>扩散系数 <b class="num">D = 7×10⁻⁹ · e^(−0.89C)</b> m²/s，仅随含水率指数衰减，<b class="hl">不含温度项</b>。</p>
      <p class="small">模型简单，适合短时预热段的快速估算，但无法刻画升温对扩散的加速作用。</p>
    </div>
    <div class="card">
      <h3><span class="badge q">附录3</span>变物性 <em>问题二所用</em></h3>
      <p>导热系数 <b class="num">λ = 0.21 + 0.38C/(C+1)</b> W/(m·K)，随含水率上升而增大。</p>
      <p>扩散系数 <b class="num">D = 2.4×10⁻³ · e^(−0.45C) · e^(−3850/T<sub>K</sub>)</b> m²/s，<b class="hl">温度依赖强烈</b>。</p>
      <p class="small">热容项 <b class="num">ρcp=(650+128C)(1450+2736C/(C+1))</b> 也随含水率漂移，物性更贴近真实湿物料。</p>
    </div>
  </div>
  <div class="stg">
    <div class="card">
      <h3>控制方程 · 变物性 · 边界与数值方法</h3>
      <div class="formula">控制方程（圆柱一维径向，热湿耦合）：
  <span class="c">∂(ρcp·T)/∂t = (1/r)·∂/∂r( r·λ·∂T/∂r )</span>
  <span class="c">∂C/∂t        = (1/r)·∂/∂r( r·D·∂C/∂r )</span>

变物性（附录3）：
  D   = 2.4e-3 · e^(−0.45C) · e^(−3850/T_K)      m²/s   ← 强温度依赖
  λ   = 0.21 + 0.38C/(C+1)                        W/(m·K)
  ρcp = (650 + 128C)·(1450 + 2736C/(C+1))

边界（r = R）：
  −λ·∂T/∂r = h·(T − T_air),   h  = 25 W/(m²·K)
  −D·∂C/∂r = km·(C − C_air),  km = 8e-7 m/s

数值方法：
  有限体积法 21 节点；中心胞元取 dr²/8；
  表面通量 = 内部扩散补给 − 表面蒸发；显式欧拉 dt = 0.5 s</div>
    </div>
  </div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">扩散系数 D 随含水率的变化（单位 ×10⁻⁹ m²/s，附录2 常物性 vs 附录3 变物性）</div>
        <div class="legend">
          <span><i class="ln" style="background:#b8543a"></i>附录3 · 50 °C</span>
          <span><i class="ln" style="background:#146c87;border-top:1px dashed #146c87"></i>附录3 · 28 °C</span>
          <span><i class="ln" style="background:#12a594;border-top:1px dashed #12a594"></i>附录2 · 常物性</span>
        </div>
      </div>
      <canvas id="cvDprop" height="280"></canvas>
      <p class="note" style="margin-top:8px" id="dNote"></p>
    </div>
  </div>
  <div class="stg grid4" id="s2KPI"></div>
</div>
</section>

<section class="scene" id="s3" data-title="第三幕 · 温度场">
<div class="wrap">
  <div class="stg">
    <div class="kicker">温度场 · 全天温度演化</div>
    <h1>中心温度约 8 h 达到 50 °C 并趋于稳定
      <small>中心 Tc、表面 Ts、环境 Ta 三条曲线在 50.16 °C 平台汇合——径向温差由 3.17 °C 收敛到 0.13 °C。</small>
    </h1>
    <p class="lead">环境热风在 0–300 s 内由 28 °C 升到 <b class="num">50.165 °C</b> 后稳定。表面温度紧跟环境快速上升（对流换热 h=25），中心温度靠径向导热「追赶」：0.5 h 时中心仅 32.03 °C、表面已 35.20 °C；随后温差不断收窄，约 <b class="hl">5.5 h</b> 中心逼近 50 °C，约 <b class="hl">8 h</b> 后稳定在 50.16 °C 平台，与表面、环境完全趋同。</p>
  </div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">全过程温度曲线（横轴：时间 h）</div>
        <div class="legend">
          <span><i class="ln" style="background:#b8543a"></i>中心 Tc</span>
          <span><i class="ln" style="background:#146c87;border-top:1px dashed #146c87"></i>表面 Ts</span>
          <span><i class="ln" style="background:#e0a04a;border-top:1px dashed #e0a04a"></i>环境 Ta</span>
        </div>
      </div>
      <canvas id="cvTemp" height="280"></canvas>
      <p class="note" style="margin-top:8px" id="tempNote"></p>
    </div>
  </div>
  <div class="stg">
    <div class="card">
      <h3>各时刻 5 个径向位置的温度 <em>r = 0 / 0.5 / 1 / 1.5 / 2 cm（单位：°C）</em></h3>
      <table class="tb" id="tab3Box"></table>
      <p class="note" style="margin-top:10px">同一时刻从中心到表面温度依次升高，说明热量由表面向中心传导；随干燥推进，同名行内 5 个数值逐渐接近，表明径向温度梯度持续减小、物料内部趋于热均匀。</p>
    </div>
  </div>
  <div class="stg grid4" id="s3KPI"></div>
</div>
</section>

<section class="scene" id="s4" data-title="第四幕 · 水分场">
<div class="wrap">
  <div class="stg">
    <div class="kicker">水分场 · 含水率演化</div>
    <h1>先表面失水、后中心跟上：整体含水率单调下降
      <small>表面含水率 0.5 h 就从 2.55 降到 1.56，中心仍保持 2.55；16.87 h 整体降到目标水位 0.15。</small>
    </h1>
    <p class="lead">含水率演化与温度场<b class="hl">强耦合</b>：表面先被热风加热并快速蒸发失水，中心含水率暂时保持不变，形成明显的径向水分梯度；随着水分由中心向表面迁移（导湿系数 D 随温度上升而变大），中心开始「跟进」下降，径向梯度在干燥中后期逐渐减小。全过程 <b class="num">C<sub>max</sub></b>（=中心含水率）由 2.55 单调降到 <b class="hl">0.15</b>，Surface 由 2.55 降到约 <b class="hl">0.11</b>。</p>
  </div>
  <div class="stg">
    <div class="canvasbox">
      <div class="cvtop">
        <div class="ct">全过程含水率曲线（横轴：时间 h，含目标水位线 C=0.15）</div>
        <div class="legend">
          <span><i class="ln" style="background:#b8543a"></i>中心 Cc</span>
          <span><i class="ln" style="background:#146c87;border-top:1px dashed #146c87"></i>表面 Cs</span>
          <span><i style="background:rgba(18,165,148,.22)"></i>整体 Cmax（上包络）</span>
        </div>
      </div>
      <canvas id="cvMoist" height="290"></canvas>
      <p class="note" style="margin-top:8px" id="moistNote"></p>
    </div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

var T=D23.t, TC=D23.Tc, TS=D23.Ts, TA=D23.Ta, CC=D23.Cc, CS=D23.Cs, CM=D23.Cmax;

/* ---- 动画工具：逐帧绘制 ---- */
function animDraw(cv,drawFn,dur){
  var start=performance.now();
  function frame(t){
    var p=Math.min(1,(t-start)/dur);
    var eased=1-Math.pow(1-p,3);
    drawFn(eased);
    if(p<1) requestAnimationFrame(frame);
  }
  if(document.body.classList.contains('reduce')) drawFn(1);
  else requestAnimationFrame(frame);
}

/* ---- 通用绘图底座（含网格、轴、序列、渐变填充） ---- */
function plot(cv,cfg){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520), h=cfg.h||220;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  var L=cfg.L||44, R=cfg.R||(cfg.y2?54:16), Tp=cfg.T||18, B=cfg.B||26;
  var PW=w-L-R, PH=h-Tp-B, n=cfg.n;
  var ymin=cfg.yMin, ymax=cfg.yMax;
  function X(i){ return L+PW*(n<=1?0:i/(n-1)); }
  function Y(v){ return Tp+PH*(1-(v-ymin)/(ymax-ymin)); }
  var Y2=null;
  if(cfg.y2){ Y2=function(v){ return Tp+PH*(1-(v-cfg.y2.min)/(cfg.y2.max-cfg.y2.min)); }; }
  var progress=cfg.progress||1;
  if(cfg.band){
    g.fillStyle=cfg.band.c;
    g.fillRect(L,Y(cfg.band.hi),PW,Math.max(0,Y(cfg.band.lo)-Y(cfg.band.hi)));
  }
  g.font='11.5px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var k;
  for(k=0;k<=4;k++){
    var v=ymin+(ymax-ymin)*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(fmt(v,cfg.yFmt),L-7,yy);
  }
  if(cfg.hlines) cfg.hlines.forEach(function(hl){
    var yy=Y(hl.v);
    g.save(); g.setLineDash([5,4]); g.strokeStyle=hl.c||'#b8543a'; g.lineWidth=hl.w||1.3;
    g.beginPath(); g.moveTo(L,yy); g.lineTo(L+PW,yy); g.stroke(); g.restore();
    if(hl.label){
      g.font='600 11.5px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      g.textAlign='left'; g.textBaseline='alphabetic';
      var mt=g.measureText?g.measureText(hl.label):null;
      var tw=(mt&&mt.width)?mt.width:hl.label.length*12;
      g.fillStyle='rgba(255,255,255,.95)';
      g.fillRect(L+3,yy-19,tw+12,16);
      g.strokeStyle='rgba(217,233,233,.95)'; g.lineWidth=1;
      g.strokeRect(L+3.5,yy-18.5,tw+11,15);
      g.fillStyle=hl.c||'#b8543a';
      g.fillText(hl.label,L+9,yy-7);
    }
  });
  if(cfg.xTicks) cfg.xTicks.forEach(function(t){
    var xx=X(t.i);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,Tp); g.lineTo(xx,Tp+PH); g.stroke();
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(t.t,xx,Tp+PH+16);
  });
  (cfg.series||[]).forEach(function(s){
    var drawN=Math.max(1,Math.ceil(s.d.length*progress));
    var yy=s.ax==='y2'?Y2:Y, pv=null;
    g.beginPath();
    for(var i=0;i<drawN;i++){
      var px=X(i),py=yy(s.d[i]);
      if(!i) g.moveTo(px,py);
      else if(s.step){ g.lineTo(px,pv); g.lineTo(px,py); }
      else g.lineTo(px,py);
      pv=py;
    }
    if(s.fill){
      g.save(); g.lineTo(X(drawN-1),Tp+PH); g.lineTo(X(0),Tp+PH); g.closePath();
      g.fillStyle=s.fill; g.fill(); g.restore();
    }
    g.strokeStyle=s.c; g.lineWidth=s.w||1.8;
    if(s.dash) g.setLineDash(s.dash); else g.setLineDash([]);
    g.lineJoin='round'; g.stroke(); g.setLineDash([]);
  });
  if(cfg.tags) cfg.tags.forEach(function(t){
    note(g,t.text,X(t.i),Y(t.v),
         {right:L+PW,left:L+2,top:Tp+2,line:t.line,tc:t.tc,up:t.up});
  });
  g.strokeStyle='#d9e9e9'; g.lineWidth=1;
  g.beginPath(); g.moveTo(L,Tp); g.lineTo(L,Tp+PH); g.lineTo(L+PW,Tp+PH); g.stroke();
  function fmt(v,f){
    if(f==='pct') return (v*100).toFixed(0)+'%';
    if(f==='sci') return v===0?'0':v.toExponential(1);
    if(f==='x') return v.toFixed(2);
    if(f==='k') return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);
    if(f===0) return v.toFixed(0);
    if(typeof f==='number') return v.toFixed(f);
    return String(Math.round(v));
  }
}
function note(g,text,px,py,o){
  o=o||{};
  var dy=o.up===undefined?24:o.up, dx=o.dx===undefined?8:o.dx;
  g.font='600 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var mt=g.measureText?g.measureText(text):null;
  var tw=(mt&&mt.width)?mt.width:text.length*12;
  var x=px+dx, y=py-dy;
  if(o.right!==undefined && x+tw+14>o.right && o.left!==undefined) x=px-dx-tw-12;
  if(o.left!==undefined && x<o.left) x=o.left;
  if(o.top!==undefined && y<o.top) y=py+12;
  g.fillStyle='rgba(255,255,255,.96)'; g.fillRect(x,y,tw+12,18);
  g.strokeStyle=o.line||'#cfe4e4'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,tw+11,17);
  g.fillStyle=o.tc||'#0b6e68'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text,x+6,y+9);
}
