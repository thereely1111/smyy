<body>
<header class="topbar">
  <div class="brand">数模演易 · <i>2026 国赛 A 题 · 中药材热风烘干</i></div>
  <div class="scene-title" id="scTitle">加载中</div>
  <div class="tools">
    <button class="tbtn on" id="btnFx">动效 开</button>
    <button class="tbtn" id="btnReplay">重播本幕</button>
  </div><div class="splitnav"><a href="./mod-p1-0.html">全局分析</a><a href="./mod-p1-1.html">问题一</a><a href="./mod-p1-2.html">问题二</a><a href="./mod-p1-3.html" class="on">问题三</a><a href="./mod-p1-4.html">问题四</a></div>
</header>
<div class="progwrap"><div id="prog"></div></div>
<main id="stage">

<!-- ============== 第一幕 问题三概述 ============== -->
<section class="scene" id="s1" data-title="一 · 问题三概述：各处含水率降到 0.15 需多久">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第一幕</div>
      <h1>让每一处都干到 0.15 以下，要烘多久？
        <small>圆柱药材 R=2 cm、L=25 cm，初始温度 28 °C、初始干基含水率 C0=2.55 kg/kg。问题三要求给出「药材各处干基含水率均降到 0.15 kg/kg 以下所需的烘干时长」。</small>
      </h1>
      <p class="lead">热风先接触到表面，水分从表层向环境迁移；内部的水分只能靠<b class="hl-t">传质扩散</b>慢慢往外走。所以同一时刻，<b class="hl">中心（r=0）的含水率永远最高、永远是最后一个达标的点</b>。问题三的核心就是：全程模拟烘干过程，盯住这个最慢的点，看它什么时候降到 0.15 以下。</p>
    </div>

    <div class="grid4 stg" id="ovKpi"></div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">药材圆柱截面 · 径向位置与水分迁移方向</div>
        <div class="legend">
          <span><i style="background:#12a594"></i>药材截面 r∈[0,2 cm]</span>
          <span><i style="background:#b8543a"></i>热风带走表层水分</span>
        </div>
      </div>
      <canvas id="cvCylinder" height="240"></canvas>
      <p class="note" style="margin-top:8px"><span class="badge">几何</span>药材为圆柱体：长 L=25 cm、半径 R=2 cm，可视为沿轴向一致的二维轴对称问题。水分先由表面蒸发，中心处的水分必须先扩散 2 cm 才能离开药材，因此中心最难干燥。</p>
    </div>

    <div class="grid2 stg">
      <div class="card">
        <h3>问题三题面要求 <em>逐字摘录</em></h3>
        <div class="quote">「建立中药材热风烘干过程中水分扩散与传热耦合模型，求药材各处干基含水率均降到 0.15 kg/kg 以下所需的烘干时长。」</div>
        <p class="small">与问题二共用同一套附录 3 变物性模型，区别在于：问题二看过程，问题三找「全部达标」的临界时间。</p>
      </div>
      <div class="card">
        <h3>关键事实 <em>本题所有数字的依据</em></h3>
        <p><b class="hl-t">几何</b>：圆柱 R=2 cm、L=25 cm；半径方向 5 个取样位置 0 / 0.5 / 1 / 1.5 / 2 cm。</p>
        <p><b class="hl-g">初始</b>：温度 28 °C，干基含水率 C0 = 2.55 kg/kg。</p>
        <p><b class="hl">边界</b>：热风 0–300 s 升到 50.165 °C 后稳定；表面换热系数 h=25、传质系数 km=8e-7。</p>
        <p class="small">数值方法：有限体积法 21 节点、时间步长 dt=0.5 s。</p>
      </div>
    </div>
  </div>
</section>

<!-- ============== 第二幕 判定思路 ============== -->
<section class="scene" id="s2" data-title="二 · 判定思路：为什么盯住 Cmax 最慢点">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第二幕</div>
      <h1>判定准则：盯住最慢的那个点
        <small>「各处均 &lt; 0.15」等价于「含水率最大的那一处 &lt; 0.15」。因为中心最难干燥、含水率始终最高，所以只要盯住整体最大含水率 Cmax 即可。</small>
      </h1>
      <p class="lead">如果把每个位置各自的达标时间都算一遍会很繁琐，而且结论相同——<b class="hl-t">最慢达标的点（中心）一旦达标，其余位置必然已经达标</b>。所以判据可以大幅简化：</p>
    </div>

    <div class="card stg">
      <div class="formula">
        <span class="fx">判据：</span> C<sub>max</sub>(t) = max<sub>r∈[0,R]</sub> C(r,t)　，　所需时长 T<sub>dry</sub> = min{ t : C<sub>max</sub>(t) &lt; 0.15 }<br>
        由于 C<sub>max</sub>(t) 随时间<b class="hl-t">单调下降</b>，首次穿越 0.15 的时刻即为答案，无需反复试探。
      </div>
    </div>

    <div class="flowrow stg">
      <div class="flowstep"><div class="ft"><span class="fn">1</span>全程模拟</div><div class="fd">用附录 3 变物性模型（21 节点有限体积法）模拟 0 → 17 h 的完整烘干过程。</div></div>
      <span class="flowarrow">→</span>
      <div class="flowstep"><div class="ft"><span class="fn">2</span>追踪 Cmax</div><div class="fd">每个时刻扫描全部径向节点，取出含水率最大者，得到 Cmax(t) 曲线。</div></div>
      <span class="flowarrow">→</span>
      <div class="flowstep"><div class="ft"><span class="fn">3</span>首次穿越 0.15</div><div class="fd">在 Cmax(t) 曲线上找到它第一次落到 0.15 kg/kg 以下的时刻。</div></div>
      <span class="flowarrow">→</span>
      <div class="flowstep"><div class="ft"><span class="fn">4</span>读出时长</div><div class="fd">该时刻即所需烘干时长 —— 结果为 <b class="hl-g">16.87 h</b>。</div></div>
    </div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">中心 vs 表面：中心含水率始终最高</div>
        <div class="legend">
          <span><i class="ln" style="background:#12a594"></i>Cmax / 中心含水率 Cc</span>
          <span><i class="ln" style="background:#1e9fc4"></i>表面含水率 Cs</span>
          <span><i class="ln" style="background:#b8543a"></i>达标阈值 0.15 kg/kg</span>
        </div>
      </div>
      <canvas id="cvGap" height="260"></canvas>
      <p class="note" style="margin-top:8px"><span class="badge q">最慢点</span>同一时刻中心含水率始终高于表面（如 6 h：中心 1.1591、表面 0.6384），且两条曲线的差距在前 6 h 拉开最大。中心值下降最慢，因此它决定了整批药材何时全部达标。</p>
    </div>

    <div class="grid2 stg">
      <div class="card">
        <h3>为什么中心最慢 <em>扩散需要时间</em></h3>
        <p>表面直接与热风接触，水分以对流蒸发方式迅速离开；而中心处的水分要穿过约 2 cm 的药材才能到达表面。含水率梯度越大，扩散通量越大，但中心始终是水分的「最后一站」。</p>
        <p class="small">因此径向含水率剖面呈「中心高、表面低」的单调分布，中心即全局最大含水率所在。</p>
      </div>
      <div class="card">
        <h3>单调性保证答案唯一 <em>不需求解器反复试探</em></h3>
        <p>Cmax(t) 从 C0=2.55 单调下降，不会反弹。所以「首次穿越 0.15」的时刻既是充分条件也是必要条件，答案唯一且不需要在各位置间分别比较。</p>
        <div class="quote"><span class="badge q">结论</span>Cmax(t) 单调下降 ⇒ 首次达到 0.15 的时刻 = 各处全部达标所需的最短时间。</div>
      </div>
    </div>
  </div>
</section>

<!-- ============== 第三幕 Cmax 阈值搜索 ============== -->
<section class="scene" id="s3" data-title="三 · Cmax 阈值搜索：16.87 h 首次穿越">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第三幕</div>
      <h1>Cmax(t) 下穿 0.15：读出 16.87 h
        <small>把问题二算出的全过程曲线取每一时刻的最大含水率，得到 Cmax(t)。它一路下降，在 16.87 h 处第一次触及 0.15 kg/kg，这就是所需烘干时长。</small>
      </h1>
      <p class="lead">曲线在 0 → 6 h 下降最陡（水分快速流失），之后逐渐变缓（进入降速干燥阶段）。整条曲线穿过红色阈值线的那一点，就是问题三要求的时间。</p>
    </div>

    <div class="grid4 stg" id="searchKpi"></div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">Cmax(t) 随时间下降 · 首次穿越阈值 0.15</div>
        <div class="legend">
          <span><i class="ln" style="background:#12a594"></i>Cmax 整体最大含水率</span>
          <span><i class="ln" style="background:#b8543a"></i>达标阈值 0.15 kg/kg</span>
          <span><i style="background:#e0a04a"></i>穿越点 16.87 h</span>
        </div>
      </div>
      <canvas id="cvCmax" height="300"></canvas>
      <p class="note" style="margin-top:8px"><span class="badge p">判读</span>Cmax 从初始 2.55 一路单调下降到 16.87 h 时的 0.150。前 6 h 内已降到约 1.12（降幅过半），后段显著放缓。穿越发生在曲线最右端，说明整体达标是一步步逼近的过程。</p>
    </div>

    <div class="grid2 stg">
      <div class="card">
        <h3>穿过阈值那一刻的分布 <em>16.87 h</em></h3>
        <table class="tb">
          <tr><th>径向位置</th><th class="num">含水率 kg/kg</th><th>状态</th></tr>
          <tr class="on"><td>0 cm（中心）</td><td class="num">0.1500</td><td><span class="badge w">恰好达标</span></td></tr>
          <tr><td>0.5 cm</td><td class="num">0.1475</td><td><span class="badge q">已达标</span></td></tr>
          <tr><td>1.0 cm</td><td class="num">0.1402</td><td><span class="badge q">已达标</span></td></tr>
          <tr><td>1.5 cm</td><td class="num">0.1287</td><td><span class="badge q">已达标</span></td></tr>
          <tr><td>2.0 cm（表面）</td><td class="num">0.1139</td><td><span class="badge q">已达标</span></td></tr>
        </table>
        <p class="small">中心恰好压线 0.15，其余位置均已低于阈值——印证了「中心决定总时长」。</p>
      </div>
      <div class="card">
        <h3>搜索过程要点 <em>为何 16.83 h 还不够</em></h3>
        <p>16.83 h 时 Cmax = 0.1509，尚未跌破 0.15；到 16.87 h 时 Cmax = 0.150，恰好满足「低于 0.15」。</p>
        <p><b class="hl-t">时间步长 dt=0.5 s</b> 保证了穿越点的时间分辨足够精细，取整报告为 <b class="hl-g">16.87 h</b>。</p>
        <div class="quote"><span class="badge">模型</span>D = 2.4e-3·e<sup>−0.45C</sup>·e<sup>−3850/T<sub>K</sub></sup>；λ = 0.21+0.38C/(C+1)；ρcp = (650+128C)(1450+2736C/(C+1))。含水率越低扩散系数越小，这正是后期降速干燥的原因。</div>
      </div>
    </div>
  </div>
</section>

<!-- ============== 第四幕 各位置达标对照 ============== -->
<section class="scene" id="s4" data-title="四 · 各位置达标对照：越靠外越先达标">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第四幕</div>
      <h1>径向剖面：越靠外越先达标
        <small>取 6 h、12 h、16.87 h 三个时刻，比较 5 个径向位置（0 / 0.5 / 1 / 1.5 / 2 cm）的含水率，看干燥如何由表及里推进。</small>
      </h1>
      <p class="lead">每个时刻的剖面都呈「中心高、表面低」的单调分布；随时间推移整条剖面整体下移，直到 16.87 h 时最靠内的中心也压到 0.15 以下。</p>
    </div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">径向含水率剖面 · 三个时刻对照</div>
        <div class="legend">
          <span><i style="background:#e0a04a"></i>6 h</span>
          <span><i style="background:#1e9fc4"></i>12 h</span>
          <span><i style="background:#12a594"></i>16.87 h</span>
          <span><i class="ln" style="background:#b8543a"></i>达标阈值 0.15</span>
        </div>
      </div>
      <canvas id="cvProfile" height="300"></canvas>
      <p class="note" style="margin-top:8px"><span class="badge">由表及里</span>6 h 时只有表面（0.6384）明显下降、中心仍高达 1.1591；12 h 时全剖面下移（中心 0.3423、表面 0.2309）；16.87 h 时整条剖面全部落在 0.15 以下，最外侧先达标、中心最后压线。</p>
    </div>

    <div class="grid2 stg">
      <div class="card">
        <h3>径向含水率对照表 <em>单位 kg/kg</em></h3>
        <table class="tb">
          <tr><th>时刻</th><th class="num">0 cm</th><th class="num">0.5 cm</th><th class="num">1 cm</th><th class="num">1.5 cm</th><th class="num">2 cm</th></tr>
          <tr><td>6 h</td><td class="num">1.1591</td><td class="num">1.1146</td><td class="num">0.9938</td><td class="num">0.8252</td><td class="num">0.6384</td></tr>
          <tr><td>12 h</td><td class="num">0.3423</td><td class="num">0.3343</td><td class="num">0.3112</td><td class="num">0.2756</td><td class="num">0.2309</td></tr>
          <tr class="on"><td>16.87 h</td><td class="num">0.1500</td><td class="num">0.1475</td><td class="num">0.1402</td><td class="num">0.1287</td><td class="num">0.1139</td></tr>
        </table>
        <p class="small">每行从左到右递减；每列从上到下递减。表格中右下角（表面、16.87 h）最低，左上角（中心、6 h）最高。</p>
      </div>
      <div class="card">
        <h3>剖面的三个特征 <em>读表要点</em></h3>
        <p><b class="hl-t">① 单调剖面</b>：任意时刻含水率都随半径增大而减小，验证中心为最大点。</p>
        <p><b class="hl-g">② 差距先扩大后收敛</b>：6 h 时中心−表面 = 0.5207，12 h 时缩小到 0.1114，16.87 h 时仅 0.0361。</p>
        <p><b class="hl">③ 后期整条剖面被「抬」到阈值以下</b>：16.87 h 中心 0.1500 恰好达标，其余四个位置 0.1139–0.1475 均有富余。</p>
      </div>
    </div>
  </div>
</section>

<!-- ============== 第五幕 结论 ============== -->
<section class="scene" id="s5" data-title="五 · 结论：所需烘干时长 16.87 h">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题 3 · 第五幕</div>
      <h1>结论汇总：所需烘干时长 16.87 h
        <small>以整体最大含水率 Cmax<0.15 为判据，得到各处均达标所需的烘干时长为 16.87 h。中心恰好压线，是决定总时长的关键点。</small>
      </h1>
    </div>

    <div class="bigkpi stg">
      <div class="bnum"><span class="bv">16.87</span><span class="bu">h</span></div>
      <div class="bcol">
        <div class="bl">药材各处干基含水率均降到 <b class="hl-t">0.15 kg/kg 以下</b>所需的烘干时长。</div>
        <div class="bsub">判据：Cmax &lt; 0.15 kg/kg；此时中心 0.1500、0.5 cm 处 0.1475、1 cm 处 0.1402、1.5 cm 处 0.1287、表面 0.1139。</div>
      </div>
    </div>

    <div class="grid4 stg" id="sumKpi"></div>

    <div class="grid2 stg">
      <div class="card">
        <h3>关键结论 <em>三条主线</em></h3>
        <p><b class="hl-t">① 中心决定总时长</b>：中心含水率始终最高、下降最慢，16.87 h 时它恰好压线 0.1500，其余位置早已达标。因此取 Cmax 作判据既简洁又严格。</p>
        <p><b class="hl-g">② 前 6 h 水分下降最快</b>：Cmax 从 2.55 迅速降到约 1.12（降幅约 56%），是失去自由水的快速干燥段。</p>
        <p><b class="hl">③ 后期进入降速干燥阶段</b>：变物性模型下含水率越低扩散系数越小，曲线明显趋平，最后的达标时刻被推迟到 16.87 h。</p>
      </div>
      <div class="card">
        <h3>各位置达标情况 <em>16.87 h 时刻</em></h3>
        <table class="tb">
          <tr><th>径向位置</th><th class="num">含水率</th><th>是否 &lt; 0.15</th></tr>
          <tr class="on"><td>0 cm（中心）</td><td class="num">0.1500</td><td>恰好达标</td></tr>

(function(){

/* ---------------- 画图基础工具 ---------------- */
function prepCanvas(cv,h){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  return {g:g,w:w,h:h};
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function kpi(v,k,cls){ return '<div class="kpi '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

R.cvCylinder=function(cv){
  var d=prepCanvas(cv,240), g=d.g, w=d.w, h=d.h;
  var cx=Math.min(w*0.28,330), cy=h/2+6;
  var RP=86;
  var t=animTime();

  /* 背景径向渐变 */
  var grd=g.createRadialGradient(cx,cy,4,cx,cy,RP);
  grd.addColorStop(0,'#f3fafa'); grd.addColorStop(1,'#e6f6f3');
  g.fillStyle=grd; g.beginPath(); g.arc(cx,cy,RP,0,6.2832); g.fill();

  /* 同心圆环 + 中心点 */
  [0.25,0.5,0.75].forEach(function(fr){
    g.strokeStyle='#cfe7e5'; g.lineWidth=1.2;
    g.beginPath(); g.arc(cx,cy,RP*fr,0,6.2832); g.stroke();
  });

  g.beginPath(); g.arc(cx,cy,RP,0,6.2832); g.stroke();

  /* 中心脉动点 */
  if(!document.body.classList.contains('reduce')){
    var pulse=0.5+0.5*Math.sin(t*2.5);
    g.fillStyle='#b8543a'; g.globalAlpha=0.18+pulse*0.16;
    g.beginPath(); g.arc(cx,cy,7+pulse*5,0,6.2832); g.fill(); g.globalAlpha=1;
  }
  g.fillStyle='#b8543a'; g.beginPath(); g.arc(cx,cy,4,0,6.2832); g.fill();

  /* 刻度与标签 */
  var labs=[['0','中心'],['0.5',''],['1',''],['1.5',''],['2','表面']];
  g.font='10.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='center';
  labs.forEach(function(L,i){
    var rx=cx+RP*(i/4);
    g.strokeStyle='#12a594'; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(rx,cy-4); g.lineTo(rx,cy+4); g.stroke();
    g.fillStyle=L[1]?'#12a594':'#57727c';
    g.textBaseline='alphabetic';
    g.fillText(L[0],rx,cy+18);

  g.textAlign='center'; g.textBaseline='alphabetic';

  /* 表面逆流箭头 */
  var ang=-Math.PI*0.75;
  g.save();
  g.strokeStyle='#b8543a'; g.lineWidth=2;
  g.beginPath(); g.moveTo(cx+Math.cos(ang)*RP,cy+Math.sin(ang)*RP);
  g.lineTo(cx+Math.cos(ang)*(RP+30),cy+Math.sin(ang)*(RP+30)); g.stroke();
  g.translate(cx+Math.cos(ang)*(RP+30),cy+Math.sin(ang)*(RP+30)); g.rotate(ang);
  g.fillStyle='#b8543a'; g.beginPath(); g.moveTo(-7,-4); g.lineTo(0,0); g.lineTo(-7,4); g.closePath(); g.fill();
  g.restore();

  /* 右侧信息块 */
  var bx=Math.max(cx+RP+60,470), by=cy-52;

/* ---------------- 第二幕 中心 / 表面 曲线 ---------------- */
R.cvGap=function(cv){
  var T=D23.t, Cc=D23.Cc, Cs=D23.Cs, n=T.length;
  var d=prepCanvas(cv,260), g=d.g, w=d.w, h=d.h;
  var L=58, Rr=26, Tp=22, B=38, PW=w-L-Rr, PH=h-Tp-B;
  var xmax=17.4, ymax=2.7;
  function X(v){ return L+PW*(Math.min(v,xmax)/xmax); }
  function Y(v){ return Tp+PH*(1-v/ymax); }

  /* 网格 */
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=5;k++){
    var v=ymax*k/5, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(1),L-7,yy);
  }
  g.save(); g.setLineDash([]); g.strokeStyle='#d9e9e9';
  g.beginPath(); g.moveTo(L,Tp+PH); g.lineTo(L+PW,Tp+PH); g.stroke(); g.restore();

  /* X 轴刻度 */
  [0,3,6,9,12,15].forEach(function(xv){
    var xx=X(xv);
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(xv+' h',xx,Tp+PH+18);
  });

  /* 阈值线 0.15 */
  var ty=Y(0.15);
  g.save(); g.setLineDash([5,4]); g.strokeStyle='#b8543a'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(L,ty); g.lineTo(L+PW,ty); g.stroke(); g.restore();
  g.fillStyle='#b8543a'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='bottom';
  g.fillText('阈值 0.15 kg/kg',L+4,ty-4);

  /* 渐进绘制 */
  var prog=Math.min(1, stP()/2.0);
  var drawN=Math.max(1,Math.floor(n*prog));

  /* 表面曲线填充 */
  g.fillStyle='rgba(30,159,196,.10)';
  g.beginPath();
  for(var i=0;i<drawN;i++){ var px=X(T[i]),py=Y(Cs[i]); if(i===0)g.moveTo(px,py); else g.lineTo(px,py); }
  g.lineTo(X(T[drawN-1]),Tp+PH); g.lineTo(X(T[0]),Tp+PH); g.closePath(); g.fill();

  /* 中心曲线 */
  g.strokeStyle='#12a594'; g.lineWidth=2.6; g.lineJoin='round';
  g.beginPath();
  for(var i=0;i<drawN;i++){ var px=X(T[i]),py=Y(Cc[i]); if(i===0)g.moveTo(px,py); else g.lineTo(px,py); }
  g.stroke();

  /* 表面曲线 */
  g.strokeStyle='#1e9fc4'; g.lineWidth=2.0; g.lineJoin='round';
  g.beginPath();
  for(var i=0;i<drawN;i++){ var px=X(T[i]),py=Y(Cs[i]); if(i===0)g.moveTo(px,py); else g.lineTo(px,py); }
  g.stroke();

  /* 终点标签 */
  if(drawN>1){
    var ex=X(T[drawN-1]), ey1=Y(Cc[drawN-1]), ey2=Y(Cs[drawN-1]);
    g.fillStyle='#12a594'; g.beginPath(); g.arc(ex,ey1,2.8,0,6.2832); g.fill();
    g.fillStyle='#1e9fc4'; g.beginPath(); g.arc(ex,ey2,2.8,0,6.2832); g.fill();
  }

  /* 图内标题 */
  g.fillStyle='#57727c'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('中心含水率始终高于表面：Cmax(t) 即中心值',12,14);
};

/* ---------------- 第三幕 Cmax 阈值搜索 ---------------- */
R.cvCmax=function(cv){
  var T=D23.t, C=D23.Cmax, n=T.length;
  var d=prepCanvas(cv,300), g=d.g, w=d.w, h=d.h;
  var L=58, Rr=34, Tp=26, B=40, PW=w-L-Rr, PH=h-Tp-B;
  var xmax=18, ymax=2.7;
  function X(v){ return L+PW*(Math.min(v,xmax)/xmax); }
  function Y(v){ return Tp+PH*(1-v/ymax); }

  var t=animTime();

  /* 网格 */
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=5;k++){
    var v=ymax*k/5, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(1),L-7,yy);
  }
  g.fillStyle='#8aa3aa'; g.font='11px "PingFang SC",system-ui,sans-serif';
  for(var xv=0;xv<=18;xv+=3){
    var xx=X(xv);
    g.fillStyle='#8aa3aa'; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(xv+' h',xx,Tp+PH+18);
  }
  g.save(); g.setLineDash([]); g.strokeStyle='#d9e9e9';
  g.beginPath(); g.moveTo(L,Tp+PH); g.lineTo(L+PW,Tp+PH); g.stroke(); g.restore();

  /* 阈值线 0.15 */
  var ty=Y(0.15);
  g.save(); g.setLineDash([5,4]); g.strokeStyle='#b8543a'; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(L,ty); g.lineTo(L+PW,ty); g.stroke(); g.restore();
  g.fillStyle='#b8543a'; g.font='600 11.5px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='bottom';
  g.fillText('达标阈值 0.15 kg/kg',L+4,ty-4);

  /* 渐进绘制 */
  var prog=Math.min(1, stP()/2.6);
  var drawN=Math.max(1,Math.floor(n*prog));

  /* 填充 */
  g.fillStyle='rgba(18,165,148,.12)';
  g.beginPath();
  for(var i=0;i<drawN;i++){ var px=X(T[i]),py=Y(C[i]); if(i===0)g.moveTo(px,py); else g.lineTo(px,py); }
  g.lineTo(X(T[drawN-1]),Tp+PH); g.lineTo(X(T[0]),Tp+PH); g.closePath(); g.fill();

  /* 曲线 */
  g.strokeStyle='#12a594'; g.lineWidth=2.8; g.lineJoin='round';
  g.beginPath();
  for(var i=0;i<drawN;i++){ var px=X(T[i]),py=Y(C[i]); if(i===0)g.moveTo(px,py); else g.lineTo(px,py); }
  g.stroke();

  /* 数据点 */
  for(var i=0;i<drawN;i++){
    var px=X(T[i]),py=Y(C[i]);
    g.fillStyle='#12a594'; g.beginPath(); g.arc(px,py,2.4,0,6.2832); g.fill();
  }

  /* 穿越点（动画到位后才出现） */
  if(prog>=1){
    var cx=X(16.8743), cy=Y(0.15);
    /* 竖直投影线 */
    g.save(); g.setLineDash([4,4]); g.strokeStyle='#e0a04a'; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx,Tp+PH); g.stroke(); g.restore();
    /* 脉动圈 */
    if(!document.body.classList.contains('reduce')){
      var pulse=0.5+0.5*Math.sin(t*3);
      g.fillStyle='#e0a04a'; g.globalAlpha=0.18+pulse*0.18;
      g.beginPath(); g.arc(cx,cy,9+pulse*5,0,6.2832); g.fill(); g.globalAlpha=1;
    }
    g.fillStyle='#e0a04a'; g.beginPath(); g.arc(cx,cy,5,0,6.2832); g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1.6; g.beginPath(); g.arc(cx,cy,5,0,6.2832); g.stroke();

    /* 右上角标注框 + 连接线 */
    var bw=182, bh=44, bx=w-bw-8, by=Tp+2;
    g.save(); g.setLineDash([4,3]); g.strokeStyle='#e0a04a'; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(bx,by+bh); g.lineTo(cx+6,cy-10); g.stroke(); g.restore();
    roundRect(g,bx,by,bw,bh,9);
    g.fillStyle='#fffdf8'; g.fill(); g.strokeStyle='#e0a04a'; g.lineWidth=1.4; g.stroke();
    g.fillStyle='#8a6313'; g.font='700 14px "PingFang SC",system-ui,sans-serif';
    g.textAlign='left'; g.textBaseline='middle';
    g.fillText('首次达标 16.87 h',bx+12,by+15);
    g.fillStyle='#57727c'; g.font='11.5px "PingFang SC",system-ui,sans-serif';
    g.fillText('Cmax = 0.150 kg/kg',bx+12,by+32);
  }

  /* 图内标题 */
  g.fillStyle='#57727c'; g.font='600 11px "PingFang SC",system-ui,sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('Cmax 随时间单调下降，在 16.87 h 首次跌破 0.15',12,14);
};

/* ---------------- 第四幕 径向剖面 ---------------- */
R.cvProfile=function(cv){
  var times=[
    {k:'6', c:'#e0a04a', lc:'#8a6313'},
    {k:'12',c:'#1e9fc4', lc:'#146c87'},
    {k:'17',c:'#12a594', lc:'#0b6e68'}
  ];
  var pos=['0','0.5','1','1.5','2'];
  var posc=['中心','','','','表面'];
  var ymax=1.35;
  var d=prepCanvas(cv,300), g=d.g, w=d.w, h=d.h;
  var L=52, Rr=18, Tp=26, B=54, PW=w-L-Rr, PH=h-Tp-B;
  function Y(v){ return Tp+PH*(1-Math.min(v,ymax)/ymax); }

  /* 网格 */
  g.font='11.5px "PingFang SC",system-ui,sans-serif';
  for(var k=0;k<=5;k++){
    var v=ymax*k/5, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(2),L-7,yy);
  }
  g.save(); g.setLineDash([]); g.strokeStyle='#d9e9e9';
  g.beginPath(); g.moveTo(L,Tp+PH); g.lineTo(L+PW,Tp+PH); g.stroke(); g.restore();

  /* 达标带去色（阈值以下淡绿） */
  var ty=Y(0.15);
  g.fillStyle='rgba(18,165,148,.07)';
  g.fillRect(L,ty,PW,Tp+PH-ty);

  var groupW=PW/5, inner=groupW*0.82, barW=inner/3;
  var prog=Math.min(1, stP()/1.8);
  prog=Math.max(0.001,prog);

  pos.forEach(function(p,i){
    var gx=L+groupW*i+(groupW-inner)/2;
    times.forEach(function(tm,j){
      var v=TAB5[tm.k][i];
      var target=PH*(v/ymax);
      var bh=target*prog;
      var bx=gx+barW*j, by=Tp+PH-bh;
      var grd=g.createLinearGradient(0,by,0,Tp+PH);
      grd.addColorStop(0,tm.c); grd.addColorStop(1,tm.c+'bb');
      g.fillStyle=grd; g.fillRect(bx,by,barW-2,bh);
      g.fillStyle='rgba(255,255,255,.28)'; g.fillRect(bx,by,barW-2,2.5);
      /* 数值标签 */
      if(prog>0.55){
        g.fillStyle=tm.lc; g.font='600 9.5px "PingFang SC",system-ui,sans-serif';
        g.textAlign='center'; g.textBaseline='alphabetic';
        g.fillText(v.toFixed(2),bx+(barW-2)/2,by-4);
      }

<!-- ===================== 第二幕 动边界建模：Landau 坐标变换 ===================== -->
<section class="scene" id="s2" data-title="二 · 动边界建模：Landau 坐标变换">
  <div class="wrap">
    <div class="stg">
      <div class="kicker">问题四 · 动边界建模</div>
      <h1>Landau 坐标：把收缩的动边界折成固定域
        <small>令 ξ = r / R(t)，物理域 [0, R(t)] 随时间收缩，归一化后变为固定域 [0, 1]。</small>
      </h1>
      <p class="lead">直接在有界缩小的物理域上离散，需要每步重建网格、处理移动边界，代价高且易出错。Landau 坐标把物理半径 r 除以当前半径 R(t)，映射为无量纲坐标 ξ=r/R(t)∈[0,1]。这样一来，动边界问题被转换成固定域上的问题，代价是方程中多出一个由收缩引起的对流（收缩）项。</p>
    </div>

    <div class="card stg">
      <h3>归一化方程与边界条件 <em>Landau 坐标下的热湿耦合</em></h3>
      <div class="formula"><span class="c">// Landau 坐标变换：把动边界 r ≤ R(t) 映射到固定域</span>
ξ = r / R(t) ,    ξ ∈ [0, 1] ,    r = ξ · R(t)

<span class="c">// 归一化扩散方程（R 随 t 收缩，额外产生对流项）</span>
∂C/∂t = (D / R²) · (1/ξ) · ∂/∂ξ ( ξ · ∂C/∂ξ )  −  <span class="w">(ξ · Ṙ / R) · ∂C/∂ξ</span>
               扩散项（半径归一化）                    收缩对流项

<span class="c">// 边界条件与初值</span>
ξ = 0 :   ∂C/∂ξ = 0                              轴对称，中心无净通量
ξ = 1 :   −(D / R) · ∂C/∂ξ = k_m · (C_s − C_eq)   表面蒸发按 k_m / R 折算
t = 0 :   C = C₀ = 2.55 kg/kg                     初始干基含水率

<span class="c">// 温度边界同理，热边界按 h / R 折算</span>
−(λ / R) · ∂T/∂ξ = h · (T_∞ − T_s)

<span class="c">// 附录4 变物性（随 C 与 T 变化）</span>
D    = 4.2e-4 · exp(−0.30 · C) · exp(−3850 / T_K)      [m²/s]
λ    = 0.12 + 0.20 · C / (C + 1)                        [W/(m·K)]
ρcₚ  = (760 + 90 · C) · (1850 + 2150 · C / (C + 1))</div>
      <p class="note t" style="margin-top:8px">关键点：扩散项中的 D 被除以 R²，表面蒸发项被除以 R，换热的 h 同样被 R 折算——半径收缩既缩短了扩散路径，又让边界通量随半径变化，两种效应叠加在归一化方程中。</p>
    </div>

    <div class="card stg">
      <h3>求解流程 <em>从收缩域到固定域，再换算回去</em></h3>
      <div class="flowrow">
        <span class="flownode">物理域随 R(t) 收缩</span><span class="flowarrow">→</span>
        <span class="flownode on">归一化 ξ = r / R(t)</span><span class="flowarrow">→</span>
        <span class="flownode on">固定域 [0,1] 离散求解</span><span class="flowarrow">→</span>
        <span class="flownode">r = ξ · R(t) 换算回物理坐标</span>
      </div>
      <p class="small" style="margin-top:8px">归一化后，网格节点固定在 ξ = k/20（k = 0…20，共 21 个节点），物理位置随 R(t) 一起收缩；时间步长取 dt = 0.5s。</p>
    </div>

    <div class="canvasbox stg">
      <div class="cvtop">
        <div class="ct">物理域收缩 vs 归一化固定域 · 节点映射示意</div>
        <div class="legend">
          <span><i style="background:#12a594"></i>物理域（随 R 收缩）</span>
          <span><i style="background:#146c87"></i>归一化域（固定）</span>
          <span><i class="ln" style="background:#1e9fc4"></i>坐标映射</span>
        </div>
      </div>
      <canvas id="cvLandau" height="320"></canvas>
      <p class="note" style="margin-top:8px">左栏是收缩的物理域 [0, R(t)]，节点物理位置随半径一起向左收缩；右栏是归一化域 [0, 1]，节点位置始终固定在 ξ = k/20。两栏的节点<b>编号相同、数量相同</b>，只是横坐标被 R(t) 缩放。这对箭头表示 ξ = r/R(t) 的正向映射与 r = ξ·R(t) 的换算。</p>
    </div>

    <div class="grid3 stg">
      <div class="card">
        <h3>Landau 变换原理 <em>把动压成静</em></h3>
        <p>令 ξ=r/R(t)，则物理域 0≤r≤R(t) 对应 0≤ξ≤1，与时间无关。</p>
        <p>求导时需计入 R(t) 的时间依赖，由此引入 ∂ξ/∂t = −ξ·Ṙ/R，从而在方程中留下一个对流项。</p>
        <div class="note t" style="margin-top:6px">变换不改变物理本质，只是把「移动的网格」换成「固定的网格」。</div>
      </div>
      <div class="card">
        <h3>收缩对流项的来历 <em>(ξ · Ṙ / R)</em></h3>
        <p>半径收缩相当于边界向中心挤压，物质被「推」向内侧，宏观上表现为一个附加的对流输运。</p>
        <p>收缩越快（Ṙ 越大）或当前半径越小（R 越小），对流项越显著。</p>
        <div class="note w" style="margin-top:6px">Ṙ<0（半径减小）时该项使含水率向外侧重分布，加速外层干燥。</div>
      </div>
      <div class="card">
        <h3>数值实现 <em>有限体积法</em></h3>
        <p><span class="badge n">网格</span>ξ 方向 21 个节点，等距布置</p>
        <p><span class="badge n">时间</span>dt = 0.5s，共用一套离散格式</p>
        <p><span class="badge n">迭代</span>物性随 C 变化，每个时间步内做内迭代</p>
        <div class="note" style="margin-top:6px">边界 ξ=1 的通量与 ξ=0 的对称条件一起，构成两组封闭的三对角方程组。</div>
      </div>
    </div>
  </div>
</section>

(function(){
"use strict";

/* ================= 数值模拟产出数据（原样复制） ================= */

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function easeOutCubic(t){return 1-Math.pow(1-t,3);}

function setupCanvas(cv,h){
  var dpr=Math.min(2,window.devicePixelRatio||1);

  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);

function pathFrac(g,pts,frac){
  var n=pts.length,f=clamp(frac,0,1),m=(n-1)*f,k=Math.floor(m),r=m-k;
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<=k;i++) g.lineTo(pts[i][0],pts[i][1]);
  if(k<n-1){ g.lineTo(lerp(pts[k][0],pts[k+1][0],r),lerp(pts[k][1],pts[k+1][1],r)); }

function interpR(tt){
  if(tt<=0) return R0;

  for(i=0;i<t.length;i++){ if(tt<=t[i]){ if(i===0) return R[0]; var f=(tt-t[i-1])/(t[i]-t[i-1]); return R[i-1]+(R[i]-R[i-1])*f; } }
  return R[R.length-1];
}
function interpC(a,tt){
  if(tt<=0) return C0;
  var t=D4.t,i;
  for(i=0;i<t.length;i++){ if(tt<=t[i]){ if(i===0) return a[0]; var f=(tt-t[i-1])/(t[i]-t[i-1]); return a[i-1]+(a[i]-a[i-1])*f; } }
  return a[a.length-1];
}
function reduceOn(){ return document.body.classList.contains('reduce'); }

/* ================= 动画引擎 ================= */
var activeAnims=[];
function stopAllAnims(){
  activeAnims.forEach(function(a){ if(a._raf) cancelAnimationFrame(a._raf); a._raf=null; });
  activeAnims=[];
}
function runAnim(fn){
  var h={_raf:null}; activeAnims.push(h);
  function loop(t){ fn(t); h._raf=requestAnimationFrame(loop); }
  h._raf=requestAnimationFrame(loop); return h;
}
function anim(fn){
  if(reduceOn()){ fn(99999); return; }
  var t0=performance.now();
  runAnim(function(t){ fn(t-t0); });
}

/* ================= 第一幕：圆柱截面收缩 ================= */
function drawHero(tm){
  var cv=$('#cvShrinkHero'); if(!cv) return;
  var o=setupCanvas(cv,300), g=o.g, w=o.w, h=o.h;
  var L=26,R=26,T=40,B=54,PW=w-L-R,PH=h-T-B;
  var pe=easeOutCubic(clamp(tm/2000,0,1));
  var times=[0,6,12,18,21.485];
  var colW=PW/times.length;
  var rmaxPx=Math.min(PH*0.32,colW*0.36,66);
  var sc=rmaxPx/R0, r0p=R0*sc;
  var cy=T+PH*0.42;
  font(g,13,600); g.fillStyle=INK; g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('圆柱截面半径随烘干时间收缩（虚线＝初始半径 2cm 轮廓）',L,26);
  g.strokeStyle=AXIS; g.lineWidth=1;
  g.beginPath(); g.moveTo(L,cy); g.lineTo(L+PW,cy); g.stroke();
  times.forEach(function(tt,i){
    var pa=clamp(pe*1.4-i*0.12,0,1); if(pa<=0.001) return;
    var cx=L+colW*(i+0.5);
    var Rcm=interpR(tt), Cc=interpC(D4.Cc,tt);
    var rp=Rcm*sc, core=Math.sqrt(clamp(Cc/C0,0,1));
    g.globalAlpha=pa;
    g.setLineDash([4,3]); g.strokeStyle='#b8cccc'; g.lineWidth=1;
    g.beginPath(); g.moveTo(cx-r0p,cy); g.lineTo(cx+r0p,cy); g.stroke();
    g.beginPath(); g.moveTo(cx-r0p,cy-r0p*0.45); g.lineTo(cx-r0p,cy+r0p*0.45); g.stroke();
    g.beginPath(); g.moveTo(cx+r0p,cy-r0p*0.45); g.lineTo(cx+r0p,cy+r0p*0.45); g.stroke();
    g.setLineDash([]);
    var gr=g.createRadialGradient(cx-rp*0.3,cy-rp*0.3,rp*0.15,cx,cy,rp);
    gr.addColorStop(0,'#fdf4e8'); gr.addColorStop(1,GOLD);
    g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,rp,0,6.2832); g.fill();
    g.strokeStyle=GOLDD; g.lineWidth=1.6; g.stroke();
    g.fillStyle=TEAL; g.beginPath(); g.arc(cx,cy,rp*core,0,6.2832); g.fill();

    g.fillText('Cc='+Cc.toFixed(2),cx,cy+rp*core+13);
    g.globalAlpha=1;
    var lab=(tt===0?'0':(tt===21.485?'21':String(Math.round(tt))));
    font(g,12.5,600); g.fillStyle=INK; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText('t = '+lab+' h',cx,cy+rmaxPx+32);
    font(g,11,400); g.fillStyle=MUTED;
    g.fillText('R = '+Rcm.toFixed(3)+' cm',cx,cy+rmaxPx+48);
  });
}

function drawLandau(tm){
  var cv=$('#cvLandau'); if(!cv) return;

  var pw=(PW-gap)/2;
  var lx=L, rx=L+pw+gap;
  var cyc=(tm/1000)%4.8;

  g.beginPath(); g.moveTo(rx-4,cy+16); g.lineTo(lx+pw+12,cy+16); g.stroke();
  g.beginPath(); g.moveTo(lx+pw+4,cy+16); g.lineTo(lx+pw+12,cy+11); g.lineTo(lx+pw+12,cy+21); g.closePath();
  g.fillStyle=WARN; g.fill();

/* ================= 第三幕：半径收缩 + 含水率下降 ================= */
function drawDual(tm){
  var cv=$('#cvDual'); if(!cv) return;
  var o=setupCanvas(cv,340), g=o.g, w=o.w, h=o.h;
  var L=52,R=22,T=52,B=46,PW=w-L-R,PH=h-T-B;

  var pe=easeOutCubic(clamp(tm/1700,0,1));
  font(g,12.5,600); g.fillStyle=TEALD; g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('半径 R(t) 收缩曲线 (cm)',x0,34);

  /* --- 左：R(t) --- */

  var pts=[[XL(0),YL(R0)]];
  D4.t.forEach(function(t,i){ pts.push([XL(t),YL(D4.R[i])]); });
  pathFrac(g,pts,pe); g.strokeStyle=TEAL; g.lineWidth=2.6; g.stroke();

  [0,6,12,18,21].forEach(function(t){
    var x=XL(t);
    g.strokeStyle='#f2f9f9'; g.lineWidth=1; g.beginPath(); g.moveTo(x,yT); g.lineTo(x,yB); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(String(t),x,yB+16);
  });
  font(g,11,400); g.fillStyle=MUTED; g.textAlign='center'; g.fillText('时间 t (h)',x0+pw/2,h-6);
  g.beginPath(); g.arc(XL(0),YL(R0),4,0,6.2832); g.fillStyle=TEAL; g.fill();
  haloText(g,'2.000 cm',XL(0)+8,YL(R0)-11,TEALD,10.5,'left');
  g.beginPath(); g.arc(XL(21.485),YL(REND),4,0,6.2832); g.fillStyle=WARN; g.fill();
  haloText(g,'1.207 cm',XL(21.485)-8,YL(REND)-12,WARN,10.5,'right');
  /* --- 右：含水率 --- */
  var Cm=2.75;
  function YR(v){ return yB-v/Cm*PH; }
  function XR(t){ return x1+pw*(t/22); }
  [0,0.5,1,1.5,2,2.5].forEach(function(v){
    var y=YR(v);
    g.strokeStyle=GRID; g.lineWidth=1; g.beginPath(); g.moveTo(x1,y+.5); g.lineTo(x1+pw,y+.5); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(1),x1-6,y);
  });
  g.strokeStyle=AXIS; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(x1,yT); g.lineTo(x1,yB); g.lineTo(x1+pw,yB); g.stroke();
  [0,6,12,18,21].forEach(function(t){
    var x=XR(t);
    g.strokeStyle='#f2f9f9'; g.lineWidth=1; g.beginPath(); g.moveTo(x,yT); g.lineTo(x,yB); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(String(t),x,yB+16);
  });
  font(g,11,400); g.fillStyle=MUTED; g.textAlign='center'; g.fillText('时间 t (h)',x1+pw/2,h-6);
  function buildC(a){ var p=[[XR(0),YR(C0)]]; D4.t.forEach(function(t,i){ p.push([XR(t),YR(a[i])]); }); return p; }
  function strokeC(a,col,dash,wd){
    var p=buildC(a);
    if(dash) g.setLineDash(dash);
    pathFrac(g,p,pe); g.strokeStyle=col; g.lineWidth=wd; g.stroke();
    if(dash) g.setLineDash([]);
  }
  strokeC(D4.Cmax,GOLD,[5,4],1.6);
  strokeC(D4.Cs,BLUE,null,2.4);
  strokeC(D4.Cc,TEAL,null,2.4);
  g.strokeStyle=WARN; g.lineWidth=1.4; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(x1,YR(TLIM)); g.lineTo(x1+pw,YR(TLIM)); g.stroke(); g.setLineDash([]);
  haloText(g,'目标 0.15',x1+7,YR(TLIM)-7,WARN,10.5,'left');
  g.beginPath(); g.arc(XR(21.485),YR(0.15),3.6,0,6.2832); g.fillStyle=TEAL; g.fill();
  haloText(g,'Cc=0.150',XR(21.485)-8,YR(0.15)-12,TEALD,10.5,'right');
  g.beginPath(); g.arc(XR(21.485),YR(0.081),3.6,0,6.2832); g.fillStyle=BLUE; g.fill();
  haloText(g,'Cs=0.081',XR(21.485)-8,YR(0.081)+13,BLUE,10.5,'right');
}

/* ================= 第四幕：径向剖面 ================= */
function drawProfile(tm){
  var cv=$('#cvProfile'); if(!cv) return;
  var o=setupCanvas(cv,340), g=o.g, w=o.w, h=o.h;
  var L=52,R=26,T=54,B=50,PW=w-L-R,PH=h-T-B;
  var yT=T, yB=T+PH;
  var pe=easeOutCubic(clamp(tm/1800,0,1));
  function X(r){ return L+PW*(r/2); }
  function Y(v){ return yB-v/2.75*PH; }
  font(g,13,600); g.fillStyle=INK; g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('径向含水率剖面 · 干区由外向内推进（半径同步收缩）',L,26);
  [0,0.5,1,1.5,2,2.5].forEach(function(v){
    var y=Y(v);
    g.strokeStyle=GRID; g.lineWidth=1; g.beginPath(); g.moveTo(L,y+.5); g.lineTo(L+PW,y+.5); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(1),L-6,y);
  });
  g.strokeStyle=AXIS; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(L,yT); g.lineTo(L,yB); g.lineTo(L+PW,yB); g.stroke();
  [0,0.5,1,1.5,2].forEach(function(v){
    var x=X(v);
    g.beginPath(); g.moveTo(x,yB); g.lineTo(x,yB+5); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(v.toFixed(1),x,yB+19);
  });
  font(g,11,400); g.fillStyle=MUTED; g.textAlign='center'; g.fillText('物理半径 r (cm)',L+PW/2,h-6);
  g.strokeStyle=WARN; g.lineWidth=1.4; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(L,Y(TLIM)); g.lineTo(L+PW,Y(TLIM)); g.stroke(); g.setLineDash([]);
  haloText(g,'目标 0.15 kg/kg',L+PW-8,Y(TLIM)+6,WARN,10.5,'right');
  var groups=[{h:6,k:'6',c:TEAL},{h:12,k:'12',c:CYAN},{h:18,k:'18',c:BLUE},{h:21,k:'21',c:WARN}];
  groups.forEach(function(gr,i){
    var v=TAB6[gr.k], Rc=interpR(gr.h);
    var p=[[X(0),Y(v[0])],[X(0.5),Y(v[1])],[X(1),Y(v[2])],[X(Rc),Y(v[3])]];
    var f=clamp(pe*1.4-i*0.16,0,1);
    if(f<=0.001) return;
    pathFrac(g,p,f); g.strokeStyle=gr.c; g.lineWidth=2.4; g.stroke();
    p.forEach(function(pt,j){
      if(f>=(j/(p.length-1))*0.98+0.02){
        g.fillStyle=gr.c; g.beginPath(); g.arc(pt[0],pt[1],3.4,0,6.2832); g.fill();
        g.strokeStyle='#fff'; g.lineWidth=1.2; g.stroke();
      }
    });
    if(f<0.99) return;
    g.strokeStyle=gr.c; g.lineWidth=1; g.setLineDash([3,3]); g.globalAlpha=0.5;
    g.beginPath(); g.moveTo(X(Rc),yT); g.lineTo(X(Rc),yB); g.stroke();
    g.setLineDash([]); g.globalAlpha=1;
    haloText(g,gr.h+'h',X(0)+8,Y(v[0])+(gr.h===21?12:0),gr.c,11,'left');
  });
  [[6,TEAL],[21,WARN]].forEach(function(q){
    var Rc=interpR(q[0]);
    haloText(g,'R('+q[0]+'h)='+Rc.toFixed(3),X(Rc),yT+14,q[1],10.5,'center');
  });
}

/* ================= 第五幕：时长对比 + 末态剖面 ================= */
function drawAnswer(tm){
  var cv=$('#cvAnswer'); if(!cv) return;
  var o=setupCanvas(cv,300), g=o.g, w=o.w, h=o.h;
  var L=54,R=24,T=50,B=48,PW=w-L-R,PH=h-T-B;
  var gap=46, pw=(PW-gap)/2;
  var x0=L, x1=L+pw+gap, yT=T, yB=T+PH;
  var pe=easeOutCubic(clamp(tm/1800,0,1));
  font(g,12.5,600); g.fillStyle=TEALD; g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('烘干时长对比 (h)',x0,32);
  g.fillText('21h 最终径向含水率 (kg/kg)',x1,32);
  /* 左：柱状 */
  var ym=24;
  function YB(v){ return yB-v/ym*PH; }
  [0,6,12,18,24].forEach(function(v){
    var y=YB(v);
    g.strokeStyle=GRID; g.lineWidth=1; g.beginPath(); g.moveTo(x0,y+.5); g.lineTo(x0+pw,y+.5); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(String(v),x0-6,y);
  });
  g.strokeStyle=AXIS; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(x0,yT); g.lineTo(x0,yB); g.lineTo(x0+pw,yB); g.stroke();
  var bars=[{n:'问题三',v:16.87,c:GREY,s:'半径不变'},{n:'问题四',v:DUR,c:TEAL,s:'半径收缩'}];
  var step=pw/bars.length, bw=Math.min(96,step*0.46);
  bars.forEach(function(b,i){
    var x=x0+step*(i+0.5)-bw/2, bh=PH*(b.v/ym)*easeOutCubic(clamp(pe*1.4-i*0.15,0,1));
    var gr=g.createLinearGradient(x,yB-bh,x,yB); gr.addColorStop(0,b.c); gr.addColorStop(1,'#ffffff');
    g.fillStyle=gr; g.fillRect(x,yB-bh,bw,bh);
    g.strokeStyle=b.c; g.lineWidth=1.8; g.strokeRect(x,yB-bh,bw,bh);
    if(bh>8) haloText(g,b.v.toFixed(2)+' h',x+bw/2,yB-bh-12,INK,13,'center');
    font(g,12.5,600); g.fillStyle=INK2; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(b.n,x+bw/2,yB+18);
    font(g,11,400); g.fillStyle=MUTED; g.fillText(b.s,x+bw/2,yB+33);
  });
  /* 右：末态剖面 */
  function RX(r){ return x1+pw*(r/2); }
  function RY(v){ return yB-v/0.20*PH; }
  [0,0.05,0.10,0.15,0.20].forEach(function(v){
    var y=RY(v);
    g.strokeStyle=GRID; g.lineWidth=1; g.beginPath(); g.moveTo(x1,y+.5); g.lineTo(x1+pw,y+.5); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='right'; g.textBaseline='middle';
    g.fillText(v.toFixed(2),x1-6,y);
  });
  g.strokeStyle=AXIS; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(x1,yT); g.lineTo(x1,yB); g.lineTo(x1+pw,yB); g.stroke();
  [0,0.5,1,1.5,2].forEach(function(v){
    var x=RX(v);
    g.beginPath(); g.moveTo(x,yB); g.lineTo(x,yB+5); g.stroke();
    font(g,10.5,400); g.fillStyle=MUTED; g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(v.toFixed(1),x,yB+19);
  });
  font(g,11,400); g.fillStyle=MUTED; g.textAlign='center'; g.fillText('物理半径 r (cm)',x1+pw/2,h-6);
  var pv=TAB6['21'], Rc=interpR(21);
  var p21=[[RX(0),RY(pv[0])],[RX(0.5),RY(pv[1])],[RX(1),RY(pv[2])],[RX(Rc),RY(pv[3])]];
  pathFrac(g,p21,clamp(pe*1.4,0,1)); g.strokeStyle=WARN; g.lineWidth=2.4; g.stroke();
  p21.forEach(function(pt){
    g.fillStyle=WARN; g.beginPath(); g.arc(pt[0],pt[1],3.6,0,6.2832); g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1.2; g.stroke();
  });
  g.strokeStyle=WARN; g.lineWidth=1.2; g.setLineDash([4,3]);
  g.beginPath(); g.moveTo(x1,RY(TLIM)); g.lineTo(x1+pw,RY(TLIM)); g.stroke(); g.setLineDash([]);
  haloText(g,'目标 0.15',x1+pw-6,RY(TLIM)-8,WARN,10.5,'right');
  haloText(g,'中心 0.150',RX(0)+8,RY(pv[0])-2,TEALD,10.5,'left');
  haloText(g,'1cm 0.099',RX(1)+8,RY(pv[2])+14,INK2,10.5,'left');
  haloText(g,'表面 0.081',RX(Rc)+8,RY(pv[3])-14,WARN,10.5,'left');
}

/* ================= 表格填充 ================= */
function buildTb6(){
  var box=$('#tbProfile'); if(!box) return;
  var rows=[[6,'6'],[12,'12'],[18,'18'],[21,'21']];
  var html='<tr><th>时刻</th><th>R(t) cm</th><th>中心 r=0cm</th><th>r=0.5cm</th><th>r=1cm</th><th>表面 r=R(t)</th></tr>';
  rows.forEach(function(rw){
    var v=TAB6[rw[1]];
    html+='<tr><td>'+rw[0]+' h</td>'+
      '<td class="num">'+interpR(rw[0]).toFixed(3)+'</td>'+
      '<td class="num">'+v[0].toFixed(4)+'</td>'+
      '<td class="num">'+v[1].toFixed(4)+'</td>'+
      '<td class="num">'+v[2].toFixed(4)+'</td>'+
      '<td class="num">'+v[3].toFixed(4)+'</td></tr>';
  });
  box.innerHTML=html;
}

/* ================= 结论幕 KPI count-up ================= */
var kpiStarted=false;
function startKPIs(){
  if(kpiStarted) return; kpiStarted=true;
  $$('.bigkpi .bk-v[data-cnt]').forEach(function(el){
    var target=parseFloat(el.dataset.cnt), dec=parseInt(el.dataset.dec||'0',10);
    var uspan=el.querySelector('.bk-u'), unitHtml=uspan?uspan.outerHTML:'';
    if(reduceOn()){ el.innerHTML=fmt(target,dec)+unitHtml; return; }
    var t0=performance.now(), dur=1200;
    function step(t){
      var p=clamp((t-t0)/dur,0,1);
      el.innerHTML=fmt(target*easeOutCubic(p),dec)+unitHtml;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* ================= 幕调度 ================= */
var SCENES=$$('.scene'), N=SCENES.length, cur=-1;
var st={last:0,armed:false,fired:0};
var sceneStarters=[
  function(){ anim(function(t){ drawHero(t); }); },
  function(){ anim(function(t){ drawLandau(t); }); },
  function(){ anim(function(t){ drawDual(t); }); },
  function(){ anim(function(t){ drawProfile(t); }); },
  function(){ anim(function(t){ drawAnswer(t); }); startKPIs(); }
];
function beatsAuto(sc){ return $$('.wrap > *',sc); }
function resetScene(sc){
  kpiStarted=false;
  $$('.wrap > *',sc).forEach(function(b){ b.classList.remove('in'); });
  $$('.bigkpi .bk-v[data-cnt]',sc).forEach(function(el){
    var uspan=el.querySelector('.bk-u'), unitHtml=uspan?uspan.outerHTML:'';
    el.innerHTML=fmt(0,parseInt(el.dataset.dec||'0',10))+unitHtml;
  });
}
function goTo(i){
  i=clamp(i,0,N-1);
  if(i===cur) return;
  if(cur>=0) SCENES[cur].classList.remove('active');
  cur=i;
  stopAllAnims();
  var sc=SCENES[i];
  resetScene(sc);
  sc.scrollTop=0;
  sc.classList.add('active');
  $('#scTitle').textContent=sc.dataset.title||'';
  $$('#dots .dot').forEach(function(d,k){ d.classList.toggle('on',k===i); });
  $('#pgNow').textContent=i+1;
  $('#prog').style.width=(N<=1?100:(i/(N-1))*100)+'%';
  st.armed=false;
  beatsAuto(sc).forEach(function(b){ b.classList.add('in'); });
  if(sceneStarters[i]) sceneStarters[i]();
}
function setReduce(v){
  document.body.classList.toggle('reduce',v);
  var b=$('#btnFx'); b.classList.toggle('on',!v); b.textContent=v?'动效 关':'动效 开';
  if(v) $$('.wrap > *').forEach(function(e){ e.classList.add('in'); });
  stopAllAnims();
  if(cur>=0 && sceneStarters[cur]) sceneStarters[cur]();
}
function init(){
  buildTb6();
  var dots='';
  for(var i=0;i<N;i++) dots+='<button class="dot" data-i="'+i+'" title="第 '+(i+1)+' 幕"></button>';
  $('#dots').innerHTML=dots;
  $('#pgAll').textContent=N;
  $('#dots').addEventListener('click',function(e){
    var t=e.target.closest?e.target.closest('.dot'):null; if(t) goTo(+t.dataset.i);
  });
  $('#btnNext').onclick=function(){ goTo(cur+1); };
  $('#btnPrev').onclick=function(){ goTo(cur-1); };
  $('#btnReplay').onclick=function(){
    resetScene(SCENES[cur]);
    beatsAuto(SCENES[cur]).forEach(function(b){ b.classList.add('in'); });
    if(sceneStarters[cur]) sceneStarters[cur]();
  };
  $('#btnFx').onclick=function(){ setReduce(!reduceOn()); };
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea') return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); goTo(cur+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); goTo(cur-1); }
    else if(k===' '){ e.preventDefault(); goTo(cur+1); }
    else if(k==='Home'){ e.preventDefault(); goTo(0); }
    else if(k==='End'){ e.preventDefault(); goTo(N-1); }
    else if(k==='r'||k==='R'){ $('#btnReplay').click(); }
    else if(k>='1'&&k<='9'&&+k<=N){ e.preventDefault(); goTo(+k-1); }
  });
  window.addEventListener('wheel',function(e){
    var sc=SCENES[cur]; if(!sc) return;
    var max=sc.scrollHeight-sc.clientHeight;
    var atTop=sc.scrollTop<=1, atBot=max<=4||sc.scrollTop>=max-1;
    var want=e.deltaY>0?1:-1;
    var edge=(max<=4)||(want>0&&atBot)||(want<0&&atTop);
    if(!edge){ st.armed=false; st.last=Date.now(); return; }
    e.preventDefault();
    var now=Date.now(), dt=now-st.last;
    if(!st.armed){ st.armed=true; st.last=now; return; }
    if(dt>280 && now-st.fired>1100 && Math.abs(e.deltaY)>=8){
      st.fired=now; st.armed=false;
      goTo(cur+want);
    }
    st.last=now;
  },{passive:false});
  window.addEventListener('resize',function(){
    stopAllAnims();
    if(cur>=0 && sceneStarters[cur]) sceneStarters[cur]();
  });
  setReduce(false);
  goTo(0);
}
init();
window.__deck={goTo:goTo,get cur(){return cur;},sceneStarters:sceneStarters,D4:D4,TAB6:TAB6};
})();
</script>
