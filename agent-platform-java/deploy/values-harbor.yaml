# cr-harbor.tipdm.net 部署专用 values（叠加在 values.yaml 之上）
# helm install/upgrade 用法见 deploy/README.md
#
# ⚠️ 2026-09-22 与线上 agent-platform-backend deployment 对账：
#    此前 kubectl 手动加过的 env 已全部收编进本文件（extraEnv + config），
#    升级生效后请勿再 kubectl edit deployment 手改 env——会被下次 upgrade 冲掉。

global:
  imagePullSecrets: []

backend:
  image:
    repository: cr-harbor.tipdm.net/agentscope/agent-platform-backend
    tag: "0.1.6"
  javaOpts: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"
  # 2026-09-21 线上手动添加的环境变量（Chart 未内置），升级前对账收编：
  #  * OAuth 登录三件套（认证中心 <内网地址>:9623）
  # ⚠️ 线上曾有 AGENT_PLATFORM_EXTERNAL_KEY 明文覆盖 Secret——2026-09-22 升级时改为
  #    直接把 Secret 的 external-key 修正为实际生效值（values-secrets.local.yaml），
  #    不再用同名 env 覆盖：Helm 战略合并按 name 合并 env 列表，同名条目会因
  #    value+valueFrom 并存被 K8s API 拒绝（UPGRADE FAILED 实测）。
  extraEnv:
    - name: AGENT_PLATFORM_OAUTH_SERVER_URL
      value: ""   # 填写：OAuth 认证中心地址
    - name: AGENT_PLATFORM_OAUTH_CLIENT_ID
      value: ""   # 填写：OAuth 应用 client id
    - name: AGENT_PLATFORM_OAUTH_CLIENT_SECRET
      value: ""   # 填写：OAuth 应用 client secret

frontend:
  image:
    repository: cr-harbor.tipdm.net/agentscope/agent-platform-frontend
    tag: "0.1.5"

postgres:
  enabled: true
  image:
    repository: cr-harbor.tipdm.net/agentscope/agent-platform-postgres
    tag: "16-alpine-pgvector"

redis:
  enabled: true
  image:
    repository: cr-harbor.tipdm.net/agentscope/redis
    tag: "7-alpine"

ingress:
  # 集群的 ingress-nginx 控制器过老（nginx 1.15.5，对 v1 多路径 Ingress 支持不完整，
  # /api 路由 404），改走 NodePort 直连：http://<内网地址>:30100/
  enabled: false

service:
  frontend:
    type: NodePort
    port: 80
    nodePort: 30100   # 30080/30081/30090/30808 均已被集群占用
  backend:
    # 2026-09-22 收口：全平台只对外暴露前端 30100 一个端口，
    # /api、/agui 由前端 nginx 反代到集群内 backend Service
    type: ClusterIP
    port: 8080

config:
  allowPrivateOutbound: "true"  # 内网集群，允许访问内网 RAGFlow/IM 网关
  # ---- 2026-09-21 线上手动添加，收编 ----
  studioEnabled: "true"                     # AGENTSCOPE_STUDIO_ENABLED
  studioUrl: ""   # 填写：AgentScope Studio 地址   # AGENTSCOPE_STUDIO_URL
  dashscopeApiKey: "<DASHSCOPE_API_KEY>"  # DASHSCOPE_API_KEY
  bochaApiKey: "<BOCHA_API_KEY>"      # BOCHA_API_KEY（联网搜索，2026-09-23）
