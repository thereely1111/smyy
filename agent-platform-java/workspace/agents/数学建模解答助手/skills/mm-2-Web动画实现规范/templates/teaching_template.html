<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · 数模演易</title>
<style>
:root{
  --bg:#f3fafa; --card:#ffffff; --line:#d9e9e9; --line2:#eaf4f4;
  --ink:#0b2e36; --ink2:#3d6570; --muted:#57727c;
  --teal:#12a594; --teal-d:#0b6e68; --blue:#146c87; --cyan:#1e9fc4;
  --gold:#e0a04a; --gold-d:#8a6313; --warn:#b8543a; --warn-bg:#fbf0ec;
  --sh:0 1px 2px rgba(11,46,54,.05),0 8px 24px rgba(11,46,54,.06);
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.72 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
b,strong{font-weight:600;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.topbar{position:fixed;left:0;right:0;top:0;height:56px;z-index:40;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.brand{font-size:12.5px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;flex-shrink:0}
.brand i{font-style:normal;color:var(--teal);font-weight:600}
.scene-title{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--teal-d);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:7px;flex-shrink:0}
.tbtn{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.18s;white-space:nowrap;}
.tbtn:hover{border-color:var(--teal);color:var(--teal-d)}
.tbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.splitnav{display:flex;gap:5px;align-items:center;margin-left:auto;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.splitnav::-webkit-scrollbar{display:none}
.splitnav a{font-size:11.5px;font-weight:700;color:var(--ink2);padding:4px 8px;border-radius:7px;
  border:1px solid var(--line);text-decoration:none;white-space:nowrap;transition:.18s;}
.splitnav a:hover{background:#f0fbfa;color:var(--teal-d);border-color:var(--teal)}
.splitnav a.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}

#stage{position:fixed;left:0;right:0;top:56px;bottom:76px;overflow:hidden}
.scene{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 28px;
  opacity:0;visibility:hidden;transform:translateY(22px) scale(.994);
  transition:opacity .45s ease,transform .5s cubic-bezier(.22,.8,.3,1),visibility .45s;}
.scene::-webkit-scrollbar{width:9px}
.scene::-webkit-scrollbar-thumb{background:#cfe4e4;border-radius:9px}
.scene.active{opacity:1;visibility:visible;transform:none}
.wrap{max-width:1180px;margin:0 auto}
.wrap>*{margin-bottom:18px}
.wrap>*:last-child{margin-bottom:0}
.wrap>.stg{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.22,.8,.3,1)}
.wrap>.stg.in{opacity:1;transform:none}

.kicker{font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:600;text-transform:uppercase}
h1{font-size:26px;line-height:1.4;margin:6px 0 8px;font-weight:600;letter-spacing:-.01em}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:0}
.lead{font-size:15px;color:var(--ink2);line-height:1.85;max-width:960px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--teal-d);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.card p{margin:0 0 8px;font-size:14px;color:var(--ink2);line-height:1.8}
.card p:last-child{margin-bottom:0}
.math-display{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;margin:8px 0;padding:5px 2px;
  text-align:center;scrollbar-width:thin;scrollbar-color:#cfe4e4 transparent}
.math-display math{display:inline-block;min-width:max-content;margin:0;font-size:1.06em;
  font-family:"Cambria Math","STIX Two Math","Noto Sans Math",serif;color:var(--ink)}
.math-inline{display:inline-block;vertical-align:-.12em;white-space:nowrap}
.math-inline math{font-family:"Cambria Math","STIX Two Math","Noto Sans Math",serif;color:inherit}
.math-fallback{display:inline-block;max-width:100%;overflow-x:auto;padding:3px 7px;border:1px solid var(--line);
  border-radius:6px;background:#fbfefe;color:var(--warn);font:13px/1.65 Consolas,monospace;white-space:pre}
.quote{font-size:14px;line-height:1.9;color:var(--ink);background:var(--line2);
  border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 14px;margin:10px 0;}
.small{font-size:12.5px;color:var(--muted);line-height:1.75}
.hl{color:var(--warn);font-weight:600}
.hl-t{color:var(--teal-d);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flexrow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.grow{flex:1;min-width:320px}
@media(max-width:960px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.scene{padding:16px 14px 24px}}

.badge{display:inline-block;font-size:11px;line-height:1.6;padding:1px 7px;border-radius:5px;
  background:var(--line2);color:var(--blue);border:1px solid #d5e8ea;margin-right:6px;white-space:nowrap}
.badge.p{background:#fdf4e8;color:var(--gold-d);border-color:#f0dcbb}
.badge.q{background:#eef7f6;color:var(--teal-d);border-color:#cfe7e5}
.badge.w{background:var(--warn-bg);color:var(--warn);border-color:#f0d5cd}
.badge.n{background:#f6f8f9;color:var(--muted);border-color:#e3eaec}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.pill{font:inherit;font-size:12.5px;padding:5px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.16s;}
.pill:hover{border-color:var(--teal);color:var(--teal-d)}
.pill.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff;font-weight:600}
.pill b{font-weight:600}
.pill:disabled{cursor:default;opacity:.5}

.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em;margin-bottom:3px}
.kpi .v{font-size:19px;font-weight:600;color:var(--teal-d);line-height:1.3}
.kpi .v u{text-decoration:none;font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi.g .v{color:var(--gold-d)}
.kpi.b .v{color:var(--blue)}
.kpi.w .v{color:var(--warn)}

table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:left}
table.tb th{font-size:11.5px;color:var(--muted);font-weight:600;background:#fafdfd;letter-spacing:.03em}
table.tb td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tb tr.on td{background:#eef8f6}
table.tb tr:hover td{background:#f6fbfb}

.canvasbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 8px;box-shadow:var(--sh);position:relative}
.canvasbox canvas{display:block;width:100%}
.cvtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.cvtop .ct{font-size:13px;font-weight:600;color:var(--teal-d)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:3px;width:16px;border-radius:2px;vertical-align:3px}
.tooltip{position:fixed;pointer-events:none;z-index:60;display:none;
  background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--sh);padding:7px 10px;font-size:12px;line-height:1.7;color:var(--ink2);min-width:96px;}
.tooltip b{color:var(--teal-d)}
.tooltip .ttr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tooltip .ttr i{flex:none;width:10px;height:10px;border-radius:3px;display:inline-block}

.slider{display:flex;align-items:center;gap:12px;margin:8px 0}
.slider input[type=range]{flex:1;height:22px;background:transparent;cursor:pointer;
  appearance:none;-webkit-appearance:none;accent-color:var(--teal);}
.slider input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#dbeaea}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5.5px;
  border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 1px 4px rgba(11,46,54,.28);}
.slider input[type=range]:focus{outline:none}
.slider input[type=range]:focus::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(18,165,148,.22)}
.slider input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#dbeaea}
.slider input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid #fff;}
.slider .sv{min-width:104px;text-align:right;font-size:14px;font-weight:600;color:var(--teal-d);
  font-variant-numeric:tabular-nums}
.slider input[type=number]{width:82px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;
  color:var(--teal-d);background:#fff;font:600 13px inherit;font-variant-numeric:tabular-nums}
.slider input[type=number]:focus{outline:2px solid rgba(18,165,148,.22);border-color:var(--teal)}

.mx{display:grid;gap:6px}
.mx .mh{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 4px}
.mx .mr{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;padding-right:6px;justify-content:flex-end}
.mx .mc{border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;transition:.16s;
  padding:7px 6px;font-size:12px;text-align:center;color:var(--muted);line-height:1.45;}
.mx .mc:hover{border-color:var(--teal)}
.mx .mc.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff;font-weight:600}
.mx .mc.dim{opacity:.55;cursor:default}

.note{font-size:12.5px;color:var(--muted);background:#fafdfd;border:1px dashed var(--line);
  border-radius:9px;padding:9px 12px;line-height:1.75;}
.note.w{background:var(--warn-bg);border-color:#eed8d1;color:#8d4229}
.hint{font-size:12px;color:var(--teal-d);background:#eef8f6;border-radius:8px;padding:7px 11px;display:inline-block}

.navbar{position:fixed;left:0;right:0;bottom:0;height:76px;z-index:40;
  display:flex;align-items:center;justify-content:center;gap:16px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.navbar button.nb{font:inherit;font-size:19px;line-height:1;width:40px;height:40px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.18s}
.navbar button.nb:hover{border-color:var(--teal);color:var(--teal-d);background:#f4fbfa}
.navbar button.nb:disabled{opacity:.35;cursor:not-allowed}
#dots{display:flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#cfe4e4;border:0;padding:0;cursor:pointer;transition:.2s}
.dot:hover{background:var(--cyan)}
.dot.on{background:var(--teal-d);width:24px;border-radius:5px}
.pageind{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.pageind b{color:var(--teal-d);font-size:14px}
.progwrap{position:fixed;left:0;right:0;top:56px;height:2px;background:transparent;z-index:41}
#prog{height:2px;background:linear-gradient(90deg,var(--teal),var(--cyan));width:0;transition:width .45s ease}
.kbd{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}

body.reduce .pulse,body.reduce .flowdot,body.reduce .blink{animation:none !important}
body.reduce .wrap>.stg{transition:none;opacity:1;transform:none}
body.reduce .scene{transition:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-26}}
.flowdot{animation:flow 1.5s linear infinite}
@media (max-width:860px){.scene-title{display:none}.brand{display:none}.splitnav{margin-left:0}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">数模演易 · <i>赛题分析动画</i></div>
  <div class="scene-title" id="scTitle">加载中</div>
  <div class="tools">
    <button class="tbtn on" id="btnFx">动效 开</button>
    <button class="tbtn" id="btnAuto">自动讲解</button>
    <button class="tbtn" id="btnReplay">重播本幕</button>
  </div>
  <nav class="splitnav" id="splitnav"></nav>
</header>
<div class="progwrap"><div id="prog"></div></div>
<main id="stage"></main>
<div class="navbar">
  <button class="nb" id="btnPrev" title="上一幕（←）">‹</button>
  <div id="dots"></div>
  <button class="nb" id="btnNext" title="下一幕（→）">›</button>
  <div class="pageind"><b id="pgNow">1</b> / <span id="pgAll">1</span></div>
</div>

<script type="application/json" id="DATA">__STEPS_JSON__</script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var D=JSON.parse($('#DATA').textContent);
var SCENES=[], TITLES=[], CHARTS={}, CHART_SPECS={}, CHART_META={}, SLIDERS={};
var cur=-1, reduce=false, auto=false, TOKEN=0, tlT=[];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/\"/g,'&quot;').replace(/'/g,'&#39;');}
function raw(s){return String(s==null?'':s);}
function cloneJSON(v){try{return JSON.parse(JSON.stringify(v||{}));}catch(e){return {};}}
function kpiHTML(v,k,cls){return '<div class="kpi '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';}

/* ================= 图表引擎（移植自参考例子 + 悬停/拖动） ================= */
var tooltipEl=null;
function ensureTooltip(){ if(tooltipEl) return tooltipEl;
  tooltipEl=document.createElement('div'); tooltipEl.className='tooltip';
  document.body.appendChild(tooltipEl); return tooltipEl; }
function fmt(v,f){
  if(typeof f==='function') return f(v);
  if(f==='pct') return v.toFixed(0)+'%';
  if(f==='sci') return v===0?'0':v.toExponential(1);
  if(f==='x') return v.toFixed(2);
  if(f==='k') return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);
  if(f===0) return v.toFixed(0);
  if(typeof f==='number') return v.toFixed(f);
  return String(Math.round(v));
}
function note(g,text,px,py,o){
  o=o||{};
  var dy=o.up===undefined?24:o.up, dx=o.dx===undefined?8:o.dx;
  g.font='600 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var mt=g.measureText?g.measureText(text):null;
  var tw=(mt&&mt.width)?mt.width:text.length*12;
  var x=px+dx, y=py-dy;
  if(o.right!==undefined && x+tw+14>o.right && o.left!==undefined) x=px-dx-tw-12;
  if(o.left!==undefined && x<o.left) x=o.left;
  if(o.top!==undefined && y<o.top) y=py+12;
  g.fillStyle='rgba(255,255,255,.96)'; g.fillRect(x,y,tw+12,18);
  g.strokeStyle=o.line||'#cfe4e4'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,tw+11,17);
  g.fillStyle=o.tc||'#0b6e68'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text,x+6,y+9);
}
function plot(cv,cfg){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(240,cv.clientWidth||520), h=cfg.h||220;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  var T=cfg.T||18, B=cfg.B||26, n=cfg.n;
  var ymin=cfg.yMin, ymax=cfg.yMax;
  /* 左右留白必须放得下最长的一位刻度文字：画布会把超出部分直接裁掉，
     15552.00 被裁成 552.00 会被当成数据错误。量完文字宽度再定边距。 */
  var YFONT='11.5px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  function textW(text,font){ g.font=font||YFONT; var m=g.measureText?g.measureText(String(text)):null;
    return (m&&m.width)?m.width:String(text).length*6.6; }
  function maxTickW(min,max,fmtStr,steps){ var mw=0;
    if(!isFinite(min)||!isFinite(max)) return 0;
    for(var q=0;q<=steps;q++){ mw=Math.max(mw,textW(fmt(min+(max-min)*q/steps,fmtStr))); }
    return mw; }
  var L=Math.max(cfg.L||44, Math.ceil(maxTickW(ymin,ymax,cfg.yFmt,4))+10);
  var R=cfg.R||(cfg.y2?54:16);
  if(cfg.y2){ R=Math.max(R,Math.ceil(maxTickW(cfg.y2.min,cfg.y2.max,cfg.y2.fmt,4))+10); }
  var PW=w-L-R, PH=h-T-B;
  function X(i){ return L+PW*(n<=1?0:i/(n-1)); }
  function Y(v){ return T+PH*(1-(v-ymin)/(ymax-ymin)); }
  var Y2=cfg.y2?function(v){ return T+PH*(1-(v-cfg.y2.min)/(cfg.y2.max-cfg.y2.min)); }:null;
  if(cfg.band){ g.fillStyle=cfg.band.c; g.fillRect(L,Y(cfg.band.hi),PW,Math.max(0,Y(cfg.band.lo)-Y(cfg.band.hi))); }
  g.font='11.5px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var k;
  for(k=0;k<=4;k++){ var v=ymin+(ymax-ymin)*k/4, yy=Y(v);
    g.strokeStyle='#eaf4f4'; g.lineWidth=1; g.beginPath(); g.moveTo(L,yy+.5); g.lineTo(L+PW,yy+.5); g.stroke();
    g.fillStyle='#57727c'; g.textAlign='right'; g.textBaseline='middle'; g.fillText(fmt(v,cfg.yFmt),L-7,yy); }
  (cfg.hlines||[]).forEach(function(hl){ var yy=Y(hl.v);
    g.save(); g.setLineDash([5,4]); g.strokeStyle=hl.c||'#b8543a'; g.lineWidth=hl.w||1.3;
    g.beginPath(); g.moveTo(L,yy); g.lineTo(L+PW,yy); g.stroke(); g.restore();
    if(hl.label){ g.font='600 11.5px "PingFang SC","Microsoft YaHei",system-ui,sans-serif'; g.textAlign='left'; g.textBaseline='alphabetic';
      var mt=g.measureText?g.measureText(hl.label):null; var tw=(mt&&mt.width)?mt.width:hl.label.length*12;
      g.fillStyle='rgba(255,255,255,.95)'; g.fillRect(L+3,yy-19,tw+12,16);
      g.strokeStyle='rgba(217,233,233,.95)'; g.lineWidth=1; g.strokeRect(L+3.5,yy-18.5,tw+11,15);
      g.fillStyle=hl.c||'#b8543a'; g.fillText(hl.label,L+9,yy-7); } });
  if(cfg.y2){ for(k=0;k<=4;k++){ var v2=cfg.y2.min+(cfg.y2.max-cfg.y2.min)*k/4;
    g.fillStyle=cfg.y2.c||'#146c87'; g.textAlign='left'; g.textBaseline='middle'; g.fillText(fmt(v2,cfg.y2.fmt),L+PW+7,Y2(v2)); } }
  (cfg.vlines||[]).forEach(function(vl){ var vx=X(vl.i);
    g.save(); g.setLineDash([4,4]); g.strokeStyle=vl.c||'#c6dbe4'; g.lineWidth=1;
    g.beginPath(); g.moveTo(vx,T); g.lineTo(vx,T+PH); g.stroke(); g.restore(); });
  (cfg.xTicks||[]).forEach(function(t){ var xx=X(t.i);
    g.strokeStyle='#f2f9f9'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+PH); g.stroke();
    /* 首尾刻度文字改成贴边对齐，避免被画布左右边缘截断。 */
    var label=String(t.t), tw=textW(label), lx=xx, align='center';

function bindHover(cv){

    var i=Math.round((px-info.L)/info.PW*(info.n-1));
    if(i<0||i>=info.n||!isFinite(i)){box.style.display='none';return;}
    var xLabel=String(info.xName||'index %i').replace('%i',(i+1));
    var rows='<b>'+esc(xLabel)+'</b>';
    if(info.stack){
      (info.panels||[]).forEach(function(panel){(panel.series||[]).forEach(function(series){
        if(series.d&&series.d[i]!=null){
          rows+='<div class="ttr"><i style="background:'+escAttr(series.c||'#888')+'"></i>'+esc(series.name||panel.cap||'')+' '+esc(fmt(+series.d[i],panel.fmt||0))+'</div>';

  sec.appendChild(wrap); $('#stage').appendChild(sec);
  SCENES.push(sec); TITLES.push(title); return wrap;
}
function buildScene(sc){
  var wrap=newScene(sc.title||('第 '+(SCENES.length+1)+' 幕'));
  if(sc.kicker||sc.h1||sc.lead) blockHead({kicker:sc.kicker,h1:sc.h1,small:sc.small,lead:sc.lead},wrap);
  (sc.blocks||[]).forEach(function(b){ b=b||{};  switch(b.type){
      case 'head': blockHead(b,wrap); break;
      case 'pills': blockPills(b,wrap); break;
      case 'matrix': blockMatrix(b,wrap); break;
      case 'svgclick': blockSvgClick(b,wrap); break;
      case 'slider': blockSlider(b,wrap); break;
      case 'chart': blockChart(b,wrap); break;
      case 'html': default: blockHtml(b,wrap); break; } });
}

/* ================= 分档切换 ================= */
(function(){ var dk=D.deck||{}, nav=$('#splitnav');
  if(!dk.names||!dk.names.length){ nav.style.display='none'; return; }
  (dk.names||[]).forEach(function(n,i){ var a=document.createElement('a');
    a.textContent=(dk.labels&&dk.labels[i])||n;
    a.href=(dk.files&&dk.files[i])||'#'; a.title=n;
    if(i===dk.idx) a.classList.add('on'); nav.appendChild(a); });
})();

/* ================= 导航 / 逐拍 ================= */
function buildDots(){ var N=SCENES.length, h='';
  for(var i=0;i<N;i++) h+='<button class="dot" data-i="'+i+'" title="'+esc(TITLES[i])+'"></button>';
  $('#dots').innerHTML=h; $('#pgAll').textContent=N;
  $('#dots').addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('.dot'):null;
    if(t) goTo(+t.dataset.i); });
}
function resetScene(sc){ $$('canvas',sc).forEach(function(cv){ cv.removeAttribute('data-done'); });
  $$('.wrap > *',sc).forEach(function(b){ b.classList.remove('stg','in'); }); }
function drawCanvas(el){ $$('canvas',el).forEach(function(cv){
  if(cv.dataset.done==='1') return; cv.dataset.done='1';
  if(CHARTS[cv.id]) CHARTS[cv.id](cv); }); }
function tlRun(i){ tlT.forEach(clearTimeout); tlT=[];
  var sc=SCENES[i], bs=$$('.wrap > *',sc), tk=TOKEN, gap=430;
  if(reduce){ bs.forEach(function(b){ b.classList.remove('stg'); b.classList.add('in'); }); drawCanvas(sc); return; }
  bs.forEach(function(b){ b.classList.remove('in'); b.classList.add('stg'); });
  var pos=0;
  bs.forEach(function(b,k){ var t=260+k*gap;
    tlT.push(setTimeout(function(){ if(tk!==TOKEN) return; b.classList.add('in'); drawCanvas(b); },t)); pos=t; });
  tlT.push(setTimeout(function(){ if(tk!==TOKEN) return;
    bs.forEach(function(b){ b.classList.remove('stg'); }); auto=false; syncAuto(); },pos+820));
}
function goTo(i){ i=Math.max(0,Math.min(SCENES.length-1,i)); if(i===cur) return;
  if(cur>=0) SCENES[cur].classList.remove('active');
  cur=i; TOKEN++; var sc=SCENES[i]; resetScene(sc); sc.scrollTop=0; sc.classList.add('active');
  $('#scTitle').textContent=TITLES[i];
  $$('#dots .dot').forEach(function(d,k){ d.classList.toggle('on',k===i); });
  $('#pgNow').textContent=i+1;
  $('#prog').style.width=(SCENES.length<=1?100:(i/(SCENES.length-1))*100)+'%';
  $('#btnPrev').disabled=(i===0); $('#btnNext').disabled=(i===SCENES.length-1);
  if(auto) tlRun(i); else { $$('.wrap > *',sc).forEach(function(b){ b.classList.add('in'); }); drawCanvas(sc); }
}
function syncAuto(){ $('#btnAuto').classList.toggle('on',auto); $('#btnAuto').textContent=auto?'自动讲解 · 开':'自动讲解'; }
function setReduce(v){ reduce=v; document.body.classList.toggle('reduce',v);
  var b=$('#btnFx'); b.classList.toggle('on',!v); b.textContent=v?'动效 关':'动效 开'; }

/* ================= 初始化 ================= */
(function(){
  (D.scenes||[]).forEach(buildScene);
  buildDots();
  $('#btnNext').onclick=function(){ goTo(cur+1); };
  $('#btnPrev').onclick=function(){ goTo(cur-1); };
  $('#btnAuto').onclick=function(){ auto=!auto; syncAuto(); if(auto) tlRun(cur); else { tlT.forEach(clearTimeout); tlT=[]; } };
  $('#btnReplay').onclick=function(){ tlT.forEach(clearTimeout); resetScene(SCENES[cur]); tlRun(cur); };
  $('#btnFx').onclick=function(){ setReduce(!reduce); };
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea') return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); goTo(cur+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); goTo(cur-1); }
    else if(k===' '){ e.preventDefault(); goTo(cur+1); }
    else if(k==='Home'){ e.preventDefault(); goTo(0); }
    else if(k==='End'){ e.preventDefault(); goTo(SCENES.length-1); }
    else if(k==='r'||k==='R'){ $('#btnReplay').click(); }
    else if(k>='1'&&k<='9'&&+k<=SCENES.length){ e.preventDefault(); goTo(+k-1); }
  });
  var st={last:0,armed:false,fired:0};
  window.addEventListener('wheel',function(e){ var sc=SCENES[cur]; if(!sc) return;
    var max=sc.scrollHeight-sc.clientHeight, want=e.deltaY>0?1:-1;
    var edge=(max<=4)||(want>0&&sc.scrollTop>=max-1)||(want<0&&sc.scrollTop<=1);
    if(!edge){ st.armed=false; st.last=Date.now(); return; }
    e.preventDefault(); var now=Date.now(), dt=now-st.last;
    if(!st.armed){ st.armed=true; st.last=now; return; }
    if(dt>280 && now-st.fired>1100 && Math.abs(e.deltaY)>=8){ st.fired=now; st.armed=false; goTo(cur+want); }
    st.last=now; },{passive:false});
  var tx=null;
  $('#stage').addEventListener('touchstart',function(e){ tx=e.touches[0].clientX; },{passive:true});
  $('#stage').addEventListener('touchend',function(e){ if(tx===null) return;
    var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>50) dx<0?goTo(cur+1):goTo(cur-1); tx=null; },{passive:true});
  /* Split reference pages show all content immediately; auto narration is opt-in. */
  setReduce(false); auto=false; syncAuto(); goTo(0);
  window.addEventListener('resize',function(){ $$('canvas').forEach(function(cv){ cv.removeAttribute('data-done'); });
    if(cur>=0) drawCanvas(SCENES[cur]); });
  window.__deck={plot:plot,plotStack:plotStack,fmt:fmt,kpi:kpiHTML,$:$,$$:$$,DATA:D,CHARTS:CHARTS,CHART_SPECS:CHART_SPECS,SLIDERS:SLIDERS};
})();
})();
</script>
