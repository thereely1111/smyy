# 本地裸跑兜底配置（K8s 环境由 Helm ConfigMap 覆盖同名文件）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端地址：本地裸跑默认 localhost:8080；K8s 由 Helm ConfigMap 渲染为集群 Service
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        client_max_body_size 25m;
    }

    location /agui/ {
        proxy_pass http://${BACKEND_HOST:-localhost:8080};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 7200s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
